<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2436">
<title>RouterKing · King Star</title>
<link rel="manifest" href="/motorista/manifest.webmanifest">
<link rel="icon" href="/motorista/icone-192.png">
<link rel="apple-touch-icon" href="/motorista/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* App do motorista — mesmo visual do PQI (Qualidade), pensado para dedo e sol. */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599; --rule:#D9DEE7; --rule-2:#EBEEF3;
  --steel:#2E4A7A; --steel-soft:#E3EAF5; --amber:#C98A0B; --amber-soft:#FBF1D9; --ok:#2F7D4F; --ok-soft:#E1F2E7;
  --bad:#B83232; --bad-soft:#F9E2E2; --gold:#E8B04A;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3; --rule:#2F384A; --rule-2:#252D3D;
  --steel:#8FB0E6; --steel-soft:#22304A; --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:5;background:#1B2436;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar .brand{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;flex:1}
.bar .brand b{color:var(--gold)}
.plate{display:inline-grid;border:2px solid #111;border-radius:5px;overflow:hidden;background:#fff;color:#111;text-align:center;min-width:80px}
.plate i{font-style:normal;background:#1f4fa3;color:#fff;font-size:8px;font-weight:700;letter-spacing:.14em;padding:0 4px}
.plate b{font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.06em;padding:0 6px}
.st{display:flex;gap:6px;flex-wrap:wrap;padding:6px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));background:var(--sheet);border-bottom:1px solid var(--rule);font-size:13px;font-weight:600}
.st span{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:var(--rule-2);color:var(--ink-2)}
.st .on{background:var(--ok-soft);color:var(--ok)} .st .off{background:var(--bad-soft);color:var(--bad)} .st .warn{background:var(--amber-soft);color:var(--amber)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
main{padding:14px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(14px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px;display:grid;gap:10px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2)}
input,select,textarea{font:inherit;font-size:17px;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.big{font-size:18px;padding:16px;border-radius:14px;width:100%}
.pri{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.warnb{background:var(--amber);color:#1B2436;border-color:var(--amber)}
.ghost{background:transparent;border-color:transparent;color:var(--steel);padding:8px 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grupo{margin:6px 2px 0;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.motivo-gde{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.cont-reg{font:700 18px/1.2 "IBM Plex Mono",monospace;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:6px 12px}
.cont-reg.quase{background:#FFE6CC;color:#C2410C} .cont-reg.estourou{background:var(--bad-soft);color:var(--bad)}
.msg-ch{background:var(--rule-2);border-radius:12px 12px 12px 4px;padding:8px 10px;max-width:85%;justify-self:start;white-space:pre-wrap;word-break:break-word}
.msg-ch.eu{background:var(--steel-soft);border-radius:12px 12px 4px 12px;justify-self:end}
.msg-ch small{display:block;font-size:11px;color:var(--ink-3);margin-bottom:2px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.msg{font-size:14px;font-weight:600;min-height:1em}
.msg.erro{color:var(--bad)} .msg.okm{color:var(--ok)}
.cap{font-size:13px;color:var(--ink-3);margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-pend{background:var(--rule-2);color:var(--ink-2)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--amber-soft);color:var(--amber)} .p-aco{background:var(--steel-soft);color:var(--steel)}
/* [v6.1] CHEGOU no cliente + aviso de resposta da frota (balão piscando e bolinha vermelha) */
.p-cheg{background:#0E7490;color:#fff}
.p-cheg.longe{background:var(--amber-soft);color:var(--amber)}
@keyframes pisca{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
@keyframes balao{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 7px rgba(220,38,38,0)}}
.bolinha{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#DC2626;border:2px solid var(--sheet);animation:pisca 1s ease-in-out infinite}
.chat-novo{position:relative;animation:balao 1.2s ease-out infinite;border-color:#DC2626!important}
.chat-novo .pill{animation:pisca 1s ease-in-out infinite}
.ped.chat-novo{position:relative;animation:balao 1.2s ease-out infinite;border-color:#DC2626}
.cheguei{display:grid;gap:6px;background:#ECFEFF;border:1px dashed #0E7490;border-radius:12px;padding:10px 12px;color:#155E75}
@media (prefers-color-scheme: dark){.cheguei{background:#0F2A31;color:#A5F3FC}}
.msg-ch img{display:block;max-width:100%;border-radius:8px;margin-top:4px}
/* [v6.1] rodapé do chat fixo: Voltar, câmera e Enviar sempre à vista */
.ch-rodape{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:4;padding:10px;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.ch-rodape textarea{padding:10px;font-size:16px}
.ch-acoes{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.ch-acoes button,.ch-cam{padding:10px 14px;border-radius:12px;font-size:16px}
.ch-cam{display:grid;place-items:center;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:20px;padding:6px 14px}
@media (prefers-reduced-motion: reduce){.bolinha,.chat-novo,.ped.chat-novo,.chat-novo .pill{animation:none}}
.p-cot{background:#5B21B6;color:#fff;font-size:13px;letter-spacing:.04em}
.cotacao{background:#5B21B6;color:#fff;border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.cotacao b{font-size:24px;letter-spacing:.06em} .cotacao span{font-size:14px;opacity:.95}
.ped.cot{border-left:6px solid #5B21B6}
.prog{height:9px;background:var(--rule-2);border-radius:99px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.ped{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.ped:focus-visible{outline:2px solid var(--gold)}
.ped .n{font-family:"IBM Plex Mono",monospace;font-weight:600;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--rule-2)}
.ped .c{min-width:0} .ped .c b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped .c span{display:block;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped.feito{opacity:.72}
.it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:15px}
.it:last-child{border-bottom:0}
.word{border:2px dashed var(--gold);background:var(--amber-soft);border-radius:14px;padding:12px;display:grid;gap:8px}
.word input{text-transform:uppercase;letter-spacing:.14em;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px}
.qtd{display:flex;align-items:center;gap:6px}
.qtd input{width:64px;text-align:center;padding:8px}
.qtd button{padding:8px 12px}
.foto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foto img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px));background:var(--sheet);border-top:1px solid var(--rule);z-index:6}
.foot>div{max-width:640px;margin:0 auto}
.inst{background:var(--steel-soft);color:var(--steel);border-radius:14px;padding:12px;display:grid;gap:8px;font-size:14px}
a.nav{color:var(--steel);font-weight:600;text-decoration:none}
.aviso{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bar"><span class="brand">ROUTER<b>KING</b> · Entregas</span><span id="barPlaca"></span></div>
<div class="st" id="st" hidden></div>
<main id="app"><div class="card"><p class="cap">Carregando…</p></div></main>
<div class="foot" id="foot" hidden><div id="footIn"></div></div>

<script>
"use strict";
/* ═══ App do motorista — conversa com /api/motorista (motorista.py) ═══
   · Login pela placa; troca da senha inicial; escolhe quem está dirigindo.
   · Baixa por pedido: Entregue / Retorno / Parcial. Palavra da entrega quando o PCL ligou.
   · Sem sinal: a baixa fica guardada no celular e vai sozinha quando a conexão volta.
   · GPS enquanto o app está aberto e a carga está na rua. */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hora = iso => iso ? iso.slice(11, 16) : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };

const S = { me: null, dados: null, carga: null, ped: null, chat: false, chatDados: null, chatErro: "", chatRascunho: "", modo: "", msg: "", erro: "", foto: null, linhas: {}, palavra: "", motivo: "", obs: "",
            gps: { estado: "parado", ult: null, enviado: 0, watch: null }, wake: null, online: navigator.onLine };

async function api(url, corpo, metodo) {
  const op = { method: metodo || (corpo ? "POST" : "GET"), headers: { "Content-Type": "application/json" }, cache: "no-store", credentials: "same-origin" };
  if (corpo) op.body = JSON.stringify(corpo);
  let r;
  try { r = await fetch("/api/motorista" + url, op); }
  catch (e) { const er = new Error("Sem sinal agora."); er.offline = true; throw er; }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { S.me = null; telaLogin(j.detail); throw Object.assign(new Error(j.detail || "Entre de novo."), { tratado: true }); }
  if (!r.ok) { const er = new Error(j.detail || `Erro ${r.status}`); er.status = r.status; throw er; }
  return j;
}

// ═══ [v5.10] dados guardados no aparelho: depois do 1º carregamento, sem sinal o motorista continua com tudo ═══
function guardarCache() { if (S.me && S.me.motorista && S.dados) ls.set("mot_cache", { placa: S.me.placa, me: S.me, dados: S.dados, em: new Date().toISOString() }); }
function lerCache() { const k = ls.get("mot_cache", null); return k && k.me && k.dados ? k : null; }
const agoraLocal = () => { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };

// ═══ fila offline (baixas que esperam sinal) ═══
const fila = () => ls.get("mot_fila", []);
function filaPor(f) { ls.set("mot_fila", f); barraStatus(); }
function enfileirar(item) { const f = fila(); f.push(item); filaPor(f); }
let enviando = false;
async function enviarFila() {
  if (enviando) return; enviando = true;
  try {
    let f = fila();
    while (f.length) {
      const it = f[0];
      try {
        const r = await api(it.url, it.corpo);
        if (r && r.resultado && r.resultado !== "ok") avisar(`Pedido ${it.rotulo}: ${r.resultado === "palavra_errada" ? "a palavra não conferiu — registre de novo" : "precisa da palavra — registre de novo"}.`);
        if (r && r.validar_palavra) avisar(`Pedido ${it.rotulo}: a palavra não conferiu. A entrega foi enviada e a FROTA vai validar.`);
        if (r && r.carga) atualizarCarga(r.carga);
      } catch (e) {
        if (e.offline) break;
        if (!e.tratado) avisar(`Pedido ${it.rotulo}: ${e.message}`);
      }
      f = fila(); f.shift(); filaPor(f);
    }
  } finally { enviando = false; guardarCache(); }
}
const AVISOS = [];
function avisar(t) { AVISOS.push(t); if (AVISOS.length > 4) AVISOS.shift(); render(); }

// ═══ status do topo ═══
function barraStatus() {
  const st = $("#st");
  if (!S.me || !S.me.motorista) { st.hidden = true; return; }
  st.hidden = false;
  const g = S.gps.estado;
  const n = fila().length;
  st.innerHTML = `<span class="${S.online ? "on" : "off"}"><i class="dot"></i>${S.online ? "Com sinal" : "Sem sinal"}</span>
    <span class="${g === "ativo" ? "on" : g === "negado" ? "off" : ""}"><i class="dot"></i>GPS ${g === "ativo" ? "ligado" : g === "negado" ? "bloqueado" : g === "erro" ? "sem posição" : "desligado"}</span>
    ${n ? `<span class="warn">${n} registro(s) esperando sinal</span>` : ""}
    ${S.cacheEm ? `<span class="warn">Dados guardados no celular (${new Date(S.cacheEm).toLocaleString("pt-BR", { hour: "2-digit", minute: "2-digit" })})</span>` : ""}
    <span>${esc(S.me.motorista.nome)}</span>`;
}

// ═══ telas ═══
function render() {
  barraStatus();
  $("#barPlaca").innerHTML = S.me && S.me.placa ? `<span class="plate"><i>BRASIL</i><b>${esc(S.me.placa)}</b></span>` : "";
  $("#foot").hidden = true;
  if (!S.me) return telaLogin();
  if (S.me.trocar_senha) return telaSenha();
  if (!S.me.motorista) return telaQuem();
  if (S.ped && S.chat) return telaChat();
  if (S.ped) return telaPedido();
  return telaCarga();
}
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (!S.me) render(); });
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
function blocoInstalar() {
  if (instalado()) return "";
  return `<div class="inst"><b>Instale o app no celular</b>
    ${deferredInstall ? `<button type="button" class="pri" id="btInst">📲 Instalar o RouterKing</button>` :
    `<span>No Chrome do Android: menu <b>⋮</b> → <b>Instalar app</b> (ou “Adicionar à tela inicial”). Vira um ícone na tela do celular.</span>`}</div>`;
}
function ligarInstalar() { const b = $("#btInst"); if (b) b.onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; render(); }; }

function telaLogin(msg) {
  S.me = null;
  $("#app").innerHTML = `<div class="card"><h1 style="font-size:26px">Entrar</h1>
      <label class="f">Placa do veículo<input id="lPl" class="mono" autocomplete="username" autocapitalize="characters" placeholder="ABC1D23" value="${esc(ls.get("mot_placa", ""))}" style="text-transform:uppercase;letter-spacing:.08em"></label>
      <label class="f">Senha<input id="lSe" type="password" autocomplete="current-password"></label>
      <button type="button" class="pri big" id="lOk">Entrar</button><p class="msg erro" id="lMsg">${esc(msg || "")}</p>
      <p class="cap">No primeiro acesso use a senha inicial que o PCL passou. O app pede para trocar.</p></div>${blocoInstalar()}`;
  ligarInstalar(); barraStatus(); $("#barPlaca").innerHTML = "";
  const ir = async () => {
    const placa = $("#lPl").value.trim(), senha = $("#lSe").value;
    if (!placa || !senha) { $("#lMsg").textContent = "Preencha placa e senha."; return; }
    $("#lOk").disabled = true;
    try { const r = await api("/login", { placa, senha }); ls.set("mot_placa", r.placa);
      S.me = { placa: r.placa, trocar_senha: r.trocar_senha, motorista: null, motoristas: r.motoristas }; await entrar(); }
    catch (e) { $("#lMsg").textContent = e.message; $("#lOk").disabled = false; }
  };
  $("#lOk").onclick = ir; $("#lSe").onkeydown = e => { if (e.key === "Enter") ir(); };
}
function telaSenha() {
  $("#app").innerHTML = `<div class="card"><h1 style="font-size:24px">Crie a senha da placa</h1>
      <p class="cap">A senha inicial deixa de valer. Use pelo menos 6 caracteres e combine com quem mais dirige esta placa.</p>
      <label class="f">Nova senha<input id="s1" type="password" autocomplete="new-password"></label>
      <label class="f">Repita a nova senha<input id="s2" type="password" autocomplete="new-password"></label>
      <button type="button" class="pri big" id="sOk">Salvar senha</button><p class="msg erro" id="sMsg"></p></div>`;
  $("#sOk").onclick = async () => {
    try { const r = await api("/senha", { nova: $("#s1").value, repetir: $("#s2").value }); S.me.trocar_senha = false; S.me.motoristas = r.motoristas; await entrar(); }
    catch (e) { if (!e.tratado) $("#sMsg").textContent = e.message; }
  };
}
// [v5.6] logou com a placa = é o motorista ligado a ela no PQI. Sem escolha e sem cadastro de nome no app.
async function entrar() {
  if (S.me && !S.me.trocar_senha) { const me = await api("/me").catch(() => null); if (me && me.logado) S.me = me; }
  if (S.me && S.me.motorista) { await carregar(); } else render();
}
function telaQuem() {
  $("#app").innerHTML = `<div class="card"><h1 style="font-size:24px">Placa sem motorista</h1>
      <p class="cap">A placa <b>${esc(S.me.placa)}</b> ainda não está ligada a um motorista no PQI. Peça ao PCL para cadastrar em <b>Motoristas e app</b>.</p>
      <button type="button" id="qAtu">Tentar de novo</button><button type="button" class="ghost" id="qSair">Sair desta placa</button></div>`;
  $("#qAtu").onclick = entrar; $("#qSair").onclick = sair;
}
async function sair() { try { await api("/sair", {}); } catch (_) {} pararGps(); soltarTela(); ls.set("mot_cache", null); S.me = null; S.dados = null; S.carga = null; render(); }

function cargaAtual() {
  const cs = (S.dados && S.dados.cargas) || [];
  return cs.find(c => c.numero === S.carga) || cs.find(c => !c.chegada) || cs[0] || null;
}
function atualizarCarga(c) {
  if (!S.dados) return;
  const i = S.dados.cargas.findIndex(x => x.numero === c.numero);
  if (i >= 0) S.dados.cargas[i] = c; else S.dados.cargas.push(c);
  guardarCache();
}
const pillCot = p => p.cotacao ? `<span class="pill p-cot">COTAÇÃO${p.cotacao.uf && p.cotacao.uf !== "SP" ? " · " + esc(p.cotacao.uf) : ""}</span>` : "";

  if (c.palavra_ligada && desfecho !== "retorno" && p.liberacao !== "liberada") {
    corpo.palavra = (S.palavra || "").trim();
    if (!corpo.palavra) { S.erro = "Digite a palavra que o cliente informou."; return render(); }
  }
  if (desfecho !== "entregue") {
    corpo.motivo = p.motivo_chat || S.motivo; corpo.obs = S.obs; corpo.foto = S.foto || "";
    if (!corpo.motivo) { S.erro = "Escolha o motivo."; return render(); }
    if (!corpo.foto) { S.erro = "Tire a foto da peça para registrar."; return render(); }
    if (desfecho === "parcial") {
      corpo.linhas = Object.entries(S.linhas).map(([i, q]) => ({ i: +i, qtd: +q })).filter(x => x.qtd > 0);
      if (!corpo.linhas.length) { S.erro = "Marque quantas peças voltaram."; return render(); }
    }
  }
  const url = `/cargas/${c.numero}/pedido/${encodeURIComponent(p.pv)}`;
  try {
    const r = await api(url, corpo);
    if (r.resultado === "pede_palavra") { S.erro = "Digite a palavra que o cliente informou."; return render(); }
    if (r.resultado === "palavra_errada") { if (r.carga) atualizarCarga(r.carga); S.erro = r.restam > 0 ? `Palavra não confere. Restam ${r.restam} tentativa(s).` : "Palavra não confere. Tentativas esgotadas: peça liberação ao PCL."; S.palavra = ""; return render(); }
    atualizarCarga(r.carga); S.ped = null; S.modo = ""; render();
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) {
    if (e.offline) {   // sem sinal: guarda e segue a rota (a palavra é conferida quando enviar; se não bater, a frota valida)
      corpo.offline_em = agoraLocal();
      enfileirar({ url, corpo, rotulo: p.nome });
      p.enviando = true; p.desfecho = desfecho; p.em = corpo.offline_em; guardarCache(); S.ped = null; S.modo = ""; render();
    } else if (!e.tratado) { S.erro = e.message; render(); }
  }
}

// ═══ CHAT com a frota [v5.5] — 1ª vez escolhe o motivo; Voltar NÃO encerra (quem encerra é a frota) ═══
let chatTimer = null;
async function carregarChat(redesenhar) {
  const c = cargaAtual(), p = c && c.pedidos.find(x => x.pv === S.ped); if (!p) return;
  const antes = S.chatDados;
  try { S.chatDados = await api(`/cargas/${c.numero}/pedido/${encodeURIComponent(p.pv)}/chat`); S.chatErro = ""; }
  catch (e) { if (!e.tratado) S.chatErro = e.offline ? "Sem sinal: o chat precisa de conexão." : e.message; }
  if (!redesenhar || !S.chat) return;
  // [v5.6] só refaz a tela inteira se o atendimento mudou (abriu/encerrou); senão atualiza só as mensagens — o que está sendo escrito não some
  const id = d => (d && d.atual && d.atual.id) || "";
  if (!$("#chTela") || id(antes) !== id(S.chatDados)) desenharChat(); else atualizarMsgs();
}
function htmlMsgs(a) {
  return a.msgs.map(m => m.de === "sistema" ? `<div class="cap" style="text-align:center">${esc(m.txt)} · ${hora(m.em)}</div>` :
    `<div class="msg-ch ${m.de === "motorista" ? "eu" : ""}"><small>${esc(m.de === "motorista" ? "Você" : "Frota · " + m.nome)} · ${hora(m.em)}</small>${m.foto ? `<a href="/api/motorista/foto/${esc(m.foto)}" target="_blank" rel="noopener"><img src="/api/motorista/foto/${esc(m.foto)}" alt="foto enviada no chat" loading="lazy"></a>${m.txt && m.txt !== "📷 Foto" ? esc(m.txt) : ""}` : esc(m.txt)}</div>`).join("");
}
function atualizarMsgs() {
  const a = (S.chatDados || {}).atual, l = $("#chLista"); if (!a || !l) return;
  const sig = a.msgs.length + "|" + (a.msgs.length ? a.msgs[a.msgs.length - 1].em : "");
  if (l.dataset.sig !== sig) { const noFim = l.scrollTop + l.clientHeight >= l.scrollHeight - 30; l.innerHTML = htmlMsgs(a); l.dataset.sig = sig; if (noFim) l.scrollTop = l.scrollHeight; }
  const ct = $("#chCont"); if (ct && a.restante_seg != null) ct.dataset.ate = Date.now() + a.restante_seg * 1000;
  const e = $("#chErro"); if (e) { e.hidden = !S.chatErro; e.textContent = S.chatErro || ""; }
}
const fmtCont = seg => { const n = Math.abs(Math.round(seg)), t = `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`; return seg >= 0 ? `⏱ ${t}` : `⏱ esgotado há ${t}`; };
setInterval(() => document.querySelectorAll("[data-ate]").forEach(el => { const seg = (+el.dataset.ate - Date.now()) / 1000;
  const t = +el.dataset.total || 900, cor = seg <= 0 || seg <= t / 3 ? "estourou" : seg <= t * 2 / 3 ? "quase" : "";   // [v5.11] terços: verde, laranja, vermelho
  el.textContent = fmtCont(seg); el.classList.toggle("estourou", cor === "estourou"); el.classList.toggle("quase", cor === "quase"); }), 1000);
function telaChat() {
  if (!chatTimer) chatTimer = setInterval(() => { if (!S.chat) { clearInterval(chatTimer); chatTimer = null; return; } if (document.visibilityState === "visible") carregarChat(true); }, 5000);
  if ($("#chTela")) return;   // já está na tela do chat: não apaga o que está sendo escrito
  if (!S.chatDados) { $("#app").innerHTML = '<div class="card"><p class="cap">Abrindo o chat…</p></div>'; carregarChat(true); return; }
  desenharChat();
}
function desenharChat() {
  const c = cargaAtual(), p = c && c.pedidos.find(x => x.pv === S.ped);
  if (!p) { S.chat = false; S.ped = null; return render(); }
  const d = S.chatDados || {}, a = d.atual;
  const rascunho = ($("#chTxt") || {}).value || S.chatRascunho || "";
  const msgs = a ? htmlMsgs(a) : "";
  $("#app").innerHTML = `<button type="button" class="ghost" id="chVolta" style="justify-self:start">‹ Voltar para o cliente</button>
    <div class="card" id="chTela"><span class="cap">Chat com a frota · Pedido <span class="mono">${esc(p.pv)}</span></span><h2 style="font-size:20px">${esc(p.nome)}</h2>
      ${a ? `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span class="motivo-gde">${esc(a.motivo)}</span>
        ${a.restante_seg != null ? `<span class="cont-reg" id="chCont" data-ate="${Date.now() + a.restante_seg * 1000}" data-total="${(a.prazo_min || 15) * 60}">${fmtCont(a.restante_seg)}</span>` : ""}</div>` : ""}</div>
    <div class="aviso" id="chErro" ${S.chatErro ? "" : "hidden"}>${esc(S.chatErro)}</div>
    ${!a ? `<div class="card"><h3>Qual é o motivo?</h3><p class="cap">A frota já vê o cliente, o pedido e as peças. Escolha o motivo para começar.</p>
        ${(d.motivos || []).map(m => `<button type="button" class="big" data-mot="${esc(m)}">${esc(m)}</button>`).join("")}</div>`
      : `<div class="card" id="chLista" data-sig="${a.msgs.length}|${a.msgs.length ? a.msgs[a.msgs.length - 1].em : ""}" style="gap:8px;max-height:46vh;overflow:auto">${msgs}</div>
        <div class="card ch-rodape"><textarea id="chTxt" rows="2" placeholder="Escreva para a frota" maxlength="500">${esc(rascunho)}</textarea>
          <div class="ch-acoes"><button type="button" id="chVolta2" title="Voltar não encerra a conversa">‹ Voltar</button>
            <label class="ch-cam" title="Tirar foto e enviar" aria-label="Tirar foto e enviar">📷<input id="chFoto" type="file" accept="image/*" capture="environment" hidden></label>
            <button type="button" class="pri" id="chEnv">Enviar</button></div></div>`}`;
  const lista = $("#chLista"); if (lista) lista.scrollTop = lista.scrollHeight;
  const voltar = () => { S.chatRascunho = ($("#chTxt") || {}).value || ""; S.chat = false; clearInterval(chatTimer); chatTimer = null; render(); window.scrollTo(0, 0); };
  $("#chVolta").onclick = voltar; const v2 = $("#chVolta2"); if (v2) v2.onclick = voltar;
  document.querySelectorAll("[data-mot]").forEach(b => b.onclick = () => enviarChat({ motivo: b.dataset.mot }));
  const t = $("#chTxt"); if (t) { t.oninput = () => { S.chatRascunho = t.value; }; }
  const env = $("#chEnv"); if (env) env.onclick = () => { const v = ($("#chTxt").value || "").trim(); if (v) enviarChat({ texto: v }); };
  const cf = $("#chFoto"); if (cf) cf.onchange = () => { const arq = cf.files && cf.files[0]; if (!arq) return;
    S.chatErro = "Enviando a foto…"; atualizarMsgs();
    comprimir(arq, marca(c, p)).then(d => enviarChat({ texto: ($("#chTxt").value || "").trim(), foto: d }))
      .catch(() => { S.chatErro = "Não consegui ler a foto. Tire de novo."; atualizarMsgs(); }); cf.value = ""; };
}
async function enviarChat(corpo) {
  const c = cargaAtual(), p = c && c.pedidos.find(x => x.pv === S.ped); if (!p) return;
  try { const r = await api(`/cargas/${c.numero}/pedido/${encodeURIComponent(p.pv)}/chat`, corpo);
    const abriu = !(S.chatDados && S.chatDados.atual);
    S.chatDados = { ...(S.chatDados || {}), ...r }; S.chatErro = ""; if (corpo.texto || corpo.foto) { S.chatRascunho = ""; const t = $("#chTxt"); if (t) t.value = ""; }
    p.chat = { ...(p.chat || {}), aberto: true, nao_lidas: 0 };
    if (abriu) desenharChat(); else { atualizarMsgs(); const l = $("#chLista"); if (l) l.scrollTop = l.scrollHeight; const t = $("#chTxt"); if (t) t.focus(); } }
  catch (e) { if (!e.tratado) S.chatErro = e.offline ? "Sem sinal: a mensagem não foi. Tente de novo." : e.message; atualizarMsgs(); if (!$("#chTela")) desenharChat(); }
}

// ═══ GPS (só com o app aberto — o navegador não deixa rastrear com a tela apagada) ═══
function ligarGps() {
  if (S.gps.watch != null || !("geolocation" in navigator)) { if (!("geolocation" in navigator)) S.gps.estado = "erro"; return; }
  S.gps.watch = navigator.geolocation.watchPosition(pos => {
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, prec: pos.coords.accuracy, t: Date.now() };
    const ant = S.gps.ult; S.gps.ult = p; S.gps.estado = "ativo"; barraStatus();
    const moveu = !ant || Math.hypot(p.lat - ant.lat, p.lng - ant.lng) > 0.0004;
    if (Date.now() - S.gps.enviado > (moveu ? 30000 : 90000)) { S.gps.enviado = Date.now(); api("/gps", { lat: p.lat, lng: p.lng, prec: p.prec }).catch(() => {}); }
    conferirChegada();   // [v6.1] pendente → CHEGOU ao entrar no raio do endereço
  }, err => { S.gps.estado = err.code === 1 ? "negado" : "erro"; barraStatus(); }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
}
function pararGps() { if (S.gps.watch != null) navigator.geolocation.clearWatch(S.gps.watch); S.gps.watch = null; S.gps.estado = "parado"; barraStatus(); }
// [v5.5] a tela fica SEMPRE ligada com o motorista logado (sem opção na tela): o GPS só funciona com o app aberto
async function manterTela() { if (S.wake || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try { S.wake = await navigator.wakeLock.request("screen"); S.wake.addEventListener("release", () => { S.wake = null; }); } catch (_) { S.wake = null; } }
function soltarTela() { try { if (S.wake) S.wake.release(); } catch (_) {} S.wake = null; }

// ═══ carga e atualização automática ═══
function marcarFila() {   // pedidos com registro guardado no celular aparecem como "Enviando…"
  for (const it of fila()) {
    const m = it.url.match(/^\/cargas\/([^/]+)\/pedido\/([^/]+)$/); if (!m || !S.dados) continue;
    const c = S.dados.cargas.find(x => x.numero === m[1]); const p = c && c.pedidos.find(x => x.pv === decodeURIComponent(m[2]));
    if (p && !p.desfecho) { p.enviando = true; p.desfecho = it.corpo.desfecho; }
  }
}
const naoLidas = () => ((S.dados && S.dados.cargas) || []).reduce((t, c) => t + c.pedidos.reduce((u, p) => u + ((p.chat || {}).nao_lidas || 0), 0), 0);
async function carregar() {
  try {
    const antes = naoLidas();
    S.dados = await api("/cargas");
    if (naoLidas() > antes && navigator.vibrate) navigator.vibrate([180, 90, 180]);   // [v6.1] a frota respondeu
    S.cacheEm = null;
    marcarFila(); guardarCache();
    manterTela();
    const c = cargaAtual();
    if (c && c.saida && !c.chegada) ligarGps(); else if (S.gps.watch != null && !(c && c.saida && !c.chegada)) pararGps();
  } catch (e) {
    if (e.status === 403) { const me = await api("/me").catch(() => null); if (me) { S.me = me.logado ? me : null; } }
    else if (e.offline) { const k = lerCache(); if (k && !S.dados) { S.dados = k.dados; S.cacheEm = k.em; marcarFila(); } else if (k) S.cacheEm = S.cacheEm || k.em; }
    else if (!e.tratado) avisar(e.message);
  }
  render();
}
function podeAtualizar() {   // não redesenha enquanto o motorista digita — só se esperar a liberação do PCL
  if (S.chat) return false;   // o chat se atualiza sozinho
  if (!S.ped) return true;
  const c = cargaAtual(), p = c && c.pedidos.find(x => x.pv === S.ped);
  return !!(p && p.liberacao === "pendente" && !S.modo);
}
setInterval(() => { if (document.visibilityState === "visible" && S.me && S.me.motorista) { enviarFila().then(() => { if (podeAtualizar()) carregar(); }); } }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.me && S.me.motorista) { enviarFila(); carregar(); manterTela(); } });
window.addEventListener("online", () => { S.online = true; barraStatus(); enviarFila().then(carregar); });
window.addEventListener("offline", () => { S.online = false; barraStatus(); });

document.addEventListener("click", () => { if (S.me && S.me.motorista) manterTela(); }, { passive: true });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/motorista/sw.js", { scope: "/motorista/" }).catch(() => {});
(async () => {
  try { const me = await api("/me"); S.me = me.logado ? me : null; }
  catch (e) {   // [v5.10] abriu o app SEM SINAL: usa o que ficou guardado no aparelho
    const k = e.offline ? lerCache() : null;
    S.me = k ? k.me : null; if (k) { S.dados = k.dados; S.cacheEm = k.em; marcarFila(); }
  }
  if (S.me && S.me.motorista) { await enviarFila(); await carregar(); } else render();
})();
</script>
</body>
</html>
