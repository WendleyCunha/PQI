<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Bordo — gestão do dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/pqi-acesso.js" data-modulo="diario"></script>
<style>
/* ═══ Mesmo padrão visual do PQI (RG do Pedido, Mapa, Diagnóstico, Organogramas) ═══ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9; --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8; --block:#6B46A8; --block-soft:#EEE7F8; --idle:#8A93A3; --idle-soft:#EEF0F3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,h4,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
h3{font-size:16px;margin:22px 0 8px;font-weight:600}
a{color:var(--steel)}
.cap{color:var(--ink-3);font-size:13px;margin:2px 0 12px;max-width:85ch}
.muted{color:var(--ink-3)}
code{background:var(--rule-2);border-radius:4px;padding:0 5px;font-size:12.5px}
[hidden]{display:none!important}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{color:var(--ink-3);font-size:13px;margin-right:auto;display:flex;align-items:center;gap:8px}
.who.erro{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.salvando{background:var(--amber)} .dot.erro{background:var(--bad)}
button,.btn{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--ink-3)}
button.primary,.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
button.warn{color:var(--bad)} button.peq,.btn.peq{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button svg,.btn svg{width:15px;height:15px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
textarea{min-height:58px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.msg{font-size:13px} .msg.ok{color:var(--ok)} .msg.erro{color:var(--bad)}
.aviso{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--steel-soft);font-size:14px}
.alerta{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--amber-soft);font-size:14px;border-left:4px solid var(--amber)}
.conflito{margin:0 0 16px;padding:12px 14px;border-radius:6px;background:var(--bad-soft);border:1px solid var(--bad);font-size:14px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0}
details.box > summary{cursor:pointer;font-weight:600;font-size:14px}
details.box[open] > summary{margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--amber-soft);color:var(--amber)}
.p-azul{background:var(--prog-soft);color:var(--prog)} .p-cinza{background:var(--idle-soft);color:var(--ink-2)} .p-roxo{background:var(--block-soft);color:var(--block)} .p-aco{background:var(--steel-soft);color:var(--steel)}
.wrap{padding:24px 28px 64px}
footer.doc-foot{margin-top:40px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule);padding-top:10px}

/* casca: menu vertical de ícones + conteúdo */
.shell-item{display:flex;align-items:flex-start;gap:22px}
.side-rg{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 8px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow-y:auto}
.side-btn{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--ink-3);font:500 10.5px/1.2 "IBM Plex Sans",sans-serif;text-align:center;cursor:pointer;position:relative;text-decoration:none}
.side-btn svg{width:20px;height:20px;flex:none}
.side-btn:hover{background:var(--rule-2);color:var(--ink-2)}
.side-btn.ativo{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.side-btn .n{position:absolute;top:3px;right:5px;font-size:10px;font-weight:600;background:var(--rule-2);color:var(--ink-2);border-radius:8px;padding:0 5px}
.side-btn .n.alerta-n{background:var(--bad);color:#fff}
.side-btn.ativo .n:not(.alerta-n){background:var(--steel);color:var(--sheet)}
.side-sep{flex:none;width:70%;height:1px;background:var(--rule);margin:4px 0}
.conteudo-item{flex:1;min-width:0}
section > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
section h2{margin:0;font-size:22px;font-weight:700}
section > header p{margin:0;color:var(--ink-3);font-size:13px}
section > header .direita{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* cabeçalho + carimbo */
.doc-head{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--steel);border-radius:10px;padding:20px 24px;display:grid;grid-template-columns:1fr auto;gap:14px 28px;margin-bottom:18px}
.doc-head h1{margin:0;font-size:30px;line-height:1.1}
.doc-head .obj{margin:6px 0 0;color:var(--ink-2)}
.stamp{border:2px solid var(--steel);border-radius:8px;padding:10px 14px;min-width:230px;align-self:start}
.stamp .code{font:700 18px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.stamp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.stamp dt{color:var(--ink-3)} .stamp dd{margin:0;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;text-align:left;cursor:default;font:inherit;color:inherit;display:block;width:100%}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--steel)}
.kpi > span{color:var(--ink-3);font-size:13px}
.kpi b{display:block;font:700 30px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}

/* pilares e prioridades */
.pil-1{--pc:var(--steel);--ps:var(--steel-soft)} .pil-2{--pc:var(--bad);--ps:var(--bad-soft)} .pil-3{--pc:var(--prog);--ps:var(--prog-soft)} .pil-4{--pc:var(--block);--ps:var(--block-soft)}
.pil{background:var(--ps);color:var(--pc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-op{border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.2}
.chip-op.ativo{background:var(--pc,var(--steel));border-color:var(--pc,var(--steel));color:var(--sheet)}
.prio{font:700 12px "IBM Plex Sans Condensed",sans-serif;border-radius:5px;padding:2px 7px}
.prio-P1{background:var(--bad);color:#fff} .prio-P2{background:var(--steel);color:#fff} .prio-P3{background:var(--amber);color:#fff} .prio-P4{background:var(--block);color:#fff}

/* cadência do dia */
.cadencia{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:6px 0 18px}
.bloco{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.bloco.agora{border-color:var(--steel);box-shadow:inset 0 4px 0 var(--steel)}
.bloco.passou{opacity:.78}
.bloco .hr{font:600 12px "IBM Plex Sans",sans-serif;color:var(--ink-3)}
.bloco h4{margin:0;font-size:16px}
.bloco .foco{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bloco .agora-tag{position:absolute;top:-10px;right:10px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;padding:3px 0;cursor:pointer}
.ck input{width:16px;height:16px;margin-top:1px;accent-color:var(--steel);flex:none}
.ck.feito span{color:var(--ink-3);text-decoration:line-through}
.ck small{display:block;color:var(--ink-3);text-decoration:none}
.prio3{display:grid;gap:8px}
.prio-slot{display:grid;grid-template-columns:auto 86px 1fr auto;gap:8px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.prio-slot .num{font:700 20px "IBM Plex Sans Condensed",sans-serif;color:var(--ink-3);width:22px;text-align:center}
.prio-slot.feito{background:var(--ok-soft)} .prio-slot.feito input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.prio-slot input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
/* [v3.8] ritmo montado pelo usuário + diário de hoje recolhível */
.cadencia{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ck .tag-at{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:600;color:var(--prog);background:var(--prog-soft);border-radius:999px;padding:0 6px;text-decoration:none}
.rt-setores{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.rt-setores label{display:flex;gap:6px;align-items:center;font-size:13.5px;border:1px solid var(--rule);border-radius:999px;padding:4px 10px;cursor:pointer}
.rt-setores input{width:15px;height:15px;accent-color:var(--steel)}
.rt-bloco{border:1px solid var(--rule);border-left:4px solid var(--steel);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--paper)}
.rt-cab{display:grid;grid-template-columns:1fr 96px 96px auto;gap:6px;align-items:end}
.rt-cab label{font-size:12px}
.rt-foco{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px}
.rt-foco label.ck2{display:flex;gap:6px;align-items:center;font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.rt-itens{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.rt-item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--sheet);border:1px solid var(--rule-2);border-radius:6px;padding:4px 4px 4px 10px;font-size:13.5px}
.rt-item .tags{display:flex;gap:4px;align-items:center}
.rt-novo{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
.rt-novo input{padding:6px 8px;font-size:13px}
.hj-oculto{opacity:.55}
.sec-recolhe{border:0;background:none;padding:4px 8px;font-size:13px;color:var(--ink-2)}
.hoje-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}

/* log (linha do tempo) */
.captura{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.captura textarea.principal{min-height:74px;font-size:15px}
.captura .linha{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}
.captura .grupo{display:flex;flex-direction:column;gap:5px}
.captura .grupo > span{font-size:12px;color:var(--ink-3);font-weight:600}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.filtros select,.filtros input{width:auto;min-width:150px}
.dia-sep{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font:700 15px "IBM Plex Sans Condensed",sans-serif}
.dia-sep small{font:500 12.5px "IBM Plex Sans",sans-serif;color:var(--ink-3)}
.reg{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--pc,var(--rule));border-radius:8px;padding:10px 14px;margin-bottom:8px}
.reg .topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.reg .topo .acs{margin-left:auto;display:flex;gap:2px}
.reg p{margin:6px 0 0;white-space:pre-wrap;font-size:14.5px}
.reg .det{font-size:13px;color:var(--ink-2);margin-top:4px}
.reg .det b{color:var(--ink)}
.ib{background:none;border:0;padding:5px 7px;font-size:13px;opacity:.6;border-radius:5px;cursor:pointer;color:var(--ink)}
.ib:hover{opacity:1;background:var(--rule-2)} .ib.del:hover{background:var(--bad-soft);color:var(--bad)}
.vazio{color:var(--ink-3);text-align:center;padding:26px 10px;border:1px dashed var(--rule);border-radius:8px}

/* cobranças (quadro) */
.quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.coluna{background:color-mix(in srgb,var(--rule-2) 55%,var(--paper));border:1px solid var(--rule);border-radius:10px;padding:10px;min-height:120px}
.coluna h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:15px}
.cob{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cob.atrasada{border-left:5px solid var(--bad)} .cob.aguardando{border-left:5px solid var(--amber)} .cob.entregue{border-left:5px solid var(--ok)}
.cob .t{font-weight:600;font-size:14.5px}
.cob .m{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cob .bt{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.cob .bt button{padding:5px 9px;font-size:12.5px}
.hist{font-size:12px;color:var(--ink-3);margin-top:6px;border-top:1px dashed var(--rule);padding-top:5px}
.cob-acoes{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.cob-acao{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.cob-acao input[type=checkbox]{width:15px;height:15px;margin-top:2px;accent-color:var(--ok);flex:none}
.cob-acao.feita span{text-decoration:line-through;color:var(--ink-3)}
.cob-acao .pz{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.cob-acao .pz.venc{color:var(--bad);font-weight:600}
.cob-acao .ib{padding:0 4px;font-size:12px}
.cob-nova{display:grid;grid-template-columns:1fr 132px auto;gap:4px;margin-top:4px}
.cob-nova input{padding:4px 7px;font-size:12.5px}
.cob-nova button{padding:4px 9px;font-size:12.5px}
.cob .sep-bt{width:1px;align-self:stretch;background:var(--rule);margin:0 2px}
.andamento{margin-top:6px} .andamento summary{cursor:pointer;font-size:12px;color:var(--ink-3)}
.andamento ul{margin:4px 0 0;padding-left:16px;font-size:12.5px} .andamento li{margin:2px 0}
.adiar-rap{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}

/* pessoas */
.pess-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pess-lista{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px;max-height:72vh;overflow:auto}
.pess-it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;padding:8px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.pess-it:hover{background:var(--rule-2)} .pess-it.ativo{background:var(--steel-soft);border-color:var(--steel)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--block-soft);color:var(--block);font:700 13px "IBM Plex Sans Condensed",sans-serif}
.pess-it .nm{font-weight:600;font-size:14px;line-height:1.2} .pess-it small{display:block;color:var(--ink-3);font-size:12px}
.fb{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.fb .topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.fb .topo .acs{margin-left:auto;display:flex}
.fb .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.fb .cols div{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap}
.fb .cols b{display:block;font:600 12px "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:3px}

/* ATAs */
.ata-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ata-card{display:flex!important;flex-direction:column;align-items:stretch!important;gap:8px!important;background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--amber);border-radius:10px;padding:14px 16px!important;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;line-height:1.4}
.ata-card.fin{border-left-color:var(--ok)}
.ata-card:hover{border-color:var(--steel);box-shadow:0 4px 14px rgba(20,30,50,.08)}
.ata-card .ac-topo{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ata-card .ac-data{font:700 13px "IBM Plex Sans Condensed",sans-serif;color:var(--steel);background:var(--steel-soft);border-radius:6px;padding:3px 8px}
.ata-card h4{margin:0;font-size:18px;line-height:1.25;color:var(--ink)}
.ata-card .ac-meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.ata-card .ac-obj{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ata-card .ac-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--rule-2);padding-top:8px}
.ata-card .ac-nums > span{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:11.5px;line-height:1.25;color:var(--ink-3)}
.ata-card .ac-nums b{display:block;font:700 20px "IBM Plex Sans Condensed",sans-serif;color:var(--ink);margin-bottom:2px}

dialog h3{font-size:24px}

.toast .x{margin-left:auto;border:0;opacity:.7}
.pick{position:fixed;z-index:85;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(10,15,25,.22);display:flex;flex-direction:column;max-height:340px;width:320px}
.pick .pk-b{padding:8px;border-bottom:1px solid var(--rule-2)}
.pick .pk-l{overflow:auto;padding:4px 8px}
.pick .pk-g{font:600 11.5px "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:8px 2px 4px}
.pick label{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:13.5px;line-height:1.3}
.pick label:hover{background:var(--rule-2)} .pick label input{width:16px;height:16px;accent-color:var(--steel);flex:none}
.pick label small{display:block;color:var(--ink-3);font-size:12px}

}

<div class="bar"><div class="bar-in">

  <footer class="doc-foot">Diário de Bordo · gestão do dia — registros, tarefas, pessoas e ATAs. Os registros deste diário são pessoais: só você os vê.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<datalist id="dl-pessoas"></datalist>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// DIÁRIO DE BORDO · GESTÃO DO DIA  [v3.7]
// Um documento por registro em /api/diario/itens (coleção diario_gestao),
// PESSOAL: cada pessoa só vê o que é dela. dados._tipo diz o que é:
//   log       — ações e acontecimentos (reunião, decisão, teste, problema…)
//   cobranca  — pendência de terceiro (follow-up), com lembrete e histórico
//   feedback  — conversa com colaborador/par (fortes, melhorias, acordos)
//   ata       — ATA de reunião (deliberações × ações com responsável)
//   dia       — plano do dia: 3 prioridades + checklist da cadência
//   config    — horários da cadência
// O servidor não conhece os campos: campo novo = só mexer AQUI.
// ═══════════════════════════════════════════════════════════════════
const API="/api/diario/itens";

// ─── a metodologia ───
const PILARES=[
  {id:1,ico:"🔁",nome:"Melhoria Contínua",curto:"Melhoria",desc:"Mapeamento de processos, KPIs/OKRs, auditorias, Lean/Six Sigma"},
  {id:2,ico:"🔥",nome:"Suporte Operacional",curto:"Operação",desc:"Mão na massa: gargalos pontuais, problemas críticos, bandeiras vermelhas"},
  {id:3,ico:"💻",nome:"Projetos e Sistemas",curto:"Sistemas",desc:"Especificação, validação e testes de sistemas, automações"},
  {id:4,ico:"👥",nome:"Pessoas e Liderança",curto:"Pessoas",desc:"Feedbacks, alinhamentos, entregas do time e de terceiros, pares e diretoria"},
];
const PRIORIDADES=[
  {id:"P1",nome:"Incêndio / validação bloqueante",desc:"Paralisa a operação ou entrega de sistema com prazo estourando"},
  {id:"P2",nome:"Melhoria e estruturação",desc:"Projetos de processo, automações, construção de sistemas, reuniões estratégicas"},
  {id:"P3",nome:"Cobranças e acompanhamentos",desc:"Lembretes, cobranças de pendências, retornos de rotina"},
  {id:"P4",nome:"Pessoas e desenvolvimento",desc:"Feedbacks planejados, alinhamentos, mapeamento de competências"},
];
const TIPOS_LOG=[
  {id:"reuniao",ico:"🗣️",nome:"Reunião"},{id:"decisao",ico:"⚖️",nome:"Decisão"},{id:"teste",ico:"🧪",nome:"Teste de sistema"},
  {id:"resolvido",ico:"✅",nome:"Problema resolvido"},{id:"incendio",ico:"🚨",nome:"Incêndio / bandeira vermelha"},
  {id:"alinhamento",ico:"🤝",nome:"Alinhamento"},{id:"entrega",ico:"📦",nome:"Entrega"},{id:"outro",ico:"📝",nome:"Outro"},
];
const TIPOS_FB=["Feedback","1:1 / alinhamento de rotina","Reconhecimento","Ponto de correção","Acompanhamento de entrega","Comunicação com par / diretoria"];
// sugestão de pilar e prioridade conforme o tipo (o usuário pode trocar)
const SUGESTAO_TIPO={reuniao:[4,"P2"],decisao:[1,"P2"],teste:[3,"P1"],resolvido:[2,"P1"],incendio:[2,"P1"],alinhamento:[4,"P4"],entrega:[1,"P2"],outro:[1,"P3"]};
// cadência do dia (horários ajustáveis em ⚙️)
const HORARIOS_PADRAO={inicio:"08:00",manha:"08:15",meio:"12:00",tarde:"12:30",fim:"17:15",encerra:"17:45"};
const BLOCOS=[
  {id:"inicio",ate:"manha",nome:"Início do dia",dur:"15 min",foco:"Planejamento & priorização",
   itens:[["revisar","Revisar o diário de ontem"],["prioridades","Definir as 3 prioridades P1/P2 do dia"],["checar_cob","Checar a lista de tarefas"]]},
  {id:"manha",ate:"meio",nome:"Bloco manhã",dur:"",foco:"Sistemas & melhoria contínua — tempo focado, sem interrupções",
   itens:[["foco_manha","Bloco focado em projetos, testes de sistemas e mapeamentos"]]},
  {id:"meio",ate:"tarde",nome:"Meio do dia",dur:"30 min",foco:"Acompanhamento & cobranças",
   itens:[["disparar","Disparar as cobranças de terceiros"],["validar","Validar as respostas recebidas"],["atualizar","Atualizar o diário"]]},
  {id:"tarde",ate:"fim",nome:"Bloco tarde",dur:"",foco:"Operação, suporte & pessoas — gargalos, feedbacks, alinhamentos",
   itens:[["tarde_op","Atender gargalos operacionais / suporte hands-on"],["tarde_pessoas","Feedbacks e reuniões de alinhamento"]]},
  {id:"fim",ate:"encerra",nome:"Fim do dia",dur:"15 min",foco:"Consolidação & ATAs",
   itens:[["registrar","Registrar o diário do dia"],["atas","Finalizar e converter as ATAs do dia"],["amanha","Organizar a agenda de amanhã"]]},
];

// ─── utilidades ───
const $=(s,r=document)=>r.querySelector(s);
function el(t,c){ const e=document.createElement(t); if(c) e.className=c; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tx(v){ return String(v==null?"":v).trim(); }
const nrm=s=>tx(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function hojeISO(){ return iso(new Date()); }
function somaDias(isoD,n){ const d=new Date(isoD+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function proxDiaUtil(isoD){ let d=somaDias(isoD,1); while([0,6].includes(new Date(d+"T12:00:00").getDay())) d=somaDias(d,1); return d; }
function agoraHM(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function minutos(hm){ const p=String(hm||"").split(":").map(Number); return p.length<2||p.some(isNaN)?null:p[0]*60+p[1]; }
function dataBR(isoD){ if(!isoD) return "—"; const d=new Date(String(isoD).length<=10?isoD+"T12:00:00":isoD); if(isNaN(d)) return isoD; return d.toLocaleDateString("pt-BR"); }
function dataHoraBR(v){ if(!v) return "—"; const d=new Date(v); if(isNaN(d)) return v; return d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); }
function diaSemana(isoD){ const t=new Date(isoD+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}); return t.charAt(0).toUpperCase()+t.slice(1); }
function diasAte(isoD){ if(!isoD) return null; return Math.round((new Date(isoD+"T12:00:00")-new Date(hojeISO()+"T12:00:00"))/864e5); }
function iniciais(n){ const p=tx(n).split(/\s+/).filter(Boolean); return p.length?(p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase():"?"; }
function pilar(id){ return PILARES.find(p=>p.id===Number(id))||null; }
function pilPill(id){ const p=pilar(id); return p?`<span class="pill pil pil-${p.id}" title="${esc(p.nome)}">${p.ico} ${esc(p.curto)}</span>`:""; }
function prioTag(id){ const p=PRIORIDADES.find(x=>x.id===id); return p?`<span class="prio prio-${p.id}" title="${esc(p.nome)}">${p.id}</span>`:""; }
function tipoLog(id){ return TIPOS_LOG.find(t=>t.id===id)||TIPOS_LOG[TIPOS_LOG.length-1]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function baixarBlob(b,nome){ const u=URL.createObjectURL(b),a=document.createElement("a"); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }

// ═══════════════════════════════════════════════════════════════════
// DADOS E GRAVAÇÃO (um registro por vez, com controle de versão)
// ═══════════════════════════════════════════════════════════════════
let ITENS=[], NIVEL=3, USUARIO="", BASE=null;
const pend={};
let statusAtual={tipo:"ok",det:""};
function setStatus(t,d){ statusAtual={tipo:t,det:d||""}; const dot=$("#dot"), w=$("#who"); dot.className="dot "+t; w.classList.toggle("erro",t==="erro");
  $("#whoTxt").textContent= t==="salvando"?"Salvando…":t==="erro"?"Erro ao salvar: "+(d||""):`Tudo salvo · ${diaSemana(hojeISO())}`; }
async function api(url,op={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},cache:"no-store",...op});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ $("#root").innerHTML='<div class="conflito"><b>Sua sessão expirou.</b> Entre de novo pelo Painel. <a href="/" target="_top">Ir para o Painel</a></div>'; throw new Error("sessão expirada"); }
  return {r,j};
}
const doTipo=t=>ITENS.filter(i=>i.dados._tipo===t);
const porId=id=>ITENS.find(i=>i.id===id);
async function criar(dados){
  if(NIVEL<2) throw new Error("Seu perfil no Diário é “Visualizar”: dá para consultar, mas não gravar.");
  setStatus("salvando");
  const {r,j}=await api(API,{method:"POST",body:JSON.stringify({dados})});
  if(!r.ok){ setStatus("erro",j.detail||r.status); throw new Error(j.detail||`HTTP ${r.status}`); }
  ITENS.push(j); setStatus("ok"); atualizarMenu(); return j;
}
function salvar(item){ if(NIVEL<2) return; setStatus("salvando"); clearTimeout(pend[item.id]); pend[item.id]=setTimeout(()=>enfileirar(item),600); }
function enfileirar(item){ delete pend[item.id]; item._fila=(item._fila||Promise.resolve()).then(()=>enviar(item)); return item._fila; }
async function salvarAgora(item){ clearTimeout(pend[item.id]); return enfileirar(item); }
async function enviar(item){
  try{
    const {r,j}=await api(`${API}/${item.id}`,{method:"PUT",body:JSON.stringify({dados:item.dados,versao:item.versao})});
    if(r.status===409){ Object.assign(item,{dados:j.atual.dados,versao:j.atual.versao}); setStatus("ok"); toast("Este registro foi alterado em outra aba — a tela foi atualizada com a versão mais nova."); render(); return; }
    if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    item.versao=j.versao; item.atualizado_em=j.atualizado_em;
    if(!Object.keys(pend).length) setStatus("ok");
  }catch(e){ if(e.message!=="sessão expirada") setStatus("erro",e.message); }
}
async function excluir(item, pergunta){
  if(pergunta&&!confirm(pergunta)) return false;
  const {r,j}=await api(`${API}/${item.id}/excluir`,{method:"POST"});
  if(!r.ok){ alert(j.detail||`Não consegui excluir (HTTP ${r.status}).`); return false; }
  ITENS=ITENS.filter(x=>x!==item); atualizarMenu(); return true;
}
async function salvarTudo(){ await Promise.all(Object.keys(pend).map(id=>{ clearTimeout(pend[id]); const it=porId(id); return it?enfileirar(it):null; })); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") salvarTudo(); });
window.addEventListener("beforeunload",e=>{ if(Object.keys(pend).length){ salvarTudo(); e.preventDefault(); e.returnValue=""; } });

// ─── configuração e plano do dia ───
function cfg(){ const c=doTipo("config")[0]; return {...HORARIOS_PADRAO,...((c&&c.dados.horarios)||{})}; }
// [v3.8] RITMO DO DIA — 100% da pessoa: blocos, horários e itens. Começa pelo modelo padrão.
function ritmoPadrao(){ const h=cfg();
  return {setores:null,blocos:BLOCOS.map(b=>({id:b.id,nome:b.nome,inicio:h[b.id],fim:h[b.ate],foco:b.foco,cobrancas:b.id==="meio",
    itens:b.itens.map(([k,t])=>({id:k,texto:t,padrao:true}))}))}; }
function ritmo(){ const c=doTipo("config")[0]; const r=c&&c.dados.ritmo; return r&&Array.isArray(r.blocos)?r:ritmoPadrao(); }
function horaCobranca(){ const b=ritmo().blocos.find(x=>x.cobrancas)||ritmo().blocos.find(x=>x.id==="meio"); return (b&&b.inicio)||"12:00"; }
// atividades do Inventário do Diagnóstico dos setores da pessoa
let ATIV_SETOR=[];
async function carregarAtividadesSetor(){ try{ const r=await fetch("/api/diario/atividades-setor",{cache:"no-store"}); if(r.ok) ATIV_SETOR=(await r.json()).departamentos||[]; }catch(_){} }
function setoresDoRitmo(r){ const ids=(r&&Array.isArray(r.setores)&&r.setores.length)?r.setores:ATIV_SETOR.filter(d=>d.meu).map(d=>d.id);
  return ATIV_SETOR.filter(d=>ids.includes(d.id)); }
function acharAtividade(texto, setores){ const k=nrm(texto); for(const d of setores){ const a=d.atividades.find(x=>nrm(x.atividade)===k); if(a) return {dep:d,ativ:a}; } return null; }
async function garantirDia(dataISO){
  let d=doTipo("dia").find(x=>x.dados.data===dataISO);
  if(!d) d=await criar({_tipo:"dia",data:dataISO,prioridades:[{texto:"",nivel:"P1",feito:false},{texto:"",nivel:"P2",feito:false},{texto:"",nivel:"P2",feito:false}],checks:{},notas:""});
  return d;
}
function diaDe(dataISO){ return doTipo("dia").find(x=>x.dados.data===dataISO)||null; }
function blocoAgora(){
  const B=ritmo().blocos, m=minutos(agoraHM());
  for(const b of B){ const ini=minutos(b.inicio), fim=minutos(b.fim); if(ini!=null&&fim!=null&&m>=ini&&m<fim) return b.id; }
  const prim=B.length?minutos(B[0].inicio):null; return prim!=null&&m<prim?"antes":"depois";
}

// ─── cobranças: status calculado ───
function acoesAbertas(c){ return (c.dados.acoes||[]).filter(a=>tx(a.texto)&&!a.feito); }
function statusCob(c){ const d=c.dados; if(d.status==="entregue") return "entregue"; const n=diasAte(d.prazo);
  if(n!=null&&n<0) return "atrasada";
  return acoesAbertas(c).some(a=>a.prazo&&diasAte(a.prazo)<0)?"atrasada":"aguardando"; }
const ROT_COB={atrasada:["🔴","Atrasado / cobrar","p-bad"],aguardando:["🟡","Aguardando resposta","p-warn"],entregue:["🟢","Entregue / concluído","p-ok"]};
function cobrancasPendentes(){ return doTipo("cobranca").filter(c=>statusCob(c)!=="entregue"); }
function cobrarHoje(){ const h=hojeISO(); return cobrancasPendentes().filter(c=>statusCob(c)==="atrasada"||(c.dados.prazo&&c.dados.prazo<=h)||(c.dados.lembrete&&c.dados.lembrete.slice(0,10)<=h)); }
function msgCobranca(c){
  const d=c.dados, primeiro=tx(d.quem).split(/[\s,(]/)[0]||"", atras=statusCob(c)==="atrasada";
  return `Olá${primeiro?", "+primeiro:""}! Tudo bem?\n\nPassando para acompanhar: ${tx(d.oque)}${d.prazo?` (prazo combinado: ${dataBR(d.prazo)})`:""}.\n${atras?"O prazo já passou — consegue me dar um retorno hoje sobre o andamento?":"Consegue me confirmar se segue dentro do prazo?"}\n\nObrigado!`;
}

// ═══════════════════════════════════════════════════════════════════
// LEMBRETES — avisos na tela (e no navegador, se você permitir)
// Funcionam enquanto o Painel estiver aberto em alguma aba.
// ═══════════════════════════════════════════════════════════════════
function toast(texto, botoes){
  const t=el("div","toast"); t.innerHTML=`<div style="flex:1">${texto}</div>`;
  (botoes||[]).forEach(([rot,fn])=>{ const b=el("button"); b.type="button"; b.textContent=rot; b.onclick=()=>{ fn(); t.remove(); }; t.firstChild.appendChild(document.createElement("br")); t.firstChild.appendChild(b); });
  const x=el("button","x"); x.type="button"; x.textContent="✕"; x.title="Fechar"; x.onclick=()=>t.remove(); t.appendChild(x);

  const R=JSON.parse(JSON.stringify(ritmo()));
  if(!Array.isArray(R.setores)||!R.setores.length) R.setores=ATIV_SETOR.filter(d=>d.meu).map(d=>d.id);
  if(!R.setores.length&&ATIV_SETOR.length===1) R.setores=[ATIV_SETOR[0].id];
  const f=abrirDlg("Montar meu ritmo do dia",`<p class="cap" style="margin:0 0 6px">Monte os blocos do seu dia com as <b>atividades do seu setor</b> (Inventário do Diagnóstico). Um item que não existe na lista vira <b>atividade nova</b> do setor ao salvar.</p><div id="rtEd"></div>`,
    async()=>{
      R.blocos.forEach(b=>{ if(!tx(b.nome)) throw new Error("Todo bloco precisa de nome."); if(minutos(b.inicio)==null||minutos(b.fim)==null) throw new Error(`Informe início e fim do bloco “${b.nome}”.`);
        if(minutos(b.fim)<=minutos(b.inicio)) throw new Error(`No bloco “${b.nome}”, o fim precisa ser depois do início.`); });
      R.blocos.sort((a,b)=>minutos(a.inicio)-minutos(b.inicio));
      // itens que não estão no Inventário viram atividade nova do setor
      const sets=ATIV_SETOR.filter(d=>R.setores.includes(d.id)), destino=sets[0]; let novas=0, semSetor=0;
      for(const b of R.blocos) for(const it of b.itens){ if(it.padrao||!tx(it.texto)) continue;
        const ach=acharAtividade(it.texto,sets);
        if(ach){ Object.assign(it,{atividade:true,dep:ach.dep.id,dep_nome:ach.dep.nome}); continue; }
        if(!destino){ semSetor++; continue; }
        const r=await fetch("/api/diario/atividades-setor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dep:destino.id,atividade:tx(it.texto)})});
        const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.detail||`Não consegui criar a atividade “${it.texto}” (HTTP ${r.status}).`);
        if(j.criada){ novas++; destino.atividades.push({atividade:tx(it.texto),subsetor:"",categoria:""}); }
        Object.assign(it,{atividade:true,dep:destino.id,dep_nome:destino.nome}); }
      let cf=doTipo("config")[0]; if(!cf) cf=await criar({_tipo:"config",horarios:cfg(),ritmo:R}); else { cf.dados.ritmo=R; await salvarAgora(cf); }
      render();
      toast(`✓ Ritmo do dia salvo.${novas?` ${novas} atividade(s) nova(s) incluída(s) no Inventário de ${esc(destino.nome)}.`:""}${semSetor?` ${semSetor} item(ns) ficaram só no seu ritmo (você não tem setor ligado).`:""}`);
    }, "Salvar meu ritmo", '<button type="button" id="rtPadrao" style="margin-right:auto">↺ Voltar ao modelo padrão</button>', true);
  const ed=$("#rtEd",f);
  const desenhar=()=>{
    const sets=ATIV_SETOR.filter(d=>R.setores.includes(d.id));
    const lista=sets.flatMap(d=>d.atividades.map(a=>({a,d})));
    ed.innerHTML=`${ATIV_SETOR.length?`<div class="rt-setores"><b style="font-size:13px;align-self:center">Meu setor:</b>${ATIV_SETOR.map(d=>`<label><input type="checkbox" data-set="${d.id}" ${R.setores.includes(d.id)?"checked":""}>${esc(d.nome)} <span class="muted">(${d.atividades.length})</span>${d.meu?' <span class="pill p-aco">você</span>':""}</label>`).join("")}</div>`
        :'<p class="alerta">Você ainda não tem acesso a nenhum setor do Diagnóstico — os itens ficam só no seu ritmo. Peça ao administrador para ligar o seu departamento em Segurança.</p>'}
      <datalist id="dl-ativ">${lista.map(({a,d})=>`<option value="${esc(a.atividade)}" label="${esc([a.subsetor,d.nome].filter(Boolean).join(" · "))}">`).join("")}</datalist>
      ${R.blocos.map((b,i)=>`<div class="rt-bloco" data-b="${i}">
        <div class="rt-cab"><label class="f">Bloco<input data-bc="nome" value="${esc(b.nome)}" placeholder="Ex.: Abertura da operação"></label>
          <label class="f">Início<input type="time" data-bc="inicio" value="${esc(b.inicio||"")}"></label><label class="f">Fim<input type="time" data-bc="fim" value="${esc(b.fim||"")}"></label>
          <span style="display:flex;gap:2px"><button type="button" class="ib" data-bmv="-1" title="Subir" ${i?"":"disabled"}>▲</button><button type="button" class="ib" data-bmv="1" title="Descer" ${i<R.blocos.length-1?"":"disabled"}>▼</button><button type="button" class="ib del" data-bdel title="Excluir bloco">🗑</button></span></div>
        <div class="rt-foco"><input data-bc="foco" value="${esc(b.foco||"")}" placeholder="Foco do bloco (opcional)"><label class="ck2" title="O horário de início deste bloco vira o horário padrão dos lembretes de cobrança"><input type="checkbox" data-bcob ${b.cobrancas?"checked":""}> momento das cobranças</label></div>
        <div class="rt-itens">${(b.itens||[]).map((it,k)=>{ const ach=!it.padrao&&acharAtividade(it.texto,sets);
          return `<div class="rt-item"><span>${esc(it.texto)}</span><span class="tags">${it.padrao?'<span class="pill p-cinza">rotina</span>':ach?`<span class="pill p-azul" title="${esc(ach.dep.nome)}">atividade${ach.ativ.subsetor?" · "+esc(ach.ativ.subsetor):""}</span>`:'<span class="pill p-warn" title="Não está no Inventário do setor — será incluída ao salvar">nova atividade</span>'}
            <button type="button" class="ib" data-imv="${k}:-1" title="Subir" ${k?"":"disabled"}>▲</button><button type="button" class="ib" data-imv="${k}:1" title="Descer" ${k<b.itens.length-1?"":"disabled"}>▼</button><button type="button" class="ib del" data-idel="${k}" title="Remover">✕</button></span></div>`; }).join("")||'<span class="cap" style="margin:0">Nenhum item.</span>'}</div>
        <div class="rt-novo"><input data-inovo list="dl-ativ" placeholder="＋ Atividade do setor ou nova (escreva e tecle Enter)"><button type="button" class="peq" data-iadd>Incluir</button></div></div>`).join("")}
      <button type="button" class="peq" id="rtBloco">＋ Novo bloco</button>`;
    ed.querySelectorAll("[data-set]").forEach(cb=>cb.onchange=()=>{ R.setores=cb.checked?[...new Set([...R.setores,cb.dataset.set])]:R.setores.filter(x=>x!==cb.dataset.set); desenhar(); });
    ed.querySelectorAll(".rt-bloco").forEach(box=>{ const b=R.blocos[+box.dataset.b];
      box.querySelectorAll("[data-bc]").forEach(i=>i.oninput=()=>{ b[i.dataset.bc]=i.value; });
      box.querySelector("[data-bcob]").onchange=e=>{ R.blocos.forEach(x=>x.cobrancas=false); b.cobrancas=e.target.checked; desenhar(); };
      box.querySelectorAll("[data-bmv]").forEach(x=>x.onclick=()=>{ const i=+box.dataset.b, j=i+Number(x.dataset.bmv); [R.blocos[i],R.blocos[j]]=[R.blocos[j],R.blocos[i]]; desenhar(); });
      box.querySelector("[data-bdel]").onclick=()=>{ if(b.itens.length&&!confirm(`Excluir o bloco “${b.nome}” e os ${b.itens.length} item(ns)?`)) return; R.blocos.splice(+box.dataset.b,1); desenhar(); };
      box.querySelectorAll("[data-imv]").forEach(x=>x.onclick=()=>{ const [k,dlt]=x.dataset.imv.split(":").map(Number); [b.itens[k],b.itens[k+dlt]]=[b.itens[k+dlt],b.itens[k]]; desenhar(); });
      box.querySelectorAll("[data-idel]").forEach(x=>x.onclick=()=>{ b.itens.splice(+x.dataset.idel,1); desenhar(); });
      const inp=box.querySelector("[data-inovo]"), add=()=>{ const t=tx(inp.value); if(!t) return; if(b.itens.some(x=>nrm(x.texto)===nrm(t))){ inp.value=""; return; }
        b.itens.push({id:uid(),texto:t}); desenhar(); const n=ed.querySelector(`.rt-bloco[data-b="${box.dataset.b}"] [data-inovo]`); n&&n.focus(); };
      box.querySelector("[data-iadd]").onclick=add; inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } }; });
    $("#rtBloco",ed).onclick=()=>{ const ult=R.blocos[R.blocos.length-1]; R.blocos.push({id:uid(),nome:"Novo bloco",inicio:ult?ult.fim:"08:00",fim:"",foco:"",cobrancas:false,itens:[]}); desenhar();
      const ns=ed.querySelectorAll('[data-bc="nome"]'); ns[ns.length-1].select(); };
  };
  $("#rtPadrao",f).onclick=()=>{ if(!confirm("Voltar ao modelo padrão de 5 blocos? (o seu ritmo atual é descartado ao salvar)")) return; const p=ritmoPadrao(); R.blocos=p.blocos; desenhar(); };
  desenhar();
}

// ─── diálogo genérico ───
function abrirDlg(titulo, corpo, aoSalvar, rotulo, extra, largo){
  fecharPick();
  const dl=$("#dlg"), f=$("#dlgForm");
  f.innerHTML=`<h3>${esc(titulo)}</h3>${corpo}<p class="msg erro" id="dlgMsg"></p><div class="acts">${extra||""}<button type="button" value="cancel" id="dlgNao">Cancelar</button><button type="submit" class="primary" id="dlgSim">${esc(rotulo||"Salvar")}</button></div>`;
  $("#dlgNao").onclick=()=>{ fecharPick(); dl.close(); };
  f.onsubmit=async e=>{ e.preventDefault(); const b=$("#dlgSim"); b.disabled=true;
    try{ const r=await aoSalvar(new FormData(f)); if(r!==false){ fecharPick(); dl.close(); } }catch(err){ $("#dlgMsg").textContent=err.message; } finally{ b.disabled=false; } };
  f.onkeydown=e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); f.requestSubmit(); } else if(e.key==="Enter"&&e.target.closest("#rtEd")&&e.target.matches("input")) e.preventDefault(); };
  dl.showModal(); return f;
}

// ═══════════════════════════════════════════════════════════════════
// REGISTRO (LOG) — ações e acontecimentos, com o porquê das decisões
// ═══════════════════════════════════════════════════════════════════
const estLog={periodo:"7",data:"",pilar:"",tipo:"",prio:"",busca:""};
function formLogHTML(d){
  d=d||{}; const tipo=d.tipo||"reuniao";
  return `<input type="hidden" name="tipo" value="${esc(tipo)}"><input type="hidden" name="pilar" value="${esc(d.pilar||"")}"><input type="hidden" name="prioridade" value="${esc(d.prioridade||"")}">
    <label class="f">O que aconteceu? *<textarea name="texto" rows="3" class="principal" placeholder="Ex.: Validei com a TI a correção do cálculo de frete no ARM — aprovado para produção.">${esc(d.texto||"")}</textarea></label>
    <div class="linha"><div class="grupo"><span>Tipo</span><div class="chips" data-chips="tipo">${TIPOS_LOG.map(t=>`<button type="button" class="chip-op${t.id===tipo?" ativo":""}" data-v="${t.id}">${t.ico} ${esc(t.nome)}</button>`).join("")}</div></div></div>
    <div class="linha"><div class="grupo"><span>Pilar</span><div class="chips" data-chips="pilar">${PILARES.map(p=>`<button type="button" class="chip-op pil-${p.id}${Number(d.pilar)===p.id?" ativo":""}" data-v="${p.id}" title="${esc(p.desc)}">${p.ico} ${esc(p.nome)}</button>`).join("")}</div></div>
      <div class="grupo"><span>Prioridade</span><div class="chips" data-chips="prioridade">${PRIORIDADES.map(p=>`<button type="button" class="chip-op${d.prioridade===p.id?" ativo":""}" data-v="${p.id}" title="${esc(p.nome+" — "+p.desc)}">${p.id}</button>`).join("")}</div></div></div>
    <label class="f" data-porque style="margin-top:10px">Por quê? (motivo da decisão — o histórico que vai responder “por que fizemos assim”)<textarea name="porque" rows="2">${esc(d.porque||"")}</textarea></label>
    <div class="grade" style="margin-top:10px"><label class="f">Pessoas envolvidas<input name="pessoas" value="${esc(d.pessoas||"")}" data-pick="varios" placeholder="Clique para escolher"></label>
      <label class="f">Resultado / impacto<input name="resultado" value="${esc(d.resultado||"")}" placeholder="Ex.: operação liberada em 40 min"></label>
      <label class="f">Evidência (link)<input name="evidencia" value="${esc(d.evidencia||"")}" placeholder="Drive, chamado, print…"></label>
      <label class="f">Data<input type="date" name="data" value="${esc(d.data||hojeISO())}"></label><label class="f">Hora<input type="time" name="hora" value="${esc(d.hora||agoraHM())}"></label></div>`;
}
function ligarFormLog(f){
  const sinc=()=>{ const t=f.querySelector('[name="tipo"]').value; f.querySelector("[data-porque]").style.display = t==="decisao"||tx(f.querySelector('[name="porque"]').value)?"":"none"; };
  f.querySelectorAll("[data-chips]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const campo=g.dataset.chips, hid=f.querySelector(`[name="${campo}"]`), ativo=b.classList.contains("ativo")&&campo!=="tipo";
    g.querySelectorAll("button").forEach(x=>x.classList.remove("ativo")); if(!ativo){ b.classList.add("ativo"); hid.value=b.dataset.v; } else hid.value="";
    if(campo==="tipo"){ const s=SUGESTAO_TIPO[b.dataset.v]; if(s){ ["pilar","prioridade"].forEach((k,i)=>{ const h=f.querySelector(`[name="${k}"]`); if(!h.value||h.dataset.auto){ h.value=String(s[i]); h.dataset.auto="1";
        f.querySelectorAll(`[data-chips="${k}"] button`).forEach(x=>x.classList.toggle("ativo",x.dataset.v===String(s[i]))); } }); } sinc(); }
    else hid.dataset.auto=""; }));
  f.querySelectorAll("[data-pick]").forEach(i=>ligarPick(i,i.dataset.pick==="varios"));
  sinc();
  if(!f.querySelector('[name="pilar"]').value){ const b=f.querySelector('[data-chips="tipo"] .ativo'); if(b){ const s=SUGESTAO_TIPO[b.dataset.v]; ["pilar","prioridade"].forEach((k,i)=>{ const h=f.querySelector(`[name="${k}"]`); h.value=String(s[i]); h.dataset.auto="1"; f.querySelectorAll(`[data-chips="${k}"] button`).forEach(x=>x.classList.toggle("ativo",x.dataset.v===String(s[i]))); }); } }
}
function dadosLog(fd){ const o={}; ["texto","tipo","pilar","prioridade","porque","pessoas","resultado","evidencia","data","hora"].forEach(k=>o[k]=tx(fd.get(k))); o.pilar=Number(o.pilar)||""; return o; }
function dlgLog(item){
  const f=abrirDlg(item?"Editar registro":"Registro rápido",formLogHTML(item&&item.dados),async fd=>{
    const v=dadosLog(fd); if(!v.texto) throw new Error("Escreva o que aconteceu.");
    if(item){ Object.assign(item.dados,v); await salvarAgora(item); } else await criar({_tipo:"log",...v});
    render(); }, item?"Salvar":"Registrar", "<span style='margin-right:auto;font-size:12px;color:var(--ink-3)'>Ctrl + Enter grava</span>");
  ligarFormLog(f); setTimeout(()=>f.querySelector('[name="texto"]').focus(),30);
}
function cardLog(l,op){
  op=op||{};
  const d=l.dados, t=tipoLog(d.tipo), p=pilar(d.pilar), e=el("div",`reg${p?" pil-"+p.id:""}`);
  e.innerHTML=`<div class="topo"><span>${esc(d.hora||"")}</span><span class="pill p-cinza">${t.ico} ${esc(t.nome)}</span>${pilPill(d.pilar)}${prioTag(d.prioridade)}
      <span class="acs">${op.hoje?(d.oculto_hoje?'<button type="button" class="ib" data-ok title="Voltar para a lista de hoje">↺</button>':'<button type="button" class="ib" data-ok title="Conferido — tirar da lista de hoje (continua no Registro)">✓</button>'):""}<button type="button" class="ib" data-ed title="Editar">✏️</button><button type="button" class="ib del" data-del title="Excluir">🗑</button></span></div>
    <p>${esc(d.texto)}</p>${d.porque?`<div class="det"><b>Por quê:</b> ${esc(d.porque)}</div>`:""}${d.resultado?`<div class="det"><b>Resultado:</b> ${esc(d.resultado)}</div>`:""}
    ${d.pessoas?`<div class="det"><b>Com:</b> ${esc(d.pessoas)}</div>`:""}${d.evidencia?`<div class="det"><b>Evidência:</b> ${/^https?:\/\//.test(d.evidencia)?`<a href="${esc(d.evidencia)}" target="_blank" rel="noopener">${esc(d.evidencia)}</a>`:esc(d.evidencia)}</div>`:""}
    ${d.ata_id&&porId(d.ata_id)?`<div class="det"><a href="#" data-ata>📄 Ver a ATA</a></div>`:""}`;
  e.querySelector("[data-ed]").onclick=()=>dlgLog(l);
  const okb=e.querySelector("[data-ok]"); if(okb) okb.onclick=async()=>{ d.oculto_hoje=!d.oculto_hoje; await salvarAgora(l); render(); };
  e.querySelector("[data-del]").onclick=async()=>{ if(await excluir(l,"Excluir este registro do diário?")) render(); };
  const a=e.querySelector("[data-ata]"); if(a) a.onclick=ev=>{ ev.preventDefault(); estAta.aberta=d.ata_id; ir("atas"); };
  return e;
}
function filtrarLogs(){
  const hoje=hojeISO(), lim=estLog.periodo==="data"?null:estLog.periodo==="tudo"?null:somaDias(hoje,-(Number(estLog.periodo)-1)), t=nrm(estLog.busca);
  return doTipo("log").filter(l=>{ const d=l.dados;
    if(estLog.periodo==="data"&&d.data!==estLog.data) return false; if(lim&&d.data<lim) return false;
    if(estLog.pilar&&String(d.pilar)!==estLog.pilar) return false; if(estLog.tipo&&d.tipo!==estLog.tipo) return false; if(estLog.prio&&d.prioridade!==estLog.prio) return false;
    if(t&&![d.texto,d.porque,d.pessoas,d.resultado].some(x=>nrm(x).includes(t))) return false; return true; })
    .sort((a,b)=>(b.dados.data+b.dados.hora).localeCompare(a.dados.data+a.dados.hora));
}
function renderLog(c){
  c.innerHTML=`<section><header><h2>Registro do dia (log)</h2><p>Reuniões, decisões, testes de sistemas e problemas resolvidos — com o porquê.</p>
      <span class="direita"><button type="button" class="peq" id="lgXls">⬇️ Excel</button><button type="button" class="peq" id="lgRel">📄 Relatório de impacto</button></span></header>
    <div class="filtros">
      <select id="fPer" aria-label="Período">${[["1","Hoje"],["7","Últimos 7 dias"],["30","Últimos 30 dias"],["90","Últimos 90 dias"],["tudo","Tudo"],["data","Um dia específico"]].map(([v,r])=>`<option value="${v}"${v===estLog.periodo?" selected":""}>${r}</option>`).join("")}</select>
      <input type="date" id="fData" value="${esc(estLog.data||hojeISO())}" ${estLog.periodo==="data"?"":"hidden"} aria-label="Dia">
      <select id="fPil" aria-label="Pilar"><option value="">Todos os pilares</option>${PILARES.map(p=>`<option value="${p.id}"${String(p.id)===estLog.pilar?" selected":""}>${p.ico} ${esc(p.nome)}</option>`).join("")}</select>
      <select id="fTipo" aria-label="Tipo"><option value="">Todos os tipos</option>${TIPOS_LOG.map(t=>`<option value="${t.id}"${t.id===estLog.tipo?" selected":""}>${t.ico} ${esc(t.nome)}</option>`).join("")}</select>
      <select id="fPrio" aria-label="Prioridade"><option value="">P1–P4</option>${PRIORIDADES.map(p=>`<option value="${p.id}"${p.id===estLog.prio?" selected":""}>${p.id} · ${esc(p.nome)}</option>`).join("")}</select>
      <input id="fBusca" placeholder="Buscar..." value="${esc(estLog.busca)}" aria-label="Buscar"></div>
    <div id="lgLista"></div></section>`;
  const re=()=>desenhar();
  $("#fPer",c).onchange=e=>{ estLog.periodo=e.target.value; $("#fData").hidden=estLog.periodo!=="data"; if(estLog.periodo==="data"&&!estLog.data) estLog.data=hojeISO(); re(); };
  $("#fData",c).onchange=e=>{ estLog.data=e.target.value; re(); };
  [["fPil","pilar"],["fTipo","tipo"],["fPrio","prio"]].forEach(([id,k])=>$("#"+id,c).onchange=e=>{ estLog[k]=e.target.value; re(); });
  $("#fBusca",c).oninput=e=>{ estLog.busca=e.target.value; re(); };
  $("#lgXls",c).onclick=()=>exportarExcel(); $("#lgRel",c).onclick=()=>relatorioImpacto();
  function desenhar(){ const box=$("#lgLista"), L=filtrarLogs(); box.innerHTML="";
    if(!L.length){ box.innerHTML='<p class="vazio">Nenhum registro com esses filtros.</p>'; return; }
    let dia=""; L.forEach(l=>{ if(l.dados.data!==dia){ dia=l.dados.data; const n=L.filter(x=>x.dados.data===dia).length;
      box.insertAdjacentHTML("beforeend",`<div class="dia-sep"><span>${esc(diaSemana(dia))}</span><small>${n} registro(s)</small></div>`); }
      box.appendChild(cardLog(l)); }); }
  desenhar();
}
</script>
<script>
// ═══════════════════════════════════════════════════════════════════
// COBRANÇAS — pendências de terceiros (follow-up)
// ═══════════════════════════════════════════════════════════════════
const estCob={periodo:"hoje",filtro:"",busca:"",pilar:"",prio:"",quem:""};   // começa sempre em HOJE
// data que manda na tarefa: a mais próxima entre prazo, lembrete e prazos das próximas ações abertas
function dataRefCob(c){ const d=c.dados, ds=[d.prazo,String(d.lembrete||"").slice(0,10),...acoesAbertas(c).map(a=>a.prazo)].filter(Boolean).sort(); return ds[0]||""; }
function lembretePadrao(prazo){ const base=prazo&&prazo>hojeISO()?prazo:proxDiaUtil(hojeISO()); return `${base}T${horaCobranca()}`; }
function dlgCobranca(item, pre){
  const d=item?item.dados:{prioridade:"P3",pilar:1,...(pre||{})};
  const f=abrirDlg(item?"Editar tarefa":"Nova tarefa",`
    <label class="f">O que está pendente? *<textarea name="oque" rows="2" placeholder="Ex.: Retorno da TI sobre o ajuste do relatório de cargas">${esc(d.oque||"")}</textarea></label>
    <div class="grade" style="margin-top:10px"><label class="f">Quem deve entregar *<input name="quem" value="${esc(d.quem||"")}" data-pick="um" placeholder="Pessoa, área ou fornecedor"></label>
      <label class="f">Contato (opcional)<input name="contato" value="${esc(d.contato||"")}" placeholder="e-mail, telefone, Teams"></label>

// ATAs — captação rápida → deliberações × ações → modelo King Star
// ═══════════════════════════════════════════════════════════════════
const estAta={aberta:"",periodo:"30",status:"",busca:"",participante:""};
const RX_PRAZO=/(?:at[eé]|prazo:?|p\/)\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i, RX_DATA_FIM=/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\.?$/;
const RX_DELIB=/\b(decidid[oa]s?|aprovad[oa]s?|ficou (definido|decidido|acordado|combinado)|definimos|deliberad[oa]|decis[aã]o)\b/i;
function prazoDe(txt, dataBase){
  const m=txt.match(RX_PRAZO)||txt.match(RX_DATA_FIM); if(!m) return {prazo:"",resto:txt};
  let ano=m[3]?Number(m[3].length===2?"20"+m[3]:m[3]):Number((dataBase||hojeISO()).slice(0,4));
  let p=`${ano}-${pad(m[2])}-${pad(m[1])}`; if(!m[3]&&dataBase&&p<dataBase) p=`${ano+1}-${pad(m[2])}-${pad(m[1])}`;
  return {prazo:p,resto:txt.replace(m[0],"").replace(/\s{2,}/g," ").replace(/[\s,;–-]+$/,"").trim()};
}
function resolverNome(n){ n=tx(n); if(!n) return ""; const todos=pessoasConhecidas().flatMap(g=>g[1].map(p=>p.nome)); const k=nrm(n);
  const exato=todos.find(x=>nrm(x)===k); if(exato) return exato; const c=[...new Set(todos.filter(x=>nrm(x).startsWith(k)))]; return c.length===1?c[0]:n; }
// identificação automática: cada linha vira tópico, ponto, deliberação, ação ou pendência
function separarCaptura(texto, dataBase){
  const out={assuntos:[],deliberacoes:[],acoes:[],pendencias:[]};
  String(texto||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    let m;
    if((m=l.match(/^(?:#+|\d{1,2}[.)])\s*(.+)$/))){ out.assuntos.push("# "+m[1]); return; }
    if((m=l.match(/^(?:d|decis[aã]o|delibera[cç][aã]o|decidido)\s*:\s*(.+)$/i))){ out.deliberacoes.push(m[1]); return; }
    if((m=l.match(/^(?:p|pend[eê]ncia)\s*:\s*(.+)$/i))||(m=l.match(/^\?\s*(.+)$/))){ out.pendencias.push(m[1]); return; }
    let a=null;
    if((m=l.match(/^(?:a|a[cç][aã]o)\s*:\s*(.+)$/i))){ const r=m[1], i=r.indexOf(":"); a=i>0&&i<=40?{resp:r.slice(0,i),acao:r.slice(i+1)}:{resp:"",acao:r}; }
    else if((m=l.match(/^@([\wÀ-ÿ.]+(?:\s+[A-ZÀ-Ý][\wÀ-ÿ.]+)?)\s*[:\-–]?\s*(.+)$/))) a={resp:m[1],acao:m[2]};
    else if((m=l.match(/^(.{2,40}?)\s+(?:vai|deve|ficou de|fica respons[aá]vel por)\s+(.+)$/i))&&RX_PRAZO.test(l)) a={resp:m[1],acao:m[2]};
    if(a){ const p=prazoDe(tx(a.acao),dataBase); out.acoes.push({id:uid(),resp:resolverNome(a.resp.replace(/^@/,"")),acao:p.resto.replace(/^[:\-–\s]+/,""),prazo:p.prazo,cobranca_id:""}); return; }
    if(RX_DELIB.test(l)&&!/^[-•*>]/.test(l)){ out.deliberacoes.push(l); return; }
    if((m=l.match(/^(?:>|➢|->)\s*(.+)$/))){ out.assuntos.push("> "+m[1]); return; }
    out.assuntos.push("- "+l.replace(/^[-•*·]\s*/,""));
  });
  return out;
}
// monta o texto no formato que o Gerador de ATA King Star reconhece
function textoATA(a){
  const d=a.dados, L=[];
  L.push(`ATA REUNIÃO – ${tx(d.titulo).toUpperCase()||"REUNIÃO"} – ${dataBR(d.data)}`);
  const parts=tx(d.participantes).split(/\s*[,\n]\s*/).filter(Boolean);
  if(parts.length){ L.push("Participantes:"); parts.forEach(p=>L.push(p)); L.push(""); }
  L.push(`Local: ${tx(d.local)||"—"}     Duração: ${tx(d.duracao)||"—"}.`); L.push("");
  if(tx(d.objetivo)){ L.push("Tema:"); L.push(tx(d.objetivo)); L.push(""); }
  const linhas=String(d.assuntos||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean), delib=(d.deliberacoes||[]).map(tx).filter(Boolean);
  if(linhas.length||delib.length){ L.push("Assuntos levantados:"); let n=0, temTopico=false;
    linhas.forEach(x=>{ let m; if((m=x.match(/^#\s*(.+)$/))){ n++; temTopico=true; L.push(`${n}. ${m[1]}`); }
      else if((m=x.match(/^>\s*(.+)$/))) L.push(`➢ ${m[1]}`);
      else { if(!temTopico){ n++; temTopico=true; L.push(`${n}. Pontos discutidos`); } L.push(`• ${x.replace(/^[-•]\s*/,"")}`); } });
    if(delib.length){ n++; L.push(`${n}. Deliberações`); delib.forEach(x=>L.push(`• **Decidido:** ${x}`)); }
    L.push(""); }
  const ac=(d.acoes||[]).filter(x=>tx(x.acao));
  if(ac.length){ L.push("Responsabilidades e Ações Futuras"); ac.forEach(x=>L.push(`▪ ${tx(x.resp)||"A definir"}: ${tx(x.acao)}${x.prazo?` – prazo ${dataBR(x.prazo)}`:""};`)); L.push(""); }
  const pd=(d.pendencias||[]).map(tx).filter(Boolean);
  if(pd.length){ L.push("Pendências"); pd.forEach((x,i)=>L.push(`${i+1}. ${x}${i<pd.length-1?";":"."}`)); }
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

      doTipo("log").sort((a,b)=>(a.dados.data+a.dados.hora).localeCompare(b.dados.data+b.dados.hora)));
    aba("Tarefas",[["O quê",x=>x.dados.oque],["Quem",x=>x.dados.quem],["Contato",x=>x.dados.contato],["Prazo",x=>x.dados.prazo],["Status",x=>ROT_COB[statusCob(x)][1]],["Prioridade",x=>x.dados.prioridade],["Pilar",x=>(pilar(x.dados.pilar)||{}).nome||""],["Vezes cobrado",x=>(x.dados.historico||[]).length],["Última cobrança",x=>{ const h=x.dados.historico||[]; return h.length?dataHoraBR(h[h.length-1].em):""; }],["Entregue em",x=>x.dados.entregue_em?dataBR(String(x.dados.entregue_em).slice(0,10)):""],["Próximas ações",x=>(x.dados.acoes||[]).filter(a=>tx(a.texto)).map(a=>`${a.feito?"[x]":"[ ]"} ${a.texto}${a.prazo?" ("+dataBR(a.prazo)+")":""}`).join("; ")],["Andamento",x=>(x.dados.andamento||[]).map(a=>`${dataHoraBR(a.em)} — ${a.texto}`).join("; ")],["Observação",x=>x.dados.obs]],doTipo("cobranca"));
    aba("Pessoas",[["Pessoa",f=>f.dados.pessoa],["Data",f=>f.dados.data],["Tipo",f=>f.dados.tipo],["Contexto",f=>f.dados.contexto],["Pontos fortes",f=>f.dados.fortes],["Pontos de melhoria",f=>f.dados.melhorias],["Acordos",f=>f.dados.acordos],["Reavaliar em",f=>f.dados.reavaliar_em],["Reavaliado",f=>f.dados.reavaliado?"Sim":"Não"],["Nota da reavaliação",f=>f.dados.reavaliacao_nota]],doTipo("feedback"));
    aba("ATAs",[["Data",a=>a.dados.data],["Tema",a=>a.dados.titulo],["Participantes",a=>a.dados.participantes],["Deliberações",a=>(a.dados.deliberacoes||[]).filter(tx).join("; ")],["Ações",a=>(a.dados.acoes||[]).filter(x=>tx(x.acao)).map(x=>`${x.resp}: ${x.acao}${x.prazo?" ("+dataBR(x.prazo)+")":""}`).join("; ")],["Pendências",a=>(a.dados.pendencias||[]).filter(tx).join("; ")],["Status",a=>a.dados.status]],doTipo("ata"));
    baixarBlob(new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`diario_de_bordo_${hojeISO()}.xlsx`);
  }catch(e){ alert("Não foi possível gerar o Excel: "+e.message); }
}

$("#dlg").addEventListener("cancel",e=>{ if(PICK){ e.preventDefault(); fecharPick(); } });
$("#btRapido").onclick=()=>dlgLog();
$("#btCobranca").onclick=()=>dlgCobranca();
async function iniciar(){
  try{ const a=window.PQI_ACESSO?await PQI_ACESSO.pronto:null; if(a&&a.carregado) NIVEL=a.nivel; }catch(_){}
  try{ const r=await fetch("/api/auth/me",{cache:"no-store"}); if(r.ok){ const j=await r.json(); USUARIO=(j.usuario&&(j.usuario.nome||j.usuario.email))||""; } }catch(_){}
  try{ const r=await fetch("/api/base/cadastros",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&Array.isArray(j.setores)) BASE=j; } }catch(_){}
  await carregarAtividadesSetor();
  try{ const {r,j}=await api(API); if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`); ITENS=Array.isArray(j)?j:[]; }
  catch(e){ if(e.message==="sessão expirada") return; setStatus("erro",e.message);
    $("#root").innerHTML=`<div class="conflito"><b>Não consegui carregar o seu diário.</b><br>${esc(e.message)}<div class="acoes"><button type="button" onclick="location.reload()">Tentar de novo</button></div></div>`; return; }
  if(NIVEL<2){ $("#btRapido").hidden=true; $("#btCobranca").hidden=true; }
  setStatus("ok"); atualizarDatalist(); botaoNotif(); render();
  verificarLembretes(); setInterval(verificarLembretes,30000);
  setInterval(()=>{ if(secao==="hoje"&&!document.querySelector("dialog[open]")&&!document.activeElement?.closest?.("#root input,#root textarea,#root select")) render(); },5*60000);
}
iniciar();
</script>
