<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Sistemas - Shell Unificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --void:#06070b; --panel:#0e1017; --panel-2:#151824;
  --line:rgba(232,179,61,0.16); --line-strong:rgba(232,179,61,0.4);
  --gold:#e8b33d; --gold-soft:#f3cd6f; --violet:#8b6cff;
  --ink:#f2f0ea; --ink-muted:#8b8f9c; --ink-faint:#565b6b;
  --verde:#3ddc97; --azul:#4fc3f7; --nav-bg:rgba(14, 16, 23, 0.90);
}
:root[data-theme="light"]{
  --void:#f4f5f8; --panel:#ffffff; --panel-2:#eaeef5;
  --line:rgba(200,160,50,0.25); --line-strong:rgba(200,160,50,0.6);
  --gold:#b38314; --gold-soft:#8c640c; --violet:#6846ff;
  --ink:#1a1c23; --ink-muted:#5e6375; --ink-faint:#8a90a2;
  --verde:#109658; --azul:#0288d1; --nav-bg:rgba(255, 255, 255, 0.90);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--void);color:var(--ink);height:100vh;overflow:hidden;transition:background .3s, color .3s;}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
::selection{background:var(--gold);color:var(--void);}

.field{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(232,179,61,0.12), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(139,108,255,0.1), transparent 60%),
    var(--void);
  transition:background .3s;
}

/* ── BARRA DE NAVEGAÇÃO FIXA (O "SHELL") ── */
.navbar {
  position: sticky; top: 0; z-index: 1000;
  background: var(--nav-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 72px;
  flex-shrink: 0;
}

.nav-left {
  display: flex; align-items: center; gap: 16px;
}

.nav-brand {
  display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none;
}
.mark{
  width:40px;height:40px;border-radius:50%;
  background:conic-gradient(from 220deg,var(--gold),var(--violet),var(--gold));
  display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
}
.mark::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--panel);}
.mark span{position:relative;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--gold-soft);}
.nav-title h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.nav-title p{font-size:11px;color:var(--ink-muted);}

/* Bloco do Sistema Ativo com o mesmo padrão visual */
.active-system-display {
  display: none; align-items: center; gap: 12px;
  border-left: 1px solid var(--line); padding-left: 16px;
}
.active-system-display.visible { display: flex; }

.nav-right {
  display: flex; align-items: center; gap: 14px;
}

/* Data, Hora e Saudação do Usuário */
.user-widget {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 12px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
  border: 1px solid var(--gold); background: var(--panel);
  display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--gold-soft);
}
.user-info {
  display: flex; flex-direction: column; text-align: right;
}
.user-greeting { font-size: 11.5px; font-weight: 600; color: var(--ink); }
.datetime-text { font-size: 10px; color: var(--ink-muted); font-family: 'Space Grotesk', sans-serif; }

.btn-home, .btn-theme, .btn-full {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  padding: 8px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: border-color .15s, background .15s, transform .1s;
  font-family: 'Inter', sans-serif; text-decoration: none;
}
.btn-home:hover, .btn-theme:hover, .btn-full:hover { border-color: var(--gold); }
.btn-home svg, .btn-theme svg, .btn-full svg { width: 15px; height: 15px; color: var(--gold-soft); }

/* ── CONTAINER PRINCIPAL (CONTEÚDO DINÂMICO OU HOME) ── */
.main-container {
  flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
}

/* Visão de Grid (Início) */
.home-view {
  flex: 1; overflow-y: auto; padding: 40px 24px 80px; max-width: 1180px; margin: 0 auto; width: 100%;
}
.home-view.hidden { display: none; }

.topo-home{text-align:center;margin-bottom:36px;}
.topo-home h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.01em;}
.topo-home p{color:var(--ink-muted);font-size:13.5px;margin-top:6px;}

.busca-wrap{max-width:400px;margin:24px auto 0;position:relative;}
.busca-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint);}
#busca{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:24px;
  color:var(--ink);font-size:13px;padding:11px 16px 11px 40px;outline:none;transition:border-color .15s;
  font-family:'Inter',sans-serif;
}
#busca:focus{border-color:var(--gold);}
#busca::placeholder{color:var(--ink-faint);}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:16px;
  margin-top:32px;
}
.card{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);border-radius:16px;padding:20px;
  cursor:pointer;text-align:left;position:relative;overflow:hidden;
  transition:border-color .15s, transform .15s;
  display:flex;flex-direction:column;gap:10px;
}
.card::after{content:"";position:absolute;top:-40%;right:-20%;width:120px;height:120px;
  background:radial-gradient(circle,rgba(232,179,61,0.12),transparent 70%);pointer-events:none;}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px);}
.card .topo-card{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.card .icone{font-size:24px;line-height:1;}
.card .tag{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 8px;border-radius:20px;white-space:nowrap;
}
.tag.servidor{background:rgba(139,108,255,0.14);color:var(--violet);}
.tag.arquivo{background:rgba(61,220,151,0.12);color:var(--verde);}
.tag.nuvem{background:rgba(79,195,247,0.14);color:var(--azul);}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;color:var(--ink);}
.card p{font-size:12px;color:var(--ink-muted);line-height:1.4;flex:1;}
.card .ir{
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--gold-soft);
  margin-top:2px;
}
.card .ir svg{width:12px;height:12px;transition:transform .15s;}
.card:hover .ir svg{transform:translateX(3px);}

.vazio{text-align:center;color:var(--ink-faint);font-size:13px;padding:50px 0;grid-column:1/-1;}

/* Visão do Tunel / Iframe */
.iframe-view {
  flex: 1; width: 100%; height: 100%; position: relative; display: none;
}
.iframe-view.active { display: flex; flex-direction: column; }

/* [NOVO] Container que segura VÁRIOS iframes ao mesmo tempo — cada
   sistema aberto ganha o seu, que fica vivo (não recarrega) mesmo
   quando você troca de aba ou volta pro Início. Só um fica visível
   por vez (display none/block via JS), os outros continuam rodando
   por trás, escondidos. */
#iframesContainer { position: relative; flex: 1; width: 100%; height: 100%; }
.app-iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: var(--void);
}

/* [NOVO] Barra de abas — aparece assim que existe pelo menos 1 sistema
   aberto, e continua visível mesmo se você voltar pro Início (é assim
   que as abas "persistem": elas não desaparecem só porque você não
   está olhando pra elas no momento). */
.tabs-bar {
  display: none; align-items: center; gap: 6px; padding: 8px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto;
}
.tabs-bar.show { display: flex; }
.tab-pill {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px 6px 12px; border-radius: 20px;
  background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; flex: none;
  font-size: 12.5px; color: var(--ink-muted); transition: all .15s; white-space: nowrap;
}
.tab-pill:hover { border-color: var(--line-strong); color: var(--ink); }
.tab-pill.ativa { background: var(--gold); border-color: var(--gold); color: #14121a; font-weight: 600; }
.tab-pill .fechar {
  display: flex; align-items: center; justify-content: center; width: 18px; height: 18px;
  border-radius: 50%; color: inherit; opacity: .6; font-size: 11px;
}
.tab-pill .fechar:hover { opacity: 1; background: rgba(0,0,0,0.15); }

/* Loader elegante enquanto o iframe carrega */
.iframe-loader {
  position: absolute; inset: 0; background: var(--void); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; z-index: 10; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.iframe-loader.loading { opacity: 1; pointer-events: auto; }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.iframe-loader span { font-size: 13px; color: var(--ink-muted); font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body>
<div class="field"></div>

<!-- BARRA FIXA (SHELL) -->
<header class="navbar">
  <div class="nav-left">
    <div class="nav-brand" onclick="voltarHome()" title="Ir para a página inicial">
      <div class="mark"><span>PS</span></div>
      <div class="nav-title">
        <h2>Painel de Sistemas</h2>
        <p>Casca Unificada</p>
      </div>
    </div>

    <!-- Indicador do sistema ativo no mesmo padrão visual -->
    <div id="activeSystemDisplay" class="active-system-display">
      <div class="mark" id="activeMark" style="width: 34px; height: 34px;">
        <span id="badgeIcon" style="font-size: 11px;">🔗</span>
      </div>
      <div class="nav-title">
        <h2 id="badgeName">Nome do Sistema</h2>
        <p>Sistema Ativo</p>
      </div>
    </div>
  </div>

  <div class="nav-right">
    <!-- Bloco de Saudação, Avatar e Data/Hora (Preparado para Futuros Logs) -->
    <div class="user-widget">
      <!-- Dica: Insira o link da foto do usuário no src da tag <img> abaixo, ou deixe a letra de fallback -->
      <img src="" id="userAvatarImg" class="user-avatar" style="display:none;" alt="Avatar">
      <div id="userAvatarFallback" class="user-avatar">W</div>
      <div class="user-info">
        <span class="user-greeting" id="lblGreeting">Boa tarde, Wendley</span>
        <span class="datetime-text" id="lblDatetime">29/09/2026 13:39</span>
      </div>
    </div>

    <button class="btn-home" id="btnHome" onclick="voltarHome()" style="display:none;" title="Voltar ao Menu Principal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Início</span>
    </button>
    <button class="btn-home" id="btnNovaAba" onclick="abrirEmNovaAba()" style="display:none;" title="Abrir este sistema numa aba separada — use se ele não carregar direito aqui dentro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span>Nova aba</span>
    </button>
    <button class="btn-full" onclick="toggleFullScreen()" title="Tela Cheia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      <span>Expandir</span>
    </button>
    <button class="btn-theme" onclick="toggleTheme()" title="Alternar tema Claro/Escuro">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span id="themeText">Dark</span>
    </button>
  </div>
</header>

<!-- [NOVO] Barra de abas — sistemas abertos ficam aqui, mesmo quando
     você está olhando o Início. Só suma clicando no ✕ de cada uma. -->
<div class="tabs-bar" id="tabsBar"></div>

<!-- CORPO CENTRALIZADO -->
<div class="main-container">

  <!-- TELA INICIAL (GRID DE CARDS) -->
  <div class="home-view" id="homeView">
    <div class="topo-home">
      <h1>Selecione um Sistema</h1>
      <p>O menu permanece fixo ao redor. O sistema escolhido rodará integrado na janela central.</p>
      <div class="busca-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="busca" placeholder="Buscar sistema...">
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- TELA DO IFRAME (TUNEL DE EXECUÇÃO) -->
  <div class="iframe-view" id="iframeView">
    <div class="iframe-loader" id="iframeLoader">
      <div class="spinner"></div>
      <span id="loaderText">Carregando sistema...</span>
    </div>
    <div id="iframesContainer"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// REGISTRO DE SISTEMAS — Adicione ou edite seus sistemas aqui.
// ═══════════════════════════════════════════════════════════════════
const SISTEMAS = [
  {
    nome: "Diário de Bordo",
    descricao: "Cadastro, acompanhamento e indicadores de atividades — com ações dentro de cada atividade.",
    url: "http://127.0.0.1:8000",
    icone: "📔",
    tipo: "servidor",
  },
  {
    nome: "RG do Pedido — Acompanhamento",
    descricao: "Rastreabilidade do item do pedido origem ao reenvio: cronograma, cenários de teste e GAPs.",
    url: "rg-pedido-acompanhamento.html",
    icone: "🧾",
    tipo: "arquivo",
  },
  {
    nome: "Parque Aliança — Gestão",
    descricao: "Relatórios, anúncios, passagens e manutenção da congregação.",
    url: "https://painelparquealianca.streamlit.app/?embedded=true",
    icone: "🕊️",
    tipo: "nuvem",
  },
  {
    nome: "Wendley Site",
    descricao: "Tickets, ChecKing e Home — hub principal de módulos.",
    url: "https://wendleysite.streamlit.app/?embedded=true",
    icone: "🗂️",
    tipo: "nuvem",
  },
  {
    nome: "Wendley Cunha",
    descricao: "App pessoal no Streamlit Cloud.",
    url: "https://wendleycunha.streamlit.app/?embedded=true",
    icone: "👤",
    tipo: "nuvem",
  },
  {
    // [ATENÇÃO] Infraestrutura de terceiro (não é código seu) e é uma
    // TELA DE LOGIN — chance real de recusar carregar dentro do túnel
    // por proteção contra clickjacking do lado deles, sem nada que dê
    // pra ajustar daqui. Se acontecer, o botão "↗ Nova aba" (agora
    // sempre visível quando um sistema está aberto) resolve na hora.
    nome: "Concierge — King Star",
    descricao: "Portal de operação King Star Colchões.",
    url: "https://portal.kingstarcolchoes.com.br/operacao/caixa",
    icone: "🛎️",
    tipo: "nuvem",
  },
];

const TAG_LABEL = { servidor: "servidor", arquivo: "arquivo local", nuvem: "hospedado" };

function iconeSetaCard(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}

function renderGrid(lista){
  const grid = document.getElementById('grid');
  if (!lista.length){
    grid.innerHTML = '<div class="vazio">Nenhum sistema encontrado com esse termo.</div>';
    return;
  }
  grid.innerHTML = lista.map((s, i) => `
    <button class="card" data-ir="${i}">
      <div class="topo-card">
        <span class="icone">${s.icone || "🔗"}</span>
        <span class="tag ${s.tipo}">${TAG_LABEL[s.tipo] || s.tipo}</span>
      </div>
      <h3>${s.nome}</h3>
      <p>${s.descricao || ''}</p>
      <div class="ir">Abrir no Shell ${iconeSetaCard()}</div>
    </button>
  `).join('');

  grid.querySelectorAll('[data-ir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sistema = lista[+btn.dataset.ir];
      abrirSistema(sistema);
    });
  });
}

// Atualizador de Data, Hora e Saudação Automática
function atualizarContextoUsuario() {
  const agora = new Date();
  
  // Data e Hora Formatada (DD/MM/AAAA HH:MM)
  const dia = String(agora.getDate()).padStart(2, '0');
  const mes = String(agora.getMonth() + 1).padStart(2, '0');
  const ano = agora.getFullYear();
  const hora = String(agora.getHours()).padStart(2, '0');
  const min = String(agora.getMinutes()).padStart(2, '0');
  
  document.getElementById('lblDatetime').textContent = `${dia}/${mes}/${ano} ${hora}:${min}`;

  // Saudação por horário
  const h = agora.getHours();
  let saudacao = "Bom dia";
  if (h >= 12 && h < 18) {
    saudacao = "Boa tarde";
  } else if (h >= 18 || h < 5) {
    saudacao = "Boa noite";
  }

  // Nome do usuário logado (pode ser integrado ao sistema de logs futuramente)
  const nomeUsuario = "Wendley"; 
  document.getElementById('lblGreeting').textContent = `${saudacao}, ${nomeUsuario}`;
}

// Atualiza a cada minuto
setInterval(atualizarContextoUsuario, 10000);
atualizarContextoUsuario();

// ═══════════════════════════════════════════════════════════════════
// ABAS — cada sistema aberto ganha seu PRÓPRIO iframe, que fica vivo
// (não recarrega) mesmo quando você troca de aba ou volta pro Início.
// Só fecha (some de vez, recarrega se abrir de novo) quando você
// clica no ✕ daquela aba específica.
// ═══════════════════════════════════════════════════════════════════
const abasAbertas = new Map(); // chave (nome do sistema) -> { sistema, iframeEl }
let chaveAtiva = null;         // qual aba está sendo exibida agora (null = na Home)
let urlSistemaAtual = null;    // alimenta o botão "Nova aba"

function chaveDoSistema(sistema){ return sistema.nome; }

function abrirSistema(sistema) {
  const chave = chaveDoSistema(sistema);
  if (!abasAbertas.has(chave)) {
    criarAba(sistema, chave);
  }
  ativarAba(chave);
}

function criarAba(sistema, chave) {
  const iframe = document.createElement('iframe');
  iframe.className = 'app-iframe';
  iframe.title = sistema.nome;
  iframe.style.display = 'none';
  iframe.onload = () => {
    iframe.dataset.carregado = '1';
    if (chaveAtiva === chave) document.getElementById('iframeLoader').classList.remove('loading');
  };
  iframe.src = sistema.url;
  document.getElementById('iframesContainer').appendChild(iframe);
  abasAbertas.set(chave, { sistema, iframeEl: iframe });
}

function ativarAba(chave) {
  const entrada = abasAbertas.get(chave);
  if (!entrada) return;
  chaveAtiva = chave;
  urlSistemaAtual = entrada.sistema.url;

  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('iframeView').classList.add('active');

  abasAbertas.forEach((v, k) => { v.iframeEl.style.display = (k === chave) ? 'block' : 'none'; });

  const jaCarregou = entrada.iframeEl.dataset.carregado === '1';
  document.getElementById('iframeLoader').classList.toggle('loading', !jaCarregou);
  document.getElementById('loaderText').textContent = `Carregando ${entrada.sistema.nome}...`;

  document.getElementById('badgeIcon').textContent = entrada.sistema.icone || '🔗';
  document.getElementById('badgeName').textContent = entrada.sistema.nome;
  document.getElementById('activeSystemDisplay').classList.add('visible');
  document.getElementById('btnHome').style.display = 'flex';
  document.getElementById('btnNovaAba').style.display = 'flex';

  renderizarAbas();
}

// [NOVO] Fecha UMA aba especificamente — as outras nem percebem.
function fecharAba(chave, evt) {
  if (evt) evt.stopPropagation();
  const entrada = abasAbertas.get(chave);
  if (!entrada) return;

  entrada.iframeEl.remove(); // tira do DOM de vez — reabrir recarrega do zero
  abasAbertas.delete(chave);

  if (chaveAtiva === chave) {
    const proxima = abasAbertas.keys().next().value; // outra aba aberta, se houver
    if (proxima) ativarAba(proxima);
    else voltarHome();
  } else {
    renderizarAbas(); // só a barra muda, o que está na tela continua igual
  }
}

// Retorna pra grade inicial — as abas NÃO fecham, só saem de vista.
function voltarHome() {
  chaveAtiva = null;
  urlSistemaAtual = null;

  document.getElementById('activeSystemDisplay').classList.remove('visible');
  document.getElementById('btnHome').style.display = 'none';
  document.getElementById('btnNovaAba').style.display = 'none';

  document.getElementById('iframeView').classList.remove('active');
  document.getElementById('homeView').classList.remove('hidden');

  renderizarAbas();
}

function abrirEmNovaAba() {
  if (urlSistemaAtual) window.open(urlSistemaAtual, '_blank', 'noopener');
}

function renderizarAbas() {
  const barra = document.getElementById('tabsBar');
  barra.classList.toggle('show', abasAbertas.size > 0);
  barra.innerHTML = '';
  abasAbertas.forEach((entrada, chave) => {
    const pill = document.createElement('div');
    pill.className = 'tab-pill' + (chave === chaveAtiva ? ' ativa' : '');
    pill.innerHTML = `<span>${entrada.sistema.icone || '🔗'}</span><span>${entrada.sistema.nome}</span><span class="fechar" title="Fechar">✕</span>`;
    pill.addEventListener('click', () => ativarAba(chave));
    pill.querySelector('.fechar').addEventListener('click', (e) => fecharAba(chave, e));
    barra.appendChild(pill);
  });
}

// Alternar Tema Claro / Escuro
function toggleTheme() {
  const html = document.documentElement;
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  
  const themeText = document.getElementById('themeText');
  themeText.textContent = newTheme === 'dark' ? 'Dark' : 'Light';
}

// Tela Cheia
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.error("Erro ao tentar entrar em tela cheia:", err);
    });
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

// Filtro de busca de sistemas
document.getElementById('busca').addEventListener('input', (e) => {
  const termo = e.target.value.trim().toLowerCase();
  if (!termo){ renderGrid(SISTEMAS); return; }
  const filtrados = SISTEMAS.filter(s =>
    s.nome.toLowerCase().includes(termo) || (s.descricao || '').toLowerCase().includes(termo)
  );
  renderGrid(filtrados);
});

// Inicialização
renderGrid(SISTEMAS);
</script>
