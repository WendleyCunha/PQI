<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualidade — Cargas e Retorno · King Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/pqi-acesso.js" data-modulo="qualidade"></script>
<style>
/* ═══ Mesmo padrão visual do PQI (Diário, Mapa, Diagnóstico, Organogramas) ═══ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9; --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8; --block:#6B46A8; --block-soft:#EEE7F8; --idle:#8A93A3; --idle-soft:#EEF0F3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,h4,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
h3{font-size:16px;margin:22px 0 8px;font-weight:600}
a{color:var(--steel)}
.cap{color:var(--ink-3);font-size:13px;margin:2px 0 12px;max-width:90ch}
.muted{color:var(--ink-3)}
[hidden]{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{color:var(--ink-3);font-size:13px;margin-right:auto;display:flex;align-items:center;gap:8px}
.who.erro{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.salvando{background:var(--amber)} .dot.erro{background:var(--bad)}
button,.btn{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--ink-3)}
button.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
button.warn{color:var(--bad)} button.peq{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.msg{font-size:13px} .msg.ok{color:var(--ok)} .msg.erro{color:var(--bad)}
.aviso{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--steel-soft);font-size:14px}
.alerta{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--amber-soft);font-size:14px;border-left:4px solid var(--amber)}
.conflito{margin:0 0 16px;padding:12px 14px;border-radius:6px;background:var(--bad-soft);border:1px solid var(--bad);font-size:14px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--amber-soft);color:var(--amber)}
.p-azul{background:var(--prog-soft);color:var(--prog)} .p-cinza{background:var(--idle-soft);color:var(--ink-2)} .p-roxo{background:var(--block-soft);color:var(--block)} .p-aco{background:var(--steel-soft);color:var(--steel)}
.wrap{padding:24px 28px 64px}
footer.doc-foot{margin-top:40px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule);padding-top:10px}
.shell-item{display:flex;align-items:flex-start;gap:22px}
.side-rg{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 8px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow-y:auto}
.side-btn{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--ink-3);font:500 10.5px/1.2 "IBM Plex Sans",sans-serif;text-align:center;cursor:pointer;position:relative}
.side-btn svg{width:20px;height:20px;flex:none}
.side-btn:hover{background:var(--rule-2);color:var(--ink-2)}
.side-btn.ativo{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.side-btn .n{position:absolute;top:3px;right:5px;font-size:10px;font-weight:600;background:var(--amber);color:#fff;border-radius:8px;padding:0 5px}
.side-sep{flex:none;width:70%;height:1px;background:var(--rule);margin:4px 0}
.conteudo-item{flex:1;min-width:0}
section > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
section h2{margin:0;font-size:22px;font-weight:700}
section > header p{margin:0;color:var(--ink-3);font-size:13px}
section > header .direita{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.doc-head{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--steel);border-radius:10px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:14px 28px;margin-bottom:18px}
.doc-head h1{margin:0;font-size:28px;line-height:1.1}
.doc-head .obj{margin:6px 0 0;color:var(--ink-2)}
.stamp{border:2px solid var(--steel);border-radius:8px;padding:10px 14px;min-width:240px;align-self:start}
.stamp .code{font:700 17px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.stamp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.stamp dt{color:var(--ink-3)} .stamp dd{margin:0;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;text-align:left;font:inherit;color:inherit;display:block;width:100%;border-top:4px solid var(--kc,var(--rule))}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--steel)}
.kpi > span{color:var(--ink-3);font-size:13px}
.kpi b{display:block;font:700 28px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))} @media (max-width:1100px){ .kpis5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }
.kpi-destaque{background:var(--bad-soft);border-color:var(--bad);border-top-width:6px} .kpi-destaque b{color:var(--bad);font-size:36px}
.k-bad{--kc:var(--bad)} .k-warn{--kc:var(--amber)} .k-ok{--kc:var(--ok)} .k-azul{--kc:var(--prog)} .k-roxo{--kc:var(--block)} .k-cinza{--kc:var(--idle)}
/* filtros */
.filtros{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.filtros select,.filtros input{padding:6px 8px;font-size:13px}
.filtros .busca{grid-column:span 2}
.filtros-rodape{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px;color:var(--ink-3)}
.chip-f{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;background:var(--steel-soft);color:var(--steel);font-weight:600}
.chip-f button{border:0;background:none;padding:0 4px;color:inherit;font-size:12px}
/* tabela */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;z-index:1;text-align:left;font:600 12.5px/1.3 "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2);background:var(--rule-2);padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.ord{cursor:pointer} th.ord:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr.clic{cursor:pointer} tr.clic:hover td{background:color-mix(in srgb,var(--steel-soft) 45%,var(--sheet))}
tr.sel td{background:color-mix(in srgb,var(--amber-soft) 60%,var(--sheet))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--ink-3)}
td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px;accent-color:var(--steel)}
.mais{display:flex;justify-content:center;margin:10px 0}
.novo{font:700 10px "IBM Plex Sans Condensed",sans-serif;background:var(--prog);color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.trat{display:inline-flex;flex-direction:column;gap:2px;border-left:3px solid var(--sc,var(--steel));padding:1px 0 1px 8px}
.trat b{font-size:12.5px;color:var(--ink)} .trat small{font-size:11.5px;color:var(--ink-3)}
.sel-barra{position:sticky;top:58px;z-index:5;display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:14px}
/* filas por setor */
.setores{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0 0 14px}
.setor-card{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--sc);border-radius:10px;padding:10px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
.setor-card:hover{border-color:var(--sc)} .setor-card.ativo{background:color-mix(in srgb,var(--sc) 10%,var(--sheet));box-shadow:inset 0 0 0 1px var(--sc)}
.setor-card h4{margin:0;font-size:16px;color:var(--ink)} .setor-card b{display:block;font:700 26px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.setor-card small{display:block;color:var(--ink-3);font-size:12px}
/* detalhe do pedido */
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:24px 28px;max-width:min(1320px,96vw);width:96vw;max-height:94vh;overflow:auto}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h3{margin:0 0 4px;font-size:24px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-24px;background:var(--sheet);padding:12px 0 4px;border-top:1px solid var(--rule-2)}
.det-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.info div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13.5px}
.info div small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.trat-box{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.hist{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--rule);font-size:13px}
.hist li{position:relative;padding:4px 0 8px 14px}
.hist li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--sc,var(--steel))}
.hist li small{display:block;color:var(--ink-3)}
/* importar */
.drop{border:2px dashed var(--rule);border-radius:12px;padding:30px;text-align:center;background:var(--sheet);cursor:pointer;color:var(--ink-2)}
.drop.sobre{border-color:var(--steel);background:var(--steel-soft)}
.arq{display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
/* barras e gráfico */
.barras{display:flex;flex-direction:column;gap:6px}
.barra-l{display:grid;grid-template-columns:minmax(120px,240px) 1fr 96px;gap:10px;align-items:center;font-size:13.5px}
.barra-l .tr{height:12px;background:var(--rule-2);border-radius:6px;overflow:hidden}
.barra-l .tr i{display:block;height:100%;background:var(--bc,var(--steel));border-radius:6px}
.barra-l b{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.graf svg{width:100%;height:auto;display:block;max-height:260px}
.est-item .pp-tit{display:none}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legenda i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{background:var(--ink);color:var(--sheet);border-radius:10px;padding:12px 14px;font-size:14px;box-shadow:0 10px 26px rgba(10,15,25,.3)}
.ver-dia{display:flex;gap:10px;align-items:center;background:var(--block-soft);color:var(--ink);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:14px}
/* [v4.3] painel do pedido na própria linha (sem popup) */
tr.exp > td{background:color-mix(in srgb,var(--steel-soft) 35%,var(--paper));padding:14px 16px;border-bottom:2px solid var(--steel)}
.pp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.pp-tit{font-size:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pp-trat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
/* [v4.4] motivos: cada classificação é um bloco com destaque; marque um ou mais motivos */
.pp.pp-tri{grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr)}
.grupos-mot{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0 0}
.grupo-mot{border:1px solid color-mix(in srgb,var(--sc) 35%,var(--rule));border-radius:9px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.gm-cab{background:color-mix(in srgb,var(--sc) 14%,var(--sheet));border-bottom:1px solid color-mix(in srgb,var(--sc) 30%,var(--rule));padding:6px 10px;display:flex;flex-direction:column}
.gm-cab b{font:700 14px "IBM Plex Sans Condensed",sans-serif;color:var(--sc);text-transform:uppercase;letter-spacing:.03em}
.gm-cab span{font-size:11.5px;color:var(--ink-2);font-weight:600}
.chip-m{display:flex;align-items:flex-start;gap:8px;text-align:left;border:0;border-top:1px solid var(--rule-2);border-radius:0;background:none;padding:7px 10px;font-size:13px;line-height:1.3;width:100%;color:var(--ink)}
.chip-m:first-of-type{border-top:0}
.chip-m i{flex:none;width:15px;height:15px;border:2px solid var(--sc);border-radius:4px;margin-top:1px;background:var(--sheet)}
.chip-m small{display:block;font-size:11px;color:var(--sc);font-weight:600}
.chip-m:hover{background:color-mix(in srgb,var(--sc) 8%,var(--sheet))}
.chip-m.marcado{background:color-mix(in srgb,var(--sc) 16%,var(--sheet));font-weight:600}
.chip-m.marcado i{background:var(--sc);box-shadow:inset 0 0 0 2px var(--sheet)}
.pp-conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;position:sticky;bottom:0;background:var(--sheet);padding-top:8px;border-top:1px solid var(--rule-2)}
.pp-conf input{flex:1 1 240px;width:auto}
.trava{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--block-soft);border-left:4px solid var(--block);font-size:14px}
.est-item.travado .est-linha{opacity:.6}
.cod-cli{font:600 14px "IBM Plex Sans",sans-serif;color:var(--steel);background:var(--steel-soft);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
/* triagem: esteira */
.tri-prog{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--prog);border-radius:10px;padding:12px 16px;margin:0 0 12px;font-size:15px}
.tri-prog b{font:700 26px "IBM Plex Sans Condensed",sans-serif;color:var(--prog)}
.tri-prog .track{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:8px}.tri-prog .track i{display:block;height:100%;background:var(--ok)}
.etapas-tri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.etapa-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--ec);border-radius:10px;padding:10px 14px;font:inherit;color:inherit}
.etapa-b span{font:700 14px "IBM Plex Sans Condensed",sans-serif;color:var(--ec);text-transform:uppercase;letter-spacing:.03em}
.etapa-b b{font:700 28px/1.1 "IBM Plex Sans Condensed",sans-serif}
.etapa-b small{font-size:12px;color:var(--ink-3)}
.etapa-b:hover{border-color:var(--ec)} .etapa-b.ativo{background:color-mix(in srgb,var(--ec) 10%,var(--sheet));box-shadow:inset 0 0 0 2px var(--ec)}
.et-atrasado{--ec:var(--bad)} .et-alerta{--ec:var(--amber)} .et-projecao{--ec:var(--prog)} .et-semdata{--ec:var(--idle)} .et-todos{--ec:var(--steel)}
@media (max-width:860px){ .etapas-tri{grid-template-columns:1fr 1fr} }
.esteira{display:flex;flex-direction:column;gap:6px}
.est-item{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;transition:opacity .3s,transform .3s,max-height .3s}
.est-item.aberto{border-color:var(--steel);box-shadow:0 4px 16px rgba(20,30,50,.08)}
.est-item.saindo{opacity:0;transform:translateY(-14px)}
.est-linha{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto auto 110px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.est-linha:hover{background:var(--rule-2)}
.est-item.aberto .est-linha{background:var(--steel-soft)}
.est-ped b{display:block} .est-ped small,.est-cli small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-cli{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-v{text-align:right;font-variant-numeric:tabular-nums}
.est-item > .pp{padding:14px 16px;border-top:1px solid var(--rule)}

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<script>
'use strict';
// ==PARSER-INICIO==
// Leitor do "Mapa de Entregas" (PDF do Protheus). Recebe as linhas do PDF
// (texto + posição x das palavras, quando houver) e devolve as cargas.
const MAPA = (() => {
  const sem = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
  const limpa = s => String(s || "").replace(/\s+/g, " ").trim();
  const ehSep = t => /^\.{20,}$/.test(t.replace(/\s/g, ""));
  const ehInt = s => /^\d{1,4}$/.test(s);

  // separa uma linha de item em "entregar" e "segunda coluna" (retirar / montagem / verificação)
  function partirItem(texto, cols, xs) {
    xs = xs || {};
    if (cols && cols.length && xs.col2) {
      const esq = cols.filter(c => c.x < xs.col2 - 2), dir = cols.filter(c => c.x >= xs.col2 - 2);
      // a quantidade é o número que está embaixo do título "Qtde" daquela coluna (mesmo se a descrição
      // for longa e passar por cima); sem o título, vale o último número da linha
      const um = (arr, xq) => {
        if (!arr.length) return null;
        let iq = -1;
        if (xq) { let melhor = 1e9; arr.forEach((c, i) => { const d = Math.abs(c.x - xq); if (ehInt(c.s) && d < 30 && d < melhor) { melhor = d; iq = i; } }); }
        if (iq < 0 && ehInt(arr[arr.length - 1].s)) iq = arr.length - 1;
        if (iq < 0) return { desc: limpa(arr.map(c => c.s).join(" ")), qtd: 0 };
        return { desc: limpa(arr.filter((_, i) => i !== iq).map(c => c.s).join(" ")), qtd: +arr[iq].s };
      };
      return { esq: um(esq, xs.q1), dir: um(dir, xs.q2) };
    }
    const tk = limpa(texto).split(" ");
    if (tk.length < 2 || !ehInt(tk[tk.length - 1])) return { esq: null, dir: null };
    for (let i = 1; i < tk.length - 2; i++) {
      // quantidade = número solto que NÃO faz parte de uma medida ("096 X 188") e é seguido do nome de um produto
      if (ehInt(tk[i]) && !/^X$/i.test(tk[i - 1]) && !/^X$/i.test(tk[i + 1]) && /^[A-Z]{2,}/i.test(tk[i + 1]) && tk.slice(i + 1, -1).some(x => !ehInt(x))) {
        return { esq: { desc: tk.slice(0, i).join(" "), qtd: +tk[i] }, dir: { desc: tk.slice(i + 1, -1).join(" "), qtd: +tk[tk.length - 1] } };
      }
    }
    return { esq: { desc: tk.slice(0, -1).join(" "), qtd: +tk[tk.length - 1] }, dir: null };
  }

  const PSEUDO = /^MAPA PARA RETIRADA DO PRODUTO EM LOJA/;

  function ler(linhas) {
    const out = { data_mapa: "", hora: "", cargas: [], avisos: [] };
    const cargas = new Map();
    let carga = null, ped = null, modo = "", ultimoNf = "", xs = {};
    const novaCarga = (num, resto) => {
      if (!cargas.has(num)) {
        const c = { numero: num, placa: "", transportadora: "", cubagem: 0, pedidos: [] };
        const mp = resto.match(/Placa:\s*(\S+)/i), mm = resto.match(/Motorista:\s*(.*?)\s*(Cubagem:|$)/i), mc = resto.match(/Cubagem:\s*([\d.,]+)/i);
        if (mp) c.placa = mp[1].toUpperCase();
        if (mm) c.transportadora = limpa(mm[1]);
        if (mc) c.cubagem = parseFloat(mc[1].replace(/\./g, "").replace(",", ".")) || 0;
        cargas.set(num, c); out.cargas.push(c);
      }
      carga = cargas.get(num); ped = null; modo = "";
    };
    for (const ln of linhas) {
      const t = limpa(ln.t), T = sem(t);
      if (!t) continue;
      let m;
      if ((m = t.match(/^Mapa de Entregas\s+Data:\s*(\d{2}\/\d{2}\/\d{4})/i))) { out.data_mapa = out.data_mapa || m[1]; modo = ""; continue; }
      if (/^Pagina:/i.test(t) || /^Conferente:/i.test(t)) { modo = ""; continue; }
      if ((m = t.match(/^Hora:\s*(\S+)/i))) { out.hora = out.hora || m[1]; continue; }
      if ((m = t.match(/^Carga:\s*(\d+)\s*(.*)$/i))) { novaCarga(m[1], m[2]); continue; }
      if (ehSep(t)) { modo = ""; continue; }
      if (!carga) continue;
      if ((m = t.match(/^Seq\.?:\s*(\d+)/i))) {
        ped = { seq: m[1], tipo: "", pv: "", nf: "", serie: "", pv_retira: "", nf_troca: "", serie_troca: "", fones: "", transportadora: "",
          cliente: "", nome: "", endereco: "", compl: "", bairro: "", cidade: "", cep: "", origem: "", despesas: "",
          entregar: [], col2: [], pseudo: [], obs: [], protocolo: null };
        carga.pedidos.push(ped); modo = ""; ultimoNf = ""; continue;
      }
      if (!ped) continue;
      if (/^Descri[cç][aã]o do Produto/i.test(t) || /^DESCRICAO DO PRODUTO/.test(T)) {
        modo = "itens"; xs = {};
        if (ln.cols) {   // posição das colunas pelo título: Descrição · Qtde · Produto p/ Retirar · Qtde
          const c = ln.cols.find((w, i) => /^Produto$/i.test(w.s) && i > 2); if (c) xs.col2 = c.x;
          const qs = ln.cols.filter(w => /^Qtde$/i.test(w.s)); if (qs[0]) xs.q1 = qs[0].x; if (qs[1]) xs.q2 = qs[1].x;
        }
        continue;
      }
      if (/^OBSERVACAO/.test(T)) {
        modo = "obs"; ped.obs.push(t);
        if ((m = t.match(/Protocolo:\s*(\d+)\s*-\s*(.*?)\s*-\s*Motivo Troca:\s*(.*)$/i))) ped.protocolo = { numero: m[1], tipo: limpa(m[2]), motivo: limpa(m[3]) };
        continue;
      }
      if (modo === "obs") { ped.obs.push(t); continue; }
      if (modo === "itens") {
        const { esq, dir } = partirItem(t, ln.cols, xs);
        if (!esq && !dir) { out.avisos.push(`Carga ${carga.numero} seq ${ped.seq}: linha de item não entendida: “${t}”`); continue; }
        if (esq) (PSEUDO.test(sem(esq.desc)) ? ped.pseudo : ped.entregar).push(esq);
        if (dir) (PSEUDO.test(sem(dir.desc)) ? ped.pseudo : ped.col2).push(dir);
        continue;
      }
      const campo = (re, k) => { const x = t.match(re); if (x) { ped[k] = limpa(x[1]); return true; } return false; };
      if ((m = t.match(/^Tipo\s*(.*)$/i)) && !/^Tipo\s*do/i.test(t)) { ped.tipo = limpa(m[1]); continue; }
      if ((m = t.match(/^Pv Retira\s+(\S+)/i))) { ped.pv_retira = m[1]; continue; }
      if ((m = t.match(/^Nf\.?\s*Troc\.?\s+(\S+)/i))) { ped.nf_troca = m[1]; ultimoNf = "troca"; continue; }
      if ((m = t.match(/^Pv Entrega\s+(\S+)/i))) { ped.pv = m[1]; continue; }
      if ((m = t.match(/^N\.?\s*Fisc\.?\s+(\S+)/i))) { ped.nf = m[1]; ultimoNf = "nf"; continue; }
      if ((m = t.match(/^Serie\s+(\S+)/i))) { if (ultimoNf === "troca" && !ped.serie_troca) ped.serie_troca = m[1]; else ped.serie = m[1]; continue; }
      if (campo(/^Fones\s+(.*)$/i, "fones")) continue;
      if (campo(/^Transportadora\s+(.*)$/i, "transportadora")) continue;
      if (campo(/^Cliente\s+(\S+)/i, "cliente")) continue;
      if (campo(/^Nome\s+(.*)$/i, "nome")) continue;
      if (/^ENDERECO:/.test(T)) { ped.endereco = limpa(t.replace(/^[^:]*:/, "")); continue; }
      if (campo(/^Compl:\s*(.*)$/i, "compl")) continue;
      if (campo(/^Bairro\s+(.*)$/i, "bairro")) continue;
      if (campo(/^Mun\s+(.*)$/i, "cidade")) continue;
      if (campo(/^CEP\s+(\S+)/i, "cep")) continue;
      if (campo(/^Origem:\s*(.*)$/i, "origem")) continue;
      if (/^DESPESAS ACESSORIAS:/.test(T)) { ped.despesas = limpa(t.replace(/^[^:]*:/, "")); continue; }
    }
    // pedidos sem PV de entrega (ex.: retirada em loja numa NF série RET) usam o PV como está
    for (const c of out.cargas) for (const p of c.pedidos) {
      p.troca = /TROCA|RETIRA/.test(sem(p.tipo)) || !!p.pv_retira;
      if (!p.pv) out.avisos.push(`Carga ${c.numero} seq ${p.seq}: sem número de PV.`);
    }
    return out;
  }
  return { ler, partirItem, sem };
})();
// ==PARSER-FIM==

// ═══════════════════════════════════════════════════════════════════
// QUALIDADE  [v5.0] — o Mapa de Entregas sem papel
//  PCL (ajustes · retornos para apontar · importar PDF · cargas)
//  → Montagem do palete → Conferência na doca (outra pessoa) → Retorno
//  → GAP (peças retornadas e trocas do Mapa) · Painel · Cadastros
// A regra de verdade (permissões, status) fica no servidor (qualidade.py).
// ═══════════════════════════════════════════════════════════════════
const API = "/api/qualidade";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const int = n => Number(n || 0).toLocaleString("pt-BR");
const dataBR = iso => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "";
const horaBR = iso => iso ? `${dataBR(iso)} ${iso.slice(11, 16)}` : "";
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const isoDe = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const HOJE = isoDe(new Date());
const diasAtras = n => isoDe(new Date(Date.now() - n * 86400000));
const STATUS_COR = {
  importada: ["Aguardando montagem", "p-azul", "var(--prog)"], em_montagem: ["Em montagem", "p-warn", "var(--amber)"],
  montagem_div: ["Montagem com divergência", "p-bad", "var(--bad)"], montada: ["Montada — aguarda doca", "p-aco", "var(--steel)"],
  em_conferencia: ["Em conferência na doca", "p-warn", "var(--amber)"], doca_div: ["Doca com divergência", "p-bad", "var(--bad)"],
  aguardando_pdf: ["Aguardando novo PDF", "p-bad", "var(--bad)"], validada: ["Validada — aguarda retorno", "p-ok", "var(--ok)"],
  em_retorno: ["Em retorno", "p-warn", "var(--amber)"], retorno_concluido: ["Retorno concluído — apontar no ERP", "p-roxo", "var(--block)"],
  baixada: ["Baixada", "p-cinza", "var(--idle)"],
};
const pillStatus = s => `<span class="pill ${(STATUS_COR[s] || ["", "p-cinza"])[1]}">${esc((STATUS_COR[s] || [s])[0])}</span>`;
const corStatus = s => (STATUS_COR[s] || [0, 0, "var(--idle)"])[2];
const FLAGS = { sem_protocolo: "Troca sem protocolo", sem_tipo: "Troca sem tipo", contraditoria: "Tipo × motivo contraditórios", obs_padrao: "Observação padrão repetida", conferente: "Apontado pelo conferente" };
const ST_PEND = { aberta: ["Aberta — PCL decide", "p-bad"], aguardando_pdf: ["Aguardando novo PDF", "p-warn"], confirmado: ["Confirmado no novo PDF", "p-ok"],
  nao_executado: ["NÃO executado no novo PDF", "p-bad"], resolvido: ["Resolvido", "p-ok"], refazer: ["Etapa refeita", "p-aco"], cancelado: ["Cancelado", "p-cinza"], superada: ["Superada (novo PDF)", "p-cinza"] };
const ORIGEM = { montagem: "Montagem", doca: "Doca", manual: "Pedido de ajuste" };
const SIT_PED = { entregue: ["Entregue", "p-ok"], parcial: ["Entrega parcial", "p-warn"], nao_entregue: ["Não entregue", "p-bad"] };

function toast(t, erro) { const d = document.createElement("div"); d.className = "toast" + (erro ? " erro" : ""); d.textContent = t; $("#toasts").appendChild(d); setTimeout(() => d.remove(), erro ? 6500 : 3200); }
function status(t) { $("#dot").className = "dot " + t; }
async function api(url, op = {}) {
  status("salvando");
  let r;
  try { r = await fetch(API + url, { headers: { "Content-Type": "application/json" }, cache: "no-store", ...op }); }
  catch (e) { status("erro"); throw new Error("Sem conexão com o servidor. Tente de novo."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { $("#root").innerHTML = '<div class="conflito"><b>Sua sessão expirou.</b> Entre de novo pelo Painel. <a href="/" target="_top">Ir para o Painel</a></div>'; throw new Error("sessão expirada"); }
  if (!r.ok) { status("erro"); throw new Error(j.detail || `HTTP ${r.status}`); }
  status("ok"); return j;
}
const post = (u, b) => api(u, { method: "POST", body: JSON.stringify(b || {}) });
const put = (u, b) => api(u, { method: "PUT", body: JSON.stringify(b || {}) });
let _ac = null;
function bip(ok) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120, 80, 120]); } catch (_) {}
  try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); const o = _ac.createOscillator(), g = _ac.createGain();
    o.frequency.value = ok ? 1250 : 330; g.gain.value = .08; o.connect(g); g.connect(_ac.destination); o.start(); o.stop(_ac.currentTime + (ok ? .09 : .35)); } catch (_) {}
}
const sec = (titulo, sub, direita, corpo) => `<section><header><h2>${titulo}</h2>${sub ? `<p>${sub}</p>` : ""}${direita ? `<span class="direita">${direita}</span>` : ""}</header>${corpo}</section>`;
const kpi = (rot, val, sub, cls = "") => `<div class="kpi ${cls}"><span>${rot}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;

const seg2 = (lista, atual, attr) => `<div class="seg2">${lista.map(([id, t]) => `<button type="button" ${attr}="${id}" aria-pressed="${id === atual}">${t}</button>`).join("")}</div>`;

// período (Hoje · 7 · 30 dias · datas)
function filtroPeriodo(P, onMuda, extra = "") {
  const atalho = P.de === HOJE && P.ate === HOJE ? "hoje" : P.ate === HOJE && P.de === diasAtras(6) ? "7" : P.ate === HOJE && P.de === diasAtras(29) ? "30" : "";
  const html = `<div class="q-filtro"><span class="fbl">Período</span>${seg2([["hoje", "Hoje"], ["7", "7 dias"], ["30", "30 dias"]], atalho, "data-pp")}
    <label>de <input type="date" data-pde value="${P.de}"></label><label>até <input type="date" data-pate value="${P.ate}"></label>${extra}</div>`;
  const ligar = el => {
    el.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => { const v = b.dataset.pp; P.ate = HOJE; P.de = v === "hoje" ? HOJE : diasAtras(+v - 1); onMuda(); });
    const de = $("[data-pde]", el), ate = $("[data-pate]", el);
    if (de) de.onchange = () => { if (de.value) { P.de = de.value; if (P.de > P.ate) P.ate = P.de; onMuda(); } };
    if (ate) ate.onchange = () => { if (ate.value) { P.ate = ate.value; if (P.de > P.ate) P.de = P.ate; onMuda(); } };
  };
  return [html, ligar];
}

const MIN_ABA = { montagem: 2, conferencia: 2, retorno: 2, cadastros: 3 };
function nivelAba(id) { if (ABAS_N && id in ABAS_N) return Number(ABAS_N[id]) || 0; const n = NIVEL_SIS; return n < (MIN_ABA[id] || 1) ? 0 : (n >= 3 ? 4 : n); }
const pode = (aba, n) => nivelAba(aba) >= n;
let secao = (() => { try { return sessionStorage.getItem("qld_secao") || ""; } catch (_) { return ""; } })();
let ABERTA = null, VOLTA = null;   // carga aberta na aba atual · para onde volta o "detalhe"
let LISTA = [];                     // cargas do período + todas as abertas (contadores do menu)
const CONT = {};
function contar() {
  const n = s => LISTA.filter(c => s.includes(c.status)).length;
  CONT.montagem = n(["importada", "em_montagem"]); CONT.conferencia = n(["montada", "em_conferencia"]); CONT.retorno = n(["validada", "em_retorno"]);
  CONT.pcl = LISTA.reduce((a, c) => a + (c.resumo.pend_abertas || 0), 0) + n(["retorno_concluido"]);
  CONT.gap = LISTA.reduce((a, c) => a + (c.resumo.a_tabular || 0), 0);
}
async function carregarLista() { LISTA = await api(`/cargas?de=${diasAtras(30)}&ate=${HOJE}`); contar(); }
function menu() {
  const vis = SECOES.filter(x => x === "sep" || nivelAba(x[0]) >= 1);
  if (!vis.some(x => x !== "sep" && x[0] === secao)) secao = (vis.find(x => x !== "sep") || ["painel"])[0];
  $("#menu").innerHTML = vis.map(x => x === "sep" ? '<div class="side-sep"></div>' :
    `<button type="button" class="side-btn${x[0] === secao ? " ativo" : ""}" data-s="${x[0]}" title="${x[1]}">${ICO[x[0]]}<span>${x[1]}</span>${CONT[x[0]] ? `<span class="n"${x[0] === "pcl" ? ' style="background:var(--bad)"' : ""}>${CONT[x[0]]}</span>` : ""}</button>`).join("");
  $("#menu").querySelectorAll("[data-s]").forEach(b => b.onclick = () => ir(b.dataset.s));

function ir(s, carga, volta) { secao = s; ABERTA = carga || null; VOLTA = volta || null; ULT = null; try { sessionStorage.setItem("qld_secao", s); } catch (_) {} pararCamera(); render(); window.scrollTo(0, 0); }

  try {
    if (ABERTA && ABERTA.startsWith("det:")) return await rDetalhe(c, ABERTA.slice(4));
    if (secao === "pcl") await rPcl(c);
    else if (secao === "painel") await rPainel(c);
    else if (secao === "montagem") await (ABERTA ? rEtapa(c, ABERTA, "montagem") : rListaEtapa(c, "montagem"));
    else if (secao === "conferencia") await (ABERTA ? rEtapa(c, ABERTA, "doca") : rListaEtapa(c, "doca"));
    else if (secao === "retorno") await (ABERTA ? rRetorno(c, ABERTA) : rListaRetorno(c));

// ═══ câmera (código de barras / QR) ═══
let CAM = null, _ultCod = "", _ultEm = 0;
async function abrirCamera(aoLer, titulo) {
  if (!window.Html5Qrcode) { toast("O leitor da câmera ainda está carregando. Tente em alguns segundos.", true); return; }
  abrirDlg(`<h3>📷 ${esc(titulo || "Aponte para o código")}</h3><div id="leitorCam"></div>
    <p class="q-ult" id="camMsg" style="background:var(--rule-2);color:var(--ink-2)">Pode ler um código atrás do outro. Feche quando terminar.</p>
    <div class="acts"><button type="button" class="primary" id="camFechar">Fechar a câmera</button></div>`, el => {
    $("#camFechar", el).onclick = () => { pararCamera(); fecharDlg(); };
    $("#dlg").onclose = () => pararCamera();
  });
  try {
    CAM = new Html5Qrcode("leitorCam", { verbose: false });
    await CAM.start({ facingMode: "environment" }, { fps: 12, qrbox: (w, h) => ({ width: Math.min(w, 320) * .92, height: Math.min(h, 220) * .7 }) }, txt => {
      const t = Date.now();
      if (txt === _ultCod && t - _ultEm < 2500) return;   // a mesma etiqueta parada na frente não conta duas vezes
      _ultCod = txt; _ultEm = t;
      const m = $("#camMsg"); if (m) { m.className = "q-ult"; m.textContent = `Lido: ${txt}…`; }
      Promise.resolve(aoLer(txt)).then(() => { const m2 = $("#camMsg"); if (m2 && ULT) { m2.className = "q-ult " + ULT.cls; m2.innerHTML = `${ULT.ico} <span>${ULT.txt}</span>`; } });
    }, () => {});
  } catch (e) { const m = $("#camMsg"); if (m) { m.className = "q-ult bad"; m.textContent = "Não consegui abrir a câmera: " + (e.message || e) + ". Confira a permissão da câmera no navegador."; } }
}
function pararCamera() { const c = CAM; CAM = null; if (c) c.stop().then(() => c.clear()).catch(() => {}); }
function pararSeCamera(daCam) { if (daCam) { pararCamera(); fecharDlg(); } }

function cardCarga(c, alvo) {
  const r = c.resumo || {};
  let prog = "", p = 0, off = false;
  if (alvo === "montagem") { prog = `${int(r.montadas)} de ${int(r.unidades)} unidades montadas`; p = pct(r.montadas, r.unidades); off = !["importada", "em_montagem"].includes(c.status); }
  else if (alvo === "doca") { prog = `${int(r.conferidas)} de ${int(r.montadas)} conferidas na doca`; p = pct(r.conferidas, r.montadas); off = !["montada", "em_conferencia"].includes(c.status); }
  else prog = `${int(r.pedidos)} pedidos · ${int(r.retornadas)} retornada(s) · ${int(r.retiradas)} retirada(s)`;
  return `<button type="button" class="q-card${off ? " off" : ""}" data-c="${esc(c.numero)}" style="--sc:${corStatus(c.status)}">
    <h4><span>Carga ${esc(c.numero)}</span>${pillStatus(c.status)}</h4>
    <div class="l">🚚 ${esc(c.placa)} · ${esc(c.motorista || "motorista não cadastrado")}</div>
    <div class="l m">${esc(c.transportadora)} · Mapa ${dataBR(c.data_iso)}${c.versao > 1 ? ` · v${c.versao}` : ""}${c.transferencia ? ' · <span class="pill p-roxo">Transferência</span>' : ""}</div>
    <div class="l">${alvo === "retorno" ? "" : `${int(r.pedidos)} pedidos · `}${prog}</div>
    ${alvo === "retorno" ? "" : `<div class="q-prog"><i style="width:${p}%"></i></div>`}
    ${off && alvo !== "retorno" ? `<div class="l" style="color:var(--bad)">⏸ ${c.status === "aguardando_pdf" ? "aguardando o novo PDF (PCL)" : "aguardando o PCL resolver as divergências"}</div>` : ""}
    ${r.alertas && alvo === "montagem" ? `<div class="l" style="color:var(--amber)">⚠ ${int(r.alertas)} alerta(s) da Carteira${r.pv_fora ? ` · ${int(r.pv_fora)} PV fora` : ""}</div>` : ""}
  </button>`;
}

const EST = { montagem: { aba: "montagem", rot: "Montagem do palete", url: "montagem" }, doca: { aba: "conferencia", rot: "Conferência na doca", url: "doca" } };

  const e = EST[et], v = VIS[et] || "fila";

  const lst = LISTA.filter(x => fila.includes(x.status));

  const sub = et === "montagem" ? "Carga = palete. Cada leitura fica no seu login. Falta ou item a mais vira pendência no PCL." : "Segunda checagem, feita por OUTRA pessoa: o que foi montado bate com o que está na doca? Se bater, a carga fica validada.";
  let corpo = abasInternas([["fila", et === "montagem" ? "A montar" : "A conferir", nAtivas], ["hist", "Histórico", null]], v, "data-v");

      $("#cards", c).querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const x = lst.find(y => y.numero === b.dataset.c); if (b.classList.contains("off")) return abrirDetalhe(x.numero); ir(secao, x.numero); }); };
    desenha(); $("#busca", c).oninput = desenha;
  } else {
    const P = per(et);
    const [fh, ligar] = filtroPeriodo(P, () => rListaEtapa(c, et), `<input type="search" id="buscaH" placeholder="Carga, placa, motorista, pessoa">`);

          <td>${horaBR(s.inicio)}</td><td>${horaBR(s.fim_em)}<span class="sub">${esc(s.fim_por)}</span></td>
          <td>${s.ok ? '<span class="pill p-ok">OK</span>' : `<span class="pill p-bad">${s.divergencias} divergência(s)</span>`}</td><td>${pillStatus(x.status)}</td></tr>`; }).join("") || '<tr><td colspan="8" class="muted" style="text-align:center;padding:20px">Nada no período.</td></tr>'}</tbody></table></div>`;

async function recarregarCG() { CG = await api(`/cargas/${CG.numero}`); desenharEtapa($("#root")); }
let _lendo = false;
async function ler(corpo, daCam) {
  if (_lendo) return; _lendo = true;
  const url = `/cargas/${CG.numero}/${EST[ET].url}/leitura`;
  try {
    let r = await post(url, corpo);
    for (let volta = 0; volta < 4 && r; volta++) {
      if (r.resultado === "escolher_pedido") {
        pararSeCamera(daCam);
        const pv = await escolher("Para qual pedido vai esta peça?", "Este produto está em mais de um pedido desta carga.", r.opcoes.map(o => ({ v: o.pv, t: `${o.nome} — PV ${o.pv}`, s: `${o.bairro} · ${o.cidade} · faltam ${o.faltam}` })));
        if (!pv) { ULT = { cls: "warn", ico: "⏸", txt: "Leitura cancelada." }; r = null; break; }
        corpo = { ...corpo, codigo: corpo.codigo || r.codigo, pv }; r = await post(url, corpo);
      } else if (r.resultado === "exige_qr") {
        pararSeCamera(daCam);
        const qr = await pedirTexto("QR da unidade", "Este produto exige o QR da unidade. Leia ou digite o QR:", true);
        if (!qr) { ULT = { cls: "warn", ico: "⏸", txt: "Falta o QR da unidade." }; r = null; break; }
        corpo = { ...corpo, pv: r.pv, qr }; r = await post(url, corpo);
      } else if (r.resultado === "desconhecido") {
        pararSeCamera(daCam); bip(false);
        if (!r.opcoes.length) { ULT = { cls: "bad", ico: "✕", txt: `Código ${esc(r.codigo)} não cadastrado e nenhum item desta carga está sem EAN. Avise o PCL.` }; r = null; break; }
        const sku = await escolher("Código ainda não cadastrado", `O código <b>${esc(r.codigo)}</b> não está ligado a nenhum produto. De qual item desta carga ele é? (fica cadastrado no seu nome)`, r.opcoes.map(o => ({ v: o.sku, t: o.desc, s: "SKU " + o.sku })));
        if (!sku) { ULT = { cls: "warn", ico: "⏸", txt: "Código não vinculado." }; r = null; break; }
        await post(`/cargas/${CG.numero}/vincular-ean`, { codigo: r.codigo, sku }); await cad(true);
        corpo = { codigo: r.codigo }; r = await post(url, corpo);
      } else break;
    }
    if (!r) { /* cancelado */ }
    else if (r.resultado === "ok") { bip(true); ULT = { cls: "ok", ico: "✓", txt: `${esc(r.unidade.desc)} <small style="opacity:.75">(PV ${esc(r.unidade.pv)} · ${r.modo === "manual" ? "confirmado tocando" : "lido"})</small>` }; }

    else if (r.resultado === "exige_codigo") { bip(false); ULT = { cls: "warn", ico: "🔒", txt: esc(r.mensagem) }; }
    else if (r.resultado === "ja_lida") { ULT = { cls: "warn", ico: "•", txt: "Esta unidade já estava lida." }; }
    else { bip(false); ULT = { cls: "bad", ico: "✕", txt: esc(r.mensagem || r.resultado) }; }
    CG = await api(`/cargas/${CG.numero}`);
  } catch (x) { bip(false); ULT = { cls: "bad", ico: "✕", txt: esc(x.message) }; }
  finally { _lendo = false; if (CG && ["montagem", "conferencia"].includes(secao) && ABERTA === CG.numero) desenharEtapa($("#root")); }
}

async function retornar(corpo, daCam) {
  if (_lendo) return; _lendo = true;
  const url = `/cargas/${CG.numero}/retorno`;
  try {
    let r = await post(url, corpo);
    for (let volta = 0; volta < 3 && r; volta++) {
      if (r.resultado === "escolher_pedido") {
        pararSeCamera(daCam);
        const pv = await escolher("De qual pedido é esta peça?", "Este produto aparece em mais de um pedido.", r.opcoes.map(o => ({ v: o.pv, t: `${o.nome} — PV ${o.pv}`, s: o.bairro })));
        if (!pv) { r = null; break; }
        corpo = { ...corpo, pv }; r = await post(url, corpo);
      } else if (r.resultado === "precisa_dados") {
        pararSeCamera(daCam);
        const d = await formPeca(r);
        if (!d) { ULT = { cls: "warn", ico: "⏸", txt: "Registro cancelado." }; r = null; break; }
        corpo = { ...corpo, pv: r.item.pv, ...d }; r = await post(url, corpo);
      } else break;
    }
    if (!r) { /* cancelado */ }
    else if (r.resultado === "ok") { const av = r.item.estado === "avariada"; bip(true); ULT = { cls: av ? "warn" : "ok", ico: av ? "⚠" : "✓", txt: `${esc(r.item.desc)} — ${av ? "AVARIADA · " + esc(r.item.avaria) : "peça OK"} → ${esc(r.item.destino)}` }; }
    else { bip(false); ULT = { cls: "bad", ico: "✕", txt: esc(r.mensagem || r.resultado) }; }
    CG = await api(`/cargas/${CG.numero}`);
  } catch (e) { bip(false); ULT = { cls: "bad", ico: "✕", txt: esc(e.message) }; }
  finally { _lendo = false; if (secao === "retorno" && CG && ABERTA === CG.numero) desenharRetorno($("#root")); }
}

async function lerPdf(arquivo) {
  if (!window.pdfjsLib) throw new Error("O leitor de PDF ainda está carregando. Tente de novo em alguns segundos.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
  const linhas = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const pg = await doc.getPage(n), tc = await pg.getTextContent();
    const grupos = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5], larg = it.width || 0, s = it.str;
      let g = grupos.find(g => Math.abs(g.y - y) < 2.5); if (!g) { g = { y, cols: [] }; grupos.push(g); }
      let pos = 0; s.split(/(\s+)/).forEach(w => { if (w.trim()) g.cols.push({ s: w, x: x + (s.length ? larg * pos / s.length : 0) }); pos += w.length; });
    });
    grupos.sort((a, b) => b.y - a.y).forEach(g => { g.cols.sort((a, b) => a.x - b.x); linhas.push({ t: g.cols.map(c => c.s).join(" "), cols: g.cols }); });
  }
  return linhas;
}

async function vincularCodigo(codigo, sku, skus) {
  codigo = String(codigo || "").replace(/\s+/g, "");
  try {
    const r = await api(`/codigo/${encodeURIComponent(codigo)}`);
    if (r.sku && (!sku || r.sku === sku)) { bip(true); ULT = { cls: "warn", ico: "•", txt: `O código ${esc(codigo)} já está no SKU <b>${esc(r.sku)}</b> — ${esc((r.produto || {}).desc || "")}` }; return; }
    if (r.sku && sku && r.sku !== sku) { bip(false); ULT = { cls: "bad", ico: "✕", txt: `O código ${esc(codigo)} já está em outro SKU (${esc(r.sku)}).` }; toast(`Código já está no SKU ${r.sku}.`, true); return; }
    if (!sku) sku = await escolherSku(codigo, skus || []);
    if (!sku) { ULT = { cls: "warn", ico: "⏸", txt: "Código não vinculado." }; return; }
    await post("/cadastros/ean", { sku, codigo }); bip(true);
    ULT = { cls: "ok", ico: "✓", txt: `Código ${esc(codigo)} vinculado ao SKU <b>${esc(sku)}</b>.` }; toast("Código vinculado.");
  } catch (e) { bip(false); ULT = { cls: "bad", ico: "✕", txt: esc(e.message) }; toast(e.message, true); }
}
function escolherSku(codigo, skus) {
  return new Promise(res => {
    let feito = false; const fim = v => { if (!feito) { feito = true; res(v); } };
    abrirDlg(`<h3>De qual SKU é o código ${esc(codigo)}?</h3><p class="cap">Busque pela descrição ou pelo SKU. Os sem EAN aparecem primeiro.</p>
      <input type="search" id="esB" placeholder="Ex.: BOX SUEDE 138" autocomplete="off"><div class="q-opc" id="esL"></div>
      <div class="acts"><button type="button" id="esC">Cancelar</button></div>`, (el, fechar) => {
      const ord = skus.slice().sort((a, b) => (a.eans.length - b.eans.length) || (b.unidades - a.unidades));
      const desenha = () => { const t = $("#esB", el).value.trim().toUpperCase().split(/\s+/).filter(Boolean);
        $("#esL", el).innerHTML = ord.filter(s => t.every(w => (s.sku + " " + s.desc).toUpperCase().includes(w))).slice(0, 30).map(s => `<button type="button" data-sk="${esc(s.sku)}"><b>${esc(s.desc)}</b><small>SKU ${esc(s.sku)}${s.eans.length ? ` · já tem ${s.eans.length} EAN` : " · sem EAN"} · ${s.unidades} unid. em 60 dias</small></button>`).join("") || '<p class="cap">Nada encontrado.</p>';
        $("#esL", el).querySelectorAll("[data-sk]").forEach(b => b.onclick = () => { fim(b.dataset.sk); fechar(); }); };
      desenha(); $("#esB", el).oninput = desenha; $("#esB", el).focus();
      $("#esC", el).onclick = () => { fim(null); fechar(); };
      $("#dlg").onclose = () => fim(null);
    });
  });
}

    <h3>GAP das trocas do Mapa</h3><div class="kpis">${kpi("Trocas", int(p.gap.trocas))}${kpi("Apontadas", int(p.gap.apontadas), "", "k-warn")}${kpi("Analisadas", int(p.gap.analisadas), "", "k-azul")}${kpi("Mapa errado", p.gap.pct_gap + "%", `${int(p.gap.mapa_errado)} das analisadas`, "k-bad")}</div>
    <div class="q-et">${ranking(Object.fromEntries(Object.entries(p.gap.por_tipo || {}).map(([k, v]) => [FLAGS[k] || k, v])), "GAP por tipo", "var(--amber)")}</div>
    <h3>Implantação do EAN</h3><div class="kpis">${kpi("SKUs com EAN", e.pct_skus + "%", `${int(e.skus_com_ean)} de ${int(e.skus_nas_cargas)} · faltam ${int(e.faltam)}`, "k-ok")}${kpi("Unidades montadas por código", e.pct_unidades_codigo + "%", `${int(e.unidades_por_codigo)} de ${int(e.unidades_montadas)}`, "k-azul")}${kpi("SKUs que exigem QR", int(e.skus_com_qr), `${int(e.cadastrados_total)} SKUs com EAN no total`, "k-roxo")}</div>`);
  ligar(c);
}

// ═══ início ═══
// o cabeçalho fixo da leitura fica logo abaixo da barra, qualquer que seja a altura dela
const medirBarra = () => { const b = $(".bar"); if (b) document.documentElement.style.setProperty("--barh", b.offsetHeight + "px"); };
window.addEventListener("resize", medirBarra); medirBarra();
(async () => {
  try {
    const a = window.PQI_ACESSO ? await PQI_ACESSO.pronto : null;
    if (a && a.carregado) { ABAS_N = a.abas || null; NIVEL_SIS = a.nivelSistema != null ? a.nivelSistema : a.nivel; EMAIL = a.email; }
    const me = await fetch("/api/auth/me", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
    NOME = (me && me.usuario && (me.usuario.nome || me.usuario.email)) || EMAIL;
    if (!EMAIL && me && me.usuario) EMAIL = me.usuario.email;
    $("#whoTxt").textContent = `${NOME} · Qualidade`;
    status("ok");
  } catch (_) { status("erro"); }
  render();
})();

</script>
