          <td>${l.alt.length?l.alt.slice(-1).map(a=>`${esc(a.prod)} <span class="sub">${a.status==="sugerido"?"aguardando cliente":a.status==="aceito"?"aceito":"recusado"}</span>`).join(""):'<span class="muted">—</span>'}</td>
          <td>${pillDev(devolutiva(l.d))}</td><td>${bolaHTML(p,'<span class="muted">—</span>')}</td></tr>
          ${COS.aberto===kk?`<tr class="exp"><td colspan="13"><div data-pgco="${esc(p.k)}"></div></td></tr>`:""}`; }).join("")||`<tr><td colspan="13" class="muted" style="text-align:center;padding:24px">${COS.escopo==="pendentes"?"Nada pendente com o Compras. 👌":"Nenhum item com esses filtros."}</td></tr>`}</tbody></table></div>
    ${lst.length>COS.limite?`<button type="button" class="peq" id="coMais" style="margin-top:8px">Mostrar mais (${int(lst.length-COS.limite)})</button>`:""}
    ${Object.keys(forn).length?`<div class="box"><b>🏭 Por fornecedor</b><div class="tbl-wrap" style="margin-top:8px;max-height:320px"><table class="mx"><thead><tr><th>Fornecedor</th><th class="num">Itens</th><th class="num">Pedidos</th><th class="num">Cobrados</th><th class="num">Previsão vencida</th></tr></thead><tbody>${
      Object.entries(forn).sort((a,b)=>b[1].venc-a[1].venc||b[1].n-a[1].n).map(([f,x])=>`<tr class="clic" data-forn="${esc(f)}"><td><b>${esc(f)}</b></td><td class="num">${x.n}</td><td class="num">${x.ped.size}</td><td class="num">${x.cob}</td><td class="num">${x.venc?`<span class="pill p-bad">${x.venc}</span>`:"—"}</td></tr>`).join("")}</tbody></table></div></div>`:""}</section>`;
  c.querySelectorAll("[data-esc]").forEach(b=>b.onclick=()=>{ COS.escopo=b.dataset.esc; COS.aberto=""; render(); });
  $("#coEsc",c).onchange=e=>{ COS.escopo=e.target.value; render(); };
  $("#coSit",c).onchange=e=>{ COS.sit=e.target.value; render(); };
  $("#coForn",c).onchange=e=>{ COS.forn=e.target.value; render(); };
  c.querySelectorAll("[data-forn]").forEach(r=>r.onclick=()=>{ COS.forn=r.dataset.forn; COS.escopo="todos"; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  const bb=$("#coBusca",c); bb.oninput=()=>{ COS.busca=bb.value; clearTimeout(bb._t); bb._t=setTimeout(()=>{ const pos=bb.selectionStart; render(); const n=$("#coBusca"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } },250); };
  ligarProduto(c,"coProd",v=>{ COS.prod=v; COS.aberto=""; });
  turbinarTabela($("#coWrap table",c),"compras",false);
  c.querySelectorAll("table.mx").forEach((t,ix)=>turbinarTabela(t,"co_t"+ix,true));
  c.querySelectorAll("th[data-oc]").forEach(h=>h.onclick=()=>{ if(Date.now()-_fimRedim<300) return; const kk=h.dataset.oc; if(COS.ord===kk) COS.dir*=-1; else { COS.ord=kk; COS.dir=kk==="dias"||kk==="cobr"?-1:1; } render(); });
  const mais=$("#coMais",c); if(mais) mais.onclick=()=>{ COS.limite+=200; render(); };
  arrastarTela($("#coWrap",c),"cart_co_scroll");
  $("#coWrap",c).querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=async e=>{ if(e.target.closest("button,a,input,select,textarea")||_arrastou) return; const kk=tr.dataset.k, abrir=COS.aberto!==kk, k=kk.split("|")[0];
    soltarAreas(); Object.keys(estPG).forEach(x=>delete estPG[x]); COS.aberto=abrir?kk:""; COS.autoForm=false;
    if(abrir&&nivelAba("compras")>=2){ await carregarReservas(); COS.autoForm=await pegarArea(k,"compras"); }   // [v4.17] quem abre primeiro trata
    render(); });
  const pg=c.querySelector("[data-pgco]"); if(pg){ const p=pedidoDeChave(pg.dataset.pgco), prod=COS.aberto.split("|").slice(1).join("|"); if(COS.autoForm&&prod&&NIVEL>=2){ estPG[p.k]="co:"+prod; } COS.autoForm=false;
    montarInteracao(pg,p,"compras"); const wr=$("#coWrap",c); Object.assign(pg.style,{position:"sticky",left:"0",maxWidth:Math.max(600,wr.clientWidth-30)+"px"}); }
  $("#coXls",c).onclick=()=>exportarXlsx("compras_andamento",[{nome:"Compras",cols:[["Loja",l=>l.p.l],["Pedido",l=>l.p.p],["Cliente",l=>l.p.n],["Código",l=>l.p.c],["Entrega",l=>l.p.en?dataBR(l.p.en):""],["Prazo",l=>prazo(l.p).rot],
    ["Produto",l=>l.prod],["Descrição",l=>l.i?l.i[IT.desc]:""],["Grupo",l=>l.i?l.i[IT.grupo]:""],["Local",l=>l.i?l.i[IT.local]:""],["Qtd",l=>l.i?Number(l.i[IT.qtd])||0:""],
    ["Triagem",l=>l.t?`${l.t.dados.classe} · ${l.t.dados.motivo}`:""],["Setor(es)",l=>l.t&&aberta(l.t)?setoresDe(l.t).map(x=>setorPor(x).nome).join(" + "):""],["Com o setor há (dias)",l=>l.t&&aberta(l.t)?diasComSetor(l.t):""],
    ["Situação Compras",l=>sitCo(l.c.situacao)[1]],["Fornecedor",l=>l.c.fornecedor||""],["Motivo do atraso",l=>l.c.motivo||""],["Nova data",l=>l.c.nova_data?dataBR(l.c.nova_data):""],["Previsão vencida",l=>l.venc?"sim":""],
    ["Última cobrança",l=>l.u?dataHoraBR(l.u.em):""],["Cobrado por",l=>l.u?l.u.por:""],["Obs. da cobrança",l=>l.u?l.u.obs:""],["Nº de cobranças",l=>(l.c.cobrancas||[]).length],
    ["Alternativo",l=>l.alt.map(a=>`${a.prod} ${a.desc} (${a.status})`).join(" | ")],["Devolutiva CX",l=>devolutiva(l.d)],["Pendente com",l=>bolaDe(l.p).map(x=>`${x.a==="cx"?"CX":"Compras"}: ${x.t}`).join(" | ")]],linhas:lst}]);
}
// atualiza sozinho: o que a outra área gravou aparece sem recarregar (a cada 60 s, se ninguém estiver digitando)
setInterval(async()=>{
  if(document.hidden||!FOTO) return;
  await Promise.all([carregarInteracoes().catch(()=>{}),carregarReservas()]);
  atualizarMenu(); desenharLembrete();
  const ativo=document.activeElement, digitando=ativo&&ativo.closest&&ativo.closest("#root")&&/INPUT|TEXTAREA|SELECT/.test(ativo.tagName);
  if(["cx","compras"].includes(secao)&&!digitando&&!Object.keys(estPG).length) render();
},120000);   // [v4.18] a cada 2 min — o servidor responde da memória (não gasta leitura do Firestore)
// coluna "CX · Compras" da lista de Pendências por setor
function celInter(p){ const d=interDe(p.k), b=bolaDe(p), ev=d&&d.eventos&&d.eventos[d.eventos.length-1];
  if(!d&&!b.length) return '<span class="muted">—</span>';
  return `<div class="cel">${b.length?b.map(x=>pillArea(x.a,x.a==="cx"?"CX":"Compras")).join(" "):pillDev(devolutiva(d))}<span class="corta" title="${esc(ev?`${ev.texto} · ${ev.por} · ${dataHoraCurta(ev.em)}`:"")}">${ev?`${esc(ev.texto)} · ${esc(nomeCurto(ev.por))}`:""}</span></div>`; }

// ═══════════════════════════════════════════════════════════════════
// [v4.18] FILTRO POR PRODUTO + COLUNAS COMO NO EXCEL (arrastar a largura, que fica guardada,
// e clicar no título para ordenar A–Z / Z–A) em todas as abas que mostram produto
// ═══════════════════════════════════════════════════════════════════
function prodBate(i,q){ if(!q) return true; if(!i) return false; const n=nrm(q); return nrm(i[IT.prod])===n||nrm(i[IT.prod]).includes(n)||nrm(i[IT.desc]).includes(n); }
function pedTemProduto(p,q){ return !q||!!(p&&(p.it||[]).some(i=>prodBate(i,q))); }
function listaProdutos(peds){ const m=new Map(); peds.forEach(p=>(p&&p.it||[]).forEach(i=>{ if(i[IT.prod]&&!m.has(i[IT.prod])) m.set(i[IT.prod],i[IT.desc]); })); return [...m.entries()].sort((a,b)=>tx(a[1]).localeCompare(tx(b[1]),"pt-BR")); }
function campoProduto(id,valor,peds){ const l=listaProdutos(peds);
  return `<span class="campo-prod"><input id="${id}" list="${id}L" placeholder="🔎 Produto: código ou descrição" value="${esc(valor||"")}" aria-label="Filtrar por produto" autocomplete="off">${valor?`<button type="button" data-limpaprod="${id}" title="Tirar o filtro de produto">✕</button>`:""}<datalist id="${id}L">${l.slice(0,2000).map(([c,d])=>`<option value="${esc(c)}">${esc(d)}</option>`).join("")}</datalist></span>`; }
function ligarProduto(c,id,set){ const i=c.querySelector("#"+id); if(!i) return;
  const ap=()=>{ set(i.value.trim()); const pos=i.selectionStart; render(); const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } };
  i.oninput=()=>{ clearTimeout(i._t); i._t=setTimeout(ap,400); };
  const x=c.querySelector(`[data-limpaprod="${id}"]`); if(x) x.onclick=()=>{ set(""); render(); }; }
function valorOrdem(cel){ if(!cel) return ""; const t=(cel.dataset.v!=null?cel.dataset.v:cel.innerText||"").trim();
  let m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return Number(m[3]+m[2]+m[1]);
  m=t.match(/^(\d{2})\/(\d{2})(\s|$)/); if(m) return Number("9"+m[2]+m[1]);
  const num=t.replace(/R\$|\s|un|it|d$/g,""); if(/^-?[\d.]+(,\d+)?$/.test(num)) return Number(num.replace(/\./g,"").replace(",","."));
  return nrm(t); }
// tab: a tabela · chave: nome para guardar larguras/ordem · ordenarDom: ordena pelas linhas da tela (tabelas sem paginação)
function turbinarTabela(tab,chave,ordenarDom){
  if(!tab||tab._turbo) return; tab._turbo=true;
  const ths=[...tab.querySelectorAll("thead th")]; if(!ths.length) return;
  const KL="cart_larg_"+chave; let larg={}; try{ larg=JSON.parse(localStorage.getItem(KL)||"{}")||{}; }catch(_){}
  const med=ths.map((th,i)=>Number(larg[i])||Math.max(50,Math.round(th.getBoundingClientRect().width)));
  ths.forEach((th,i)=>{ th.style.width=med[i]+"px"; th.style.position="relative"; });
  const ajusta=()=>{ tab.style.width=ths.reduce((a,th)=>a+(parseFloat(th.style.width)||0),0)+"px"; };
  tab.style.tableLayout="fixed"; tab.style.minWidth="0"; ajusta();
  ths.forEach((th,i)=>{ const h=document.createElement("span"); h.className="col-res"; h.title="Arraste para ajustar a largura · duplo clique volta ao tamanho original"; th.appendChild(h);
    h.addEventListener("click",e=>e.stopPropagation());
    h.addEventListener("dblclick",e=>{ e.stopPropagation(); delete larg[i]; try{ localStorage.setItem(KL,JSON.stringify(larg)); }catch(_){} render(); });
    h.addEventListener("mousedown",e=>{ e.preventDefault(); e.stopPropagation(); const x0=e.clientX, w0=parseFloat(th.style.width)||th.offsetWidth; document.body.classList.add("redimensionando"); h.classList.add("ativo");
      const mv=ev=>{ th.style.width=Math.max(40,Math.round(w0+ev.clientX-x0))+"px"; ajusta(); };
      const up=()=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); document.body.classList.remove("redimensionando"); h.classList.remove("ativo");
        larg[i]=Math.round(parseFloat(th.style.width)); try{ localStorage.setItem(KL,JSON.stringify(larg)); }catch(_){} _fimRedim=Date.now(); };
      document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up); }); });
  if(!ordenarDom) return;
  const KO="cart_ord_"+chave; let ord=null; try{ ord=JSON.parse(sessionStorage.getItem(KO)||"null"); }catch(_){}
  const tb=tab.tBodies[0]; if(!tb) return;
  const aplicar=()=>{ ths.forEach(th=>{ const s0=th.querySelector(".seta"); if(s0) s0.remove(); });
    if(!ord||!ths[ord.i]) return;
    const grupos=[]; [...tb.rows].forEach(r=>{ if(r.classList.contains("exp")&&grupos.length) grupos[grupos.length-1].push(r); else grupos.push([r]); });
    if(grupos.length<2) return;
    grupos.sort((a,b)=>{ const x=valorOrdem(a[0].cells[ord.i]), y=valorOrdem(b[0].cells[ord.i]);
      return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"pt-BR",{numeric:true}))*ord.d; });
    grupos.forEach(g=>g.forEach(r=>tb.appendChild(r)));
    ths[ord.i].insertAdjacentHTML("beforeend",`<span class="seta">${ord.d>0?" ▲":" ▼"}</span>`); };
  ths.forEach((th,i)=>{ if(th.dataset.o||th.dataset.of||th.dataset.oc||th.dataset.ocx||!th.textContent.trim()) return;
    th.classList.add("ord"); if(!th.title) th.title="Clique para ordenar A–Z / Z–A";
    th.addEventListener("click",()=>{ if(Date.now()-_fimRedim<300) return; ord=ord&&ord.i===i?{i,d:-ord.d}:{i,d:1}; try{ sessionStorage.setItem(KO,JSON.stringify(ord)); }catch(_){} aplicar(); }); });
  if(ord) aplicar();
}

async function iniciar(){
  try{ const a=window.PQI_ACESSO?await PQI_ACESSO.pronto:null; if(a&&a.carregado){ NIVEL=a.nivel; NIVEL_SIS=a.nivelSistema!=null?a.nivelSistema:a.nivel; ABAS_N=a.abas||null; EMAIL=a.email; } }catch(_){}
  try{ const r=await fetch("/api/auth/me",{cache:"no-store"}); if(r.ok){ const j=await r.json(), u=j.usuario||{}; USUARIO=u.nome||u.email||""; EMAIL=EMAIL||u.email||""; ADMIN=u.papel==="admin";
      const deps=u.departamentos||[];
      if(deps.length){ const b=await fetch("/api/base/cadastros",{cache:"no-store"}); if(b.ok){ const bj=await b.json(); MEUS_SETORES=(bj.setores||[]).filter(s=>deps.includes(s.id)).map(s=>s.nome); } } } }catch(_){}
  $("#btImportar").hidden=nivelAba("importar")<3; $("#btImportar").onclick=()=>ir("importar");
  $("#btRelatorio").onclick=()=>{ if(!FOTO) return alert("Nenhuma carteira importada ainda."); exportarRelatorio("relatorio_completo",FOTO.pedidos); };
  try{
    const [cf,dias]=await Promise.all([api(`${API}/config`),api(`${API}/dias`),carregarTratativas(),carregarReservas(),carregarInteracoes()]);   // [v4.15] + CX × Compras
    CFG=cf.j&&cf.j.id?cf.j:null; CFG_DADOS=cfg(); DIAS=dias.j||[];
    if(DIAS.length){ const ult=DIAS[DIAS.length-1].data, f=await carregarFoto(ult); FOTO=f; FOTO_DATA=ult; FOTO_ATUAL={data:ult,foto:f}; }
    else if(NIVEL>=3) secao="importar";
    $("#btRelatorio").hidden=!FOTO;
    setStatus("ok"); render(); avisoAoEntrar();
  }catch(e){ if(e.message==="sessão expirada") return; setStatus("erro",e.message);
    $("#root").innerHTML=`<div class="conflito"><b>Não consegui carregar a carteira.</b><br>${esc(e.message)}<div class="acoes"><button type="button" onclick="location.reload()">Tentar de novo</button></div></div>`; }
}
iniciar();
