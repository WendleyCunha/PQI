    <div class="arq">${imp.pedidos?`✅ <b>Pedidos</b> · ${esc(imp.pedidos.nome)} · ${int(imp.pedidos.linhas.length)} linha(s)`:'<span class="muted">⬜ Planilha de <b>pedidos</b> (Filial, Nome, Pedido, Itens PV, Agenda, Cidade, CEP, Tel, Cubagem, Valor…)</span>'}</div>
    <div class="grade" style="max-width:520px;margin-top:12px"><label class="f">Data da carteira<input type="date" id="impData" value="${imp.data}"></label></div>
    ${ex?`<p class="alerta">Já existe uma carteira de <b>${dataBR(imp.data)}</b> (importada ${dataHoraBR(ex.importado_em)} por ${esc(ex.importado_por||"—")}). Gravar de novo <b>substitui</b> a foto desse dia; as tratativas não são afetadas.</p>`:""}
    <div class="acoes"><button type="button" id="impPrev" ${imp.itens||imp.pedidos?"":"disabled"}>Conferir antes de gravar</button>${imp.itens||imp.pedidos?'<button type="button" class="peq" id="impLimpar">Trocar arquivos</button>':""}<span class="msg" id="impMsg"></span></div>
    <div id="impPv"></div></section>`;
  const drop=$("#drop",c), inp=$("#arqs",c);
  drop.onclick=()=>inp.click(); drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); inp.click(); } };
  inp.onchange=()=>receberArquivos([...inp.files]);
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("sobre"); }; drop.ondragleave=()=>drop.classList.remove("sobre");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("sobre"); receberArquivos([...e.dataTransfer.files]); };
  $("#impData",c).onchange=e=>{ imp.data=e.target.value||hojeISO(); imp.previa=null; render(); };
  const lp=$("#impLimpar",c); if(lp) lp.onclick=()=>{ imp.itens=imp.pedidos=imp.previa=null; render(); };
  $("#impPrev",c).onclick=async()=>{ const b=$("#impPrev"); b.disabled=true; $("#impMsg").textContent="Unindo as planilhas…"; try{ await calcularPrevia(); render(); }catch(e){ $("#impMsg").className="msg erro"; $("#impMsg").textContent=e.message; b.disabled=false; } };
  if(!pv) return;
  const r=pv.resumo, U=pv.atualizacoes||[], nSaiu=U.filter(x=>x.tipo==="saiu").length, nDesb=U.filter(x=>x.tipo==="desbloqueou").length, nMud=U.filter(x=>x.tipo==="mudou").length;
  $("#impPv",c).innerHTML=`<div class="box"><b style="font-size:16px">Conferência — carteira de ${dataBR(imp.data)}</b>
    <div class="kpis"><div class="kpi k-azul"><span>Pedidos</span><b>${int(r.pedidos)}</b><small>${int(pv.ambas)} nas duas planilhas · ${int(pv.soPed)} só em pedidos · ${int(pv.soIt)} só em itens</small></div>
      <div class="kpi"><span>Itens / unidades</span><b>${int(r.itens)}</b><small>${int(r.unidades)} unidades · ${moeda(r.valor)}</small></div>
      <div class="kpi k-warn"><span>Bloqueados</span><b>${int(r.bloqueados)}</b><small>${int(r.bloq_atrasados)} bloqueados e atrasados</small></div>
      <div class="kpi k-bad"><span>Atrasados</span><b>${int(r.atrasados)}</b><small>${int(r.sem_data)} sem data</small></div>
      <div class="kpi k-roxo"><span>Comparado com ${pv.anterior?dataBR(pv.anterior):"—"}</span><b>${pv.primeira?"1ª foto":`+${int(pv.novos.length)} / −${int(pv.sairam.length)}`}</b><small>${pv.primeira?"ainda não há dia anterior para comparar":"entraram / saíram da carteira"}</small></div></div>
    ${imp.itens&&imp.itens.totais.TOTAL!=null?(imp.itens.totais.TOTAL===r.itens?`<p class="aviso" style="background:var(--ok-soft)">✓ Confere com o total do BI: <b>${int(imp.itens.totais.TOTAL)}</b> itens${imp.itens.totais.BLOQUEADOS!=null?` · ${int(imp.itens.totais.BLOQUEADOS)} bloqueados`:""}${imp.itens.totais.LIBERADOS!=null?` · ${int(imp.itens.totais.LIBERADOS)} liberados`:""}.</p>`
      :`<p class="alerta">⚠ O total do BI diz <b>${int(imp.itens.totais.TOTAL)}</b> itens, mas foram lidos <b>${int(r.itens)}</b>. Confira se a planilha veio completa.</p>`):""}
    ${!imp.itens||!imp.pedidos?`<p class="alerta">Falta a planilha de <b>${!imp.itens?"itens":"pedidos"}</b>. Dá para gravar assim, mas a foto fica incompleta.</p>`:""}
    ${pv.conflitos.length?`<p class="alerta">${pv.conflitos.length} pedido(s) repetido(s) na mesma loja dentro da planilha de pedidos — ficou a última linha: ${pv.conflitos.slice(0,10).map(esc).join(", ")}${pv.conflitos.length>10?"…":""}</p>`:""}
    ${r.corrigidos_qtd_bloq?`<p class="aviso">⛔ <b>${int(r.corrigidos_qtd_bloq)}</b> pedido(s) com <b>Qtd Bloq = 1</b> estavam como LIBERADO/CARTEIRA no Status e foram considerados <b>BLOQUEADO</b>.</p>`:""}
    ${U.length?`<div class="aviso"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="impFechar" ${imp.fechar?"checked":""} style="width:16px;height:16px;margin-top:3px"><span><b>Atualizar automaticamente ${U.length} pendência(s) aberta(s) pela planilha:</b><br>
      ${nSaiu?`• ${nSaiu} saíram da carteira → encerradas<br>`:""}${nDesb?`• ${nDesb} desbloquearam (Status Pedido saiu de bloqueado) → encerradas<br>`:""}${nMud?`• ${nMud} mudaram de Status Pedido → registrado no histórico, continuam com o setor`:""}</span></label></div>`:""}
    ${(pv.repos||[]).some(x=>["reposta","saiu"].includes(x.status))?`<p class="aviso" style="background:var(--ok-soft)">↩ <b>${int(pv.repos.filter(x=>["reposta","saiu"].includes(x.status)).length)}</b> reposição(ões) serão encerradas: ${int(pv.repos.filter(x=>x.status==="reposta").length)} com o item liberado de novo · ${int(pv.repos.filter(x=>x.status==="saiu").length)} de pedidos que saíram da carteira.</p>`:""}
    ${(pv.repos||[]).some(x=>x.status==="pendente_erp")?`<p class="alerta">⚠ <b>${int(pv.repos.filter(x=>x.status==="pendente_erp").length)}</b> retirada(s) registrada(s) ainda não aparecem na planilha (o item do pedido que doou continua liberado). Confira se a movimentação foi feita no ERP: ${pv.repos.filter(x=>x.status==="pendente_erp").slice(0,10).map(x=>esc(`${x.r.produto} do ${x.r.de_pedido}`)).join(", ")}.</p>`:""}
    ${(pv.indevidos||[]).length?(()=>{ const pu=new Map(); pv.indevidos.forEach(x=>pu.set(x.enc.por||"—",(pu.get(x.enc.por||"—")||0)+1));
      return `<div class="indev-aviso">⚠ <b>${int(pv.indevidos.length)} pedido(s) marcados como resolvidos voltaram BLOQUEADOS nesta planilha.</b> Ao gravar, eles ficam como <b>RESOLVIDO INDEVIDAMENTE</b> e voltam para a Triagem em vermelho.<br>
        Encerrados por: ${[...pu.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<b>${esc(k)}</b> (${int(v)})`).join(" · ")}<br>
        <span class="muted">Pedidos: ${pv.indevidos.slice(0,15).map(x=>esc(x.p.p)).join(", ")}${pv.indevidos.length>15?"…":""}</span></div>`; })():""}
    <div class="acoes"><button type="button" class="primary" id="impGravar">✓ Gravar a carteira de ${dataBR(imp.data)}</button><span class="msg" id="impMsg2"></span></div></div>`;
  const fx=$("#impFechar",c); if(fx) fx.onchange=()=>{ imp.fechar=fx.checked; };
  $("#impGravar",c).onclick=async()=>{ const b=$("#impGravar"), m=$("#impMsg2");
    if(ex&&!confirm(`Substituir a carteira de ${dataBR(imp.data)} que já está gravada?`)) return;
    b.disabled=true; m.className="msg"; m.textContent="Compactando e gravando…";
    try{
      const foto={versao:1,data:imp.data,pedidos:pv.pedidos}, {partes,formato}=await compactar(foto);
      const corta=a=>a.length>6000?a.slice(0,6000):a;
      const meta={resumo:pv.resumo,novos:corta(pv.novos),sairam:corta(pv.sairam),primeira:pv.primeira,formato,
        arquivos:{itens:imp.itens&&imp.itens.nome,pedidos:imp.pedidos&&imp.pedidos.nome},origem:{ambas:pv.ambas,so_pedidos:pv.soPed,so_itens:pv.soIt},conflitos:pv.conflitos.slice(0,200)};
      setStatus("salvando");
      await enviarFoto(imp.data,meta,partes,t=>{ m.textContent=t; });
      const {j}=await api(`${API}/dias`); DIAS=j||[];
      if(!FOTO_ATUAL||imp.data>=FOTO_ATUAL.data){ foto.meta={...meta,data:imp.data,importado_em:new Date().toISOString(),importado_por:USUARIO}; FOTO_ATUAL={data:imp.data,foto}; FOTO=foto; FOTO_DATA=imp.data; }
      let fechadas=0, mudaram=0;
      if(U.length&&imp.fechar) for(const x of U){ const quando=`foto de ${dataBR(imp.data)}`;
        try{ if(x.tipo==="saiu"){ await gravarTratativa(pedidoDaTrat(x.t),{acao:"auto",nota:`Saiu da carteira na ${quando}`}); fechadas++; }
          else if(x.tipo==="desbloqueou"){ await gravarTratativa(x.p,{acao:"auto",situacao:x.para,nota:`Status do pedido: ${x.de} → ${x.para} (${quando})`}); fechadas++; }
          else { await gravarTratativa(x.p,{acao:"status",situacao:x.para,nota:`Status do pedido: ${x.de} → ${x.para} (${quando})`}); mudaram++; } }catch(_){}
        m.textContent=`Atualizando pendências… ${fechadas+mudaram} de ${U.length}`; }
      let indevN=0; const IV=pv.indevidos||[];
      for(const x of IV){ try{ await gravarTratativa(x.p,{acao:"indevido",enc:x.enc,foto:imp.data,
          nota:`Voltou bloqueado na foto de ${dataBR(imp.data)} — tinha sido encerrado como “${ROT_TIPO_ENC[x.enc.acao]||x.enc.acao}” por ${x.enc.por||"—"} em ${dataHoraBR(x.enc.em)}`}); indevN++; }catch(_){}
        m.textContent=`Marcando encerramentos indevidos… ${indevN} de ${IV.length}`; }
      let repN=0; /* conta só as encerradas */
      for(const x of (pv.repos||[]).filter(x=>x.status!=="pendente_erp")){ try{ if(x.status==="visto"){ await gravarTratativa(x.p,{acao:"repor",repo_id:x.r.id,status:"visto",foto:imp.data,nota:`Planilha de ${dataBR(imp.data)}: retirada de ${x.r.qtd}× ${x.r.produto} confirmada — aguardando reposição`}); continue; }
        await gravarTratativa(x.p||pedidoDaTrat(x.t),{acao:"repor",repo_id:x.r.id,status:x.status,auto:true,nota:x.status==="reposta"?`Reposição de ${x.r.qtd}× ${x.r.produto}: item voltou liberado na foto de ${dataBR(imp.data)}`:`Pedido saiu da carteira na foto de ${dataBR(imp.data)} — reposição encerrada`}); repN++; }catch(_){} }
      setStatus("ok"); imp.itens=imp.pedidos=imp.previa=null; $("#btRelatorio").hidden=false; ir("painel");
      toast(`✓ Carteira de ${dataBR(imp.data)} gravada (${int(pv.resumo.pedidos)} pedidos).${fechadas?` ${fechadas} pendência(s) encerrada(s) pela planilha.`:""}${mudaram?` ${mudaram} mudaram de status.`:""}${indevN?` ⚠ ${indevN} encerramento(s) indevido(s) — voltaram para a Triagem.`:""}${repN?` ↩ ${repN} reposição(ões) encerrada(s).`:""}`);
    }catch(e){ setStatus("erro",e.message); m.className="msg erro"; m.textContent=e.message; b.disabled=false; } };
}

function renderConfig(c){
  if(NIVEL<3){ c.innerHTML='<div class="aviso">Configurar exige o perfil <b>Editar</b> no módulo Carteira.</div>'; return; }
  const D=JSON.parse(JSON.stringify(cfg()));
  c.innerHTML=`<section><header><h2>Configurar</h2><p>Setores que recebem pendências e os motivos de cada classificação. Cada motivo fica pendente com um setor.</p></header>
    <div class="grade" style="max-width:860px"><label class="f">Atrasado = entrega em até (dias)<input type="number" min="0" id="cfDias" value="${esc(D.dias_alerta)}"></label>
      <label class="f">Alerta = entrega em até (dias)<input type="number" min="1" id="cfAviso" value="${esc(D.dias_aviso??13)}"></label>
      <label class="f">Sem data = entrega a partir do ano<input type="number" min="2026" id="cfAno" value="${esc(D.ano_ficticio)}"></label></div>
    <h3>Setores</h3><div id="cfSet"></div><div class="acoes"><button type="button" class="peq" id="cfSetAdd">＋ Setor</button></div>
    <h3>Motivos</h3><p class="cap">A <b>classificação</b> agrupa (ex.: Pendente compra); o <b>motivo</b> detalha; o <b>setor</b> é com quem fica a pendência; o <b>prazo</b> é quantos dias o setor tem antes de ficar “fora do prazo”.</p>
    <datalist id="dlClasses">${[...new Set(D.motivos.map(m=>m.classe))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <div id="cfMot"></div><div class="acoes"><button type="button" class="peq" id="cfMotAdd">＋ Motivo</button></div>
    <div class="acoes"><button type="button" class="primary" id="cfSalvar">Salvar configuração</button><span class="msg" id="cfMsg"></span></div></section>`;
  const desSet=()=>{ $("#cfSet").innerHTML=`<div class="tbl-wrap" style="max-width:640px"><table><thead><tr><th>Cor</th><th>Setor</th><th>Motivos</th><th></th></tr></thead><tbody>${D.setores.map((s,i)=>`<tr>
      <td><input type="color" data-sc="${i}" value="${esc(s.cor)}" style="width:44px;padding:2px;height:30px"></td><td><input data-sn="${i}" value="${esc(s.nome)}"></td><td>${D.motivos.filter(m=>m.setor===s.id).length}</td>
      <td><button type="button" class="peq warn" data-sd="${i}" title="Excluir">🗑</button></td></tr>`).join("")}</tbody></table></div>`;
    $("#cfSet").querySelectorAll("[data-sn]").forEach(i=>i.oninput=()=>{ D.setores[+i.dataset.sn].nome=i.value; });
    $("#cfSet").querySelectorAll("[data-sc]").forEach(i=>i.oninput=()=>{ D.setores[+i.dataset.sc].cor=i.value; });
    $("#cfSet").querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{ const s=D.setores[+b.dataset.sd];
      if(D.motivos.some(m=>m.setor===s.id)){ alert(`“${s.nome}” tem motivos ligados. Troque o setor desses motivos antes de excluir.`); return; }
      if([...TRAT.values()].some(t=>aberta(t)&&setoresDe(t).includes(s.id))){ alert(`“${s.nome}” tem pendências abertas. Resolva ou toque para outro setor antes.`); return; }
      D.setores.splice(+b.dataset.sd,1); desSet(); desMot(); }); };
  const desMot=()=>{ $("#cfMot").innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Classificação</th><th>Motivo</th><th>Fica pendente com</th><th>Prazo (dias)</th><th>Ativo</th><th></th></tr></thead><tbody>${D.motivos.map((m,i)=>`<tr>
      <td><input data-mc="${i}" list="dlClasses" value="${esc(m.classe)}"></td><td><input data-mm="${i}" value="${esc(m.motivo)}"></td>
      <td><select data-ms="${i}">${D.setores.map(s=>`<option value="${s.id}"${s.id===m.setor?" selected":""}>${esc(s.nome)}</option>`).join("")}</select></td>
      <td><input type="number" min="0" data-ml="${i}" value="${esc(m.sla??"")}" style="width:90px"></td><td><input type="checkbox" data-ma="${i}" ${m.ativo!==false?"checked":""}></td>
      <td><button type="button" class="peq warn" data-md="${i}" title="Excluir">🗑</button></td></tr>`).join("")}</tbody></table></div>`;
    const lig=(sel,k,conv)=>$("#cfMot").querySelectorAll(`[${sel}]`).forEach(i=>i[i.type==="checkbox"||i.tagName==="SELECT"?"onchange":"oninput"]=()=>{ D.motivos[+i.getAttribute(sel)][k]=conv?conv(i):i.value; });
    lig("data-mc","classe"); lig("data-mm","motivo"); lig("data-ms","setor"); lig("data-ml","sla",i=>Number(i.value)||0); lig("data-ma","ativo",i=>i.checked);
    $("#cfMot").querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{ const m=D.motivos[+b.dataset.md];
      if([...TRAT.values()].some(t=>aberta(t)&&motivosDe(t).some(x=>x.id===m.id))){ alert("Há pendências abertas com este motivo — desative em vez de excluir."); return; }
      D.motivos.splice(+b.dataset.md,1); desMot(); }); };
  desSet(); desMot();
  $("#cfSetAdd",c).onclick=()=>{ D.setores.push({id:uid(),nome:"Novo setor",cor:CORES[D.setores.length%CORES.length]}); desSet(); desMot(); };
  $("#cfMotAdd",c).onclick=()=>{ D.motivos.push({id:uid(),classe:"",motivo:"",setor:(D.setores[0]||{}).id,sla:3,ativo:true}); desMot(); };
  $("#cfSalvar",c).onclick=async()=>{ const m=$("#cfMsg");
    D.dias_alerta=Number($("#cfDias").value)||4; D.ano_ficticio=Number($("#cfAno").value)||2030;
    D.dias_aviso=Math.max(D.dias_alerta+1,Number($("#cfAviso").value)||13);
    D.setores=D.setores.filter(s=>tx(s.nome)).map(s=>({...s,nome:tx(s.nome)})); D.motivos=D.motivos.filter(x=>tx(x.motivo)).map(x=>({...x,classe:tx(x.classe)||"Outros",motivo:tx(x.motivo)}));
    try{ await salvarConfig(D); m.className="msg ok"; m.textContent="✓ Configuração salva."; render(); toast("✓ Configuração salva."); }catch(e){ m.className="msg erro"; m.textContent=e.message; } };
}

// EXCEL

let _xl=null;
function excelJS(){ if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!_xl) _xl=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"; s.onload=()=>res(window.ExcelJS); s.onerror=()=>{ _xl=null; rej(new Error("não consegui carregar a biblioteca de Excel (sem internet?)")); }; document.head.appendChild(s); });
  return _xl; }
async function exportarXlsx(nome,abas){
  try{ const X=await excelJS(), wb=new X.Workbook();
    abas.forEach(a=>{ const ws=wb.addWorksheet(a.nome.slice(0,31)); ws.addRow(a.cols.map(c=>c[0]));
      ws.getRow(1).eachCell((c,n)=>{ c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:(a.cols[n-1]&&a.cols[n-1][2])||"FF2E4A7A"}}; c.alignment={vertical:"middle",wrapText:true}; });
      ws.getRow(1).height=32;
      a.linhas.forEach(l=>ws.addRow(a.cols.map(c=>c[1](l))));
      a.cols.forEach((c,i)=>ws.getColumn(i+1).width=Math.max(10,Math.min(48,Math.max(c[0].length+4,...a.linhas.slice(0,200).map(l=>String(c[1](l)??"").length+2))))); ws.views=[{state:"frozen",xSplit:5,ySplit:1}];
      if(a.linhas.length) ws.autoFilter={from:{row:1,column:1},to:{row:1,column:a.cols.length}}; });
    baixarBlob(new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`${nome}_${FOTO_DATA||hojeISO()}.xlsx`);
  }catch(e){ alert(e.message); } }
function exportarCarteira(lst){ return exportarRelatorio("carteira",lst); }

// [v4.6] RELATÓRIO COMPLETO — as duas planilhas do BI unidas + tudo o
// que foi digitado no sistema. Aba "Itens": uma linha por peça pendente
// (pedido sem item na planilha de itens sai numa linha só). Aba "Pedidos":
// uma linha por pedido. Aba "Histórico": cada movimentação da tratativa.
// ═══════════════════════════════════════════════════════════════════
function foraDeLinha(i){ const g=nrm(i[IT.grupo]); return g.startsWith("9999")||g.includes("fora de linha"); }
// cores do cabeçalho: de onde vem cada coluna
const COR_ITENS="FF2B63B0", COR_PV="FF2F7D4F", COR_SIS="FFC98A0B";
// colunas da planilha de ITENS — mesmos nomes e mesma ordem do BI
const COLS_BI_ITENS=[["Filial",x=>x.i?x.i[IT.fil]||"":""],["Filial Origem",x=>`${x.p.l}${x.p.ln?" - "+x.p.ln:""}`],["Codigo",x=>x.p.c],["Cliente",x=>x.p.n],["Pedido",x=>x.p.p],
  ["Emissão",x=>x.p.em?dataBR(x.p.em):""],["Item",x=>x.i?x.i[IT.item]:""],["Produto",x=>x.i?x.i[IT.prod]:""],["Descrição",x=>x.i?x.i[IT.desc]:""],["Grupo Produto",x=>x.i?x.i[IT.grupo]:""],
  ["Local",x=>x.i?x.i[IT.local]:""],["QTD",x=>x.i?x.i[IT.qtd]:""],["Total",x=>x.i?x.i[IT.total]:""],["Entrega",x=>x.p.en?dataBR(x.p.en):""],["Status",x=>x.i?x.i[IT.st]:""],
  ["Tipo Pedido",x=>x.p.tp],["Status Pedido",x=>x.p.sp]].map(c=>[c[0],c[1],COR_ITENS]);
// colunas da planilha de PEDIDOS (PV) — mesmos nomes do BI; as que repetem nome levam "(PV)"
const COLS_BI_PV=[["Filial (PV)",x=>x.p.l],["Nome",x=>x.p.ln],["Itens PV",x=>x.p.ipv||""],["Qtd PV",x=>x.p.qpv||""],["Status (PV)",x=>x.p.st],["Qtd Bloq",x=>temQtdBloq(x.p)?x.p.qb:""],
  ["Agenda",x=>x.p.ag],["Cidade",x=>x.p.ci],["Bairro",x=>x.p.ba],["CEP",x=>x.p.cep],["Tel",x=>(x.p.t||[])[0]||""],["Tel2",x=>(x.p.t||[])[1]||""],["Tel3",x=>(x.p.t||[])[2]||""],
  ["Observações",x=>x.p.ob],["Desp. Aces.",x=>x.p.de],["Cubagem",x=>x.p.cu||""],["Valor",x=>x.p.v||""]].map(c=>[c[0],c[1],COR_PV]);
// colunas do SISTEMA — regras aplicadas e tudo o que foi digitado
function colunasSistema(){
  const tr=p=>tratDe(p.k), d=p=>(tr(p)||{}).dados||{}, hist=p=>d(p).historico||[];
  const naFoto=new Set(((FOTO_ATUAL&&FOTO_ATUAL.foto.pedidos)||[]).map(x=>x.k));
  return [
    ["Bloqueado (regra Qtd Bloq)",p=>p.fora?"":bloqueado(p)?"Sim":"Não"],["Status ajustado",p=>p.fora?"":statusReal(p)],["Status do pedido ajustado",p=>p.fora?(d(p).situacao||""):situacao(p)],
    ["Prazo",p=>p.fora?"":prazo(p).rot],["Etapa da triagem",p=>p.fora?"":({vencidos:"1ª · Vencido",emdia:"2ª · Em dia",semdata:"Sem data"})[etapaDe(p)]],
    ["Origem dos dados",p=>p.fora?"fora da carteira atual":({ambas:"as duas planilhas",pedidos:"só planilha de pedidos",itens:"só planilha de itens"})[p.fo]||""],["Na carteira atual",p=>naFoto.has(p.k)?"Sim":"Saiu"],
    ["Analisado",p=>analisado(p.k)?"Sim":"Não"],["Situação da tratativa",p=>({aberta:"Aberta",resolvida:"Resolvida",ok:ROT_CORRECAO,reposicao:"Doou peça — aguardando reposição",indevido:"Resolvido indevidamente (voltou bloqueado)"})[d(p).status]||""],
    ["Encerramentos indevidos",p=>indevidosDe(tr(p)).length||""],["Último encerramento indevido por",p=>{ const u=ultIndevido(tr(p)); return u?`${u.por||"—"} · ${ROT_TIPO_ENC[u.acao]||u.acao||""} em ${dataHoraBR(u.em)} · voltou em ${dataBR(u.foto)}`:""; }],
    ["Classificação",p=>d(p).status==="ok"?ROT_CORRECAO:d(p).classe||""],["Motivo(s)",p=>d(p).status==="ok"?ROT_CORRECAO+(notaCorrecao(tr(p))?" — "+notaCorrecao(tr(p)):""):d(p).motivo||""],["Setor(es)",p=>setoresDe(tr(p)).map(i=>setorPor(i).nome).join(" + ")],
    ["Dias com o setor",p=>aberta(tr(p))?diasComSetor(tr(p)):""],["Fora do prazo do setor",p=>aberta(tr(p))&&foraDoPrazo(tr(p))?`Sim (prazo ${foraDoPrazo(tr(p))} d)`:""],
    ["Aberta em",p=>d(p).aberta_em?dataHoraBR(d(p).aberta_em):""],["Classificado por",p=>(hist(p).find(h=>h.acao==="classificar"||h.acao==="ok")||{}).por||""],
    ["Última nota",p=>([...hist(p)].reverse().find(h=>h.nota)||{}).nota||""],["Última movimentação",p=>{ const h=hist(p)[hist(p).length-1]; return h?`${dataHoraBR(h.em)} · ${h.por||""}`:""; }],
    ["Resolvida em",p=>d(p).resolvida_em?dataHoraBR(d(p).resolvida_em):""],["Em análise agora por",p=>{ const r=RESERVAS.get(p.k); return r&&String(r.expira)>new Date().toISOString()?(r.por||r.email):""; }],
    ["Histórico",p=>hist(p).map(h=>`${dataHoraBR(h.em)} ${h.por||""}: ${textoHist(h).replace(/<[^>]+>/g,"")}${h.nota?` — “${h.nota}”`:""}`).join(" | ")]].map(c=>[c[0],c[1],COR_SIS]);
}
function linhasRelatorio(lst){
  const sis=colunasSistema(), comP=cols=>cols.map(([r,f,c])=>[r,x=>f(x.p),c]);
  const itens=lst.flatMap(p=>p.it.length?p.it.map(i=>({p,i})):[{p,i:null}]);
  const hist=lst.flatMap(p=>{ const t=tratDe(p.k); return t?(t.dados.historico||[]).map(h=>({p,h})):[]; });
  const pvPedidos=[["Filial",x=>x.p.l],["Nome",x=>x.p.ln],["Codigo",x=>x.p.c],["Cliente",x=>x.p.n],["Pedido",x=>x.p.p],["Emissao",x=>x.p.em?dataBR(x.p.em):""],["Itens PV",x=>x.p.ipv||""],["Qtd PV",x=>x.p.qpv||""],
    ["Entrega",x=>x.p.en?dataBR(x.p.en):""],["Status",x=>x.p.st],["Tipo Pedido",x=>x.p.tp],["Qtd Bloq",x=>temQtdBloq(x.p)?x.p.qb:""],["Agenda",x=>x.p.ag],["Cidade",x=>x.p.ci],["Bairro",x=>x.p.ba],["CEP",x=>x.p.cep],
    ["Tel",x=>(x.p.t||[])[0]||""],["Tel2",x=>(x.p.t||[])[1]||""],["Tel3",x=>(x.p.t||[])[2]||""],["Observações",x=>x.p.ob],["Desp. Aces.",x=>x.p.de],["Cubagem",x=>x.p.cu||""],["Valor",x=>x.p.v||""]].map(c=>[c[0],c[1],COR_PV]);
  return [
    {nome:"Relatório completo",cols:[...COLS_BI_ITENS,...COLS_BI_PV,...comP(sis)],linhas:itens},
    {nome:"Pedidos",cols:[...pvPedidos,["Peças (planilha de itens)",x=>x.p.it.map(i=>`${i[IT.qtd]}x ${i[IT.prod]} ${i[IT.desc]}`).join(" | "),COR_ITENS],["Status Pedido",x=>x.p.sp,COR_ITENS],...comP(sis)],linhas:lst.map(p=>({p}))},
    {nome:"Histórico",cols:[["Filial Origem",x=>`${x.p.l}${x.p.ln?" - "+x.p.ln:""}`],["Pedido",x=>x.p.p],["Codigo",x=>x.p.c],["Cliente",x=>x.p.n],["Data e hora",x=>dataHoraBR(x.h.em)],["Por",x=>x.h.por||""],
      ["Ação",x=>textoHist(x.h).replace(/<[^>]+>/g,"")],["Setor(es)",x=>(x.h.setores||(x.h.setor?[x.h.setor]:[])).map(i=>setorPor(i).nome).join(" + ")],["Classificação",x=>x.h.classe||""],["Motivo",x=>x.h.motivo||""],["Nota",x=>x.h.nota||""]].map(c=>[c[0],c[1],COR_SIS]),linhas:hist}];
}
function exportarRelatorio(nome,lst){ if(!lst.length) return alert("Nada para exportar com esses filtros."); return exportarXlsx(nome,linhasRelatorio(lst)); }

// INÍCIO
// ═══════════════════════════════════════════════════════════════════
async function iniciar(){
  try{ const a=window.PQI_ACESSO?await PQI_ACESSO.pronto:null; if(a&&a.carregado){ NIVEL=a.nivel; EMAIL=a.email; } }catch(_){}
  try{ const r=await fetch("/api/auth/me",{cache:"no-store"}); if(r.ok){ const j=await r.json(), u=j.usuario||{}; USUARIO=u.nome||u.email||""; EMAIL=EMAIL||u.email||""; ADMIN=u.papel==="admin";
      const deps=u.departamentos||[];
      if(deps.length){ const b=await fetch("/api/base/cadastros",{cache:"no-store"}); if(b.ok){ const bj=await b.json(); MEUS_SETORES=(bj.setores||[]).filter(s=>deps.includes(s.id)).map(s=>s.nome); } } } }catch(_){}
  $("#btImportar").hidden=NIVEL<3; $("#btImportar").onclick=()=>ir("importar");
  $("#btRelatorio").onclick=()=>{ if(!FOTO) return alert("Nenhuma carteira importada ainda."); exportarRelatorio("relatorio_completo",FOTO.pedidos); };
  try{
    const [cf,dias]=await Promise.all([api(`${API}/config`),api(`${API}/dias`),carregarTratativas(),carregarReservas()]);
    CFG=cf.j&&cf.j.id?cf.j:null; CFG_DADOS=cfg(); DIAS=dias.j||[];
    if(DIAS.length){ const ult=DIAS[DIAS.length-1].data, f=await carregarFoto(ult); FOTO=f; FOTO_DATA=ult; FOTO_ATUAL={data:ult,foto:f}; }
    else if(NIVEL>=3) secao="importar";
    $("#btRelatorio").hidden=!FOTO;
    setStatus("ok"); render();
  }catch(e){ if(e.message==="sessão expirada") return; setStatus("erro",e.message);
    $("#root").innerHTML=`<div class="conflito"><b>Não consegui carregar a carteira.</b><br>${esc(e.message)}<div class="acoes"><button type="button" onclick="location.reload()">Tentar de novo</button></div></div>`; }
}
iniciar();
</script>
