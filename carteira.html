<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira de Encomendas — King Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/pqi-acesso.js" data-modulo="carteira"></script>
<style>
/* ═══ Mesmo padrão visual do PQI (Diário, Mapa, Diagnóstico, Organogramas) ═══ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9; --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8; --block:#6B46A8; --block-soft:#EEE7F8; --idle:#8A93A3; --idle-soft:#EEF0F3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442; --idle:#8A93A3; --idle-soft:#262D3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,h4,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
h3{font-size:16px;margin:22px 0 8px;font-weight:600}
a{color:var(--steel)}
.cap{color:var(--ink-3);font-size:13px;margin:2px 0 12px;max-width:90ch}
.muted{color:var(--ink-3)}
[hidden]{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{color:var(--ink-3);font-size:13px;margin-right:auto;display:flex;align-items:center;gap:8px}
.who.erro{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.salvando{background:var(--amber)} .dot.erro{background:var(--bad)}
button,.btn{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--ink-3)}
button.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
button.warn{color:var(--bad)} button.peq{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.msg{font-size:13px} .msg.ok{color:var(--ok)} .msg.erro{color:var(--bad)}
.aviso{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--steel-soft);font-size:14px}
.alerta{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--amber-soft);font-size:14px;border-left:4px solid var(--amber)}
.conflito{margin:0 0 16px;padding:12px 14px;border-radius:6px;background:var(--bad-soft);border:1px solid var(--bad);font-size:14px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--amber-soft);color:var(--amber)}
.p-azul{background:var(--prog-soft);color:var(--prog)} .p-cinza{background:var(--idle-soft);color:var(--ink-2)} .p-roxo{background:var(--block-soft);color:var(--block)} .p-aco{background:var(--steel-soft);color:var(--steel)}
.wrap{padding:24px 28px 64px}
footer.doc-foot{margin-top:40px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule);padding-top:10px}
.shell-item{display:flex;align-items:flex-start;gap:22px}
.side-rg{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 8px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow-y:auto}
.side-btn{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--ink-3);font:500 10.5px/1.2 "IBM Plex Sans",sans-serif;text-align:center;cursor:pointer;position:relative}
.side-btn svg{width:20px;height:20px;flex:none}
.side-btn:hover{background:var(--rule-2);color:var(--ink-2)}
.side-btn.ativo{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.side-btn .n{position:absolute;top:3px;right:5px;font-size:10px;font-weight:600;background:var(--amber);color:#fff;border-radius:8px;padding:0 5px}
.side-sep{flex:none;width:70%;height:1px;background:var(--rule);margin:4px 0}
.conteudo-item{flex:1;min-width:0}
section > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
section h2{margin:0;font-size:22px;font-weight:700}
section > header p{margin:0;color:var(--ink-3);font-size:13px}
section > header .direita{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.doc-head{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--steel);border-radius:10px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:14px 28px;margin-bottom:18px}
.doc-head h1{margin:0;font-size:28px;line-height:1.1}
.doc-head .obj{margin:6px 0 0;color:var(--ink-2)}
.stamp{border:2px solid var(--steel);border-radius:8px;padding:10px 14px;min-width:240px;align-self:start}
.stamp .code{font:700 17px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.stamp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.stamp dt{color:var(--ink-3)} .stamp dd{margin:0;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;text-align:left;font:inherit;color:inherit;display:block;width:100%;border-top:4px solid var(--kc,var(--rule))}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--steel)}
.kpi > span{color:var(--ink-3);font-size:13px}
.kpi b{display:block;font:700 28px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))} @media (max-width:1100px){ .kpis5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }
.kpi-destaque{background:var(--bad-soft);border-color:var(--bad);border-top-width:6px} .kpi-destaque b{color:var(--bad);font-size:36px}
.k-bad{--kc:var(--bad)} .k-warn{--kc:var(--amber)} .k-ok{--kc:var(--ok)} .k-azul{--kc:var(--prog)} .k-roxo{--kc:var(--block)} .k-cinza{--kc:var(--idle)}
/* filtros */
.filtros{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.filtros select,.filtros input{padding:6px 8px;font-size:13px}
.filtros .busca{grid-column:span 2}
.filtros-rodape{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px;color:var(--ink-3)}
.chip-f{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;background:var(--steel-soft);color:var(--steel);font-weight:600}
.chip-f button{border:0;background:none;padding:0 4px;color:inherit;font-size:12px}
/* tabela */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;z-index:1;text-align:left;font:600 12.5px/1.3 "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2);background:var(--rule-2);padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.ord{cursor:pointer} th.ord:hover{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr.clic{cursor:pointer} tr.clic:hover td{background:color-mix(in srgb,var(--steel-soft) 45%,var(--sheet))}
tr.sel td{background:color-mix(in srgb,var(--amber-soft) 60%,var(--sheet))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--ink-3)}
td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px;accent-color:var(--steel)}
.mais{display:flex;justify-content:center;margin:10px 0}
.novo{font:700 10px "IBM Plex Sans Condensed",sans-serif;background:var(--prog);color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.trat{display:inline-flex;flex-direction:column;gap:2px;border-left:3px solid var(--sc,var(--steel));padding:1px 0 1px 8px}
.trat b{font-size:12.5px;color:var(--ink)} .trat small{font-size:11.5px;color:var(--ink-3)}
.sel-barra{position:sticky;top:58px;z-index:5;display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:14px}
/* filas por setor */
.setores{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0 0 14px}
.setor-card{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--sc);border-radius:10px;padding:10px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
.setor-card:hover{border-color:var(--sc)} .setor-card.ativo{background:color-mix(in srgb,var(--sc) 10%,var(--sheet));box-shadow:inset 0 0 0 1px var(--sc)}
.setor-card h4{margin:0;font-size:16px;color:var(--ink)} .setor-card b{display:block;font:700 26px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.setor-card small{display:block;color:var(--ink-3);font-size:12px}
/* detalhe do pedido */
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:24px 28px;max-width:min(1320px,96vw);width:96vw;max-height:94vh;overflow:auto}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h3{margin:0 0 4px;font-size:24px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-24px;background:var(--sheet);padding:12px 0 4px;border-top:1px solid var(--rule-2)}
.det-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.info div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13.5px}
.info div small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.trat-box{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.hist{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--rule);font-size:13px}
.hist li{position:relative;padding:4px 0 8px 14px}
.hist li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--sc,var(--steel))}
.hist li small{display:block;color:var(--ink-3)}
/* importar */
.drop{border:2px dashed var(--rule);border-radius:12px;padding:30px;text-align:center;background:var(--sheet);cursor:pointer;color:var(--ink-2)}
.drop.sobre{border-color:var(--steel);background:var(--steel-soft)}
.arq{display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
/* barras e gráfico */
.barras{display:flex;flex-direction:column;gap:6px}
.barra-l{display:grid;grid-template-columns:minmax(120px,240px) 1fr 96px;gap:10px;align-items:center;font-size:13.5px}
.barra-l .tr{height:12px;background:var(--rule-2);border-radius:6px;overflow:hidden}
.barra-l .tr i{display:block;height:100%;background:var(--bc,var(--steel));border-radius:6px}
.barra-l b{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.graf svg{width:100%;height:auto;display:block;max-height:260px}
.est-item .pp-tit{display:none}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legenda i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{background:var(--ink);color:var(--sheet);border-radius:10px;padding:12px 14px;font-size:14px;box-shadow:0 10px 26px rgba(10,15,25,.3)}
.ver-dia{display:flex;gap:10px;align-items:center;background:var(--block-soft);color:var(--ink);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:14px}
/* [v4.3] painel do pedido na própria linha (sem popup) */
tr.exp > td{background:color-mix(in srgb,var(--steel-soft) 35%,var(--paper));padding:14px 16px;border-bottom:2px solid var(--steel)}
.pp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.pp-tit{font-size:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pp-trat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
/* [v4.4] motivos: cada classificação é um bloco com destaque; marque um ou mais motivos */
.pp.pp-tri{grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr)}
.grupos-mot{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0 0}
.grupo-mot{border:1px solid color-mix(in srgb,var(--sc) 35%,var(--rule));border-radius:9px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.gm-cab{background:color-mix(in srgb,var(--sc) 14%,var(--sheet));border-bottom:1px solid color-mix(in srgb,var(--sc) 30%,var(--rule));padding:6px 10px;display:flex;flex-direction:column}
.gm-cab b{font:700 14px "IBM Plex Sans Condensed",sans-serif;color:var(--sc);text-transform:uppercase;letter-spacing:.03em}
.gm-cab span{font-size:11.5px;color:var(--ink-2);font-weight:600}
.chip-m{display:flex;align-items:flex-start;gap:8px;text-align:left;border:0;border-top:1px solid var(--rule-2);border-radius:0;background:none;padding:7px 10px;font-size:13px;line-height:1.3;width:100%;color:var(--ink)}
.chip-m:first-of-type{border-top:0}
.chip-m i{flex:none;width:15px;height:15px;border:2px solid var(--sc);border-radius:4px;margin-top:1px;background:var(--sheet)}
.chip-m small{display:block;font-size:11px;color:var(--sc);font-weight:600}
.chip-m:hover{background:color-mix(in srgb,var(--sc) 8%,var(--sheet))}
.chip-m.marcado{background:color-mix(in srgb,var(--sc) 16%,var(--sheet));font-weight:600}
.chip-m.marcado i{background:var(--sc);box-shadow:inset 0 0 0 2px var(--sheet)}
.pp-conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;position:sticky;bottom:0;background:var(--sheet);padding-top:8px;border-top:1px solid var(--rule-2)}
.pp-conf input{flex:1 1 240px;width:auto}
.trava{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--block-soft);border-left:4px solid var(--block);font-size:14px}
.est-item.travado .est-linha{opacity:.6}
.cod-cli{font:600 14px "IBM Plex Sans",sans-serif;color:var(--steel);background:var(--steel-soft);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
/* triagem: esteira */
.tri-prog{background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--prog);border-radius:10px;padding:12px 16px;margin:0 0 12px;font-size:15px}
.tri-prog b{font:700 26px "IBM Plex Sans Condensed",sans-serif;color:var(--prog)}
.tri-prog .track{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:8px}.tri-prog .track i{display:block;height:100%;background:var(--ok)}
.etapas-tri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.etapa-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--ec);border-radius:10px;padding:10px 14px;font:inherit;color:inherit}
.etapa-b span{font:700 14px "IBM Plex Sans Condensed",sans-serif;color:var(--ec);text-transform:uppercase;letter-spacing:.03em}
.etapa-b b{font:700 28px/1.1 "IBM Plex Sans Condensed",sans-serif}
.etapa-b small{font-size:12px;color:var(--ink-3)}
.etapa-b:hover{border-color:var(--ec)} .etapa-b.ativo{background:color-mix(in srgb,var(--ec) 10%,var(--sheet));box-shadow:inset 0 0 0 2px var(--ec)}
.et-atrasado{--ec:var(--bad)} .et-alerta{--ec:var(--amber)} .et-projecao{--ec:var(--prog)} .et-semdata{--ec:var(--idle)} .et-todos{--ec:var(--steel)}
@media (max-width:860px){ .etapas-tri{grid-template-columns:1fr 1fr} }
.esteira{display:flex;flex-direction:column;gap:6px}
.est-item{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;transition:opacity .3s,transform .3s,max-height .3s}
.est-item.aberto{border-color:var(--steel);box-shadow:0 4px 16px rgba(20,30,50,.08)}
.est-item.saindo{opacity:0;transform:translateY(-14px)}
.est-linha{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto auto 110px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.est-linha:hover{background:var(--rule-2)}
.est-item.aberto .est-linha{background:var(--steel-soft)}
.est-ped b{display:block} .est-ped small,.est-cli small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-cli{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-v{text-align:right;font-variant-numeric:tabular-nums}
.est-item > .pp{padding:14px 16px;border-top:1px solid var(--rule)}

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// CARTEIRA DE ENCOMENDAS  [v4.0] · [v4.7] encerramento indevido (resolvido que voltou bloqueado)
// Todo dia: importar as duas planilhas do BI (itens e pedidos) → unir por
// LOJA + PEDIDO → gravar a "foto do dia" (compactada). O histórico é a
// sequência de fotos. Cada pedido pode receber uma TRATATIVA: motivo →
// setor responsável (Compras, CX, Logística…), com histórico de passagens.
// O servidor não conhece os campos: campo novo = só mexer AQUI.
// ═══════════════════════════════════════════════════════════════════
const API="/api/carteira";
const $=(s,r=document)=>r.querySelector(s);
function el(t,c){ const e=document.createElement(t); if(c) e.className=c; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tx(v){ return String(v==null?"":v).trim(); }
const nrm=s=>tx(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
// [v4.18] HORÁRIO DE BRASÍLIA: "hoje" e o dia de cada registro sempre no fuso de São Paulo (o computador pode estar em outro)
const TZ_BR="America/Sao_Paulo";
function hojeISO(){ return new Date().toLocaleDateString("sv-SE",{timeZone:TZ_BR}); }
function diaBR(v){ if(!v) return ""; const t=String(v); if(/T/.test(t)&&/(Z|[+-]\d\d:?\d\d)$/.test(t)){ const d=new Date(t); if(!isNaN(d)) return d.toLocaleDateString("sv-SE",{timeZone:TZ_BR}); } return t.slice(0,10); }
function dataBR(i){ if(!i) return "—"; const [a,m,d]=diaBR(i).split("-"); return d?`${d}/${m}/${a}`:i; }
function dataHoraBR(v){ if(!v) return "—"; const d=new Date(v); return isNaN(d)?v:d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short",timeZone:TZ_BR}); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function numBR(s){ s=tx(s); if(!s) return 0; const n=parseFloat(s.replace(/\./g,"").replace(",",".")); return isNaN(n)?0:n; }
function moeda(v){ return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
function int(v){ return (v||0).toLocaleString("pt-BR"); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function baixarBlob(b,nome){ const u=URL.createObjectURL(b),a=document.createElement("a"); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function toast(t){ const e=el("div","toast"); e.innerHTML=t; $("#toasts").appendChild(e); setTimeout(()=>e.remove(),7000); }
// "24/01/25" → "2025-01-24" (século: 00–69 → 20xx)
function dataBI(s){ const m=tx(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return ""; let a=Number(m[3]); if(a<100) a+=a<70?2000:1900; return `${a}-${pad(m[2])}-${pad(m[1])}`; }

// ═══ leitura das planilhas do BI (são tabelas HTML com extensão .xls) ═══
// O BI às vezes exporta com codificação MISTURADA (cabeçalho em UTF-8 e dados em Windows-1252).
// Decodifica byte a byte: sequência UTF-8 válida vira UTF-8; byte solto vira Windows-1252.
async function lerTexto(file){
  const u=new Uint8Array(await file.arrayBuffer());
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u).replace(/^﻿/,""); }catch(_){}
  const utf8=new TextDecoder("utf-8"), w1252=new TextDecoder("windows-1252"), partes=[]; let i=0, ini=0;
  const corte=()=>{ if(i>ini) partes.push(utf8.decode(u.subarray(ini,i))); };
  while(i<u.length){ const b=u[i];
    if(b<0x80){ i++; continue; }
    const n=(b&0xE0)===0xC0?2:(b&0xF0)===0xE0?3:(b&0xF8)===0xF0?4:0;
    let ok=n>0&&i+n<=u.length; for(let k=1;ok&&k<n;k++) if((u[i+k]&0xC0)!==0x80) ok=false;
    if(ok){ i+=n; continue; }
    corte(); partes.push(w1252.decode(u.subarray(i,i+1))); i++; ini=i; }
  corte(); return partes.join("").replace(/^﻿/,"");
}
function tabelaDoHTML(texto){
  const doc=new DOMParser().parseFromString(texto,"text/html");
  // [v4.2] arquivo aberto e salvo no Excel como "página da web": é só a capa, os dados ficam na pasta "..._arquivos"
  if(doc.querySelector("frameset, frame")||/Excel Workbook Frameset/i.test(texto))
    throw new Error("este arquivo foi aberto e salvo no Excel e ficou só com a “capa” — os dados não estão dentro dele. Baixe a planilha de novo do BI e arraste aqui direto, sem abrir no Excel.");
  const tbs=[...doc.querySelectorAll("table")].filter(t=>t.rows.length>1);
  if(!tbs.length) throw new Error("não encontrei a tabela de dados no arquivo. Use a planilha exatamente como sai do BI (.xls), sem abrir nem salvar no Excel.");
  const t=tbs.sort((a,b)=>b.rows.length-a.rows.length)[0], linhas=[...t.rows].map(r=>[...r.cells].map(c=>tx(c.textContent)));
  const cab=linhas[0].map(h=>h.replace(/\s+/g," "));
  const dados=linhas.slice(1).filter(l=>l.some(Boolean)&&l.length>=cab.length-2).map(l=>Object.fromEntries(cab.map((h,i)=>[h,l[i]??""])));
  // linhas de total do BI (TOTAL / BLOQUEADOS / LIBERADOS…): servem para conferir a importação
  dados.totais={}; linhas.slice(1).filter(l=>l.length<cab.length-2&&/^[A-ZÇÃÕ ]+$/.test(l[0]||"")).forEach(l=>{ dados.totais[l[0]]=numBR(l[1]); });
  return dados;
}
function tipoDaPlanilha(linhas){
  const c=Object.keys(linhas[0]||{}).map(nrm);
  if(c.includes("produto")&&c.includes("item")) return "itens";
  if(c.includes("itens pv")||c.includes("agenda")||c.includes("cep")) return "pedidos";
  return null;
}
const campo=(o,...nomes)=>{ for(const n of nomes){ const k=Object.keys(o).find(x=>nrm(x)===nrm(n)); if(k!=null) return tx(o[k]); } return ""; };

// une as duas planilhas: chave = loja + pedido (a loja do arquivo de itens vem em "Filial Origem": "03 - MOEMA")
// [v4.18] as duas planilhas são unidas pelo NÚMERO DO PEDIDO (nunca se repete) — a loja não precisa bater.

    const nk=numChave(ped); if(porNum.has(nk)){ conflitos.push(k); P.delete(porNum.get(nk)); }
    porNum.set(nk,k); P.set(k,{k,p:ped,l:loja,ln:campo(r,"Nome"),c:campo(r,"Codigo"),n:campo(r,"Cliente"),em:dataBI(campo(r,"Emissao","Emissão")),en:dataBI(campo(r,"Entrega")),
      st:campo(r,"Status"),tp:campo(r,"Tipo Pedido"),sp:"",ag:campo(r,"Agenda"),ci:campo(r,"Cidade"),ba:campo(r,"Bairro"),cep:campo(r,"CEP"),
      t:[campo(r,"Tel"),campo(r,"Tel2"),campo(r,"Tel3")],ob:campo(r,"Observações","Observacoes"),de:campo(r,"Desp. Aces."),
      cu:numBR(campo(r,"Cubagem")),v:numBR(campo(r,"Valor")),ipv:Number(campo(r,"Itens PV"))||0,qpv:Number(campo(r,"Qtd PV"))||0,qb:numBR(campo(r,"Qtd Bloq")),fo:"pedidos",it:[]}); });
  itens.forEach(r=>{ const ped=campo(r,"Pedido"); if(!ped) return; const fo=campo(r,"Filial Origem"), loja=fo.split(" - ")[0].trim(), k=`${loja}-${ped}`;
    let x=P.get(porNum.get(numChave(ped))||k);
    if(!x){ x={k,p:ped,l:loja,ln:(fo.split(" - ")[1]||"").trim(),c:campo(r,"Codigo"),n:campo(r,"Cliente"),em:dataBI(campo(r,"Emissão","Emissao")),en:dataBI(campo(r,"Entrega")),
      st:"",tp:campo(r,"Tipo Pedido"),sp:"",ag:"",ci:"",ba:"",cep:"",t:[],ob:"",de:"",cu:0,v:0,ipv:0,qpv:0,qb:null,fo:"itens",it:[]}; P.set(k,x); porNum.set(numChave(ped),k); }
    else if(x.fo==="pedidos") x.fo="ambas";

let CFG_DADOS={ano_ficticio:2030,dias_alerta:4,dias_aviso:13,pedido_minimo:10000,dias_carteira:30};
function prazo(p){
  if(!p.en) return {cls:"semdata",rot:"Sem data",pill:"p-cinza"};
  if(Number(p.en.slice(0,4))>=Number(CFG_DADOS.ano_ficticio||2030)) return {cls:"semdata",rot:"Sem data",pill:"p-cinza",obs:"data fictícia"};
  const n=diasEntre(hojeISO(),p.en), lim=Number(CFG_DADOS.dias_alerta||4);
  if(n<0) return {cls:"atrasado",rot:`Venceu há ${-n} d`,pill:"p-bad",n};
  if(n<=lim) return {cls:"atrasado",rot:n===0?"Vence hoje":`Vence em ${n} d`,pill:"p-bad",n};
  // [v4.12] ALERTA: passou do limite do atraso (logística D+4) mas entrega em até "dias_aviso" dias (padrão 13)
  if(n<=Number(CFG_DADOS.dias_aviso||13)) return {cls:"alerta",rot:`Alerta · ${n} d`,pill:"p-warn",n};
  return {cls:"emdia",rot:`Em dia · ${n} d`,pill:"p-ok",n};
}
// [v4.3] FONTE DA VERDADE do bloqueio: coluna L "Qtd Bloq" da planilha de pedidos (1 = bloqueado),
// mesmo quando o Status (coluna J) diz LIBERADO. Só sem a planilha de pedidos cai na regra antiga (itens).
function temQtdBloq(p){ return p.fo!=="itens"&&p.qb!=null; }
// [v4.18] REGRA ÚNICA DO BLOQUEIO
//   • tem bloqueio  = Qtd Bloq = 1 (coluna L da planilha de pedidos) — vale mais que o status das linhas de itens
//     (um pedido tem várias linhas: a planilha marca umas como liberadas e o bloqueio está em outra)
//   • BLOQUEADO     = tem bloqueio E entrega em até 30 dias (ou vencida)
//   • CARTEIRA      = tem bloqueio E entrega ACIMA de 30 dias (ou sem data) — não entra em bloqueados, triagem, CX nem Compras.
//     Ex.: hoje 19/10/2026 → entrega 18/11/2026 = BLOQUEADO · 19/11/2026 = CARTEIRA. Quando a data entrar na janela, o fluxo recomeça.
function temBloqueio(p){ return temQtdBloq(p)?Number(p.qb)>0:(nrm(p.st)==="bloqueado"||nrm(p.sp).includes("bloque")||p.it.some(i=>nrm(i[IT.st])==="bloqueado")); }
function naJanela(p){ const pz=prazo(p); return pz.cls!=="semdata"&&pz.n!=null&&pz.n<=Number(CFG_DADOS.dias_carteira??30); }
function bloqueado(p){ return temBloqueio(p)&&naJanela(p); }
function emCarteira(p){ return temBloqueio(p)&&!naJanela(p); }
function statusReal(p){ return bloqueado(p)?"BLOQUEADO":emCarteira(p)?"CARTEIRA":(p.st||"—"); }
function corrigidoPelaQtdBloq(p){ return temQtdBloq(p)&&Number(p.qb)>0&&nrm(p.st)!=="bloqueado"; }
// situação do pedido (coluna Q "Status Pedido"), ajustada pela Qtd Bloq
const SIT_CARTEIRA="EM CARTEIRA (entrega acima de 30 dias)";
const SITUACOES=[["BLOQUEADO POR ESTOQUE","#B83232","⛔"],[SIT_CARTEIRA,"#2E4A7A","📁"],["SEM AGENDAMENTO","#C98A0B","📅"],["AGENDADO","#2F7D4F","✅"]];
function situacao(p){
  if(!p||!p.k) return "";
  const sp=tx(p.sp).toUpperCase();
  if(bloqueado(p)) return sp.includes("GERENTE")?"BLOQUEADO PELO GERENTE":"BLOQUEADO POR ESTOQUE";
  if(emCarteira(p)) return SIT_CARTEIRA;
  if(sp&&!sp.includes("BLOQUE")) return sp;
  return sp?"SEM AGENDAMENTO":"SEM STATUS (fora da planilha de itens)";
}
function corSituacao(s){ const x=SITUACOES.find(z=>z[0]===s); return x?x[1]:"#8A93A3"; }
function qtdTotal(p){ return p.it.reduce((a,i)=>a+(i[IT.qtd]||0),0)||p.qpv||0; }
function resumoDaFoto(peds){
  const r={pedidos:peds.length,itens:0,unidades:0,valor:0,bloqueados:0,atrasados:0,bloq_atrasados:0,sem_data:0,por_situacao:{},corrigidos_qtd_bloq:0};
  peds.forEach(p=>{ r.itens+=p.it.length; r.unidades+=qtdTotal(p); r.valor+=p.v||0; const b=bloqueado(p), pz=prazo(p).cls, si=situacao(p);
    r.por_situacao[si]=(r.por_situacao[si]||0)+1; if(corrigidoPelaQtdBloq(p)) r.corrigidos_qtd_bloq++;
    if(b) r.bloqueados++; if(pz==="atrasado"){ r.atrasados++; if(b) r.bloq_atrasados++; } if(pz==="semdata") r.sem_data++; });
  return r;
}

// ═══ compactação da foto (gzip → base64, em partes de até 800 mil caracteres) ═══
async function compactar(obj){
  const json=JSON.stringify(obj);
  let b64, formato="gzip";
  if("CompressionStream" in window){
    const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); b64=btoa(s);
  } else { b64=btoa(unescape(encodeURIComponent(json))); formato="json"; }
  const partes=[]; for(let i=0;i<b64.length;i+=200000) partes.push(b64.slice(i,i+200000));   // pedaços pequenos: passam por proxy/antivírus da rede
  return {partes,formato};
}
async function descompactar(partes,formato){
  const b64=partes.join(""), bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  if(formato==="json") return JSON.parse(decodeURIComponent(escape(bin)));
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}

// envia a foto em pedaços (com nova tentativa em cada um) e só no fim "fecha" o dia
async function enviarFoto(data, meta, partes, aoProgredir){
  const envio=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toLowerCase();
  for(let i=0;i<partes.length;i++){
    for(let tent=1;;tent++){
      aoProgredir(`Enviando parte ${i+1} de ${partes.length}${tent>1?` (tentativa ${tent})`:""}…`);
      try{ await api(`${API}/dias/${data}/partes/${i}`,{method:"POST",body:JSON.stringify({envio,conteudo:partes[i]})}); break; }
      catch(e){ if(e.message==="sessão expirada"||tent>=3) throw new Error(e instanceof TypeError||/fetch|network/i.test(e.message)?`a conexão caiu ao enviar a parte ${i+1} de ${partes.length}. Verifique a internet e clique em Gravar de novo — nada foi alterado na carteira.`:e.message);
        await new Promise(r=>setTimeout(r,1500*tent)); }
    }
  }
  aoProgredir("Fechando a carteira do dia…");
  for(let tent=1;;tent++){
    try{ return (await api(`${API}/dias/${data}`,{method:"POST",body:JSON.stringify({meta,envio,n:partes.length})})).j; }
    catch(e){ if(tent>=3) throw new Error(e instanceof TypeError||/fetch|network/i.test(e.message)?"a conexão caiu ao fechar a carteira. Clique em Gravar de novo.":e.message); await new Promise(r=>setTimeout(r,1500*tent)); }
  }
}

  f.meta=j.meta; return f;
}

function graficoLinhas(series, rotulos){

          <td>${esc(p.n||"—")}<span class="sub">${esc(p.c)}${p.ci?" · "+esc(p.ci):""}</span></td><td>${esc(p.l)}<span class="sub">${esc(p.ln)}</span></td>
          <td>${p.en&&pz.cls!=="semdata"?dataBR(p.en):"—"}<span class="sub"><span class="pill ${pz.pill}">${pz.rot}</span></span></td>
          <td>${b?'<span class="pill p-warn">⛔ Bloqueado</span>':emCarteira(p)?'<span class="pill p-azul" title="Qtd Bloq 1 com entrega acima de 30 dias">📁 Carteira</span>':esc(p.st||"—")}<span class="sub">${corrigidoPelaQtdBloq(p)?`<span title="Status na planilha: ${esc(p.st)} — a Qtd Bloq = 1 manda">Qtd Bloq 1 · J: ${esc(p.st)}</span>`:esc(situacao(p))}</span></td><td>${esc(p.tp)}<span class="sub">${p.ag&&p.ag!=="NAO"?"agenda: "+esc(p.ag):""}</span></td>
          <td class="num">${p.it.length||p.ipv} it · ${int(qtdTotal(p))} un${nb?`<span class="sub" style="color:var(--amber)">${nb} bloq.</span>`:""}</td><td class="num">${moeda(p.v)}</td><td>${celTrat(p)}</td></tr>
          ${estC.aberto===p.k?`<tr class="exp"><td colspan="10"><div data-pp="${esc(p.k)}"></div></td></tr>`:""}`; }).join("")||`<tr><td colspan="10" class="muted" style="text-align:center;padding:24px">Nenhum pedido com esses filtros.</td></tr>`}</tbody></table></div>
      ${lst.length>vis.length?`<div class="mais"><button type="button" id="ctMais">Mostrar mais ${int(Math.min(300,lst.length-vis.length))}</button></div>`:""}`;

    $("#ctT").querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("input")) return; estC.aberto=estC.aberto===tr.dataset.k?"":tr.dataset.k; desenhar(); });
    const pp=$("#ctT [data-pp]"); if(pp){ const p=FOTO.pedidos.find(x=>x.k===pp.dataset.pp); montarPainelPedido(pp,p,"normal",()=>{ desenhar(); atualizarMenu(); }); }
    $("#ctT").querySelectorAll("[data-sel]").forEach(cb=>cb.onchange=()=>{ cb.checked?estC.sel.add(cb.dataset.sel):estC.sel.delete(cb.dataset.sel); desenhar(); });
    const td=$("#ctTodos"); if(td) td.onchange=()=>{ vis.forEach(p=>td.checked?estC.sel.add(p.k):estC.sel.delete(p.k)); desenhar(); };
    const mm=$("#ctMais"); if(mm) mm.onclick=()=>{ estC.limite+=300; desenhar(); };
    c._lista=lst;
  };
  $("#ctF",c).appendChild(painelFiltros(()=>{ estC.limite=150; render(); }));
  desenhar();
  $("#ctXls",c).onclick=()=>exportarCarteira(c._lista||[]);
}

// ITENS — quantidade de cada produto (respeita os filtros)

function renderItens(c){
  c.innerHTML=`<section><header><h2>Itens</h2><p>Quanto de cada produto está na carteira — com os mesmos filtros da Carteira. Clique num produto para ver os pedidos.</p>
      <span class="direita"><button type="button" class="peq" id="itXls">⬇️ Excel (resumo por produto)</button><button type="button" class="peq" id="itRel">⬇️ Relatório completo (com os filtros)</button></span></header><div id="itF"></div><div id="itT"></div></section>`;
  $("#itF",c).appendChild(painelFiltros(()=>render()));
  const ag=new Map();
  FOTO.pedidos.filter(p=>passa(p,true)).forEach(p=>{ const pz=prazo(p).cls; p.it.filter(itemPassa).forEach(i=>{ const k=i[IT.prod];
    const x=ag.get(k)||{prod:k,desc:i[IT.desc],grupo:i[IT.grupo],locais:new Set(),qtd:0,bloq:0,ped:new Set(),atr:new Set(),valor:0};
    x.qtd+=i[IT.qtd]||0; if(nrm(i[IT.st])==="bloqueado") x.bloq+=i[IT.qtd]||0; x.ped.add(p.k); if(pz==="atrasado") x.atr.add(p.k); x.valor+=i[IT.total]||0; x.locais.add(i[IT.local]); ag.set(k,x); }); });
  const lst=[...ag.values()].sort((a,b)=>b.qtd-a.qtd);
  $("#itT",c).innerHTML=`<p class="cap" style="margin:0 0 6px"><b>${int(lst.length)}</b> produto(s) · ${int(lst.reduce((a,x)=>a+x.qtd,0))} unidade(s) · ${int(lst.reduce((a,x)=>a+x.bloq,0))} bloqueada(s)</p>
    <div class="tbl-wrap"><table><thead><tr><th>Produto</th><th>Descrição</th><th>Grupo</th><th>Local</th><th class="num">Qtd</th><th class="num">Bloqueada</th><th class="num">Pedidos</th><th class="num">Pedidos atrasados</th><th class="num">Valor</th></tr></thead><tbody>${
    lst.map(x=>`<tr class="clic" data-p="${esc(x.prod)}"><td><b>${esc(x.prod)}</b></td><td>${esc(x.desc)}</td><td>${esc(x.grupo)}</td><td>${esc([...x.locais].join(", "))}</td>
      <td class="num"><b>${int(x.qtd)}</b></td><td class="num">${x.bloq?`<span class="pill p-warn">${int(x.bloq)}</span>`:"—"}</td><td class="num">${int(x.ped.size)}</td><td class="num">${x.atr.size?`<span class="pill p-bad">${int(x.atr.size)}</span>`:"—"}</td><td class="num">${moeda(x.valor)}</td></tr>`).join("")||'<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">Nenhum item com esses filtros.</td></tr>'}</tbody></table></div>`;
  turbinarTabela($("#itT table",c),"itens",true);
  $("#itT",c).querySelectorAll("tr[data-p]").forEach(tr=>tr.onclick=()=>{ F.produto=tr.dataset.p; ir("carteira"); });
  $("#itRel",c).onclick=()=>exportarRelatorio("relatorio_itens",FOTO.pedidos.filter(p=>passa(p)));
  $("#itXls",c).onclick=()=>exportarXlsx("itens_carteira",[{nome:"Itens",cols:[["Produto",x=>x.prod],["Descrição",x=>x.desc],["Grupo",x=>x.grupo],["Local",x=>[...x.locais].join(", ")],["Qtd",x=>x.qtd],["Qtd bloqueada",x=>x.bloq],["Pedidos",x=>x.ped.size],["Pedidos atrasados",x=>x.atr.size],["Valor",x=>x.valor]],linhas:lst}]);
}

// PAINEL DO PEDIDO — abre NA PRÓPRIA LINHA (sem popup): dados, itens,
// motivos em lista para clicar, histórico da tratativa.
// ═══════════════════════════════════════════════════════════════════
function opcoesMotivo(atual){
  const classes=[...new Set(cfg().motivos.filter(m=>m.ativo!==false).map(m=>m.classe))];
  return `<option value="">— escolha o motivo —</option>`+classes.map(cl=>`<optgroup label="${esc(cl)}">${cfg().motivos.filter(m=>m.ativo!==false&&m.classe===cl).map(m=>`<option value="${m.id}"${m.id===atual?" selected":""}>${esc(m.motivo)} → ${esc(setorPor(m.setor).nome)}</option>`).join("")}</optgroup>`).join("");
}
function textoHist(h){ const nomes=a=>(a||[]).map(x=>setorPor(x).nome).join(" + "), para=nomes(h.setores||(h.setor?[h.setor]:[])), de=nomes(h.de_setores||(h.de_setor?[h.de_setor]:[]));
  return h.acao==="classificar"?(de&&de!==para?`Tocou de <b>${esc(de)}</b> para <b>${esc(para)}</b>`:`Classificou → <b>${esc(para)}</b>`)+` · ${esc(h.classe||"")} — ${esc(h.motivo||"")}`
    :h.acao==="retirada"?"↪ Peça retirada para liberar outro pedido — aguardando reposição":h.acao==="repor"?"↩ Reposição encerrada":h.acao==="recebeu"?"↪ Recebeu peça de outro pedido"
    :h.acao==="indevido"?`⚠ Voltou bloqueado na planilha — <b>resolvido indevidamente por ${esc(h.indevido_por||"—")}</b>${h.tipo_enc?` (${esc(ROT_TIPO_ENC[h.tipo_enc]||h.tipo_enc)})`:""}`
    :h.acao==="ok"?`✓ ${ROT_CORRECAO}`:h.acao==="resolver"?"✓ Resolveu":h.acao==="reabrir"?"↺ Reabriu":h.acao==="auto"?"⚙ Atualizado pela planilha — encerrado":h.acao==="janela"?"📁 Foi para CARTEIRA (entrega acima de 30 dias)":h.acao==="retorno"?"↺ Voltou para a janela de 30 dias — nova triagem":h.acao==="status"?"⚙ Status do pedido mudou na planilha":"Nota"; }
// [v4.9] Pendências por setor: no card do pedido, só os itens BLOQUEADOS (Status · Produto · Descrição)
// e só a ÚLTIMA classificação (o histórico completo fica num "ver tudo" recolhido)
function itensBloqueados(p){ return (p.it||[]).filter(i=>nrm(i[IT.st])==="bloqueado"); }
// [v4.18] Qtd Bloq = 1 é a verdade: se nenhuma linha veio "BLOQUEADO" na planilha de itens, considera todas as linhas do pedido
function itensDoBloqueio(p){ const b=itensBloqueados(p); return b.length?b:(temBloqueio(p)?(p.it||[]):[]); }
// [v4.9] coluna da lista em Pendências por setor: só os itens BLOQUEADOS do pedido
function celBloqueados(p){
  if(p.fora) return '<span class="muted">fora da carteira atual</span>';
  if(!p.it.length) return '<span class="muted">fora da planilha de itens</span>';
  const bl=itensDoBloqueio(p);
  if(!bl.length) return '<span class="muted">nenhum item bloqueado</span>';
  return bl.map(i=>`<div style="display:flex;gap:6px;align-items:baseline;margin:1px 0"><span class="pill p-warn">Bloqueado</span><span><b>${esc(i[IT.prod])}</b> · ${esc(i[IT.desc])}</span></div>`).join("");
}
function tabelaBloqueados(p){
  if(!p.it.length) return `<p class="cap" style="margin:8px 0 0">${p.fora?"Este pedido não está na carteira atual.":"Fora da planilha de itens — sem detalhe dos produtos."}</p>`;
  const bl=p.it.filter(i=>nrm(i[IT.st])==="bloqueado");
  if(!bl.length) return '<p class="cap" style="margin:8px 0 0">✓ Nenhum item bloqueado na planilha de itens.</p>';
  return `<div class="tbl-wrap" style="max-height:220px;margin-top:8px"><table><thead><tr><th>Status</th><th>Produto</th><th>Descrição</th></tr></thead><tbody>${
    bl.map(i=>`<tr><td><span class="pill p-warn">Bloqueado</span></td><td>${esc(i[IT.prod])}</td><td>${esc(i[IT.desc])}</td></tr>`).join("")}</tbody></table></div>
    <p class="cap" style="margin:4px 0 0">${bl.length} item(ns) bloqueado(s)${p.it.length>bl.length?` · ${p.it.length-bl.length} liberado(s) não exibido(s)`:""}</p>`;
}
function liHist(h){ return `<li style="--sc:${h.acao==="indevido"?"var(--bad)":(h.setores&&h.setores[0])||h.setor?setorPor((h.setores&&h.setores[0])||h.setor).cor:"var(--idle)"}">${textoHist(h)}${h.nota?`<br>“${esc(h.nota)}”`:""}<small>${dataHoraBR(h.em)} · ${esc(h.por||"—")}</small></li>`; }
function ultimaClassificacao(d){
  const hs=d.historico||[], ult=[...hs].reverse().find(h=>h.acao==="classificar");
  if(!ult) return hs.length?`<ul class="hist">${liHist(hs[hs.length-1])}</ul>`:"";
  return `<ul class="hist">${liHist(ult)}</ul>${hs.length>1?`<details style="margin-top:4px;font-size:13px"><summary class="muted" style="cursor:pointer">ver histórico completo (${hs.length})</summary><ul class="hist">${hs.slice().reverse().map(liHist).join("")}</ul></details>`:""}`;
}
function montarPainelPedido(box,p,modo,aoFim){
  const t=tratDe(p.k), d=t&&t.dados, pz=prazo(p), ativos=cfg().motivos.filter(m=>m.ativo!==false), aberta_=d&&d.status==="aberta", indev_=pendenteIndevido(t)||(d&&["reposicao","retorno"].includes(d.status)), ui=pendenteIndevido(t)?ultIndevido(t):null;
  const classes=[...new Set(ativos.map(m=>m.classe))], outro=reservaDeOutro(p.k);
  const marcados=new Set(aberta_?motivosDe(t).map(m=>m.id):[]);
  box.className="pp"+(modo==="triagem"?" pp-tri":"");
  box.innerHTML=`<div class="pp-info">
      <div class="pp-tit"><b>Pedido ${esc(p.p)}</b> · loja ${esc(p.l)} ${esc(p.ln)} · <b>${esc(p.n||"—")}</b> <span class="pill p-aco" style="font-size:14px">cód. ${esc(p.c||"—")}</span>
        <span class="pill ${pz.pill}">${pz.rot}</span> <span class="pill" style="background:color-mix(in srgb,${corSituacao(situacao(p))} 14%,transparent);color:${corSituacao(situacao(p))}">${esc(situacao(p))}</span></div>
      ${corrigidoPelaQtdBloq(p)?`<p class="cap" style="margin:4px 0 0">⛔ Bloqueado pela <b>Qtd Bloq = 1</b> (coluna L) — o Status na planilha diz “${esc(p.st)}”.</p>`:""}
      <div class="info" style="margin-top:8px">
        <div><small>Código do cliente</small><b>${esc(p.c||"—")}</b></div><div><small>Entrega</small>${p.en?dataBR(p.en):"—"}</div><div><small>Emissão</small>${p.em?dataBR(p.em):"—"}</div><div><small>Tipo</small>${esc(p.tp||"—")}</div><div><small>Agenda</small>${esc(p.ag||"—")}</div>
        <div><small>Cidade / bairro</small>${esc([p.ci,p.ba].filter(Boolean).join(" · ")||"—")}</div><div><small>Telefones</small>${tels(p).length?tels(p).map(x=>`<a href="tel:${esc(x)}">${esc(x)}</a>`).join(" · "):"—"}</div>
        <div><small>Valor</small>${moeda(p.v)}</div><div><small>Qtd Bloq</small>${temQtdBloq(p)?esc(p.qb):"—"}</div>${p.ob?`<div style="grid-column:1/-1"><small>Observações</small>${esc(p.ob)}</div>`:""}</div>
      ${p.it.length?`<div class="tbl-wrap" style="max-height:220px;margin-top:8px"><table><thead><tr><th>Status</th><th>Produto</th><th>Descrição</th><th>Grupo</th><th>Local</th><th class="num">Qtd</th></tr></thead><tbody>${
        p.it.map(i=>`<tr><td>${nrm(i[IT.st])==="bloqueado"?'<span class="pill p-warn">Bloqueado</span>':esc(i[IT.st])}</td><td>${esc(i[IT.prod])}</td><td>${esc(i[IT.desc])}</td><td>${esc(i[IT.grupo])}</td><td>${esc(i[IT.local])}</td><td class="num">${int(i[IT.qtd])}</td></tr>`).join("")}</tbody></table></div>`
        :`<p class="cap" style="margin:8px 0 0">${p.fora?"Este pedido não está na carteira atual.":`Fora da planilha de itens (${p.ipv} item(ns), ${p.qpv} unidade(s) segundo a planilha de pedidos).`}</p>`}
    </div>
    <div class="pp-trat">
      ${indev_&&ui?`<div class="indev-aviso">⚠ <b>RESOLVIDO INDEVIDAMENTE POR: ${esc(ui.por||"—")}</b><br>Marcou “${esc(ROT_TIPO_ENC[ui.acao]||ui.acao||"—")}” em ${ui.em?dataHoraBR(ui.em):"—"}, mas o pedido voltou <b>bloqueado</b> na planilha de ${ui.foto?dataBR(ui.foto):"—"}. Trate de novo: classifique o motivo ou use “✓ Correção da Pendência”.</div>`
        :indevidosDe(t).length?`<p class="cap" style="margin:0 0 6px;color:var(--bad)">⚠ Este pedido já teve ${indevidosDe(t).length} encerramento(s) indevido(s).</p>`:""}

          :d.status==="ok"?`<p style="margin:0"><span class="pill p-ok">✓ ${ROT_CORRECAO}</span>${notaCorrecao(t)?` “${esc(notaCorrecao(t))}”`:""}</p>`:`<p style="margin:0"><span class="pill p-ok">✓ Resolvida</span> ${esc(d.classe)} — ${esc(d.motivo)}</p>`)

        <div class="pp-conf"><input data-nota placeholder="Nota (opcional) — o que foi visto, combinado com quem">

      ${modo==="fila"&&d?ultimaClassificacao(d):d&&d.historico&&d.historico.length?`<ul class="hist">${d.historico.slice().reverse().map(h=>`<li style="--sc:${h.acao==="indevido"?"var(--bad)":(h.setores&&h.setores[0])||h.setor?setorPor((h.setores&&h.setores[0])||h.setor).cor:"var(--idle)"}">${textoHist(h)}${h.nota?`<br>“${esc(h.nota)}”`:""}<small>${dataHoraBR(h.em)} · ${esc(h.por||"—")}</small></li>`).join("")}</ul>`:""}
    </div>`;
  const nota=()=>{ const i=box.querySelector("[data-nota]"); return i?i.value:""; }, conf=box.querySelector("[data-conf]");
  const atualizarConf=()=>{ if(!conf) return; const ms=[...marcados].map(motivoPor).filter(Boolean), st=[...new Set(ms.map(m=>setorPor(m.setor).nome))];
    conf.disabled=!ms.length; conf.textContent=ms.length?`${aberta_?"Atualizar":"Classificar"} (${ms.length}) → ${st.join(" + ")}`:"Marque um ou mais motivos"; };
  const agir=async m=>{ const msg=box.querySelector("[data-msg]"); box.querySelectorAll(".pp-trat button").forEach(b=>b.disabled=true);
    try{ await gravarTratativa(p,{...m,nota:nota()}); aoFim(m.acao); }
    catch(e){ msg.className="msg erro"; msg.textContent=e.message; box.querySelectorAll(".pp-trat button").forEach(b=>b.disabled=false); atualizarConf(); } };
  box.querySelectorAll("[data-mot]").forEach(b=>b.onclick=()=>{ const id=b.dataset.mot; marcados.has(id)?marcados.delete(id):marcados.add(id);
    b.classList.toggle("marcado",marcados.has(id)); b.setAttribute("aria-pressed",marcados.has(id)); atualizarConf(); });

    <div class="tbl-wrap arrasta" id="flWrap"><table class="uma-linha"><thead><tr>${COLS_FILA.map(thF).join("")}<th style="width:${LG.acao}px"></th></tr></thead><tbody>${

// [v4.13] SOLUÇÕES — peça que está liberada (separada) num pedido que não vai
// sair agora pode completar outro pedido mais urgente. O sistema só sugere a
// troca quando ela LIBERA O PEDIDO INTEIRO. Quem pode doar:
//   • pedido BLOQUEADO (falta outra peça) com entrega depois da do recebedor
//   • pedido LIBERADO com entrega a mais de 15 dias (ou sem data), mesmo agendado
// Ao registrar "Retirei", a peça entra na REPOSIÇÃO do pedido que doou e a
// próxima planilha encerra sozinha quando o item dele voltar liberado.
// ═══════════════════════════════════════════════════════════════════
// [v4.18] "NÃO EXECUTADO": a sugestão some até a próxima planilha subir (vale para todos — fica gravado no pedido)
function chaveFotoAtual(){ return (FOTO_ATUAL&&((FOTO_ATUAL.foto.meta&&FOTO_ATUAL.foto.meta.importado_em)||FOTO_ATUAL.data))||""; }
function naoExecutado(k){ const d=typeof interDe==="function"?interDe(k):null; return !!(d&&d.sol_nao_exec&&d.sol_nao_exec.foto===chaveFotoAtual()); }
let SOL_VER=0;
const SOL={prod:"",aba:"sugestoes",escopo:"urgentes",busca:"",tipo:"todos",repoSt:"aberta",repoBusca:""};
const DIAS_DOADOR_LIBERADO=15;
const linhaLiberada=i=>nrm(i[IT.st])!=="bloqueado";
function chaveEnt(p){ const pz=prazo(p); return pz.cls==="semdata"||!p.en?"9999-12-31":p.en; }
function todasReposicoes(){ const l=[]; TRAT.forEach(t=>(t.dados.reposicoes||[]).forEach(r=>l.push({t,r}))); return l; }
function reposAbertas(){ return todasReposicoes().filter(x=>x.r.status==="aberta"); }
// retiradas já registradas contra a foto aberta: não sugerir de novo a mesma peça
function retiradasDaFoto(){ const doado=new Map(), servidos=new Set();
  todasReposicoes().forEach(({t,r})=>{ if(r.foto!==FOTO_DATA) return; const k=t.dados.chave+"|"+r.produto; doado.set(k,(doado.get(k)||0)+(Number(r.qtd)||0)); servidos.add(r.para_chave); });
  return {doado,servidos}; }
function montarSolucoes(escopo){
  const P=FOTO.pedidos, {doado,servidos}=retiradasDaFoto();
  const alvo=p=>{ const c=prazo(p).cls; return escopo==="atrasados"?c==="atrasado":escopo==="urgentes"?(c==="atrasado"||c==="alerta"):true; };
  // OFERTA: por pedido + produto, as unidades LIBERADAS que podem sair
  const oferta=new Map();   // produto → [{p,tipo,rem,local,desc}]
  P.forEach(p=>{ const pz=prazo(p), b=bloqueado(p);
    const tipo=b?"bloqueado":(pz.cls==="semdata"||(pz.n!=null&&pz.n>DIAS_DOADOR_LIBERADO))?"liberado":null;
    if(!tipo) return;
    const porProd=new Map();
    p.it.forEach(i=>{ if(!linhaLiberada(i)) return; const k=i[IT.prod]; const x=porProd.get(k)||{q:0,local:i[IT.local],desc:i[IT.desc]}; x.q+=Number(i[IT.qtd])||0; porProd.set(k,x); });
    porProd.forEach((x,prod)=>{ const rem=x.q-(doado.get(p.k+"|"+prod)||0); if(rem<=0) return;
      if(!oferta.has(prod)) oferta.set(prod,[]); oferta.get(prod).push({p,tipo,rem,local:x.local,desc:x.desc}); }); });
  // RECEBEDORES: bloqueados (atrasados primeiro), cada um precisa das linhas bloqueadas
  const receb=P.filter(p=>bloqueado(p)&&alvo(p)&&!servidos.has(p.k)&&!naoExecutado(p.k)&&p.it.some(i=>!linhaLiberada(i)))
    .sort((a,b)=>chaveEnt(a).localeCompare(chaveEnt(b))||((b.v||0)-(a.v||0)));
  const tirado=new Map(), planejados=new Set(), sols=[];
  for(const r of receb){
    const need=new Map(), localPara=new Map();
    r.it.forEach(i=>{ if(linhaLiberada(i)) return; const k=i[IT.prod]; need.set(k,(need.get(k)||0)+(Number(i[IT.qtd])||0)); localPara.set(k,i[IT.local]); });
    tirado.forEach((q,k)=>{ const [pk,prod]=k.split("|"); if(pk===r.k&&q>0){ need.set(prod,(need.get(prod)||0)+q); } });   // se ele já doou nesta rodada, precisa repor
    const moves=[]; let ok=need.size>0;
    for(const [prod,q] of need){
      const cands=(oferta.get(prod)||[]).filter(o=>o.rem>0&&o.p.k!==r.k&&!planejados.has(o.p.k)&&(o.tipo==="liberado"||chaveEnt(o.p)>chaveEnt(r)))
        .sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==="bloqueado"?-1:1)||chaveEnt(b.p).localeCompare(chaveEnt(a.p)));
      let falta=q; const usar=[];
      for(const o of cands){ if(falta<=0) break; const t=Math.min(o.rem,falta); usar.push([o,t]); falta-=t; }
      if(falta>0){ ok=false; break; }
      usar.forEach(([o,t])=>moves.push({o,t,prod,desc:o.desc,localDe:o.local,localPara:localPara.get(prod)||""}));
    }
    if(!ok) continue;
    moves.forEach(m=>{ m.o.rem-=m.t; const k=m.o.p.k+"|"+m.prod; tirado.set(k,(tirado.get(k)||0)+m.t); });
    planejados.add(r.k); sols.push({r,moves});
  }
  return sols;
}
// visão por produto: onde a peça está "presa" (liberada em pedido que continua bloqueado)
function pecasPresas(){
  const m=new Map();
  FOTO.pedidos.forEach(p=>{ const b=bloqueado(p), pz=prazo(p);
    p.it.forEach(i=>{ const k=i[IT.prod], q=Number(i[IT.qtd])||0, x=m.get(k)||{prod:k,desc:i[IT.desc],dem:0,pdem:new Set(),presa:0,ppresa:new Set(),longe:0,plonge:new Set()};
      if(!linhaLiberada(i)){ if(b){ x.dem+=q; x.pdem.add(p.k); } }
      else if(b){ x.presa+=q; x.ppresa.add(p.k); }
      else if(pz.cls==="semdata"||(pz.n!=null&&pz.n>DIAS_DOADOR_LIBERADO)){ x.longe+=q; x.plonge.add(p.k); }
      m.set(k,x); }); });
  return [...m.values()].filter(x=>x.dem>0&&(x.presa>0||x.longe>0)).sort((a,b)=>(b.presa+b.longe)-(a.presa+a.longe)||b.dem-a.dem);
}
function pedCurto(p,extra){ const pz=prazo(p); return `<b>${esc(p.p)}</b> <span class="muted">loja ${esc(p.l)}</span> · ${esc(nomeCurto(p.n))} <span class="cod-cli" style="font-size:12px">cód. ${esc(p.c||"—")}</span> · ${p.en&&pz.cls!=="semdata"?dataBR(p.en):"sem data"} <span class="pill ${pz.pill}">${pz.rot}</span>${extra||""}`; }
async function registrarRetirada(sol,btn){

  btn.disabled=true; let ok=0, erro="";

    const repo={id:uid(),produto:m.prod,desc:m.desc,qtd:m.t,local_de:m.localDe,local_para:m.localPara,tipo_doador:m.o.tipo,
      de_chave:d.k,de_pedido:d.p,de_loja:d.l,de_cliente:d.n,de_entrega:d.en||"",para_chave:r.k,para_pedido:r.p,para_loja:r.l,para_cliente:r.n,para_entrega:r.en||"",
      foto:FOTO_DATA,em:new Date().toISOString(),por:USUARIO,status:"aberta"};
    try{ await gravarTratativa(d,{acao:"retirada",repo,nota:`Retirado ${m.t}× ${m.prod} ${m.desc} para liberar o pedido ${r.p} (${nomeCurto(r.n)}) — aguardando reposição`}); ok++; }
    catch(e){ erro=e.message; }

  atualizarMenu(); render();

}

function renderSituacao(c){
  const P=FOTO.pedidos, por=new Map();
  P.forEach(p=>{ const s=situacao(p); const x=por.get(s)||{n:0,un:0,v:0,atr:0,nao:0,lojas:new Map()}; x.n++; x.un+=qtdTotal(p); x.v+=p.v||0; if(prazo(p).cls==="atrasado") x.atr++; if(!analisado(p.k)) x.nao++; x.lojas.set(p.l,(x.lojas.get(p.l)||0)+1); por.set(s,x); });
  const principais=SITUACOES.map(z=>z[0]), outros=[...por.keys()].filter(s=>!principais.includes(s)).sort();
  const corr=P.filter(corrigidoPelaQtdBloq).length, viraram=P.filter(p=>bloqueado(p)&&tx(p.sp).toUpperCase()==="SEM AGENDAMENTO").length;
  const card=(s,grande)=>{ const x=por.get(s)||{n:0,un:0,v:0,atr:0,nao:0}, cor=corSituacao(s), ico=(SITUACOES.find(z=>z[0]===s)||[,,"•"])[2];

      <small>${P.length?Math.round(x.n/P.length*100):0}% dos pedidos · ${int(x.un)} unidades · ${moeda(x.v)}</small>
      <span class="sit-rodape">${x.atr?`<span class="pill p-bad">${int(x.atr)} atrasados</span>`:'<span class="pill p-ok">nenhum atrasado</span>'}${x.nao?` <span class="pill p-azul">${int(x.nao)} não analisados</span>`:""}</span></button>`; };
  const lojas=[...new Map(P.map(p=>[p.l,p.ln])).entries()].sort((a,b)=>a[0].localeCompare(b[0],"pt-BR",{numeric:true}));
  const colunas=[...principais,...outros];
  const hist=DIAS.slice(-30).filter(d=>d.resumo&&d.resumo.por_situacao);
  c.innerHTML=`<section><header><h2>Status do pedido</h2><p>Coluna Q “Status Pedido”, com a regra da <b>Qtd Bloq</b> (coluna L): Qtd Bloq = 1 é <b>BLOQUEADO POR ESTOQUE</b>, mesmo que a planilha diga outra coisa.</p></header>

    ${corr||viraram?`<p class="aviso">Regra da Qtd Bloq aplicada: <b>${int(corr)}</b> pedido(s) estavam LIBERADO/CARTEIRA no Status (coluna J) e <b>${int(viraram)}</b> estavam SEM AGENDAMENTO na coluna Q — todos com Qtd Bloq = 1, então contam como <b>BLOQUEADO POR ESTOQUE</b>.</p>`:""}

  const ant=DIAS.filter(d=>d.data<imp.data).pop(); let novosK=[], sairamK=[], primeira=!ant;
  if(ant){ const f=FOTO_ATUAL&&FOTO_ATUAL.data===ant.data?FOTO_ATUAL.foto:await carregarFoto(ant.data);
    const a=new Set(f.pedidos.map(p=>p.k)), b=new Set(m.pedidos.map(p=>p.k)); novosK=[...b].filter(k=>!a.has(k)); sairamK=[...a].filter(k=>!b.has(k)); }
  // [v4.3] pendências abertas: o que a planilha nova diz sobre elas (só na foto mais recente)
  const atual=!DIAS.length||imp.data>=DIAS[DIAS.length-1].data, porK=new Map(m.pedidos.map(p=>[p.k,p])), upd=[];
  if(atual) [...TRAT.values()].filter(aberta).forEach(t=>{ const np=porK.get(t.dados.chave);
    if(!np) return upd.push({t,tipo:"saiu"});
    const de=t.dados.situacao||"", para=situacao(np);
    if(de&&para!==de) upd.push({t,p:np,de,para,tipo:de.startsWith("BLOQUEADO")&&!bloqueado(np)?"desbloqueou":"mudou"}); });
  // [v4.7] encerrado por alguém (Correção da Pendência / Resolver) ANTES do dia desta planilha e que voltou BLOQUEADO → encerramento indevido
  const indev=[];
  if(atual) [...TRAT.values()].filter(t=>["ok","resolvida"].includes(t.dados.status)).forEach(t=>{ const np=porK.get(t.dados.chave);
    if(!np||!bloqueado(np)) return; if((t.dados.reposicoes||[]).some(r=>r.status==="aberta")) return;   // doou peça: bloquear de novo é esperado
    if(t.dados.saiu_janela_em&&String(t.dados.saiu_janela_em)>=String(t.dados.resolvida_em||"")) return;   // [v4.18] passou pela CARTEIRA: é retorno, não erro
    const e=encerramentoManual(t);
    if(!e||!e.em||diaBR(e.em)>=imp.data) return;   // encerrado no mesmo dia da planilha (ou depois) não conta
    indev.push({t,p:np,enc:e}); });
  // [v4.13] reposições abertas: o item do pedido que doou voltou liberado? (ou o pedido saiu da carteira)
  const repos=[];
  if(atual) reposAbertas().forEach(({t,r})=>{ if(String(r.foto||"")>=imp.data) return; const np=porK.get(t.dados.chave);
    if(!np) return repos.push({t,r,status:"saiu"});
    const ls=np.it.filter(i=>i[IT.prod]===r.produto);
    // só encerra depois que a planilha MOSTROU o item bloqueado (a retirada foi feita no ERP) e agora ele voltou liberado
    if(ls.some(i=>!linhaLiberada(i))){ if(!r.viu_bloqueado) repos.push({t,r,status:"visto",p:np}); }
    else if(ls.length&&r.viu_bloqueado) repos.push({t,r,status:"reposta",p:np});
    else if(ls.length) repos.push({t,r,status:"pendente_erp",p:np}); });
  // [v4.18] janela de 30 dias: encerrado que foi para CARTEIRA fica marcado; quando voltar a ser BLOQUEADO, volta para a triagem
  const janela=[], retornos=[];
  if(atual) [...TRAT.values()].filter(t=>["ok","resolvida"].includes(t.dados.status)).forEach(t=>{ const np=porK.get(t.dados.chave); if(!np) return;
    const passou=t.dados.saiu_janela_em&&String(t.dados.saiu_janela_em)>=String(t.dados.resolvida_em||"");
    if(emCarteira(np)&&!passou) janela.push({t,p:np});
    else if(bloqueado(np)&&passou) retornos.push({t,p:np}); });
  // [v4.18] pedidos entre CX e Compras ainda abertos de pedidos que saíram, liberaram ou foram para CARTEIRA: encerra
  const orfaos=[];
  if(atual) INTER.forEach((doc,k)=>{ const ab=solAbertas(doc.dados); if(!ab.length) return; const np=porK.get(k);
    if(!np||!bloqueado(np)) orfaos.push({k,p:np||pedidoDeChave(k),motivo:!np?"o pedido saiu da planilha":emCarteira(np)?"o pedido foi para CARTEIRA (entrega acima de 30 dias)":"o pedido não está mais bloqueado"}); });
  imp.previa={janela,retornos,orfaos,...m,resumo:resumoDaFoto(m.pedidos),novos:novosK,sairam:sairamK,primeira,anterior:ant&&ant.data,atualizacoes:upd,indevidos:indev,repos,
    ambas:m.pedidos.filter(p=>p.fo==="ambas").length,soPed:m.pedidos.filter(p=>p.fo==="pedidos").length,soIt:m.pedidos.filter(p=>p.fo==="itens").length};
}

    }catch(e){ setStatus("erro",e.message); m.className="msg erro"; m.textContent=e.message; b.disabled=false; } };

// INÍCIO
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// [v4.15] CX × COMPRAS — o "pingue-pongue" de cada pedido
// Um registro por pedido (loja+pedido), separado da tratativa da triagem:
//   cx            → devolutiva atual do CX (colaborador, devolutiva, tentativa, nova previsão aceita, obs, data da ação)
//   cx_hist       → todas as devolutivas (é o que alimenta os indicadores e a evolução)
//   cx_resp       → colaborador do CX responsável pelo pedido (distribuição da equipe)
//   compras[prod] → por ITEM: situação, fornecedor, nova data, motivo do atraso, cobranças (dia/hora/login/obs)
//   alternativos  → produtos alternativos sugeridos pelo Compras (e a resposta do cliente via CX)
//   solicitacoes  → o que uma área pediu para a outra (aberta → respondida): é o que diz "com quem está a bola"
//   eventos       → linha do tempo do pedido (quem fez o quê, quando)
// ═══════════════════════════════════════════════════════════════════
let INTER=new Map();
async function carregarInteracoes(){
  try{ const {j}=await api(`${API}/interacoes`); const m=new Map();
    (j||[]).forEach(d=>{ const k=d.dados&&d.dados.chave; if(!k) return; const o=m.get(k); if(!o||String(d.atualizado_em||"")>String(o.atualizado_em||"")) m.set(k,d); });
    INTER=m; }catch(e){ if(e.message==="sessão expirada") throw e; }
}
function interDe(k){ const d=INTER.get(k); return d?d.dados:null; }
function novaInter(p){ return {chave:p.k,pedido:p.p,loja:p.l,cliente:p.n,cx:null,cx_hist:[],cx_resp:"",compras:{},alternativos:[],solicitacoes:[],eventos:[]}; }
function evento(d,setor,acao,texto,extra){ d.eventos=d.eventos||[]; d.eventos.push({id:uid(),em:new Date().toISOString(),por:USUARIO,email:EMAIL,setor,acao,texto:tx(texto),...(extra||{})}); }
async function gravarInteracao(p, fn, tent=0){
  const doc=INTER.get(p.k), dados=doc?JSON.parse(JSON.stringify(doc.dados)):novaInter(p);
  ["cx_hist","alternativos","solicitacoes","eventos"].forEach(k=>{ if(!Array.isArray(dados[k])) dados[k]=[]; }); if(!dados.compras) dados.compras={};
  fn(dados); dados.cliente=p.n||dados.cliente; if(dados.eventos.length>400) dados.eventos=dados.eventos.slice(-400);
  setStatus("salvando");
  if(doc){ const {r,j}=await api(`${API}/interacoes/${doc.id}`,{method:"PUT",body:JSON.stringify({dados,versao:doc.versao})});
    if(r.status===409){ INTER.set(p.k,j.atual); if(tent<3) return gravarInteracao(p,fn,tent+1); setStatus("ok"); throw new Error("muita gente mexendo neste pedido ao mesmo tempo — tente de novo"); }
    INTER.set(p.k,j); }
  else { const {r,j}=await api(`${API}/interacoes`,{method:"POST",body:JSON.stringify({dados})});
    if(r.status===409){ INTER.set(p.k,j.atual); if(tent<3) return gravarInteracao(p,fn,tent+1); }
    else INTER.set(p.k,j); }
  setStatus("ok"); atualizarMenu(); desenharLembrete();
}

// com quem está a bola (CX × Compras) — usado no card, nas listas e no lembrete
function bolaDe(p){
  const d=interDe(p.k), r=[];
  const sc=solAbertas(d,"compras"), sx=solAbertas(d,"cx");
  if(sc.length) r.push({a:"compras",t:`${sc.length} pedido(s) do CX`});
  if(sx.length) r.push({a:"cx",t:`${sx.length} pedido(s) do Compras`});

}

function pendenciasAreas(){
  const r={paraCompras:0,paraCX:0,vencidas:0,semCompras:0,alt:0,pedCompras:new Set(),pedCX:new Set()};
  const bloqK=new Set(((FOTO_ATUAL&&FOTO_ATUAL.foto.pedidos)||[]).filter(bloqueado).map(p=>p.k));   // [v4.18] só o que ainda está bloqueado conta
  INTER.forEach((doc,k)=>{ if(!bloqK.has(k)) return; const d=doc.dados; const a=solAbertas(d,"compras").length, b=solAbertas(d,"cx").length;
    if(a){ r.paraCompras+=a; r.pedCompras.add(k); } if(b){ r.paraCX+=b; r.pedCX.add(k); } r.alt+=altPendentes(d).length; });
  ((FOTO_ATUAL&&FOTO_ATUAL.foto.pedidos)||[]).forEach(p=>{ if(!bloqueado(p)) return; const d=interDe(p.k);
    if(comprasVencidas(p,d).length){ r.vencidas++; r.pedCompras.add(p.k); }
    if(comComprasNaTriagem(p)&&semRegistroCompras(p,d)){ r.semCompras++; r.pedCompras.add(p.k); } });
  return r;
}

function registrarDevolutiva(dd,p,x){
  const tent=(dd.cx_hist||[]).filter(h=>/sem sucesso/i.test(h.devolutiva)).length;
  const dev=x.devolutiva==="Sem sucesso"?`${Math.min(tent+1,9)}°Sem sucesso`:x.devolutiva;
  const reg={devolutiva:dev,colab:USUARIO,   // [v4.17] sempre quem está logado
   atendeu:x.atendeu||"",nova_previsao:x.nova_previsao||"",data_acao:x.data_acao||hojeISO(),obs:x.obs||"",por:USUARIO,email:EMAIL,em:new Date().toISOString(),aba:abaCX(p),tentativa:/sem sucesso/i.test(dev)?Math.min(tent+1,9):0};
  dd.cx=reg; dd.cx_hist=[...(dd.cx_hist||[]),reg]; if(!dd.cx_resp) dd.cx_resp=reg.colab;
  evento(dd,"cx","devolutiva",`Devolutiva: ${dev}${reg.nova_previsao?` · nova previsão ${dataBR(reg.nova_previsao)}`:""}${reg.obs?` — “${reg.obs}”`:""}`);
}

    ${aberto?'<div data-pg></div>':""}</div>`;
  box.querySelector("[data-ri]").onclick=e=>{ e.stopPropagation(); box.dataset.aberto=aberto?"":"1"; montarResumoInteracao(box,p); };

// ABA CX — o painel "Fluxo da Carteira" do CX, em cima da carteira oficial
// ═══════════════════════════════════════════════════════════════════
const CXS={ord:"",dir:1,prodF:"",view:"resumo",aba:"atrasados",acao:"",busca:"",colab:"",soNova:false,soVencida:false,soPend:false,prev:null,produto:"",fMes:"",fData:"",fRean:"",eqColab:"",eqAba:"",prodBusca:"",pvModo:"produto",aberto:"",limite:150};
try{ const v=JSON.parse(localStorage.getItem("cart_cx_pref")||"{}"); if(v.view) CXS.view=v.view; if(v.pvModo) CXS.pvModo=v.pvModo; if(v.aba) CXS.aba=v.aba; }catch(_){}
function guardarPrefCX(){ try{ localStorage.setItem("cart_cx_pref",JSON.stringify({view:CXS.view,pvModo:CXS.pvModo,aba:CXS.aba})); }catch(_){} }
const MESES_CX=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const ABAS_CX=[["atrasados","Atrasados","previsao"],["alerta","Alerta","previsao"],["fora","Fora de linha e resíduos","tratativa"],["medida","Medida especial","previsao"],["demais","Demais bloqueados","previsao"]];
function abaCX(p){
  const bl=itensDoBloqueio(p).length?itensDoBloqueio(p):p.it;
  if(bl.some(i=>foraDeLinha(i)||/residuo/.test(nrm(`${i[IT.grupo]} ${i[IT.desc]}`)))) return "fora";
  if(bl.some(i=>/medida especial|med\.? ?especial|\bm\.? ?esp\b/.test(nrm(`${i[IT.grupo]} ${i[IT.desc]}`)))) return "medida";
  const c=p.fora?"":prazo(p).cls; return c==="atrasado"?"atrasados":c==="alerta"?"alerta":"demais";
}
// reanálise automática: o que aconteceu com o pedido DEPOIS do contato do CX (comparando com a foto atual)
const REAN_ORDEM=["Resolvido (saiu da planilha)","Agendado","Liberado para agendar","Em tratativa com Compras","Previsão vencida","Sem estoque"];
const REAN_COR={"Resolvido (saiu da planilha)":"var(--ok)","Agendado":"#0F766E","Liberado para agendar":"var(--prog)","Em tratativa com Compras":"var(--amber)","Previsão vencida":"var(--bad)","Sem estoque":"#9D174D"};
function reanDe(l){ if(!l.d||!l.d.cx) return null; const p=l.p;
  if(p.fora) return "Resolvido (saiu da planilha)";   // [v4.18] saiu = resolvido (cancelamento aparece na devolutiva do CX)
  if(!bloqueado(p)) return /AGENDADO/.test(tx(situacao(p)).toUpperCase())&&!/SEM AGEND/.test(tx(situacao(p)).toUpperCase())?"Agendado":"Liberado para agendar";
  if(l.vencida) return "Previsão vencida";
  return itensDoBloqueio(p).some(i=>coDe(l.d,i[IT.prod]).situacao)?"Em tratativa com Compras":"Sem estoque"; }
function pillRean(c){ return c?`<span class="pill" style="background:color-mix(in srgb,${REAN_COR[c]} 14%,transparent);color:${REAN_COR[c]}">${esc(c)}</span>`:'<span class="muted">—</span>'; }
function linhasCX(){
  if(!FOTO_ATUAL) return [];
  const hoje=hojeISO(), vistos=new Set(), L=[];
  const add=(p,d)=>{ if(vistos.has(p.k)) return; vistos.add(p.k); d=d||interDe(p.k);
    const aba=p.fora||!bloqueado(p)?((d&&d.cx&&d.cx.aba)||abaCX(p)):abaCX(p), prev=previsaoCompras(p,d), nova=(d&&d.cx&&d.cx.nova_previsao)||"";
    const ac=devolutiva(d), ref=prev||nova;
    const l={p,d,aba,acao:ac,colab:colabCX(d)||"Sem colaborador",dataAcao:(d&&d.cx&&d.cx.data_acao)||"",previsao:prev,nova,bloq:!p.fora&&bloqueado(p),
      vencida:!p.fora&&bloqueado(p)&&!!ref&&ref<hoje&&!/cancel/i.test(ac),itens:itensDoBloqueio(p)};
    l.mes=l.dataAcao?MESES_CX[+l.dataAcao.slice(5,7)-1]:""; l.rean=reanDe(l); L.push(l); };
  FOTO_ATUAL.foto.pedidos.forEach(p=>{ if(bloqueado(p)) add(p); });
  INTER.forEach((doc,k)=>{ if(doc.dados&&doc.dados.cx) add(pedidoDeChave(k),doc.dados); });   // já tratados pelo CX que liberaram ou saíram (reanálise)

    <div class="filtros" style="grid-template-columns:minmax(200px,1fr) minmax(200px,1fr) minmax(170px,1fr) minmax(220px,1.4fr) minmax(240px,2fr)">

      <select id="coForn"><option value="">Fornecedor: todos</option>${Object.keys(forn).sort().map(f=>`<option${f===COS.forn?" selected":""}>${esc(f)}</option>`).join("")}</select>

      <input class="busca" id="coBusca" placeholder="Buscar pedido, cliente, código, produto, fornecedor, motivo..." value="${esc(COS.busca)}"></div>
    <p class="cap" style="margin:0 0 6px"><b>${int(lst.length)}</b> item(ns) · clique na linha para registrar · clique no título da coluna para ordenar</p>

      lst.slice(0,COS.limite).map(l=>{ const p=l.p, pz=prazo(p), t=l.t, kk=p.k+"|"+l.prod;
        return `<tr class="clic${COS.aberto===kk?" sel":""}${l.scI.length?" tr-pend":""}" data-k="${esc(kk)}"><td class="nw"><b>${esc(p.p)}</b><span class="sub">loja ${esc(p.l)}</span></td><td>${esc(nomeCurto(p.n))}<span class="sub">cód. ${esc(p.c||"—")}</span></td>

          <td>${pillCo(l.c.situacao)}${l.c.motivo?`<span class="sub">${esc(l.c.motivo)}</span>`:""}</td><td>${esc(l.c.fornecedor||"—")}</td>
          <td>${l.u?`${dataHoraCurta(l.u.em)}<span class="sub">${esc(nomeCurto(l.u.por))}${(l.c.cobrancas||[]).length>1?` · ${(l.c.cobrancas||[]).length}×`:""}</span>`:'<span class="muted">não cobrado</span>'}</td>
