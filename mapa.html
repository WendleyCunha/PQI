<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Digital King Star — como é feito hoje × Instrução de Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/pqi-acesso.js" data-modulo="mapa"></script>
<style>
/* ═══ Mesmo padrão visual do RG do Pedido (IBM Plex, papel, aço, menu vertical) ═══ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9;
  --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8; --block:#6B46A8; --block-soft:#EEE7F8;
  --idle:#8A93A3; --idle-soft:#EEF0F3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17;
    --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442;
    --idle:#8A93A3; --idle-soft:#262D3A;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17;
  --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442;
  --idle:#8A93A3; --idle-soft:#262D3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
h3{font-size:16px;margin:20px 0 8px;font-weight:600}
.wrap{max-width:none;margin:0;padding:24px 28px 64px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-in .who{color:var(--ink-3);font-size:13px;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.salvando{background:var(--amber)} .dot.erro{background:var(--bad)}
.who.erro{color:var(--bad)}
button,.btn{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ink-3)}
button.primary,.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
button.warn,.btn.perigo{color:var(--bad)}
.btn.peq{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.item-card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button[hidden]{display:none}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:6px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.banner:empty{display:none}
.cap{color:var(--ink-3);font-size:13px;margin:2px 0 12px;max-width:80ch}
.muted{color:var(--ink-3)}
code{background:var(--rule-2);border-radius:4px;padding:0 5px;font-size:12.5px}

/* cabeçalho do documento + carimbo (igual ao RG) */
.doc-head{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px 32px}
.doc-head h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.doc-head .obj{margin:10px 0 0;color:var(--ink-2);max-width:68ch}
.stamp{border:2px solid var(--steel);border-radius:8px;padding:10px 14px;min-width:230px;align-self:start}
.stamp .code{font:700 20px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.stamp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.stamp dt{color:var(--ink-3)} .stamp dd{margin:0;font-weight:500}
.sit{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.sit.exec{background:var(--prog-soft);color:var(--prog)} .sit.val{background:var(--amber-soft);color:var(--amber)}
.sit.fim{background:var(--ok-soft);color:var(--ok)} .sit.susp{background:var(--bad-soft);color:var(--bad)}

/* resumo: medidor + contagens */
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) 3fr;gap:16px;margin-top:16px}
.meter{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.meter .big{font:700 46px/1 "IBM Plex Sans Condensed",sans-serif}
.meter .lbl{color:var(--ink-3);font-size:13px;margin-top:4px}
.track{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;background:var(--ok)}
.counts{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font:700 26px/1 "IBM Plex Sans Condensed",sans-serif}
.count span{color:var(--ink-2);font-size:13px}

/* seções */
section{margin-top:34px}
section:first-child{margin-top:0}
section > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
section h2{margin:0;font-size:22px;font-weight:700}
section > header p{margin:0;color:var(--ink-3);font-size:13px}
section > header .add{margin-left:auto}

/* linha de vida */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);overflow-x:auto;padding-bottom:6px}
.link{position:relative;padding:0 6px}
.link::before{content:"";position:absolute;top:19px;left:0;right:0;height:3px;background:var(--rule)}
.link:first-child::before{left:50%} .link:last-child::before{right:50%}
.link.st-ok::before{background:var(--ok)}
.knot{position:relative;width:40px;height:40px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font:700 15px/1 "IBM Plex Sans Condensed",sans-serif;border:3px solid var(--idle);background:var(--sheet);color:var(--idle)}
.link .nm{text-align:center;font:600 14px/1.25 "IBM Plex Sans Condensed",sans-serif;margin-top:8px}
.link .st{text-align:center;margin-top:6px}
.link .doc{text-align:center;font-size:12px;color:var(--ink-3);margin-top:4px;word-break:break-word}
.st-ok .knot{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.st-bad .knot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.st-warn .knot{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.st-prog .knot{border-color:var(--prog);color:var(--prog);background:var(--prog-soft)}
.st-block .knot{border-color:var(--block);color:var(--block);background:var(--block-soft)}
.chain-detail{margin-top:14px}
.legenda-chain{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}

/* tabelas (leitura e edição) */
.scroll,.tbl-wrap{overflow-x:auto}
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
table{width:100%;border-collapse:collapse;background:var(--sheet);font-size:14px}
table.lista,table.tbl{min-width:760px}
.scroll > table,.tbl-wrap > table{border:0}
th{text-align:left;font:600 13px/1.3 "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2);background:var(--rule-2);padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:bottom;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.id{font-weight:600;color:var(--ink-3);white-space:nowrap}
table.tbl td{padding:3px 4px}
table.tbl input,table.tbl select,table.tbl textarea{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:5px;padding:6px 7px;width:100%;min-width:70px}
table.tbl textarea{min-height:36px;resize:vertical}
table.tbl input:hover,table.tbl select:hover,table.tbl textarea:hover{border-color:var(--rule)}
table.tbl input:focus,table.tbl select:focus,table.tbl textarea:focus{border-color:var(--amber);background:color-mix(in srgb,var(--amber-soft) 35%,var(--sheet));outline:none}
table.tbl .ro{display:block;padding:7px;color:var(--ink-3);white-space:nowrap}
table.tbl td.acts{white-space:nowrap;width:1%}
.ib{background:none;border:0;padding:5px 7px;font-size:13px;opacity:.6;border-radius:5px}
.ib:hover{opacity:1;background:var(--rule-2)} .ib.del:hover{background:var(--bad-soft);color:var(--bad)}
td.vazio{color:var(--ink-3);text-align:center;padding:18px}
table.lista tr.clic{cursor:pointer} table.lista tr.clic:hover td{background:var(--rule-2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--amber-soft);color:var(--amber)} .p-azul{background:var(--prog-soft);color:var(--prog)}
.p-cinza{background:var(--idle-soft);color:var(--ink-2)} .p-block{background:var(--block-soft);color:var(--block)}

/* campos */
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
textarea{min-height:58px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0}
details.box > summary{cursor:pointer;font-weight:600;font-size:14px}
details.box[open] > summary{margin-bottom:10px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.msg{font-size:13px} .msg.ok{color:var(--ok)} .msg.erro{color:var(--bad)}
.aviso{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--steel-soft);color:var(--ink);font-size:14px}
.conflito{margin:0 0 16px;padding:12px 14px;border-radius:6px;background:var(--bad-soft);color:var(--ink);font-size:14px;border:1px solid var(--bad)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.filtros .inp,.filtros select,.filtros input{width:auto;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.kpi > span{color:var(--ink-3);font-size:13px}
.kpi b{display:block;font:700 30px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.barra{height:6px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--steel)}
.cat4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.cat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.cat b{display:block;font:700 30px/1 "IBM Plex Sans Condensed",sans-serif}
.cat span{color:var(--ink-2);font-size:13px}
.mini4{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.etapas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.etapa{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px}
.etapa.feita{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 50%,var(--sheet))}
.etapa label.ck{display:flex;gap:8px;align-items:center;font:600 14px "IBM Plex Sans Condensed",sans-serif;cursor:pointer}
.etapa input[type=checkbox]{width:16px;height:16px;accent-color:var(--steel)}
.etapa p{font-size:12px;color:var(--ink-3);margin:4px 0 8px}
.conf4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bloco{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.bloco h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.bloco ol{margin:0;padding-left:20px} .bloco li{margin:5px 0;font-size:14px}
.bloco li small{display:block;color:var(--ink-3);font-size:12.5px}
.lado{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.lado > div{padding:9px 12px;border-bottom:1px solid var(--rule-2);font-size:14px}
.lado > .h{background:var(--rule-2);font:600 13px "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2)}
.lado > .it{border-right:1px solid var(--rule-2)} .lado .vaz{color:var(--ink-3);font-style:italic}

/* registrar */
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.tipo{text-align:left;padding:10px 12px;line-height:1.3;border-radius:8px}
.tipo b{display:block;font:600 14px "IBM Plex Sans Condensed",sans-serif;margin-top:2px}
.tipo small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tipo.ativo{border-color:var(--steel);background:var(--steel-soft);color:var(--steel)}
.campos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.campos .full{grid-column:1/-1}
.campos textarea.grande{min-height:130px;font-size:15px;line-height:1.55}
.rascunho{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.editando-faixa{background:var(--amber-soft);border-radius:6px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.hist-filtro{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.hist-filtro button{padding:6px 11px;font-size:12.5px;border-radius:999px}
.hist-filtro button.ativo{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
.registro{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.registro.recente{border-color:var(--steel);box-shadow:inset 3px 0 0 var(--steel)}
.registro .topo-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.registro .topo-r .acs{margin-left:auto;display:flex}
.registro p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
.registro .det{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.vazio-h{color:var(--ink-3);text-align:center;padding:28px 10px;border:1px dashed var(--rule);border-radius:8px}
.reg-dupla{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}

/* lista de processos (tela inicial — igual "Itens em teste" do RG) */
.lista-topo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.lista-topo h1{margin:0;font-size:28px}
.lista-topo p{margin:4px 0 0;color:var(--ink-3);font-size:13px;flex-basis:100%}
.lista-acoes{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.lista-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item-card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s;text-align:left;width:100%;font:inherit;color:inherit}
.item-card:hover{border-color:var(--steel)}
.item-card .ic-codigo{font:700 17px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.item-card .ic-item{font-size:14px;color:var(--ink);margin-top:3px;font-weight:500}
.item-card .ic-area{font-size:12.5px;color:var(--ink-3)}
.item-card .ic-macro{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.item-card .ic-macro b{font:700 24px/1 "IBM Plex Sans Condensed",sans-serif}
.item-card .ic-macro span{color:var(--ink-3);font-size:12px}
.item-card .ic-track{margin-top:8px}
.item-card .ic-rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--ink-3);gap:8px}
.vazio-lista{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:50px 0}

/* casca do item aberto: menu vertical + conteúdo (igual ao RG) */
.shell-item{display:flex;align-items:flex-start;gap:22px}
.side-rg{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 8px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.side-btn{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;
  color:var(--ink-3);font-size:10.5px;line-height:1.2;text-align:center;position:relative}
.side-btn svg{width:20px;height:20px;flex:none}
.side-btn:hover{background:var(--rule-2);color:var(--ink-2)}
.side-btn.ativo{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.side-btn .n{position:absolute;top:4px;right:6px;font-size:10px;font-weight:600;background:var(--rule-2);color:var(--ink-2);border-radius:8px;padding:0 5px}
.side-btn.ativo .n{background:var(--steel);color:var(--sheet)}
.side-sep{width:70%;height:1px;background:var(--rule);margin:4px 0}
.side-rg{max-height:calc(100vh - 90px);overflow-y:auto}
.side-btn .fz{position:absolute;top:4px;left:6px;font-size:9.5px;font-weight:700;color:var(--ink-3)}
.side-btn.ativo .fz{color:var(--steel)}
.fase-box{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--steel);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.fase-box button{margin-left:auto}
.link.clic{cursor:pointer} .link.clic:hover .nm{color:var(--steel)}
button svg{width:15px;height:15px;vertical-align:-3px}
table.matriz td,table.matriz th{text-align:center} table.matriz td:first-child,table.matriz th:first-child{text-align:left}
table.matriz td.zero{color:var(--rule)}
.conteudo-item{flex:1;min-width:0}

/* [v3.5] fluxograma em raias */
.fx-barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.fx-seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.fx-seg button{border:0;border-radius:0;padding:7px 11px}
.fx-seg button+button,.fx-seg span{border-left:1px solid var(--rule)}
.fx-seg span{padding:7px 10px;font-size:13px;color:var(--ink-2);min-width:52px;text-align:center}
.fx-seg button.ativo{background:var(--steel);color:var(--sheet)}
.fx-grid{display:grid;grid-template-columns:150px minmax(0,1fr) 250px;gap:10px;align-items:start}
.fx-paleta,.fx-props{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px;max-height:72vh;overflow:auto}
.fx-pt{font:600 12px "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:2px 2px 6px}

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// COMO OS DADOS FICAM
// Um documento por PROCESSO no Firestore (coleção mapa_processos).
// O servidor não conhece os campos: campo novo = só mexer AQUI.
//
// O CONFRONTO é calculado, ninguém digita a classificação final:
//   passo real ligado a um passo da IT + "Conforme"   → ✅ feito conforme
//   passo real ligado a um passo da IT + "Divergente" → ⚠️ feito diferente
//   passo real SEM ligação a passo da IT              → ➕ feito sem IT
//   passo da IT que nenhum passo real usa             → ❌ na IT e não é feito
// ═══════════════════════════════════════════════════════════════════
const API = "/api/mapa/processos";
// [v3.4] Lista de reserva: vale só se o Organograma não responder. Com ele no ar, as áreas são os setores do Organograma.
let AREAS_PADRAO = ["Comercial","Lojas","Financeiro","Faturamento / Fiscal","Logística","Expedição","Estoque","Compras","SAC / CX","Qualidade","RH","Marketing","TI","Diretoria"];
const STATUS_PROC = ["Em levantamento","Em validação","Validado","Revisar"];
const CRITICIDADE = ["Alta","Média","Baixa"];
const ETAPAS_LEV = [
  ["conversar","Conversar","Reunião com quem executa, não só com quem chefia"],
  ["acompanhar","Acompanhar","Ver o processo rodando no dia a dia, como é de verdade"],
  ["registrar","Registrar","Passo a passo: quem faz, com qual sistema, gerando qual dado"],
  ["cruzar","Cruzar","Comparar com os chamados que a área mais abre"],
];
const TIPOS_OPORT = ["Dor","Trabalho repetido","Ganho de tempo","Integração","Indicador","Risco","Gap de IT"];
const STATUS_OPORT = ["Identificada","Em análise","Em execução","Concluída","Descartada"];
const ESCALA = ["1","2","3","4","5"];
const CAT = {
  conforme:  {rot:"Feito conforme a IT",   ico:"✅", pill:"p-ok"},
  divergente:{rot:"Feito diferente da IT", ico:"⚠️", pill:"p-warn"},
  semIT:     {rot:"Feito sem IT",          ico:"➕", pill:"p-azul"},
  naoFeito:  {rot:"Na IT e não é feito",   ico:"❌", pill:"p-bad"},
};

// ─── utilidades ───
const $ = (s, r=document) => r.querySelector(s);
function el(t, c){ const e=document.createElement(t); if(c) e.className=c; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tx(v){ return String(v==null?"":v).trim(); }
function num(v){ const n=parseFloat(String(v??"").replace(",",".")); return isNaN(n)?0:n; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pct(x){ return x==null ? "—" : Math.round(x*100)+"%"; }
function hojeISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dataBR(v){ if(!v) return "—"; const d=new Date(v); if(isNaN(d)) return v; return d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:v.length>10?"short":undefined}); }
function ordenar(a){ return a.slice().sort((x,y)=>x.localeCompare(y,"pt-BR")); }
function opts(arr, atual, vazio=true){ return (vazio?'<option value=""></option>':"")+arr.map(o=>`<option${o===atual?" selected":""}>${esc(o)}</option>`).join(""); }
function horas(v){ return (Math.round(v*10)/10).toLocaleString("pt-BR"); }

// ═══════════════════════════════════════════════════════════════════
// Dados e gravação (um processo por vez, com controle de versão)
// ═══════════════════════════════════════════════════════════════════
let PROCS = [];
const pend = {};
async function api(url, op={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},cache:"no-store",...op});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ sessaoExpirada(); throw new Error("sessão expirada"); }
  return {r,j};
}
function sessaoExpirada(){
  $("#root").innerHTML='<div class="conflito"><b>Sua sessão expirou.</b> Entre de novo pelo Painel para continuar. <a href="/" target="_top" style="color:var(--gold-soft)">Ir para o Painel</a></div>';
}
function procPorId(id){ return PROCS.find(p=>p.id===id); }

function salvar(p){
  setStatus("salvando");
  clearTimeout(pend[p.id]);
  pend[p.id]=setTimeout(()=>enfileirar(p), 800);
}
function enfileirar(p, forcar){
  delete pend[p.id];
  p._fila=(p._fila||Promise.resolve()).then(()=>enviar(p, forcar));
  return p._fila;
}
async function enviar(p, forcar){
  if(p._conflito && !forcar) return;
  try{
    const {r,j}=await api(`${API}/${p.id}`,{method:"PUT",body:JSON.stringify({dados:p.dados, versao: forcar?null:p.versao})});
    if(r.status===409){ p._conflito=j.atual; setStatus("erro","conflito de versão"); if(vista==="processo" && atual===p.id) render(); return; }
    if(r.status===403){   // [v3.3] perfil não permite esta alteração: volta ao que está gravado
      setStatus("erro", j.detail||"sem permissão para esta alteração");
      try{ const x=await api(API); const at=(x.j||[]).find(z=>z.id===p.id); if(at){ p.dados=p.dados&&p.dados._tipo?at.dados:normalizar(at.dados); p.versao=at.versao; } }catch(_){}
      render(); return;
    }
    if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    p.versao=j.versao; p.atualizado_por=j.atualizado_por; p.atualizado_em=j.atualizado_em; p._conflito=null;
    if(!Object.keys(pend).length) setStatus("ok");
  }catch(e){ if(e.message!=="sessão expirada") setStatus("erro", e.message); }
}
async function salvarTudo(){ await Promise.all(Object.keys(pend).map(id=>{ clearTimeout(pend[id]); const doc=docPorId(id); return doc?enfileirar(doc):null; })); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") salvarTudo(); });
window.addEventListener("beforeunload",e=>{ if(Object.keys(pend).length){ salvarTudo(); e.preventDefault(); e.returnValue=""; } });

function normalizar(d){
  d=d||{};
  const base={codigo:"",nome:"",area:"",dono:"",objetivo:"",gatilho:"",entradas:"",saidas:"",sistemas:"",criticidade:"Média",status:"Em levantamento",
    entrevistados:"",chamados:"",etapas:{},it:{codigo:"",titulo:"",versao:"",data:"",link:"",obs:""},passos_it:[],passos_real:[],oportunidades:[],
    validacao:{por:"",data:"",parecer:"",obs:""},anotacoes:[],
    macroprocesso:"",recebe_de:"",entrega_para:"",
    fases:{},validacao_tobe:{por:"",data:"",parecer:"",obs:""},
    tobe:{codigo:"",versao:"",objetivo:"",regras:"",fluxo:"",passos:[],pendencias:[]},implantacao:{acoes:[]},
    fluxo:{}, origem:null};   // [v3.5] fluxograma (AS IS / TO BE) e a atividade do Diagnóstico que originou o processo
  for(const k in base) if(d[k]==null) d[k]=base[k];
  ETAPAS_LEV.forEach(([id])=>{ if(!d.etapas[id]) d.etapas[id]={feito:false,data:""}; });
  ["f2","f4","f5","f7"].forEach(f=>{ if(!d.fases[f]) d.fases[f]={concluido:false,por:"",em:""}; });
  ["passos","pendencias"].forEach(k=>{ if(!Array.isArray(d.tobe[k])) d.tobe[k]=[]; d.tobe[k].forEach(x=>{ if(!x.id) x.id=uid(); }); });
  if(!Array.isArray(d.implantacao.acoes)) d.implantacao.acoes=[];
  // migração: processos validados na versão anterior já contam como Fase 3 (validação do AS IS) concluída
  if(d.status==="Validado" && !d.validacao.parecer) d.validacao.parecer="Validado";
  ["passos_it","passos_real","oportunidades","anotacoes"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; d[k].forEach(x=>{ if(!x.id) x.id=uid(); }); });
  fxNormalizar(d);
  return d;
}

// ═══════════════════════════════════════════════════════════════════
// O CONFRONTO (IT × real)
// ═══════════════════════════════════════════════════════════════════
function confronto(d){
  const it=d.passos_it.filter(p=>tx(p.descricao)), real=d.passos_real.filter(p=>tx(p.descricao));
  const porId={}; it.forEach((p,i)=>porId[p.id]={...p,_n:d.passos_it.indexOf(p)+1});
  const R={conforme:[],divergente:[],semIT:[],naoFeito:[],pendente:[]};
  const usados=new Set();
  real.forEach(r=>{
    const n=d.passos_real.indexOf(r)+1, alvo=r.it_ref&&porId[r.it_ref];
    if(!alvo) return R.semIT.push({real:{...r,_n:n}});
    usados.add(r.it_ref);
    const item={real:{...r,_n:n},it:alvo};
    if(r.aderencia==="Conforme") R.conforme.push(item);
    else if(r.aderencia==="Divergente") R.divergente.push(item);
    else R.pendente.push(item);
  });
  it.forEach(p=>{ if(!usados.has(p.id)) R.naoFeito.push({it:porId[p.id]}); });
  const totalClass=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length;
  R.indice = totalClass ? R.conforme.length/totalClass : null;                 // conformidade geral
  R.cobertura = it.length ? usados.size/it.length : null;                      // % da IT que é executada
  const lig=R.conforme.length+R.divergente.length;
  R.aderencia = lig ? R.conforme.length/lig : null;                            // dos executados, quantos conforme
  R.gaps = R.divergente.length+R.semIT.length+R.naoFeito.length;
  R.horasMes = d.passos_real.reduce((a,r)=>a+num(r.tempo_min)*num(r.vezes_mes),0)/60;
  return R;
}
function situacaoPassoIT(d, passo){
  const lig=d.passos_real.filter(r=>tx(r.descricao)&&r.it_ref===passo.id);
  if(!lig.length) return "Não executado";
  if(lig.some(r=>r.aderencia==="Divergente")) return "Executado com divergência";
  if(lig.every(r=>r.aderencia==="Conforme")) return "Executado conforme";
  return "Pendente de classificação";
}
function classePassoReal(d, r){
  const ok=r.it_ref && d.passos_it.some(p=>p.id===r.it_ref && tx(p.descricao));
  if(!ok) return "Feito sem IT";
  return r.aderencia==="Conforme" ? "Feito conforme a IT" : r.aderencia==="Divergente" ? "Feito diferente da IT" : "Pendente de classificação";
}
function score(o){ return num(o.volume)*num(o.tempo)*num(o.custo)*num(o.risco); }
function rotuloIT(d, id){ const i=d.passos_it.findIndex(p=>p.id===id); return i<0?"":`${i+1}. ${tx(d.passos_it[i].descricao)}`; }

// ═══════════════════════════════════════════════════════════════════
// Tabela editável
// colunas: {campo,label,tipo:text|textarea|select|number|date|calc,opcoes(array | fn → [valor,rotulo]),lista,placeholder,largura,calc}
// ═══════════════════════════════════════════════════════════════════
let focarUltima=null;
function tabela(o){
  const {chave, linhas, colunas, aoSalvar, aoMudar, aoEstrutura, novaLinha, ordenavel, rotuloAdd, numerar} = o;
  const wrap=el("div"), tw=el("div","tbl-wrap"), t=el("table","tbl");
  t.innerHTML="<thead><tr>"+(numerar?"<th>#</th>":"")+colunas.map(c=>`<th style="${c.largura?`min-width:${c.largura}px`:""}">${esc(c.label)}</th>`).join("")+"<th></th></tr></thead>";
  const tb=el("tbody");
  if(!linhas.length) tb.innerHTML=`<tr><td colspan="${colunas.length+2}" class="vazio">Nenhuma linha ainda.</td></tr>`;
  linhas.forEach((row,i)=>{
    const tr=el("tr");
    if(numerar){ const td=el("td"); td.innerHTML=`<span class="ro">${i+1}</span>`; tr.appendChild(td); }
    colunas.forEach(c=>{ const td=el("td"); td.dataset.campo=c.campo; td.appendChild(o.leitura?celulaLeitura(row,c):celula(row,c,tr,colunas,aoSalvar,aoMudar)); tr.appendChild(td); });
    const td=el("td","acts"); if(o.leitura){ tr.appendChild(td); tb.appendChild(tr); return; }
    if(ordenavel){
      const up=el("button","ib"); up.type="button"; up.textContent="↑"; up.title="Subir"; up.disabled=i===0;
      up.onclick=()=>{ [linhas[i-1],linhas[i]]=[linhas[i],linhas[i-1]]; aoSalvar(); aoEstrutura(); };
      const dn=el("button","ib"); dn.type="button"; dn.textContent="↓"; dn.title="Descer"; dn.disabled=i===linhas.length-1;
      dn.onclick=()=>{ [linhas[i+1],linhas[i]]=[linhas[i],linhas[i+1]]; aoSalvar(); aoEstrutura(); };
      td.append(up,dn);
    }
    const del=el("button","ib del"); del.type="button"; del.textContent="🗑"; del.title="Excluir linha";
    del.onclick=()=>{ if(o.confirmarExclusao && !confirm(o.confirmarExclusao(row))) return; linhas.splice(i,1); aoSalvar(); aoEstrutura(); };
    td.appendChild(del); tr.appendChild(td); tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); wrap.appendChild(tw);
  const b=el("button","btn"); b.type="button"; b.style.marginTop="8px"; b.textContent=rotuloAdd||"+ Adicionar linha";
  b.onclick=()=>{ linhas.push(novaLinha()); aoSalvar(); focarUltima=chave; aoEstrutura(); };
  if(!o.leitura) wrap.appendChild(b);
  if(focarUltima===chave){ focarUltima=null; setTimeout(()=>{ tw.scrollTop=tw.scrollHeight; const f=tb.lastElementChild&&tb.lastElementChild.querySelector("input,select,textarea"); f&&f.focus(); },0); }
  return wrap;
}
function celula(row, c, tr, colunas, aoSalvar, aoMudar){
  const v=row[c.campo]??"";
  if(c.tipo==="calc"){ const s=el("span","ro"); s.textContent=c.calc(row); return s; }
  let inp;
  if(c.tipo==="select"){
    inp=el("select");
    let ops=(typeof c.opcoes==="function"?c.opcoes(row):c.opcoes).map(x=>Array.isArray(x)?x:[x,x]);
    if(!c.semVazio) ops=[["",c.vazio||""],...ops];
    if(v && !ops.some(x=>x[0]===v)) ops.push([v,v]);
    inp.innerHTML=ops.map(([val,rot])=>`<option value="${esc(val)}"${val===v?" selected":""}>${esc(rot)}</option>`).join("");
  } else if(c.tipo==="textarea"){ inp=el("textarea"); inp.rows=2; inp.value=v; }
  else { inp=el("input"); inp.type=c.tipo||"text"; inp.value=v; if(c.tipo==="number"){ inp.min="0"; inp.step="any"; inp.style.minWidth="64px"; } if(c.lista) inp.setAttribute("list",c.lista); }
  if(c.placeholder) inp.placeholder=c.placeholder;
  inp.setAttribute("aria-label",c.label);
  const aplicar=()=>{ row[c.campo]=inp.value;
    colunas.filter(x=>x.tipo==="calc").forEach(x=>{ const s=tr.querySelector(`td[data-campo="${x.campo}"] .ro`); if(s) s.textContent=x.calc(row); });
    aoSalvar(); };
  const digitando=["text","textarea","number",undefined].includes(c.tipo);
  if(digitando) inp.addEventListener("input",aplicar);
  inp.addEventListener("change",()=>{ if(!digitando) aplicar(); aoMudar&&aoMudar(row,c); });
  return inp;
}
// "colar passos": uma linha = um passo (tira numeração tipo "1.", "2)", "-", "•")
function colarPassos(texto){
  return String(texto||"").split(/\r?\n/).map(l=>l.replace(/^\s*(\d+[\.\)\-:]|[-•*–])\s*/,"").trim()).filter(Boolean);
}

// ═══════════════════════════════════════════════════════════════════
// Excel (ExcelJS sob demanda) e impressão
// ═══════════════════════════════════════════════════════════════════
let _xl=null;
function excelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!_xl) _xl=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    s.onload=()=>res(window.ExcelJS); s.onerror=()=>{ _xl=null; rej(new Error("não consegui carregar a biblioteca de Excel (sem internet?)")); }; document.head.appendChild(s); });
  return _xl;
}
function baixarBlob(b,nome){ const u=URL.createObjectURL(b),a=document.createElement("a"); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
async function excelMulti(nomeArquivo, abas){
  const X=await excelJS(), wb=new X.Workbook();
  abas.forEach(({nome,colunas,linhas})=>{
    const ws=wb.addWorksheet(nome.slice(0,31));
    ws.addRow(colunas.map(c=>c[1]));
    ws.getRow(1).eachCell(c=>{ c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF2B2A27"}}; c.alignment={vertical:"middle",wrapText:true}; });
    linhas.forEach(l=>ws.addRow(colunas.map(c=>l[c[0]]??"")));
    colunas.forEach((c,i)=>{ const maior=Math.max(String(c[1]).length,...linhas.map(l=>String(l[c[0]]??"").length)); ws.getColumn(i+1).width=Math.max(10,Math.min(60,maior+2)); });
    ws.views=[{state:"frozen",ySplit:1}];
    if(linhas.length) ws.autoFilter={from:{row:1,column:1},to:{row:1,column:colunas.length}};
  });
  baixarBlob(new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), nomeArquivo+".xlsx");
}

function renderPainel(c){
  const tot={conforme:0,divergente:0,semIT:0,naoFeito:0,pendente:0,horas:0}, porArea={};
  let criticos=0, criticosVal=0, comDono=0, validados=0, oportAtivas=0, horasPot=0, horasDev=0;
  const todasOp=[];
  PROCS.forEach(p=>{ const d=p.dados, R=confronto(d);
    ["conforme","divergente","semIT","naoFeito","pendente"].forEach(k=>tot[k]+=R[k].length); tot.horas+=R.horasMes;
    const EF=estadoFases(p);
    if(d.criticidade==="Alta"){ criticos++; if(EF.f3.ok) criticosVal++; }
    if(tx(d.dono)) comDono++; if(EF.f3.ok) validados++;
    const a=tx(d.area)||"(sem área)"; const A=porArea[a]=porArea[a]||{n:0,val:0,conf:0,cls:0,gaps:0,horas:0};
    A.n++; if(EF.f3.ok) A.val++; A.fases=A.fases||{}; const fk=EF.atual||"fim"; A.fases[fk]=(A.fases[fk]||0)+1; A.conf+=R.conforme.length; A.cls+=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length; A.gaps+=R.gaps; A.horas+=R.horasMes;
    d.oportunidades.forEach(o=>{ if(o.status==="Descartada") return; oportAtivas++; horasPot+=num(o.horas_mes); if(o.status==="Concluída") horasDev+=num(o.horas_mes); todasOp.push({p,o}); });
  });
  const totCls=tot.conforme+tot.divergente+tot.semIT+tot.naoFeito;
  const meta=(rot,v,alvo,sub)=>{ const x=alvo?Math.min(1,v/alvo):0;
    return `<div class="kpi"><span>${esc(rot)}</span><b>${typeof v==="number"&&alvo===1?pct(v):esc(String(v))}${alvo!==1&&alvo?`<span style="font-size:14px;color:var(--muted)"> / ${alvo}</span>`:""}</b><div class="barra"><i style="width:${Math.round(x*100)}%"></i></div><small>${esc(sub)}</small></div>`; };
  c.innerHTML=`
    <p class="cap">Conhecer a empresa antes de automatizar a empresa. Cada processo levantado ponta a ponta e confrontado com a Instrução de Trabalho.</p>
    <h3>Resultado do confronto (todos os processos)</h3>
    <div class="cat4">${Object.entries(CAT).map(([k,v])=>`<div class="cat"><b>${tot[k]}</b><span>${v.ico} ${esc(v.rot)}</span></div>`).join("")}</div>
    ${tot.pendente?`<div class="aviso">⏳ ${tot.pendente} passo(s) ligado(s) à IT ainda sem classificação (Conforme/Divergente).</div>`:""}
    <div class="kpis">
      <div class="kpi"><span>Índice de conformidade geral</span><b>${pct(totCls?tot.conforme/totCls:null)}</b><small>conformes ÷ (conformes + divergentes + sem IT + não feitos)</small></div>
      <div class="kpi"><span>Processos mapeados</span><b>${PROCS.length}</b><small>${validados} validado(s) pela área</small></div>
      <div class="kpi"><span>Horas/mês consumidas</span><b>${horas(tot.horas)}</b><small>soma de tempo × frequência dos passos reais</small></div>
      <div class="kpi"><span>Horas/mês a devolver</span><b>${horas(horasPot)}</b><small>${horas(horasDev)} já devolvidas (oportunidades concluídas)</small></div>
    </div>
    <h3>Metas 2027</h3>
    <div class="kpis">
      ${meta("Processos críticos mapeados e validados", criticos?criticosVal/criticos:0, 1, `${criticosVal} de ${criticos} com criticidade Alta`)}

  R.semIT.forEach(({real:r})=>{ L.push(`<div class="it vaz">— sem passo na IT —</div><div><span class="pill p-azul">➕ sem IT</span> <b>${r._n}.</b> ${esc(r.descricao)}</div>`); });

// ═══════════════════════════════════════════════════════════════════
// AS 7 FASES DA METODOLOGIA
//  F1 Visão macro e arquitetura  → por ÁREA: botão "100% mapeado"
//  F2 Levantamento AS IS         → Registrar / Como é feito hoje / IT atual
//  F3 Validação do AS IS         → a área confirma o levantamento
//  F4 Diagnóstico                → confronto com a IT + oportunidades
//  F5 Desenho TO BE              → pendências + construção da nova IT
//  F6 Validação do TO BE         → aprovado = passa a ser regra (trava)
//  F7 Planejar implantação       → plano de ações (fecho do objetivo)
// ═══════════════════════════════════════════════════════════════════
const FASES=[["f1","Visão macro e arquitetura","identificacao"],["f2","Levantamento AS IS","real"],["f3","Validação do AS IS","validacao"],
  ["f4","Diagnóstico","confronto"],["f5","Desenho TO BE","tobe"],["f6","Validação do TO BE","validacao_tobe"],["f7","Planejar implantação","implantacao"]];
const TIPOS_PEND=["Nova regra","Alterar passo","Novo passo","Eliminar passo","Novo fluxo","Automação","Dúvida"];
const STATUS_PEND=["Aberta","Em discussão","Definida","Descartada"];
const MUDANCA=["Mantido","Ajustado","Novo","Automatizado"];
const STATUS_ACAO=["A fazer","Em andamento","Concluída","Bloqueada"];
const nrm=s=>tx(s).toLowerCase().replace(/\s+/g," ");
const agoraISO=()=>new Date().toISOString();

// ── Arquitetura: um documento especial (dados._tipo="arquitetura") guarda as áreas ──
let CFG=null;
function docPorId(id){ return CFG&&CFG.id===id ? CFG : procPorId(id); }
function areasCfg(){ return CFG ? CFG.dados.areas : []; }
function areaCfg(nome){ return areasCfg().find(a=>nrm(a.nome)===nrm(nome)); }
async function garantirCfg(){
  if(CFG) return CFG;
  const {r,j}=await api(API,{method:"POST",body:JSON.stringify({dados:{_tipo:"arquitetura",areas:[]}})});
  if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
  CFG=j; if(!Array.isArray(CFG.dados.areas)) CFG.dados.areas=[]; return CFG;
}
async function areaGarantida(nome){
  await garantirCfg(); let a=areaCfg(nome);
  if(!a){ a={nome:tx(nome),responsavel:"",mapeado:false,mapeado_por:"",mapeado_em:"",obs:""}; CFG.dados.areas.push(a); }
  return a;
}
async function gravarCfg(){
  clearTimeout(pend[CFG.id]); await enfileirar(CFG);
  if(CFG._conflito){ const atual=CFG._conflito; CFG={...atual,_conflito:null}; if(!Array.isArray(CFG.dados.areas)) CFG.dados.areas=[];
    alert("Outra pessoa alterou as áreas ao mesmo tempo. A tela foi atualizada com a versão dela — repita a última ação."); }
}
async function marcarArea(nome, valor){
  const n=PROCS.filter(x=>nrm(x.dados.area)===nrm(nome)).length;
  if(valor && !n){ alert("Cadastre pelo menos um processo nesta área antes de marcar como 100% mapeada."); return; }
  if(valor && !confirm(`Confirmar que TODOS os processos da área "${nome}" estão cadastrados (${n} processo(s))?\n\nIsso conclui a Fase 1 dessa área.`)) return;
  const a=await areaGarantida(nome);
  Object.assign(a,{mapeado:valor,mapeado_por:valor?USUARIO_NOME:"",mapeado_em:valor?agoraISO():""});
  await gravarCfg(); render();
}

// ── estado de cada fase de um processo ──
function estadoFases(p){
  const d=p.dados, a=areaCfg(d.area), E={}, F=d.fases;
  const feita=st=>({ok:true,por:st.por||"",em:st.em||""});
  E.f1 = a&&a.mapeado ? {ok:true,por:a.mapeado_por,em:a.mapeado_em} : {ok:false,and:!!tx(d.area)};
  E.f2 = F.f2.concluido ? feita(F.f2) : {ok:false,and:d.passos_real.some(r=>tx(r.descricao))||ETAPAS_LEV.some(([id])=>d.etapas[id]&&d.etapas[id].feito)};
  E.f3 = String(d.validacao.parecer||"").startsWith("Validado") ? {ok:true,por:d.validacao.por,em:d.validacao.data} : {ok:false,and:!!d.validacao.parecer};
  E.f4 = F.f4.concluido ? feita(F.f4) : {ok:false,and:d.oportunidades.length>0||d.passos_real.some(r=>r.it_ref)};
  E.f5 = F.f5.concluido ? feita(F.f5) : {ok:false,and:d.tobe.passos.length>0||d.tobe.pendencias.length>0};
  E.f6 = String(d.validacao_tobe.parecer||"").startsWith("Aprovado") ? {ok:true,por:d.validacao_tobe.por,em:d.validacao_tobe.data} : {ok:false,and:!!d.validacao_tobe.parecer};
  E.f7 = F.f7.concluido ? feita(F.f7) : {ok:false,and:d.implantacao.acoes.length>0};
  // a Fase 1 é da ÁREA e corre em paralelo; a "fase atual" do processo é a 1ª pendente entre a 2 e a 7
  E.atual=null; for(const [id] of FASES.slice(1)) if(!E[id].ok){ E.atual=id; break; }
  return E;
}
function idxFase(id){ return FASES.findIndex(f=>f[0]===id); }
function rotuloFase(p){ const E=estadoFases(p); if(!E.atual) return "Concluído"; const i=idxFase(E.atual); return `Fase ${i+1} · ${FASES[i][1]}`; }
function pillFase(p){ const E=estadoFases(p), i=E.atual?idxFase(E.atual):7; return `<span class="sit ${!E.atual?"fim":i<=2?"exec":"val"}">${esc(rotuloFase(p))}</span>`; }
function textoFase(e){ return e.ok?"Concluída":e.and?"Em andamento":"A fazer"; }

// caixa de controle da fase (F2, F4, F5, F7 são concluídas por botão)
function painelFase(p, fid, dica, aviso){
  const d=p.dados, i=idxFase(fid), st=d.fases[fid], box=el("div","fase-box");
  box.innerHTML = st.concluido
    ? `<b>Fase ${i+1} — ${esc(FASES[i][1])}</b> <span class="pill p-ok">Concluída</span> <span class="muted">${esc(dataBR(st.em))} · ${esc(st.por||"—")}</span><button type="button" class="peq">Reabrir fase</button>`
    : `<b>Fase ${i+1} — ${esc(FASES[i][1])}</b> <span class="pill p-azul">Em andamento</span> <span class="muted">${esc(dica)}</span>${aviso?`<span class="msg erro">${esc(aviso)}</span>`:""}<button type="button" class="primary peq">✓ Marcar fase como concluída</button>`;
  box.querySelector("button").onclick=()=>{
    if(st.concluido){ if(!confirm("Reabrir esta fase?")) return; Object.assign(st,{concluido:false,por:"",em:""}); }
    else { if(aviso && !confirm(aviso+"\n\nConcluir a fase mesmo assim?")) return; Object.assign(st,{concluido:true,por:USUARIO_NOME,em:agoraISO()}); }
    salvar(p); render(); };
  return box;
}
function painelArea(p){
  const d=p.dados, box=el("div","fase-box");
  if(!tx(d.area)){ box.innerHTML=`<b>Fase 1 — Visão macro e arquitetura</b> <span class="muted">Informe abaixo a área deste processo.</span>`; return box; }
  const a=areaCfg(d.area), n=PROCS.filter(x=>nrm(x.dados.area)===nrm(d.area)).length;
  box.innerHTML = a&&a.mapeado
    ? `<b>Fase 1 — Área ${esc(d.area)}</b> <span class="pill p-ok">100% mapeado</span> <span class="muted">${n} processo(s) · validado por ${esc(a.mapeado_por||"—")} em ${esc(dataBR(a.mapeado_em))}</span><button type="button" class="peq">Desfazer</button>`
    : `<b>Fase 1 — Área ${esc(d.area)}</b> <span class="pill p-azul">Em mapeamento</span> <span class="muted">${n} processo(s) cadastrado(s). Quando todos os processos da área estiverem cadastrados, valide:</span><button type="button" class="primary peq">✓ 100% mapeado</button>`;
  box.querySelector("button").onclick=()=>marcarArea(d.area,!(a&&a.mapeado));
  return box;
}

// ── tabela somente leitura (TO BE aprovado vira regra: não se edita) ──
function celulaLeitura(row,c){
  const s=el("span","ro"); s.style.whiteSpace="pre-wrap"; s.style.color="var(--ink)";
  let v=c.tipo==="calc"?c.calc(row):(row[c.campo]??"");
  if(c.tipo==="select"){ const ops=(typeof c.opcoes==="function"?c.opcoes(row):c.opcoes).map(x=>Array.isArray(x)?x:[x,x]); const f=ops.find(x=>x[0]===v); if(f) v=f[1]; }
  s.textContent=v||"—"; return s;
}

// ═══ FASE 1 — Áreas e arquitetura (visão geral) ═══
async function criarProcessos(area, macro, crit, nomes){
  for(const nome of nomes){
    const dados=normalizar({codigo:proximoCodigo(),nome,area,macroprocesso:macro,criticidade:crit});
    const {r,j}=await api(API,{method:"POST",body:JSON.stringify({dados})});
    if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    j.dados=normalizar(j.dados); PROCS.push(j);
  }
}
function renderArquitetura(c){
  const porArea={}; PROCS.forEach(p=>{ const a=tx(p.dados.area)||"(sem área)"; (porArea[a]=porArea[a]||[]).push(p); });
  const nomes=ordenar([...new Set([...Object.keys(porArea),...areasCfg().map(a=>a.nome),...ATIV_DIAG.filter(x=>pendentesDoDiag(x.nome).lista.length).map(x=>x.nome)])]);
  const reais=nomes.filter(n=>n!=="(sem área)"), feitas=reais.filter(n=>areaCfg(n)&&areaCfg(n).mapeado).length;
  const totPend=ATIV_DIAG.reduce((a,x)=>a+pendentesDoDiag(x.nome).lista.length,0);
  const vazias=AREAS_PADRAO.filter(a=>!nomes.some(n=>nrm(n)===nrm(a)));
  const foraOrg=BASE?reais.filter(n=>!setorOficial(n)):[];   // [v3.4] áreas digitadas que não são setor do Organograma
  c.innerHTML=`<p class="cap">Fase 1 — cadastre os processos de cada área (pode ser só o nome, o resto vem no levantamento). Quando a área tiver <b>todos</b> os processos cadastrados, quem fez o mapeamento marca <b>✓ 100% mapeado</b>.</p>
    <div class="kpis"><div class="kpi"><span>Áreas com processos</span><b>${reais.length}</b><small>de ${new Set([...reais,...AREAS_PADRAO]).size} áreas conhecidas</small></div>
      <div class="kpi"><span>Áreas 100% mapeadas</span><b>${feitas}</b><div class="barra"><i style="width:${reais.length?Math.round(feitas/reais.length*100):0}%"></i></div><small>Fase 1 concluída</small></div>
      <div class="kpi"><span>Processos cadastrados</span><b>${PROCS.length}</b><small>${PROCS.filter(p=>p.dados.criticidade==="Alta").length} com criticidade Alta</small></div></div>
    ${totPend?`<p class="aviso">🗺️ <b>${totPend} atividade(s) levantadas no Diagnóstico</b> ainda não viraram processo. Elas aparecem em cada área abaixo — clique numa para criar o processo e mapear o passo a passo e o fluxograma.</p>`:""}
    <div class="acoes"><input id="arNova" list="dl-areas" placeholder="Nome de uma nova área" style="max-width:320px"><button type="button" id="arAdd">+ Adicionar área</button><span class="msg" id="arMsg"></span></div>
    ${foraOrg.length?`<div class="conflito" style="margin:10px 0"><b>${foraOrg.length} área(s) com processos não existem no Organograma:</b> ${foraOrg.map(esc).join(", ")}.<br><span style="font-size:12px">Para ligar ao cadastro oficial, renomeie a área nos processos para o nome do setor do Organograma (ou cadastre o setor lá).</span></div>`:""}
    <div id="arLista"></div>
    ${vazias.length?`<h3>Áreas ainda sem processos</h3><div class="mini4">${vazias.map(a=>`<button type="button" class="peq" data-nova="${esc(a)}">+ ${esc(a)}</button>`).join("")}</div>`:""}`;
  const addArea=async nome=>{ nome=tx(nome); if(!nome) return; await areaGarantida(nome); await gravarCfg(); estArq.aberta=nome; render(); };
  $("#arAdd",c).onclick=()=>addArea($("#arNova").value);
  c.querySelectorAll("[data-nova]").forEach(b=>b.onclick=()=>addArea(b.dataset.nova));
  const lista=$("#arLista",c);
  nomes.forEach(nome=>{
    const procs=(porArea[nome]||[]).slice().sort((a,b)=>String(a.dados.macroprocesso+a.dados.codigo).localeCompare(String(b.dados.macroprocesso+b.dados.codigo),"pt-BR",{numeric:true}));
    const a=areaCfg(nome), semArea=nome==="(sem área)", porFase={};
    procs.forEach(p=>{ const k=estadoFases(p).atual||"fim"; porFase[k]=(porFase[k]||0)+1; });
    const box=el("details","box"); box.open = estArq.aberta===nome;
    box.ontoggle=()=>{ if(box.open) estArq.aberta=nome; };
    box.innerHTML=`<summary><span style="font:700 17px 'IBM Plex Sans Condensed',sans-serif">${esc(nome)}</span> &nbsp;
        ${semArea?'<span class="pill p-warn">defina a área destes processos</span>':a&&a.mapeado?`<span class="pill p-ok">✓ 100% mapeado</span> <span class="muted" style="font-size:12.5px">${esc(a.mapeado_por||"")} · ${esc(dataBR(a.mapeado_em))}</span>`:'<span class="pill p-azul">Em mapeamento</span>'}
        <span class="muted" style="font-size:12.5px"> · ${procs.length} processo(s) ${FASES.slice(1).map(([id],i)=>porFase[id]?` · F${i+2}: ${porFase[id]}`:"").join("")}${porFase.fim?` · concluídos: ${porFase.fim}`:""}</span></summary>
      ${semArea?"":`<div class="acoes"><label class="f" style="flex-direction:row;align-items:center;gap:8px;margin:0">Responsável pelo mapeamento da área <input data-resp style="width:240px" value="${esc(a?a.responsavel:"")}"></label>
        <button type="button" data-cem class="${a&&a.mapeado?"":"primary"}">${a&&a.mapeado?"Desfazer 100% mapeado":"✓ 100% mapeado"}</button></div>`}
      ${(()=>{ const pd=pendentesDoDiag(nome); if(!pd.lista.length) return "";
        return `<div class="box" style="background:var(--paper);border-style:dashed"><b>🗺️ Atividades do Diagnóstico ainda sem processo (${pd.lista.length})</b>
          <p class="cap" style="margin:4px 0 6px">Levantadas no inventário do Diagnóstico de ${esc(pd.dep.nome)}. Cada uma pode virar um processo para detalhar o passo a passo e o fluxograma.</p>
          <div class="ativ-diag">${pd.lista.map((a,i)=>`<span class="chip-at">${esc(a.atividade)}${a.subsetor?` <small>· ${esc(a.subsetor)}</small>`:""}<button type="button" class="peq" data-novo-at="${i}">Criar processo</button></span>`).join("")}</div>
          ${pd.lista.length>1?`<button type="button" class="peq" data-todas-at>Criar as ${pd.lista.length} de uma vez</button>`:""}</div>`; })()}
      ${procs.length?`<div class="scroll"><table class="lista"><thead><tr><th>Código</th><th>Processo</th><th>Macroprocesso</th><th>Criticidade</th><th>Fase atual</th></tr></thead><tbody>${
        procs.map(p=>`<tr class="clic" data-id="${p.id}"><td class="id">${esc(p.dados.codigo)}</td><td>${esc(p.dados.nome)}</td><td>${esc(p.dados.macroprocesso||"—")}</td><td>${pillCrit(p.dados.criticidade)}</td><td>${pillFase(p)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Nenhum processo cadastrado nesta área ainda.</p>'}
      ${semArea?"":`<div class="box" style="background:var(--paper)"><b>Cadastrar processos nesta área</b><p class="cap" style="margin:4px 0 10px">Um processo por linha. Dá para colar uma lista inteira de uma vez.</p>
        <div class="grade"><label class="f">Macroprocesso (opcional)<input data-macro list="dl-macro" placeholder="Ex.: Pós-venda"></label>
        <label class="f">Criticidade<select data-crit>${opts(CRITICIDADE,"Média",false)}</select></label></div>
        <label class="f" style="margin-top:10px">Processos<textarea data-nomes rows="4" placeholder="Troca de produto&#10;Devolução com reembolso&#10;Assistência técnica"></textarea></label>
        <div class="acoes"><button type="button" class="primary" data-criar>Cadastrar processos</button><span class="msg" data-msg></span></div></div>`}`;
    box.querySelectorAll("tr.clic").forEach(tr=>tr.onclick=()=>ir("processo",tr.dataset.id,"linha"));
    const pd=pendentesDoDiag(nome);
    box.querySelectorAll("[data-novo-at]").forEach(b=>b.onclick=()=>novoDaAtividade(pd.dep,pd.lista[+b.dataset.novoAt]));
    const todas=box.querySelector("[data-todas-at]");
    if(todas) todas.onclick=async()=>{ if(!confirm(`Criar ${pd.lista.length} processo(s) a partir das atividades do Diagnóstico de ${pd.dep.nome}?`)) return; todas.disabled=true;
      try{ for(const a of pd.lista){ const dados=normalizar({codigo:proximoCodigo(),nome:a.atividade,area:pd.dep.nome,macroprocesso:a.subsetor||"",origem:{dep:pd.dep.id,atividade:a.atividade,subsetor:a.subsetor||""}});
          const {r,j}=await api(API,{method:"POST",body:JSON.stringify({dados})}); if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`); j.dados=normalizar(j.dados); PROCS.push(j); }
        estArq.aberta=nome; render(); }catch(e){ alert(e.message); todas.disabled=false; } };
    const cem=box.querySelector("[data-cem]"); if(cem) cem.onclick=()=>marcarArea(nome,!(a&&a.mapeado));
    const resp=box.querySelector("[data-resp]"); if(resp) resp.onchange=async()=>{ const ar=await areaGarantida(nome); ar.responsavel=tx(resp.value); await gravarCfg(); };
    const criar=box.querySelector("[data-criar]");
    if(criar) criar.onclick=async()=>{ const lst=colarPassos(box.querySelector("[data-nomes]").value), m=box.querySelector("[data-msg]");
      if(!lst.length){ m.className="msg erro"; m.textContent="Escreva pelo menos um nome de processo."; return; }
      criar.disabled=true; m.className="msg"; m.textContent="Cadastrando…";
      try{ await criarProcessos(nome,tx(box.querySelector("[data-macro]").value),box.querySelector("[data-crit]").value,lst);
        if(!areaCfg(nome)){ await areaGarantida(nome); await gravarCfg(); }
        estArq.aberta=nome; render(); }
      catch(e){ m.className="msg erro"; m.textContent=e.message; criar.disabled=false; } };
    lista.appendChild(box);
  });
  if(!nomes.length) lista.innerHTML='<p class="aviso">Nenhuma área ainda. Adicione uma área acima ou clique numa das áreas sugeridas abaixo.</p>';
}
const estArq={aberta:""};

// ═══ FASE 5 — Desenho TO BE: pendências + construção da nova IT ═══
function abaToBe(c,p,d,sv){
  const tb=d.tobe, E=estadoFases(p), travado=E.f6.ok, R=confronto(d);
  c.innerHTML=`<p class="cap">O TO BE é discutido e aprovado depois do diagnóstico. Aqui ficam as <b>pendências</b> (o que precisa ser decidido) e a <b>nova Instrução de Trabalho</b>, construída aos poucos com as novas regras, passos e fluxo.</p>
    ${travado?`<p class="banner">✅ TO BE aprovado em ${esc(dataBR(d.validacao_tobe.data))} por ${esc(d.validacao_tobe.por||"—")} — <b>passou a ser regra</b>. Para alterar, reabra a Validação do TO BE.</p>`:""}
    <h3>Pendências a discutir</h3><p class="cap">Cada pendência termina como <b>Definida</b> (com a decisão) ou <b>Descartada</b>. O TO BE só pode ser aprovado com todas resolvidas.</p>
    <div class="acoes" id="tbAc"></div><div id="tbPend"></div>
    <h3>Nova Instrução de Trabalho</h3>
    <div class="grade"><label class="f">Código da nova IT<input id="tbCod" value="${esc(tb.codigo||d.it.codigo||"")}" ${travado?"disabled":""}></label>
      <label class="f">Versão / revisão<input id="tbVer" value="${esc(tb.versao)}" ${travado?"disabled":""}></label></div>
    <label class="f" style="margin-top:12px">Objetivo e escopo<textarea id="tbObj" rows="2" ${travado?"disabled":""}>${esc(tb.objetivo)}</textarea></label>
    <h3>Passos da nova IT</h3><div id="tbIni"></div><div id="tbPassos"></div>
    <label class="f" style="margin-top:14px">Regras gerais (o que passa a valer)<textarea id="tbReg" rows="5" ${travado?"disabled":""} placeholder="Ex.: Toda troca precisa de protocolo no SAC antes do reenvio.">${esc(tb.regras)}</textarea></label>
    <label class="f" style="margin-top:12px">Fluxo / exceções / observações<textarea id="tbFlu" rows="4" ${travado?"disabled":""}>${esc(tb.fluxo)}</textarea></label>
    <div class="acoes"><button type="button" id="tbPdf">${ICO.imprimir} Imprimir nova IT (PDF)</button></div>`;
  if(!travado){ [["tbCod","codigo"],["tbVer","versao"],["tbObj","objetivo"],["tbReg","regras"],["tbFlu","fluxo"]].forEach(([id,k])=>ligar(c,id,tb,k,sv)); }
  $("#tbPdf",c).onclick=()=>imprimir(`Nova IT — ${tb.codigo||d.codigo}`,novaITHTML(p));
  const ac=$("#tbAc",c);
  if(!travado){
    const b1=el("button"); b1.type="button"; b1.textContent="Trazer gaps do diagnóstico"; ac.appendChild(b1);
    const b2=el("button"); b2.type="button"; b2.textContent="Trazer oportunidades"; ac.appendChild(b2);
    const m=el("span","msg"); ac.appendChild(m);
    const ja=()=>new Set(tb.pendencias.map(x=>x.origem).filter(Boolean));
    const nova=(origem,tipo,desc,txtOrig)=>({id:uid(),origem,origem_txt:txtOrig,tipo,descricao:desc,responsavel:"",prazo:"",status:"Aberta",decisao:"",autor:USUARIO_NOME,criado_em:agoraISO()});
    b1.onclick=()=>{ const J=ja(); let n=0;
      R.divergente.forEach(({real:r,it:i})=>{ if(J.has("div:"+r.id)) return; tb.pendencias.push(nova("div:"+r.id,"Alterar passo",`Feito diferente da IT (IT nº ${i._n}): ${tx(r.descricao)}${r.diferenca?` — ${tx(r.diferenca)}`:""}. Qual será a regra?`,"Gap: feito diferente")); n++; });
      R.semIT.forEach(({real:r})=>{ if(J.has("sem:"+r.id)) return; tb.pendencias.push(nova("sem:"+r.id,"Novo passo",`Feito sem IT: ${tx(r.descricao)}. Entra na nova IT ou deixa de ser feito?`,"Gap: feito sem IT")); n++; });
      R.naoFeito.forEach(({it:i})=>{ if(J.has("nao:"+i.id)) return; tb.pendencias.push(nova("nao:"+i.id,"Eliminar passo",`Na IT e não é feito (IT nº ${i._n}): ${tx(i.descricao)}. Passa a ser feito ou sai da IT?`,"Gap: não é feito")); n++; });
      sv(); render(); };
    b2.onclick=()=>{ const J=ja(); let n=0;
      d.oportunidades.filter(o=>o.status!=="Descartada"&&tx(o.descricao)).forEach(o=>{ if(J.has("op:"+o.id)) return;
        tb.pendencias.push(nova("op:"+o.id,["Integração","Ganho de tempo","Trabalho repetido"].includes(o.tipo)?"Automação":o.tipo==="Gap de IT"?"Alterar passo":"Nova regra",tx(o.descricao),`Oportunidade (${o.tipo})`)); n++; });
      sv(); render(); };
  }
  $("#tbPend",c).appendChild(tabela({chave:"pend",linhas:tb.pendencias,aoSalvar:sv,aoEstrutura:render,leitura:travado,rotuloAdd:"+ Adicionar pendência",
    novaLinha:()=>({id:uid(),origem:"",origem_txt:"Manual",tipo:"Nova regra",descricao:"",responsavel:"",prazo:"",status:"Aberta",decisao:"",autor:USUARIO_NOME,criado_em:agoraISO()}),
    colunas:[{campo:"tipo",label:"Tipo",tipo:"select",opcoes:TIPOS_PEND,semVazio:true},{campo:"descricao",label:"O que precisa ser decidido",tipo:"textarea",largura:280},

      {campo:"status",label:"Status",tipo:"select",opcoes:STATUS_PEND,semVazio:true},{campo:"decisao",label:"Decisão / nova regra",tipo:"textarea",largura:240}]}));
  const ini=$("#tbIni",c);
  if(!travado && !tb.passos.length){
    ini.innerHTML=`<p class="aviso">Comece a nova IT a partir de uma base e ajuste: <button type="button" id="tbDaIT">Copiar da IT atual</button> <button type="button" id="tbDoReal">Copiar de como é feito hoje</button> — ou adicione passo a passo abaixo.</p>`;
    $("#tbDaIT",c).onclick=()=>{ d.passos_it.filter(x=>tx(x.descricao)).forEach(x=>tb.passos.push({id:uid(),descricao:x.descricao,quem:x.quem,sistema:x.sistema,regra:x.regra,mudanca:"Mantido"})); sv(); render(); };
    $("#tbDoReal",c).onclick=()=>{ d.passos_real.filter(x=>tx(x.descricao)).forEach(x=>tb.passos.push({id:uid(),descricao:x.descricao,quem:x.quem,sistema:x.sistema,regra:"",mudanca:"Mantido"})); sv(); render(); };
  }
  $("#tbPassos",c).appendChild(tabela({chave:"tbp",linhas:tb.passos,numerar:true,ordenavel:true,aoSalvar:sv,aoEstrutura:render,leitura:travado,rotuloAdd:"+ Adicionar passo",
    novaLinha:()=>({id:uid(),descricao:"",quem:"",sistema:"",regra:"",mudanca:"Novo"}),
    colunas:[{campo:"descricao",label:"Passo (como passa a ser feito)",tipo:"textarea",largura:320},{campo:"quem",label:"Quem faz",lista:"dl-quem",largura:120},
      {campo:"sistema",label:"Sistema",lista:"dl-sistemas",largura:110},{campo:"regra",label:"Regra / controle",tipo:"textarea",largura:200},
      {campo:"mudanca",label:"Em relação a hoje",tipo:"select",opcoes:MUDANCA,semVazio:true}]}));
}
function novaITHTML(p){
  const d=p.dados, tb=d.tobe, v=d.validacao_tobe;
  return `<h1>${esc(tb.codigo||"Nova IT")} — ${esc(d.nome)}</h1>
    <p>Versão: <b>${esc(tb.versao||"—")}</b> · Área: <b>${esc(d.area||"—")}</b> · Responsável: <b>${esc(d.dono||"—")}</b> · ${String(v.parecer||"").startsWith("Aprovado")?`<b>Aprovada</b> em ${esc(v.data)} por ${esc(v.por)}`:"<b>Rascunho — em aprovação</b>"}</p>
    ${tb.objetivo?`<h2>Objetivo e escopo</h2><p>${esc(tb.objetivo)}</p>`:""}
    <h2>Passos</h2><table><tr><th>#</th><th>Passo</th><th>Quem</th><th>Sistema</th><th>Regra / controle</th></tr>${tb.passos.filter(x=>tx(x.descricao)).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.descricao)}</td><td>${esc(x.quem)}</td><td>${esc(x.sistema)}</td><td>${esc(x.regra)}</td></tr>`).join("")}</table>
    ${tb.regras?`<h2>Regras gerais</h2><p style="white-space:pre-wrap">${esc(tb.regras)}</p>`:""}
    ${tb.fluxo?`<h2>Fluxo / exceções</h2><p style="white-space:pre-wrap">${esc(tb.fluxo)}</p>`:""}
    ${tb.pendencias.some(x=>x.status==="Definida")?`<h2>Decisões tomadas</h2><table><tr><th>Tipo</th><th>Pendência</th><th>Decisão</th></tr>${tb.pendencias.filter(x=>x.status==="Definida").map(x=>`<tr><td>${esc(x.tipo)}</td><td>${esc(x.descricao)}</td><td>${esc(x.decisao)}</td></tr>`).join("")}</table>`:""}`;
}

// ═══ FASE 6 — Validação do TO BE (aprovado = passa a ser regra) ═══
function abaValidToBe(c,p,d,sv){
  const v=d.validacao_tobe, tb=d.tobe;
  const abertas=tb.pendencias.filter(x=>!["Definida","Descartada"].includes(x.status)).length;
  const semPassos=!tb.passos.some(x=>tx(x.descricao));
  const bloqueio = abertas ? `Ainda há ${abertas} pendência(s) do TO BE sem decisão (Aberta / Em discussão).` : semPassos ? "A nova IT ainda não tem passos." : "";
  const aprovado=String(v.parecer||"").startsWith("Aprovado");
  c.innerHTML=`<p class="cap">Com tudo definido, a nova Instrução de Trabalho é aprovada e <b>passa a ser regra</b>. Depois de aprovada, ela fica travada para edição.</p>
    ${bloqueio&&!aprovado?`<p class="banner">⚠️ ${esc(bloqueio)} Resolva no <b>Desenho TO BE</b> antes de aprovar.</p>`:""}
    <div class="grade"><label class="f">Aprovado por (nome / cargo)<input id="vtPor" value="${esc(v.por)}"></label>
      <label class="f">Data<input type="date" id="vtData" value="${esc(v.data)}"></label>
      <label class="f">Parecer<select id="vtPar"><option value=""></option>${["Aprovado — passa a ser regra","Aprovado com ajustes — passa a ser regra","Reprovado — rever o desenho"].map(o=>`<option${o===v.parecer?" selected":""}${o.startsWith("Aprovado")&&bloqueio&&o!==v.parecer?" disabled":""}>${esc(o)}</option>`).join("")}</select></label></div>
    <label class="f" style="margin-top:12px">Comentários / ajustes pedidos<textarea id="vtObs" rows="4">${esc(v.obs)}</textarea></label>
    <div class="acoes"><button type="button" id="vtPdf">${ICO.imprimir} Ver a nova IT (PDF)</button></div>`;
  ligar(c,"vtPor",v,"por",sv); ligar(c,"vtData",v,"data",sv,"change"); ligar(c,"vtObs",v,"obs",sv);
  $("#vtPdf",c).onclick=()=>imprimir(`Nova IT — ${tb.codigo||d.codigo}`,novaITHTML(p));
  $("#vtPar",c).onchange=e=>{ v.parecer=e.target.value; v.registrado_por=USUARIO_NOME; v.registrado_em=agoraISO();
    if(v.parecer.startsWith("Aprovado")){ if(!v.data) v.data=hojeISO(); if(!d.fases.f5.concluido) Object.assign(d.fases.f5,{concluido:true,por:USUARIO_NOME,em:agoraISO()}); }
    if(v.parecer.startsWith("Reprovado")) Object.assign(d.fases.f5,{concluido:false,por:"",em:""});
    sv(); render(); };
}

// ═══ FASE 7 — Planejar implantação ═══
function abaImplantacao(c,p,d,sv){
  const im=d.implantacao, E=estadoFases(p), hoje=hojeISO();
  const atrasadas=im.acoes.filter(a=>a.prazo&&a.prazo<hoje&&a.status!=="Concluída").length;
  c.innerHTML=`<p class="cap">Fecho do objetivo inicial: o que precisa acontecer para o TO BE aprovado virar prática — com responsável, prazo e dependência.</p>

// ═══════════════════════════════════════════════════════════════════
// ROTEADOR DE LINHAS (ângulos retos) — a linha passa pelos espaços em
// branco e nunca por trás de um cartão/símbolo. A* numa grade esparsa
// formada pelas bordas dos obstáculos; cada curva custa mais, então ele
// prefere caminhos limpos, com poucas dobras.
//   a, b       : pontos {x,y} já fora dos obstáculos (pontas da linha)
//   obst       : [{x1,y1,x2,y2}] retângulos a evitar (já com folga)
//   lim        : {x1,y1,x2,y2} área permitida (opcional)
// devolve [{x,y},...] ou null se não achar caminho
// ═══════════════════════════════════════════════════════════════════
function rotearLinha(a, b, obst, lim){
  const M=260;
  const bx1=Math.min(a.x,b.x)-M, bx2=Math.max(a.x,b.x)+M, by1=Math.min(a.y,b.y)-M, by2=Math.max(a.y,b.y)+M;
  const rel=obst.filter(o=>o.x2>bx1&&o.x1<bx2&&o.y2>by1&&o.y1<by2);
  const dentro=(x,y)=>rel.some(o=>x>o.x1&&x<o.x2&&y>o.y1&&y<o.y2);
  if(dentro(a.x,a.y)||dentro(b.x,b.y)) return null;
  const xs=new Set([a.x,b.x]), ys=new Set([a.y,b.y]);
  rel.forEach(o=>{ xs.add(o.x1); xs.add(o.x2); ys.add(o.y1); ys.add(o.y2); });
  const meio=arr=>{ const v=[...arr].sort((p,q)=>p-q), out=new Set(v); for(let i=0;i<v.length-1;i++) if(v[i+1]-v[i]>24) out.add((v[i]+v[i+1])/2); return [...out].sort((p,q)=>p-q); };
  let X=meio(xs), Y=meio(ys);
  if(lim){ X=X.filter(x=>x>=lim.x1&&x<=lim.x2); Y=Y.filter(y=>y>=lim.y1&&y<=lim.y2); }
  const nx=X.length, ny=Y.length, ia=X.indexOf(a.x), ja=Y.indexOf(a.y), ib=X.indexOf(b.x), jb=Y.indexOf(b.y);
  if(ia<0||ja<0||ib<0||jb<0) return null;
  const bloq=(x1,y1,x2,y2)=>{ if(y1===y2){ const lo=Math.min(x1,x2), hi=Math.max(x1,x2); return rel.some(o=>y1>o.y1&&y1<o.y2&&hi>o.x1&&lo<o.x2); }
    const lo=Math.min(y1,y2), hi=Math.max(y1,y2); return rel.some(o=>x1>o.x1&&x1<o.x2&&hi>o.y1&&lo<o.y2); };
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1]], CURVA=36;
  const chave=(i,j,d)=>(i*ny+j)*5+d;
  const custo=new Map(), veio=new Map(), heap=[];
  const push=(f,k)=>{ heap.push([f,k]); let n=heap.length-1; while(n>0){ const p=(n-1)>>1; if(heap[p][0]<=heap[n][0]) break; [heap[p],heap[n]]=[heap[n],heap[p]]; n=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let n=0; for(;;){ const l=2*n+1, r=l+1; let m=n;
    if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===n) break; [heap[m],heap[n]]=[heap[n],heap[m]]; n=m; } } return top; };
  const h=(i,j)=>Math.abs(X[i]-b.x)+Math.abs(Y[j]-b.y);
  const k0=chave(ia,ja,4); custo.set(k0,0); push(h(ia,ja),k0);
  let fim=null, passos=0;
  while(heap.length&&passos<60000){ passos++;
    const [,k]=pop(), d=k%5, ij=(k-d)/5, i=Math.floor(ij/ny), j=ij%ny, g=custo.get(k);
    if(i===ib&&j===jb){ fim=k; break; }
    DIRS.forEach(([di,dj],nd)=>{ const ni=i+di, nj=j+dj; if(ni<0||nj<0||ni>=nx||nj>=ny) return;
      if(d!==4&&(nd^1)===d&&(nd>>1)===(d>>1)) return;          // não volta pelo mesmo caminho
      if(dentro(X[ni],Y[nj])||bloq(X[i],Y[j],X[ni],Y[nj])) return;
      const nk=chave(ni,nj,nd), ng=g+Math.abs(X[ni]-X[i])+Math.abs(Y[nj]-Y[j])+(d!==4&&d!==nd?CURVA:0);
      if(ng<(custo.has(nk)?custo.get(nk):Infinity)){ custo.set(nk,ng); veio.set(nk,k); push(ng+h(ni,nj),nk); } });
  }
  if(fim==null) return null;
  const pts=[]; for(let k=fim;k!=null;k=veio.get(k)){ const d=k%5, ij=(k-d)/5; pts.push({x:X[Math.floor(ij/ny)],y:Y[ij%ny]}); }
  pts.reverse();
  return simplificarPontos(pts);
}
function simplificarPontos(pts){
  const out=[];
  pts.forEach(p=>{ if(out.length&&out[out.length-1].x===p.x&&out[out.length-1].y===p.y) return;
    if(out.length>=2){ const a=out[out.length-2], b=out[out.length-1];
      if((a.x===b.x&&b.x===p.x)||(a.y===b.y&&b.y===p.y)){ out[out.length-1]=p; return; } }
    out.push(p); });
  return out;
}
function caminhoSVG(pts){ return pts.map((p,i)=>(i?"L":"M")+Math.round(p.x)+" "+Math.round(p.y)).join(""); }
function segmentoCruza(p1,p2,obst){ return obst.some(o=>{
  if(p1.y===p2.y){ const lo=Math.min(p1.x,p2.x), hi=Math.max(p1.x,p2.x); return p1.y>o.y1&&p1.y<o.y2&&hi>o.x1&&lo<o.x2; }
  const lo=Math.min(p1.y,p2.y), hi=Math.max(p1.y,p2.y); return p1.x>o.x1&&p1.x<o.x2&&hi>o.y1&&lo<o.y2; }); }

// ═══════════════════════════════════════════════════════════════════
// [NOVO v3.5] FLUXOGRAMA EM RAIAS (swimlane) — AS IS e TO BE
// Cada raia é quem executa (pessoa, função ou subsetor). Símbolos na
// notação usual de fluxograma. Arraste os símbolos; puxe uma ligação
// pelos pontos ● da borda; arraste o ponto do meio de uma ligação para
// desviá-la; clique duas vezes para editar textos.
// Dados: d.fluxo = {asis:{raias,nos,ligacoes}, tobe:{...}}
//   raia    {id,nome}
//   nó      {id,tipo,texto,raia,x,ry}   (ry = altura dentro da raia)
//   ligação {id,de,para,ds,ps,rotulo,via:{x,y}|null}  (ds/ps = lado)

const RAIA_W=150, RAIA_MIN=150, FX_FOLGA=10;
const SIMB={
  inicio:{nome:"Início",w:120,h:46,fill:"#E1F2E7",stroke:"#2F7D4F"},
  fim:{nome:"Fim",w:120,h:46,fill:"#F9E2E2",stroke:"#B83232"},
  processo:{nome:"Processo / atividade",w:160,h:66,fill:"#FFFFFF",stroke:"#2E4A7A"},
  decisao:{nome:"Decisão",w:150,h:100,fill:"#FBF1D9",stroke:"#C98A0B"},
  entrada:{nome:"Entrada / saída (dados)",w:160,h:62,fill:"#E1EBF8",stroke:"#2B63B0"},
  documento:{nome:"Documento",w:150,h:70,fill:"#FFFFFF",stroke:"#4A5568"},
  subprocesso:{nome:"Subprocesso",w:160,h:66,fill:"#E3EAF5",stroke:"#2E4A7A"},
  espera:{nome:"Espera / atraso",w:130,h:60,fill:"#EEE7F8",stroke:"#6B46A8"},
  sistema:{nome:"Sistema / banco de dados",w:130,h:76,fill:"#EEF0F3",stroke:"#4A5568"},
  manual:{nome:"Operação manual",w:150,h:60,fill:"#FFFFFF",stroke:"#4A5568"},
  conector:{nome:"Conector",w:46,h:46,fill:"#FFFFFF",stroke:"#2E4A7A"},
  nota:{nome:"Anotação",w:160,h:60,fill:"none",stroke:"#7A8599"},
};
const fxNormalizar=d=>{ if(!d.fluxo||typeof d.fluxo!=="object") d.fluxo={};
  ["asis","tobe"].forEach(v=>{ const F=d.fluxo[v]=d.fluxo[v]||{}; ["raias","nos","ligacoes"].forEach(k=>{ if(!Array.isArray(F[k])) F[k]=[]; }); }); };

function fxGeom(F){
  const nos={}; F.nos.forEach(n=>{ const S=SIMB[n.tipo]||SIMB.processo; nos[n.id]={n,w:S.w,h:S.h}; });
  let y=0; const raias=F.raias.map(r=>{ const dentro=F.nos.filter(n=>n.raia===r.id);
    const h=Math.max(RAIA_MIN,...dentro.map(n=>(n.ry||0)+(SIMB[n.tipo]||SIMB.processo).h+30)); const o={...r,y,h}; y+=h; return o; });
  const topo={}; raias.forEach(r=>topo[r.id]=r.y);
  Object.values(nos).forEach(o=>{ o.x=o.n.x; o.y=(topo[o.n.raia]??0)+(o.n.ry||0); });
  const W=Math.max(1100,...Object.values(nos).map(o=>o.x+o.w+180)), H=Math.max(y,RAIA_MIN);

}
function fxPorta(o,lado){ return lado==="top"?{x:o.x+o.w/2,y:o.y}:lado==="bottom"?{x:o.x+o.w/2,y:o.y+o.h}:lado==="left"?{x:o.x,y:o.y+o.h/2}:{x:o.x+o.w,y:o.y+o.h/2}; }
function fxFora(p,lado,dist){ return lado==="top"?{x:p.x,y:p.y-dist}:lado==="bottom"?{x:p.x,y:p.y+dist}:lado==="left"?{x:p.x-dist,y:p.y}:{x:p.x+dist,y:p.y}; }
function fxLadoAuto(a,b){ const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2, dx=bx-ax, dy=by-ay;
  if(Math.abs(dx)>=Math.abs(dy)*0.8) return dx>=0?["right","left"]:["left","right"];
  return dy>=0?["bottom","top"]:["top","bottom"]; }
function fxLadoProximo(o,p){ const c=[["top",Math.abs(p.y-o.y)],["bottom",Math.abs(p.y-(o.y+o.h))],["left",Math.abs(p.x-o.x)],["right",Math.abs(p.x-(o.x+o.w))]]; return c.sort((a,b)=>a[1]-b[1])[0][0]; }
function fxRotas(F,G){
  const obst=Object.values(G.nos).map(o=>({x1:o.x-FX_FOLGA,y1:o.y-FX_FOLGA,x2:o.x+o.w+FX_FOLGA,y2:o.y+o.h+FX_FOLGA}));
  obst.push({x1:-1e5,y1:-1e5,x2:RAIA_W+4,y2:1e5});
  const lim={x1:RAIA_W+6,y1:-60,x2:G.W+200,y2:G.H+80};
  const out={};
  F.ligacoes.forEach(l=>{ const A=G.nos[l.de], B=G.nos[l.para]; if(!A||!B) return;
    const auto=fxLadoAuto(A,B), ds=l.ds||auto[0], ps=l.ps||auto[1];
    const pa=fxPorta(A,ds), pb=fxPorta(B,ps), a2=fxFora(pa,ds,FX_FOLGA+8), b2=fxFora(pb,ps,FX_FOLGA+8);
    let meio=null;
    if(l.via){ const r1=rotearLinha(a2,l.via,obst,lim), r2=rotearLinha(l.via,b2,obst,lim); if(r1&&r2) meio=[...r1,...r2.slice(1)]; }
    if(!meio) meio=rotearLinha(a2,b2,obst,lim);
    if(!meio) meio=[a2,{x:b2.x,y:a2.y},b2];
    out[l.id]=simplificarPontos([pa,...meio,pb]);

}
function fxQuebrar(t,w,h,fs){
  const max=Math.max(4,Math.floor((w-14)/(fs*0.56))), maxL=Math.max(1,Math.floor((h-8)/(fs*1.25)));
  const pal=String(t||"").replace(/\s+/g," ").trim().split(" "), L=[]; let cur="";
  pal.forEach(p=>{ if((cur+" "+p).trim().length<=max) cur=(cur+" "+p).trim(); else { if(cur) L.push(cur); cur=p.length>max?p.slice(0,max-1)+"…":p; } });
  if(cur) L.push(cur);
  if(L.length>maxL){ L.length=maxL; L[maxL-1]=L[maxL-1].replace(/.{0,2}$/,"")+"…"; }
  return L;
}
function fxForma(tipo,w,h){
  const S=SIMB[tipo]||SIMB.processo, st=`fill="${S.fill}" stroke="${S.stroke}" stroke-width="1.6"`;
  switch(tipo){
    case "inicio": case "fim": return `<rect width="${w}" height="${h}" rx="${h/2}" ${st}/>`;
    case "decisao": return `<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" ${st}/>`;
    case "entrada": return `<polygon points="18,0 ${w},0 ${w-18},${h} 0,${h}" ${st}/>`;
    case "manual": return `<polygon points="0,0 ${w},0 ${w-16},${h} 16,${h}" ${st}/>`;
    case "documento": return `<path d="M0 0H${w}V${h-10}Q${w*0.75} ${h-24} ${w/2} ${h-10}T0 ${h-10}Z" ${st}/>`;
    case "subprocesso": return `<rect width="${w}" height="${h}" rx="3" ${st}/><line x1="10" y1="0" x2="10" y2="${h}" stroke="${S.stroke}" stroke-width="1.4"/><line x1="${w-10}" y1="0" x2="${w-10}" y2="${h}" stroke="${S.stroke}" stroke-width="1.4"/>`;
    case "espera": return `<path d="M0 0H${w-h/2}A${h/2} ${h/2} 0 0 1 ${w-h/2} ${h}H0Z" ${st}/>`;
    case "sistema": return `<path d="M0 9V${h-9}A${w/2} 9 0 0 0 ${w} ${h-9}V9" ${st}/><ellipse cx="${w/2}" cy="9" rx="${w/2}" ry="9" ${st}/>`;
    case "conector": return `<circle cx="${w/2}" cy="${h/2}" r="${w/2}" ${st}/>`;
    case "nota": return `<rect width="${w}" height="${h}" fill="#FFFFFF" fill-opacity=".6" stroke="none"/><path d="M14 0H0V${h}H14" fill="none" stroke="${S.stroke}" stroke-width="1.6"/>`;
    default: return `<rect width="${w}" height="${h}" rx="6" ${st}/>`;
  }
}
function fxTexto(n,w,h){
  const fs=n.tipo==="conector"?13:12.5, area={decisao:[w*0.68,h*0.62],entrada:[w-34,h],manual:[w-30,h],documento:[w,h-14],sistema:[w,h-16],subprocesso:[w-22,h]}[n.tipo]||[w,h];
  const L=fxQuebrar(n.texto||SIMB[n.tipo].nome,area[0],area[1],fs), cy=(n.tipo==="documento"?(h-12)/2:n.tipo==="sistema"?h/2+5:h/2)-(L.length-1)*fs*0.62;
  const ax=n.tipo==="nota"?{x:12,a:"start"}:{x:w/2,a:"middle"};
  return `<text x="${ax.x}" y="${cy}" text-anchor="${ax.a}" dominant-baseline="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="${fs}" fill="#1B2436" font-weight="${["inicio","fim","conector"].includes(n.tipo)?600:400}">${L.map((l,i)=>`<tspan x="${ax.x}" dy="${i?fs*1.25:0}">${esc(l)}</tspan>`).join("")}</text>`;
}
// desenha o fluxograma inteiro (também usado no PDF e na exportação)
function svgFluxo(F, op={}){
  const G=fxGeom(F), R=fxRotas(F,G), sel=op.sel||{};
  let s=`<svg xmlns="http://www.w3.org/2000/svg" ${op.id?`id="${op.id}"`:""} viewBox="0 0 ${G.W} ${G.H}" width="${G.W*(op.zoom||1)}" height="${G.H*(op.zoom||1)}" font-family="IBM Plex Sans, Arial, sans-serif">
    <defs><marker id="fxSeta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5568"/></marker>
    <marker id="fxSetaSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B63B0"/></marker></defs>
    <rect width="${G.W}" height="${G.H}" fill="#FFFFFF"/>`;
  G.raias.forEach((r,i)=>{ const ativa=sel.tipo==="raia"&&sel.id===r.id;
    s+=`<rect x="0" y="${r.y}" width="${G.W}" height="${r.h}" fill="${i%2?"#FFFFFF":"#F7F9FC"}" stroke="#D9DEE7"/>
      <g class="fx-raia-cab" data-r="${r.id}"><rect x="0" y="${r.y}" width="${RAIA_W}" height="${r.h}" fill="${ativa?"#CFDDF2":"#E3EAF5"}" stroke="#B8C4D8"/>
      ${fxQuebrar(r.nome,RAIA_W-10,r.h,13).map((l,k,arr)=>`<text x="${RAIA_W/2}" y="${r.y+r.h/2-(arr.length-1)*8+k*16}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1B2436">${esc(l)}</text>`).join("")}</g>`; });
  if(!G.raias.length) s+=`<text x="${G.W/2}" y="70" text-anchor="middle" font-size="14" fill="#7A8599">Crie uma raia (quem executa) e adicione os símbolos.</text>`;
  F.ligacoes.forEach(l=>{ const pts=R[l.id]; if(!pts) return; const ativo=sel.tipo==="lig"&&sel.id===l.id, d=caminhoSVG(pts);
    s+=`<path d="${d}" fill="none" stroke="${ativo?"#2B63B0":"#4A5568"}" stroke-width="${ativo?2.4:1.6}" stroke-linejoin="round" marker-end="url(#${ativo?"fxSetaSel":"fxSeta"})"/>`;
    if(op.edicao) s+=`<path class="fx-hit" data-l="${l.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14" style="cursor:pointer"/>`;

function fxGerar(d,ver){
  const fonte=(ver==="asis"?d.passos_real:d.tobe.passos).filter(x=>tx(x.descricao));
  const nomes=[]; fonte.forEach(x=>{ const q=tx(x.quem)||"Executante"; if(!nomes.some(n=>nrm(n)===nrm(q))) nomes.push(q); });
  if(!nomes.length) nomes.push("Executante");
  const raias=nomes.map(n=>({id:uid(),nome:n})), rid=q=>raias.find(r=>nrm(r.nome)===nrm(tx(q)||"Executante")).id;
  const nos=[], ligacoes=[]; let x=RAIA_W+40;
  const add=(tipo,texto,raia)=>{ const S=SIMB[tipo]; const n={id:uid(),tipo,texto,raia,x,ry:Math.round((RAIA_MIN-S.h)/2)}; nos.push(n); x+=S.w+56; return n; };
  let ant=add("inicio","Início",fonte.length?rid(fonte[0].quem):raias[0].id);
  fonte.forEach(p=>{ const t=tx(p.descricao), tipo=/\?\s*$/.test(t)?"decisao":"processo"; const n=add(tipo,t,rid(p.quem)); ligacoes.push({id:uid(),de:ant.id,para:n.id,rotulo:""}); ant=n; });
  const f=add("fim","Fim",ant.raia); ligacoes.push({id:uid(),de:ant.id,para:f.id,rotulo:""});
  return {raias,nos,ligacoes};
}

        <div class="ic-macro"><b>${pct(R.indice)}</b><span>conforme a IT (${R.conforme.length} de ${cls})</span></div><div class="ic-track track"><i style="width:${w}%"></i></div>
        <div class="mini4">${Object.entries(CAT).map(([k,v])=>`<span class="pill ${v.pill}" title="${esc(v.rot)}">${v.ico} ${R[k].length}</span>`).join("")}</div>
        <div class="ic-rodape">${pillFase(p)}<span>v${p.versao} · ${esc(dataBR(p.atualizado_em))}</span></div></button>`; }).join("");
    g.querySelectorAll(".item-card").forEach(b=>b.onclick=()=>{ const p=procPorId(b.dataset.id); ir("processo",b.dataset.id, registrosDo(p).length?"linha":"registrar"); });
  };

  $("#fArea",c).onchange=e=>{ filtro.area=e.target.value; desenhar(); };
  $("#fStatus",c).onchange=e=>{ filtro.status=e.target.value; desenhar(); };
  desenhar();
}

    : secProc==="tobe" ? painelFase(p,"f5","Conclua quando a nova IT estiver pronta para ir à aprovação.", pendAbertas?`${pendAbertas} pendência(s) ainda sem decisão.`:"")
    : secProc==="implantacao" ? painelFase(p,"f7","Conclua quando o plano estiver completo, com responsável e prazo em cada ação.", d.implantacao.acoes.some(a=>!tx(a.responsavel)||!a.prazo)?"Há ações sem responsável ou sem prazo.":"")

}
