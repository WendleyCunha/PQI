<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Digital King Star — como é feito hoje × Instrução de Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ Mesmo padrão visual do RG do Pedido (IBM Plex, papel, aço, menu vertical) ═══ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9;
  --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8; --block:#6B46A8; --block-soft:#EEE7F8;
  --idle:#8A93A3; --idle-soft:#EEF0F3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17;
    --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442;
    --idle:#8A93A3; --idle-soft:#262D3A;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17;
  --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48; --block:#B79AE6; --block-soft:#2E2442;
  --idle:#8A93A3; --idle-soft:#262D3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
h3{font-size:16px;margin:20px 0 8px;font-weight:600}
.wrap{max-width:none;margin:0;padding:24px 28px 64px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-in .who{color:var(--ink-3);font-size:13px;margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.salvando{background:var(--amber)} .dot.erro{background:var(--bad)}
.who.erro{color:var(--bad)}
button,.btn{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ink-3)}
button.primary,.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
button.warn,.btn.perigo{color:var(--bad)}
.btn.peq{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.item-card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button[hidden]{display:none}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:6px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.banner:empty{display:none}
.cap{color:var(--ink-3);font-size:13px;margin:2px 0 12px;max-width:80ch}
.muted{color:var(--ink-3)}
code{background:var(--rule-2);border-radius:4px;padding:0 5px;font-size:12.5px}

/* cabeçalho do documento + carimbo (igual ao RG) */
.doc-head{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px 32px}
.doc-head h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.doc-head .obj{margin:10px 0 0;color:var(--ink-2);max-width:68ch}
.stamp{border:2px solid var(--steel);border-radius:8px;padding:10px 14px;min-width:230px;align-self:start}
.stamp .code{font:700 20px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.stamp dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.stamp dt{color:var(--ink-3)} .stamp dd{margin:0;font-weight:500}
.sit{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.sit.exec{background:var(--prog-soft);color:var(--prog)} .sit.val{background:var(--amber-soft);color:var(--amber)}
.sit.fim{background:var(--ok-soft);color:var(--ok)} .sit.susp{background:var(--bad-soft);color:var(--bad)}

/* resumo: medidor + contagens */
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) 3fr;gap:16px;margin-top:16px}
.meter{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.meter .big{font:700 46px/1 "IBM Plex Sans Condensed",sans-serif}
.meter .lbl{color:var(--ink-3);font-size:13px;margin-top:4px}
.track{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;background:var(--ok)}
.counts{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font:700 26px/1 "IBM Plex Sans Condensed",sans-serif}
.count span{color:var(--ink-2);font-size:13px}

/* seções */
section{margin-top:34px}
section:first-child{margin-top:0}
section > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
section h2{margin:0;font-size:22px;font-weight:700}
section > header p{margin:0;color:var(--ink-3);font-size:13px}
section > header .add{margin-left:auto}

/* linha de vida */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);overflow-x:auto;padding-bottom:6px}
.link{position:relative;padding:0 6px}
.link::before{content:"";position:absolute;top:19px;left:0;right:0;height:3px;background:var(--rule)}
.link:first-child::before{left:50%} .link:last-child::before{right:50%}
.link.st-ok::before{background:var(--ok)}
.knot{position:relative;width:40px;height:40px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font:700 15px/1 "IBM Plex Sans Condensed",sans-serif;border:3px solid var(--idle);background:var(--sheet);color:var(--idle)}
.link .nm{text-align:center;font:600 14px/1.25 "IBM Plex Sans Condensed",sans-serif;margin-top:8px}
.link .st{text-align:center;margin-top:6px}
.link .doc{text-align:center;font-size:12px;color:var(--ink-3);margin-top:4px;word-break:break-word}
.st-ok .knot{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.st-bad .knot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.st-warn .knot{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.st-prog .knot{border-color:var(--prog);color:var(--prog);background:var(--prog-soft)}
.st-block .knot{border-color:var(--block);color:var(--block);background:var(--block-soft)}
.chain-detail{margin-top:14px}
.legenda-chain{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}

/* tabelas (leitura e edição) */
.scroll,.tbl-wrap{overflow-x:auto}
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
table{width:100%;border-collapse:collapse;background:var(--sheet);font-size:14px}
table.lista,table.tbl{min-width:760px}
.scroll > table,.tbl-wrap > table{border:0}
th{text-align:left;font:600 13px/1.3 "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2);background:var(--rule-2);padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:bottom;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.id{font-weight:600;color:var(--ink-3);white-space:nowrap}
table.tbl td{padding:3px 4px}
table.tbl input,table.tbl select,table.tbl textarea{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:5px;padding:6px 7px;width:100%;min-width:70px}
table.tbl textarea{min-height:36px;resize:vertical}
table.tbl input:hover,table.tbl select:hover,table.tbl textarea:hover{border-color:var(--rule)}
table.tbl input:focus,table.tbl select:focus,table.tbl textarea:focus{border-color:var(--amber);background:color-mix(in srgb,var(--amber-soft) 35%,var(--sheet));outline:none}
table.tbl .ro{display:block;padding:7px;color:var(--ink-3);white-space:nowrap}
table.tbl td.acts{white-space:nowrap;width:1%}
.ib{background:none;border:0;padding:5px 7px;font-size:13px;opacity:.6;border-radius:5px}
.ib:hover{opacity:1;background:var(--rule-2)} .ib.del:hover{background:var(--bad-soft);color:var(--bad)}
td.vazio{color:var(--ink-3);text-align:center;padding:18px}
table.lista tr.clic{cursor:pointer} table.lista tr.clic:hover td{background:var(--rule-2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--amber-soft);color:var(--amber)} .p-azul{background:var(--prog-soft);color:var(--prog)}
.p-cinza{background:var(--idle-soft);color:var(--ink-2)} .p-block{background:var(--block-soft);color:var(--block)}

/* campos */
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:7px 9px;width:100%}
textarea{min-height:58px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0}
details.box > summary{cursor:pointer;font-weight:600;font-size:14px}
details.box[open] > summary{margin-bottom:10px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.msg{font-size:13px} .msg.ok{color:var(--ok)} .msg.erro{color:var(--bad)}
.aviso{margin:10px 0;padding:10px 14px;border-radius:6px;background:var(--steel-soft);color:var(--ink);font-size:14px}
.conflito{margin:0 0 16px;padding:12px 14px;border-radius:6px;background:var(--bad-soft);color:var(--ink);font-size:14px;border:1px solid var(--bad)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.filtros .inp,.filtros select,.filtros input{width:auto;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.kpi > span{color:var(--ink-3);font-size:13px}
.kpi b{display:block;font:700 30px/1.1 "IBM Plex Sans Condensed",sans-serif;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.barra{height:6px;background:var(--rule-2);border-radius:4px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--steel)}
.cat4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.cat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.cat b{display:block;font:700 30px/1 "IBM Plex Sans Condensed",sans-serif}
.cat span{color:var(--ink-2);font-size:13px}
.mini4{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.etapas{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.etapa{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px}
.etapa.feita{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 50%,var(--sheet))}
.etapa label.ck{display:flex;gap:8px;align-items:center;font:600 14px "IBM Plex Sans Condensed",sans-serif;cursor:pointer}
.etapa input[type=checkbox]{width:16px;height:16px;accent-color:var(--steel)}
.etapa p{font-size:12px;color:var(--ink-3);margin:4px 0 8px}
.conf4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bloco{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.bloco h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.bloco ol{margin:0;padding-left:20px} .bloco li{margin:5px 0;font-size:14px}
.bloco li small{display:block;color:var(--ink-3);font-size:12.5px}
.lado{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.lado > div{padding:9px 12px;border-bottom:1px solid var(--rule-2);font-size:14px}
.lado > .h{background:var(--rule-2);font:600 13px "IBM Plex Sans Condensed",sans-serif;color:var(--ink-2)}
.lado > .it{border-right:1px solid var(--rule-2)} .lado .vaz{color:var(--ink-3);font-style:italic}

/* registrar */
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.tipo{text-align:left;padding:10px 12px;line-height:1.3;border-radius:8px}
.tipo b{display:block;font:600 14px "IBM Plex Sans Condensed",sans-serif;margin-top:2px}
.tipo small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tipo.ativo{border-color:var(--steel);background:var(--steel-soft);color:var(--steel)}
.campos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.campos .full{grid-column:1/-1}
.campos textarea.grande{min-height:130px;font-size:15px;line-height:1.55}
.rascunho{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.editando-faixa{background:var(--amber-soft);border-radius:6px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.hist-filtro{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.hist-filtro button{padding:6px 11px;font-size:12.5px;border-radius:999px}
.hist-filtro button.ativo{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
.registro{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.registro.recente{border-color:var(--steel);box-shadow:inset 3px 0 0 var(--steel)}
.registro .topo-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.registro .topo-r .acs{margin-left:auto;display:flex}
.registro p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
.registro .det{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.vazio-h{color:var(--ink-3);text-align:center;padding:28px 10px;border:1px dashed var(--rule);border-radius:8px}
.reg-dupla{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}

/* lista de processos (tela inicial — igual "Itens em teste" do RG) */
.lista-topo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.lista-topo h1{margin:0;font-size:28px}
.lista-topo p{margin:4px 0 0;color:var(--ink-3);font-size:13px;flex-basis:100%}
.lista-acoes{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.lista-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item-card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s;text-align:left;width:100%;font:inherit;color:inherit}
.item-card:hover{border-color:var(--steel)}
.item-card .ic-codigo{font:700 17px/1.1 "IBM Plex Sans Condensed",sans-serif;color:var(--steel)}
.item-card .ic-item{font-size:14px;color:var(--ink);margin-top:3px;font-weight:500}
.item-card .ic-area{font-size:12.5px;color:var(--ink-3)}
.item-card .ic-macro{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.item-card .ic-macro b{font:700 24px/1 "IBM Plex Sans Condensed",sans-serif}
.item-card .ic-macro span{color:var(--ink-3);font-size:12px}
.item-card .ic-track{margin-top:8px}
.item-card .ic-rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--ink-3);gap:8px}
.vazio-lista{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:50px 0}

/* casca do item aberto: menu vertical + conteúdo (igual ao RG) */
.shell-item{display:flex;align-items:flex-start;gap:22px}
.side-rg{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 8px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.side-btn{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;
  color:var(--ink-3);font-size:10.5px;line-height:1.2;text-align:center;position:relative}
.side-btn svg{width:20px;height:20px;flex:none}
.side-btn:hover{background:var(--rule-2);color:var(--ink-2)}
.side-btn.ativo{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.side-btn .n{position:absolute;top:4px;right:6px;font-size:10px;font-weight:600;background:var(--rule-2);color:var(--ink-2);border-radius:8px;padding:0 5px}
.side-btn.ativo .n{background:var(--steel);color:var(--sheet)}
.side-sep{width:70%;height:1px;background:var(--rule);margin:4px 0}
.conteudo-item{flex:1;min-width:0}

dialog{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:22px;max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h3{margin:0 0 12px;font-size:20px}
dialog label.f{margin:10px 0 0}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
footer.doc-foot{margin-top:40px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule);padding-top:10px}

@media (max-width:860px){
  .doc-head{grid-template-columns:1fr;padding:20px} .doc-head h1{font-size:26px}
  .summary,.reg-dupla{grid-template-columns:1fr}
  .shell-item{flex-direction:column}
  .side-rg{width:100%;flex-direction:row;overflow-x:auto;position:static}
  .side-btn{width:auto;min-width:76px} .side-sep{width:1px;height:40px;margin:0 4px}
  .cat4,.conf4,.etapas,.tipos{grid-template-columns:1fr 1fr} .campos,.lado{grid-template-columns:1fr}
  .wrap{padding:18px 14px 50px} .bar-in{padding:10px 14px}
}
@media print{
  .bar,.side-rg,.lista-acoes,.acoes,.tipos,.hist-filtro{display:none!important}
  body{background:#fff;color:#000} .wrap{padding:0} .shell-item{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <button id="btnVoltar" type="button" hidden>← Processos</button>
  <span class="who" id="who"><i class="dot" id="dot"></i><span id="whoTxt">Carregando…</span></span>
  <span id="barAcoes" style="display:contents"></span>
</div></div>
<div class="wrap">
  <p class="banner" id="banner"></p>
  <div id="root"><p class="cap">Carregando processos…</p></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// COMO OS DADOS FICAM
// Um documento por PROCESSO no Firestore (coleção mapa_processos).
// O servidor não conhece os campos: campo novo = só mexer AQUI.
//
// O CONFRONTO é calculado, ninguém digita a classificação final:
//   passo real ligado a um passo da IT + "Conforme"   → ✅ feito conforme
//   passo real ligado a um passo da IT + "Divergente" → ⚠️ feito diferente
//   passo real SEM ligação a passo da IT              → ➕ feito sem IT
//   passo da IT que nenhum passo real usa             → ❌ na IT e não é feito
// ═══════════════════════════════════════════════════════════════════
const API = "/api/mapa/processos";
const AREAS_PADRAO = ["Comercial","Lojas","Financeiro","Faturamento / Fiscal","Logística","Expedição","Estoque","Compras","SAC / CX","Qualidade","RH","Marketing","TI","Diretoria"];
const STATUS_PROC = ["Em levantamento","Em validação","Validado","Revisar"];
const CRITICIDADE = ["Alta","Média","Baixa"];
const ETAPAS_LEV = [
  ["conversar","Conversar","Reunião com quem executa, não só com quem chefia"],
  ["acompanhar","Acompanhar","Ver o processo rodando no dia a dia, como é de verdade"],
  ["registrar","Registrar","Passo a passo: quem faz, com qual sistema, gerando qual dado"],
  ["cruzar","Cruzar","Comparar com os chamados que a área mais abre"],
  ["validar","Validar","A área confirma e assume o processo como seu"],
];
const TIPOS_OPORT = ["Dor","Trabalho repetido","Ganho de tempo","Integração","Indicador","Risco","Gap de IT"];
const STATUS_OPORT = ["Identificada","Em análise","Em execução","Concluída","Descartada"];
const ESCALA = ["1","2","3","4","5"];
const CAT = {
  conforme:  {rot:"Feito conforme a IT",   ico:"✅", pill:"p-ok"},
  divergente:{rot:"Feito diferente da IT", ico:"⚠️", pill:"p-warn"},
  semIT:     {rot:"Feito sem IT",          ico:"➕", pill:"p-azul"},
  naoFeito:  {rot:"Na IT e não é feito",   ico:"❌", pill:"p-bad"},
};

// ─── utilidades ───
const $ = (s, r=document) => r.querySelector(s);
function el(t, c){ const e=document.createElement(t); if(c) e.className=c; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tx(v){ return String(v==null?"":v).trim(); }
function num(v){ const n=parseFloat(String(v??"").replace(",",".")); return isNaN(n)?0:n; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pct(x){ return x==null ? "—" : Math.round(x*100)+"%"; }
function hojeISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dataBR(v){ if(!v) return "—"; const d=new Date(v); if(isNaN(d)) return v; return d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:v.length>10?"short":undefined}); }
function ordenar(a){ return a.slice().sort((x,y)=>x.localeCompare(y,"pt-BR")); }
function opts(arr, atual, vazio=true){ return (vazio?'<option value=""></option>':"")+arr.map(o=>`<option${o===atual?" selected":""}>${esc(o)}</option>`).join(""); }
function horas(v){ return (Math.round(v*10)/10).toLocaleString("pt-BR"); }

// ═══════════════════════════════════════════════════════════════════
// Dados e gravação (um processo por vez, com controle de versão)
// ═══════════════════════════════════════════════════════════════════
let PROCS = [];
const pend = {};
async function api(url, op={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},cache:"no-store",...op});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ sessaoExpirada(); throw new Error("sessão expirada"); }
  return {r,j};
}
function sessaoExpirada(){
  $("#root").innerHTML='<div class="conflito"><b>Sua sessão expirou.</b> Entre de novo pelo Painel para continuar. <a href="/" target="_top" style="color:var(--gold-soft)">Ir para o Painel</a></div>';
}
function procPorId(id){ return PROCS.find(p=>p.id===id); }

function salvar(p){
  setStatus("salvando");
  clearTimeout(pend[p.id]);
  pend[p.id]=setTimeout(()=>enfileirar(p), 800);
}
function enfileirar(p, forcar){
  delete pend[p.id];
  p._fila=(p._fila||Promise.resolve()).then(()=>enviar(p, forcar));
  return p._fila;
}
async function enviar(p, forcar){
  if(p._conflito && !forcar) return;
  try{
    const {r,j}=await api(`${API}/${p.id}`,{method:"PUT",body:JSON.stringify({dados:p.dados, versao: forcar?null:p.versao})});
    if(r.status===409){ p._conflito=j.atual; setStatus("erro","conflito de versão"); if(vista==="processo" && atual===p.id) render(); return; }
    if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    p.versao=j.versao; p.atualizado_por=j.atualizado_por; p.atualizado_em=j.atualizado_em; p._conflito=null;
    if(!Object.keys(pend).length) setStatus("ok");
  }catch(e){ if(e.message!=="sessão expirada") setStatus("erro", e.message); }
}
async function salvarTudo(){ await Promise.all(Object.keys(pend).map(id=>{ clearTimeout(pend[id]); return enfileirar(procPorId(id)); })); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") salvarTudo(); });
window.addEventListener("beforeunload",e=>{ if(Object.keys(pend).length){ salvarTudo(); e.preventDefault(); e.returnValue=""; } });

function normalizar(d){
  d=d||{};
  const base={codigo:"",nome:"",area:"",dono:"",objetivo:"",gatilho:"",entradas:"",saidas:"",sistemas:"",criticidade:"Média",status:"Em levantamento",
    entrevistados:"",chamados:"",etapas:{},it:{codigo:"",titulo:"",versao:"",data:"",link:"",obs:""},passos_it:[],passos_real:[],oportunidades:[],
    validacao:{por:"",data:"",parecer:"",obs:""},anotacoes:[]};
  for(const k in base) if(d[k]==null) d[k]=base[k];
  ETAPAS_LEV.forEach(([id])=>{ if(!d.etapas[id]) d.etapas[id]={feito:false,data:""}; });
  ["passos_it","passos_real","oportunidades","anotacoes"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; d[k].forEach(x=>{ if(!x.id) x.id=uid(); }); });
  return d;
}

// ═══════════════════════════════════════════════════════════════════
// O CONFRONTO (IT × real)
// ═══════════════════════════════════════════════════════════════════
function confronto(d){
  const it=d.passos_it.filter(p=>tx(p.descricao)), real=d.passos_real.filter(p=>tx(p.descricao));
  const porId={}; it.forEach((p,i)=>porId[p.id]={...p,_n:d.passos_it.indexOf(p)+1});
  const R={conforme:[],divergente:[],semIT:[],naoFeito:[],pendente:[]};
  const usados=new Set();
  real.forEach(r=>{
    const n=d.passos_real.indexOf(r)+1, alvo=r.it_ref&&porId[r.it_ref];
    if(!alvo) return R.semIT.push({real:{...r,_n:n}});
    usados.add(r.it_ref);
    const item={real:{...r,_n:n},it:alvo};
    if(r.aderencia==="Conforme") R.conforme.push(item);
    else if(r.aderencia==="Divergente") R.divergente.push(item);
    else R.pendente.push(item);
  });
  it.forEach(p=>{ if(!usados.has(p.id)) R.naoFeito.push({it:porId[p.id]}); });
  const totalClass=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length;
  R.indice = totalClass ? R.conforme.length/totalClass : null;                 // conformidade geral
  R.cobertura = it.length ? usados.size/it.length : null;                      // % da IT que é executada
  const lig=R.conforme.length+R.divergente.length;
  R.aderencia = lig ? R.conforme.length/lig : null;                            // dos executados, quantos conforme
  R.gaps = R.divergente.length+R.semIT.length+R.naoFeito.length;
  R.horasMes = d.passos_real.reduce((a,r)=>a+num(r.tempo_min)*num(r.vezes_mes),0)/60;
  return R;
}
function situacaoPassoIT(d, passo){
  const lig=d.passos_real.filter(r=>tx(r.descricao)&&r.it_ref===passo.id);
  if(!lig.length) return "Não executado";
  if(lig.some(r=>r.aderencia==="Divergente")) return "Executado com divergência";
  if(lig.every(r=>r.aderencia==="Conforme")) return "Executado conforme";
  return "Pendente de classificação";
}
function classePassoReal(d, r){
  const ok=r.it_ref && d.passos_it.some(p=>p.id===r.it_ref && tx(p.descricao));
  if(!ok) return "Feito sem IT";
  return r.aderencia==="Conforme" ? "Feito conforme a IT" : r.aderencia==="Divergente" ? "Feito diferente da IT" : "Pendente de classificação";
}
function score(o){ return num(o.volume)*num(o.tempo)*num(o.custo)*num(o.risco); }
function rotuloIT(d, id){ const i=d.passos_it.findIndex(p=>p.id===id); return i<0?"":`${i+1}. ${tx(d.passos_it[i].descricao)}`; }

// ═══════════════════════════════════════════════════════════════════
// Tabela editável
// colunas: {campo,label,tipo:text|textarea|select|number|date|calc,opcoes(array | fn → [valor,rotulo]),lista,placeholder,largura,calc}
// ═══════════════════════════════════════════════════════════════════
let focarUltima=null;
function tabela(o){
  const {chave, linhas, colunas, aoSalvar, aoMudar, aoEstrutura, novaLinha, ordenavel, rotuloAdd, numerar} = o;
  const wrap=el("div"), tw=el("div","tbl-wrap"), t=el("table","tbl");
  t.innerHTML="<thead><tr>"+(numerar?"<th>#</th>":"")+colunas.map(c=>`<th style="${c.largura?`min-width:${c.largura}px`:""}">${esc(c.label)}</th>`).join("")+"<th></th></tr></thead>";
  const tb=el("tbody");
  if(!linhas.length) tb.innerHTML=`<tr><td colspan="${colunas.length+2}" class="vazio">Nenhuma linha ainda.</td></tr>`;
  linhas.forEach((row,i)=>{
    const tr=el("tr");
    if(numerar){ const td=el("td"); td.innerHTML=`<span class="ro">${i+1}</span>`; tr.appendChild(td); }
    colunas.forEach(c=>{ const td=el("td"); td.dataset.campo=c.campo; td.appendChild(celula(row,c,tr,colunas,aoSalvar,aoMudar)); tr.appendChild(td); });
    const td=el("td","acts");
    if(ordenavel){
      const up=el("button","ib"); up.type="button"; up.textContent="↑"; up.title="Subir"; up.disabled=i===0;
      up.onclick=()=>{ [linhas[i-1],linhas[i]]=[linhas[i],linhas[i-1]]; aoSalvar(); aoEstrutura(); };
      const dn=el("button","ib"); dn.type="button"; dn.textContent="↓"; dn.title="Descer"; dn.disabled=i===linhas.length-1;
      dn.onclick=()=>{ [linhas[i+1],linhas[i]]=[linhas[i],linhas[i+1]]; aoSalvar(); aoEstrutura(); };
      td.append(up,dn);
    }
    const del=el("button","ib del"); del.type="button"; del.textContent="🗑"; del.title="Excluir linha";
    del.onclick=()=>{ if(o.confirmarExclusao && !confirm(o.confirmarExclusao(row))) return; linhas.splice(i,1); aoSalvar(); aoEstrutura(); };
    td.appendChild(del); tr.appendChild(td); tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); wrap.appendChild(tw);
  const b=el("button","btn"); b.type="button"; b.style.marginTop="8px"; b.textContent=rotuloAdd||"+ Adicionar linha";
  b.onclick=()=>{ linhas.push(novaLinha()); aoSalvar(); focarUltima=chave; aoEstrutura(); };
  wrap.appendChild(b);
  if(focarUltima===chave){ focarUltima=null; setTimeout(()=>{ tw.scrollTop=tw.scrollHeight; const f=tb.lastElementChild&&tb.lastElementChild.querySelector("input,select,textarea"); f&&f.focus(); },0); }
  return wrap;
}
function celula(row, c, tr, colunas, aoSalvar, aoMudar){
  const v=row[c.campo]??"";
  if(c.tipo==="calc"){ const s=el("span","ro"); s.textContent=c.calc(row); return s; }
  let inp;
  if(c.tipo==="select"){
    inp=el("select");
    let ops=(typeof c.opcoes==="function"?c.opcoes(row):c.opcoes).map(x=>Array.isArray(x)?x:[x,x]);
    if(!c.semVazio) ops=[["",c.vazio||""],...ops];
    if(v && !ops.some(x=>x[0]===v)) ops.push([v,v]);
    inp.innerHTML=ops.map(([val,rot])=>`<option value="${esc(val)}"${val===v?" selected":""}>${esc(rot)}</option>`).join("");
  } else if(c.tipo==="textarea"){ inp=el("textarea"); inp.rows=2; inp.value=v; }
  else { inp=el("input"); inp.type=c.tipo||"text"; inp.value=v; if(c.tipo==="number"){ inp.min="0"; inp.step="any"; inp.style.minWidth="64px"; } if(c.lista) inp.setAttribute("list",c.lista); }
  if(c.placeholder) inp.placeholder=c.placeholder;
  inp.setAttribute("aria-label",c.label);
  const aplicar=()=>{ row[c.campo]=inp.value;
    colunas.filter(x=>x.tipo==="calc").forEach(x=>{ const s=tr.querySelector(`td[data-campo="${x.campo}"] .ro`); if(s) s.textContent=x.calc(row); });
    aoSalvar(); };
  const digitando=["text","textarea","number",undefined].includes(c.tipo);
  if(digitando) inp.addEventListener("input",aplicar);
  inp.addEventListener("change",()=>{ if(!digitando) aplicar(); aoMudar&&aoMudar(row,c); });
  return inp;
}
// "colar passos": uma linha = um passo (tira numeração tipo "1.", "2)", "-", "•")
function colarPassos(texto){
  return String(texto||"").split(/\r?\n/).map(l=>l.replace(/^\s*(\d+[\.\)\-:]|[-•*–])\s*/,"").trim()).filter(Boolean);
}

// ═══════════════════════════════════════════════════════════════════
// Excel (ExcelJS sob demanda) e impressão
// ═══════════════════════════════════════════════════════════════════
let _xl=null;
function excelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!_xl) _xl=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    s.onload=()=>res(window.ExcelJS); s.onerror=()=>{ _xl=null; rej(new Error("não consegui carregar a biblioteca de Excel (sem internet?)")); }; document.head.appendChild(s); });
  return _xl;
}
function baixarBlob(b,nome){ const u=URL.createObjectURL(b),a=document.createElement("a"); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
async function excelMulti(nomeArquivo, abas){
  const X=await excelJS(), wb=new X.Workbook();
  abas.forEach(({nome,colunas,linhas})=>{
    const ws=wb.addWorksheet(nome.slice(0,31));
    ws.addRow(colunas.map(c=>c[1]));
    ws.getRow(1).eachCell(c=>{ c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF2B2A27"}}; c.alignment={vertical:"middle",wrapText:true}; });
    linhas.forEach(l=>ws.addRow(colunas.map(c=>l[c[0]]??"")));
    colunas.forEach((c,i)=>{ const maior=Math.max(String(c[1]).length,...linhas.map(l=>String(l[c[0]]??"").length)); ws.getColumn(i+1).width=Math.max(10,Math.min(60,maior+2)); });
    ws.views=[{state:"frozen",ySplit:1}];
    if(linhas.length) ws.autoFilter={from:{row:1,column:1},to:{row:1,column:colunas.length}};
  });
  baixarBlob(new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), nomeArquivo+".xlsx");
}
function imprimir(titulo, html){
  const f=el("iframe"); Object.assign(f.style,{position:"fixed",right:0,bottom:0,width:0,height:0,border:0}); document.body.appendChild(f);
  const d=f.contentDocument; d.open();
  d.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>
    @page{size:A4 landscape;margin:12mm} body{font:11px/1.45 Inter,Arial,sans-serif;color:#1a1c23}
    h1{font-size:18px;margin:0 0 4px} h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
    table{border-collapse:collapse;width:100%;margin:4px 0} td,th{border:1px solid #bbb;padding:4px 6px;vertical-align:top;text-align:left} th{background:#2b2a27;color:#fff}
    .k{display:inline-block;border:1px solid #bbb;border-radius:6px;padding:6px 10px;margin:0 6px 6px 0} .k b{font-size:16px;display:block}
  </style></head><body>${html}</body></html>`); d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ alert("Impressão indisponível: "+e.message); } setTimeout(()=>f.remove(),4000); },350);
}
function acoesExport(c, lista){
  const d=el("div","acoes");
  lista.forEach(([rot,fn])=>{ const b=el("button","btn"); b.type="button"; b.textContent=rot;
    b.onclick=async()=>{ b.disabled=true; try{ await salvarTudo(); await fn(); }catch(e){ alert("Não foi possível gerar: "+e.message); } finally{ b.disabled=false; } }; d.appendChild(b); });

}

function linhasExport(lista){
  const P=[],IT=[],RE=[],CF=[],OP=[],NT=[];

      conforme:R.conforme.length,divergente:R.divergente.length,semIT:R.semIT.length,naoFeito:R.naoFeito.length,pendente:R.pendente.length,
      indice:pct(R.indice),cobertura:pct(R.cobertura),aderencia:pct(R.aderencia),horas_mes:horas(R.horasMes),oportunidades:d.oportunidades.length,
      validado_por:d.validacao.por,validado_em:d.validacao.data,atualizado_por:p.atualizado_por,atualizado_em:dataBR(p.atualizado_em)});
    d.passos_it.forEach((x,i)=>{ if(!tx(x.descricao)) return;
      IT.push({...base,it_codigo:d.it.codigo,ordem:i+1,descricao:x.descricao,quem:x.quem,sistema:x.sistema,regra:x.regra,situacao:situacaoPassoIT(d,x),
        passos_reais:d.passos_real.map((r,j)=>r.it_ref===x.id&&tx(r.descricao)?j+1:null).filter(Boolean).join(", "),obs:x.obs}); });
    d.passos_real.forEach((r,i)=>{ if(!tx(r.descricao)) return;
      RE.push({...base,ordem:i+1,descricao:r.descricao,quem:r.quem,sistema:r.sistema,dado:r.dado,tempo_min:r.tempo_min,vezes_mes:r.vezes_mes,
        horas_mes:horas(num(r.tempo_min)*num(r.vezes_mes)/60),passo_it:rotuloIT(d,r.it_ref),classificacao:classePassoReal(d,r),diferenca:r.diferenca,obs:r.obs,
        data_obs:r.data_obs,fonte:r.fonte,autor:r.autor}); });
    d.anotacoes.forEach(n=>{ if(tx(n.texto)) NT.push({...base,data_obs:n.data_obs,fonte:n.fonte,com_quem:n.com_quem,texto:n.texto,autor:n.autor}); });
    const add=(cat,x)=>CF.push({...base,categoria:CAT[cat]?CAT[cat].rot:"Pendente de classificação",
      passo_it:x.it?`${x.it._n}. ${x.it.descricao}`:"",passo_real:x.real?`${x.real._n}. ${x.real.descricao}`:"",
      detalhe:(x.real&&x.real.diferenca)||(x.it&&!x.real&&x.it.obs)||""});
    ["conforme","divergente","semIT","naoFeito","pendente"].forEach(cat=>R[cat].forEach(x=>add(cat,x)));
    d.oportunidades.forEach(o=>OP.push({...base,tipo:o.tipo,descricao:o.descricao,passo:o.passo_ref?(()=>{ const i=d.passos_real.findIndex(r=>r.id===o.passo_ref); return i<0?"":`${i+1}. ${d.passos_real[i].descricao}`; })():"",
      volume:o.volume,tempo:o.tempo,custo:o.custo,risco:o.risco,score:score(o)||"",horas_mes:o.horas_mes,acao:o.acao,responsavel:o.responsavel,prazo:o.prazo,status:o.status}));
  });
  return [{nome:"Processos",colunas:COL_PROC,linhas:P},{nome:"Confronto",colunas:COL_CONF,linhas:CF},{nome:"Passos da IT",colunas:COL_IT,linhas:IT},
          {nome:"Como é feito hoje",colunas:COL_REAL,linhas:RE},{nome:"Oportunidades",colunas:COL_OPORT,linhas:OP},{nome:"Anotações",colunas:COL_NOTA,linhas:NT}];
}

function padraoDoTipo(tipo){
  return tipo==="real" ? {data_obs:hojeISO(), fonte:"Observação no local (Gemba)"} :
         tipo==="nota" ? {data_obs:hojeISO(), fonte:"Entrevista"} :
         tipo==="op"   ? {tipo:"Dor", status:"Identificada"} : {};
}
function registrosDo(p){
  const d=p.dados, L=[];
  d.passos_real.forEach((x,i)=>L.push({tipo:"real",x,n:i+1,texto:x.descricao}));
  d.passos_it.forEach((x,i)=>L.push({tipo:"it",x,n:i+1,texto:x.descricao}));
  d.anotacoes.forEach(x=>L.push({tipo:"nota",x,texto:x.texto}));
  d.oportunidades.forEach(x=>L.push({tipo:"op",x,texto:x.descricao}));
  return L.filter(r=>tx(r.texto)).sort((a,b)=>String(b.x.criado_em||"").localeCompare(String(a.x.criado_em||"")));
}

function renderPainel(c){
  const tot={conforme:0,divergente:0,semIT:0,naoFeito:0,pendente:0,horas:0}, porArea={};
  let criticos=0, criticosVal=0, comDono=0, validados=0, oportAtivas=0, horasPot=0, horasDev=0;
  const todasOp=[];
  PROCS.forEach(p=>{ const d=p.dados, R=confronto(d);
    ["conforme","divergente","semIT","naoFeito","pendente"].forEach(k=>tot[k]+=R[k].length); tot.horas+=R.horasMes;
    if(d.criticidade==="Alta"){ criticos++; if(d.status==="Validado") criticosVal++; }
    if(tx(d.dono)) comDono++; if(d.status==="Validado") validados++;
    const a=tx(d.area)||"(sem área)"; const A=porArea[a]=porArea[a]||{n:0,val:0,conf:0,cls:0,gaps:0,horas:0};
    A.n++; if(d.status==="Validado") A.val++; A.conf+=R.conforme.length; A.cls+=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length; A.gaps+=R.gaps; A.horas+=R.horasMes;
    d.oportunidades.forEach(o=>{ if(o.status==="Descartada") return; oportAtivas++; horasPot+=num(o.horas_mes); if(o.status==="Concluída") horasDev+=num(o.horas_mes); todasOp.push({p,o}); });
  });
  const totCls=tot.conforme+tot.divergente+tot.semIT+tot.naoFeito;
  const meta=(rot,v,alvo,sub)=>{ const x=alvo?Math.min(1,v/alvo):0;
    return `<div class="kpi"><span>${esc(rot)}</span><b>${typeof v==="number"&&alvo===1?pct(v):esc(String(v))}${alvo!==1&&alvo?`<span style="font-size:14px;color:var(--muted)"> / ${alvo}</span>`:""}</b><div class="barra"><i style="width:${Math.round(x*100)}%"></i></div><small>${esc(sub)}</small></div>`; };
  c.innerHTML=`
    <p class="cap">Conhecer a empresa antes de automatizar a empresa. Cada processo levantado ponta a ponta e confrontado com a Instrução de Trabalho.</p>
    <h3>Resultado do confronto (todos os processos)</h3>
    <div class="cat4">${Object.entries(CAT).map(([k,v])=>`<div class="cat"><b>${tot[k]}</b><span>${v.ico} ${esc(v.rot)}</span></div>`).join("")}</div>
    ${tot.pendente?`<div class="aviso">⏳ ${tot.pendente} passo(s) ligado(s) à IT ainda sem classificação (Conforme/Divergente).</div>`:""}
    <div class="kpis">
      <div class="kpi"><span>Índice de conformidade geral</span><b>${pct(totCls?tot.conforme/totCls:null)}</b><small>conformes ÷ (conformes + divergentes + sem IT + não feitos)</small></div>
      <div class="kpi"><span>Processos mapeados</span><b>${PROCS.length}</b><small>${validados} validado(s) pela área</small></div>
      <div class="kpi"><span>Horas/mês consumidas</span><b>${horas(tot.horas)}</b><small>soma de tempo × frequência dos passos reais</small></div>
      <div class="kpi"><span>Horas/mês a devolver</span><b>${horas(horasPot)}</b><small>${horas(horasDev)} já devolvidas (oportunidades concluídas)</small></div>
    </div>
    <h3>Metas 2027</h3>
    <div class="kpis">
      ${meta("Processos críticos mapeados e validados", criticos?criticosVal/criticos:0, 1, `${criticosVal} de ${criticos} com criticidade Alta`)}
      ${meta("Processos com responsável definido", PROCS.length?comDono/PROCS.length:0, 1, `${comDono} de ${PROCS.length}`)}
      ${meta("Dores / oportunidades identificadas", oportAtivas, 30, "meta: Top 30 dores")}
      ${meta("Oportunidades concluídas", todasOp.filter(x=>x.o.status==="Concluída").length, 20, "meta: Top 20 processos automatizados")}
    </div>
    <h3>Por área</h3><div id="pArea"></div>
    <h3>Top 10 prioridades (Volume × Tempo × Custo × Risco)</h3><div id="pTop"></div>`;
  const areas=Object.entries(porArea).sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
  $("#pArea",c).innerHTML = areas.length ? `<div class="tbl-wrap"><table class="lista"><thead><tr><th>Área</th><th>Processos</th><th>Validados</th><th>Conformidade</th><th>Gaps</th><th>Horas/mês</th></tr></thead><tbody>${
    areas.map(([a,A])=>`<tr><td>${esc(a)}</td><td>${A.n}</td><td>${A.val}</td><td>${pct(A.cls?A.conf/A.cls:null)}</td><td>${A.gaps}</td><td>${horas(A.horas)}</td></tr>`).join("")}</tbody></table></div>`
    : '<div class="aviso">Nenhum processo cadastrado ainda. Comece em <b>📁 Processos → + Novo processo</b>.</div>';
  const top=todasOp.filter(x=>score(x.o)>0).sort((a,b)=>score(b.o)-score(a.o)).slice(0,10);
  const pt=$("#pTop",c);
  if(!top.length){ pt.innerHTML='<p class="cap">Sem oportunidades pontuadas ainda. Na aba Oportunidades de cada processo, dê nota de 1 a 5 para Volume, Tempo, Custo e Risco.</p>'; return; }
  pt.innerHTML=`<div class="tbl-wrap"><table class="lista"><thead><tr><th>Prioridade</th><th>Oportunidade</th><th>Tipo</th><th>Processo</th><th>Status</th></tr></thead><tbody>${
    top.map(({p,o})=>`<tr class="clic" data-id="${p.id}"><td><b>${score(o)}</b></td><td>${esc(o.descricao)}</td><td>${esc(o.tipo)}</td><td>${esc(p.dados.codigo)} · ${esc(p.dados.nome)}</td><td>${esc(o.status)}</td></tr>`).join("")}</tbody></table></div>`;
  pt.querySelectorAll("tr.clic").forEach(tr=>tr.onclick=()=>ir("processo",tr.dataset.id,"oportunidades"));
}

function renderConfronto(c){

  c.innerHTML=`<p class="cap">Todos os itens de todos os processos, classificados. Use os filtros para montar a lista que você precisa.</p>

    const linhas=[];

try{ const s=JSON.parse(sessionStorage.getItem("mapa_nav2")||"{}"); if(s.vista){ vista=s.vista; atual=s.atual||null; secProc=s.secProc||"linha"; secGeral=s.secGeral||"painel"; } }catch(_){}
function guardarNav(){ try{ sessionStorage.setItem("mapa_nav2",JSON.stringify({vista,atual,secProc,secGeral})); }catch(_){} }
function ir(v, id, sec){
  vista=v; if(id!==undefined&&id!==null) atual=id;
  if(sec){ if(v==="processo") secProc=sec; else if(v==="geral") secGeral=sec; }
  guardarNav(); window.scrollTo(0,0); render();
}

// ─── barra superior (igual ao RG: voltar · situação · botões) ───
let statusAtual={tipo:"ok",det:""};
function setStatus(tipo, det){ statusAtual={tipo,det:det||""}; atualizarWho(); }
function atualizarWho(){
  const dot=$("#dot"), t=$("#whoTxt"), w=$("#who"); if(!dot) return;
  dot.className="dot "+statusAtual.tipo; w.classList.toggle("erro",statusAtual.tipo==="erro");
  let txt = statusAtual.tipo==="salvando" ? "Salvando…" : statusAtual.tipo==="erro" ? "Erro ao salvar: "+statusAtual.det : "Tudo salvo";
  if(statusAtual.tipo==="ok"){
    const p = vista==="processo" ? procPorId(atual) : null;
    txt += p ? (p.atualizado_em ? ` · última alteração ${dataBR(p.atualizado_em)} por ${p.atualizado_por||"—"}` : "")
             : ` · Mapa Digital King Star · ${PROCS.length} processo(s)`;
  }
  t.textContent=txt;
}
function botaoBar(rotulo, fn, cls, icone){
  const b=el("button",cls||""); b.type="button"; b.innerHTML=(icone?icone+" ":"")+esc(rotulo);
  b.onclick=async()=>{ b.disabled=true; try{ await fn(); }catch(e){ alert(e.message); } finally{ b.disabled=false; } };
  $("#barAcoes").appendChild(b); return b;
}
function sitClasse(s){ return {"Em levantamento":"exec","Em validação":"val","Validado":"fim","Revisar":"susp"}[s]||"exec"; }

function render(){
  atualizarListas();
  if(vista==="processo" && !procPorId(atual)) vista="lista";
  const root=$("#root"); root.innerHTML=""; $("#barAcoes").innerHTML=""; $("#banner").textContent="";
  $("#btnVoltar").hidden = vista==="lista";
  if(vista==="processo") renderProcessoShell(root);
  else if(vista==="geral") renderGeralShell(root);
  else renderLista(root);
  atualizarWho();
}
function atualizarListas(){
  const areas=new Set(AREAS_PADRAO), sist=new Set(), quem=new Set();
  PROCS.forEach(p=>{ const d=p.dados; if(tx(d.area)) areas.add(tx(d.area));
    [...d.passos_it,...d.passos_real].forEach(x=>{ if(tx(x.sistema)) sist.add(tx(x.sistema)); if(tx(x.quem)) quem.add(tx(x.quem)); }); });
  $("#dl-areas").innerHTML=ordenar([...areas]).map(a=>`<option value="${esc(a)}">`).join("");
  $("#dl-sistemas").innerHTML=ordenar([...sist]).map(a=>`<option value="${esc(a)}">`).join("");
  $("#dl-quem").innerHTML=ordenar([...quem]).map(a=>`<option value="${esc(a)}">`).join("");
}
function pillStatus(s){ return `<span class="sit ${sitClasse(s)}">${esc(s||"—")}</span>`; }
function pillCrit(s){ const m={"Alta":"p-bad","Média":"p-warn","Baixa":"p-cinza"}; return `<span class="pill ${m[s]||"p-cinza"}">${esc(s||"—")}</span>`; }
function totaisGerais(){
  const t={conforme:0,divergente:0,semIT:0,naoFeito:0,pendente:0,horas:0};
  PROCS.forEach(p=>{ const R=confronto(p.dados); ["conforme","divergente","semIT","naoFeito","pendente"].forEach(k=>t[k]+=R[k].length); t.horas+=R.horasMes; });
  t.cls=t.conforme+t.divergente+t.semIT+t.naoFeito; t.indice=t.cls?t.conforme/t.cls:null; return t;
}
function blocoResumo(indice, conforme, cls, sub, R){
  const w=Math.round((indice||0)*100);
  return `<div class="summary"><div class="meter"><div class="big">${pct(indice)}</div><div class="lbl">dos itens conforme a IT (${conforme} de ${cls})</div>
      <div class="track"><i style="width:${w}%"></i></div><div class="lbl" style="margin-top:10px">${sub}</div></div>
    <div class="counts">
      <div class="count"><b style="color:var(--ok)">${R.conforme}</b><span>✅ feitos conforme a IT</span></div>
      <div class="count"><b style="color:var(--amber)">${R.divergente}</b><span>⚠️ feitos diferente da IT</span></div>
      <div class="count"><b style="color:var(--prog)">${R.semIT}</b><span>➕ feitos sem IT</span></div>
      <div class="count"><b style="color:var(--bad)">${R.naoFeito}</b><span>❌ na IT e não são feitos</span></div>
      <div class="count"><b style="color:var(--steel)">${horas(R.horas)}</b><span>horas/mês consumidas</span></div>
      ${R.pendente?`<div class="count"><b style="color:var(--idle)">${R.pendente}</b><span>⏳ pendentes de classificação</span></div>`:""}
    </div></div>`;
}

// TELA INICIAL — processos mapeados
// ═══════════════════════════════════════════════════════════════════
function proximoCodigo(){
  const n=PROCS.reduce((m,p)=>{ const x=String(p.dados.codigo||"").match(/(\d+)$/); return Math.max(m,x?+x[1]:0); },0);
  return "PROC-"+String(n+1).padStart(3,"0");
}
function abrirNovoProcesso(){
  const dl=$("#dlgNovo"); ["npNome","npArea","npDono","npIT"].forEach(i=>$("#"+i).value=""); $("#npCrit").value="Média"; $("#npMsg").textContent="";
  dl.showModal(); setTimeout(()=>$("#npNome").focus(),30);
}
$("#npNao").onclick=()=>$("#dlgNovo").close();
$("#npSim").onclick=async()=>{
  const nome=tx($("#npNome").value), m=$("#npMsg");
  if(!nome){ m.textContent="Informe o nome do processo."; $("#npNome").focus(); return; }
  const dados=normalizar({codigo:proximoCodigo(),nome,area:tx($("#npArea").value),dono:tx($("#npDono").value),criticidade:$("#npCrit").value});
  dados.it.codigo=tx($("#npIT").value);
  $("#npSim").disabled=true;
  try{ const {r,j}=await api(API,{method:"POST",body:JSON.stringify({dados})}); if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    j.dados=normalizar(j.dados); PROCS.push(j); $("#dlgNovo").close(); reg.tipo="real"; reg.editando=null; ir("processo",j.id,"registrar");
  }catch(e){ m.textContent=e.message; } finally{ $("#npSim").disabled=false; }
};
function renderLista(c){
  const T=totaisGerais(), areas=ordenar([...new Set(PROCS.map(p=>tx(p.dados.area)).filter(Boolean))]);
  c.innerHTML=`<div class="lista-topo"><h1>Processos mapeados</h1>
      <div class="lista-acoes"><button type="button" id="lsGeral">${ICO.painel} Visão geral</button><button type="button" id="lsExp">${ICO.exportar} Exportar tudo (Excel)</button>
      <button type="button" class="primary" id="lsNovo">${ICO.mais} Novo processo</button></div>
      <p>Cada processo é uma "Linha de vida" independente: como é feito hoje, confrontado com a Instrução de Trabalho. Clique num processo para registrar e acompanhar.</p></div>
    ${PROCS.length?blocoResumo(T.indice,T.conforme,T.cls,`${PROCS.filter(p=>p.dados.status==="Validado").length} de ${PROCS.length} processo(s) validado(s) pela área`,T):""}
    <div class="filtros" style="margin-top:18px"><input id="fBusca" placeholder="Buscar por nome, código, IT ou dono..." value="${esc(filtro.busca)}" aria-label="Buscar">
      <select id="fArea" aria-label="Área"><option value="">Todas as áreas</option>${areas.map(a=>`<option${a===filtro.area?" selected":""}>${esc(a)}</option>`).join("")}</select>
      <select id="fStatus" aria-label="Situação"><option value="">Todas as situações</option>${STATUS_PROC.map(a=>`<option${a===filtro.status?" selected":""}>${esc(a)}</option>`).join("")}</select></div>
    <div class="lista-grid" id="grid"></div>`;
  $("#lsNovo",c).onclick=abrirNovoProcesso;
  $("#lsGeral",c).onclick=()=>ir("geral",null,"painel");
  $("#lsExp",c).onclick=async()=>{ try{ await salvarTudo(); await excelMulti("mapa_digital_king_star_"+hojeISO(),linhasExport(PROCS)); }catch(e){ alert(e.message); } };
  const desenhar=()=>{
    const t=filtro.busca.toLowerCase();
    const lst=PROCS.filter(p=>{ const d=p.dados;
      return (!t||[d.nome,d.codigo,d.dono,d.it.codigo].some(x=>String(x||"").toLowerCase().includes(t))) && (!filtro.area||d.area===filtro.area) && (!filtro.status||d.status===filtro.status); })
      .sort((a,b)=>String(a.dados.codigo).localeCompare(String(b.dados.codigo),"pt-BR",{numeric:true}));
    const g=$("#grid");
    if(!lst.length){ g.innerHTML=`<div class="vazio-lista">${PROCS.length?"Nenhum processo com esse filtro.":'Nenhum processo cadastrado ainda. Clique em "Novo processo" para começar o primeiro levantamento.'}</div>`; return; }
    g.innerHTML=lst.map(p=>{ const d=p.dados, R=confronto(d), cls=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length, w=Math.round((R.indice||0)*100);
      return `<button type="button" class="item-card" data-id="${p.id}"><div class="ic-codigo">${esc(d.codigo)}</div><div class="ic-item">${esc(d.nome||"(sem nome)")}</div>
        <div class="ic-area">${esc(d.area||"sem área")}${d.it.codigo?` · ${esc(d.it.codigo)}`:""}${d.dono?` · ${esc(d.dono)}`:""}</div>
        <div class="ic-macro"><b>${pct(R.indice)}</b><span>conforme a IT (${R.conforme.length} de ${cls})</span></div><div class="ic-track track"><i style="width:${w}%"></i></div>
        <div class="mini4">${Object.entries(CAT).map(([k,v])=>`<span class="pill ${v.pill}" title="${esc(v.rot)}">${v.ico} ${R[k].length}</span>`).join("")}</div>
        <div class="ic-rodape">${pillStatus(d.status)}<span>v${p.versao} · ${esc(dataBR(p.atualizado_em))}</span></div></button>`; }).join("");
    g.querySelectorAll(".item-card").forEach(b=>b.onclick=()=>{ const p=procPorId(b.dataset.id); ir("processo",b.dataset.id, registrosDo(p).length?"linha":"registrar"); });
  };
  $("#fBusca",c).oninput=e=>{ filtro.busca=e.target.value; desenhar(); };
  $("#fArea",c).onchange=e=>{ filtro.area=e.target.value; desenhar(); };
  $("#fStatus",c).onchange=e=>{ filtro.status=e.target.value; desenhar(); };
  desenhar();
}

function menuVertical(secoes, ativa, cont, aoClicar){
  return `<div class="side-rg">${secoes.map(s=>s==="sep"?'<div class="side-sep"></div>':
    `<button type="button" class="side-btn${s[0]===ativa?" ativo":""}" data-sec="${s[0]}" title="${esc(s[2].replace(/\u00ad/g,""))}" aria-current="${s[0]===ativa}">${ICO[s[1]]}<span>${s[2]}</span>${cont&&cont[s[0]]?`<span class="n">${cont[s[0]]}</span>`:""}</button>`).join("")}</div>`;
}
function renderProcessoShell(c){
  const p=procPorId(atual), d=p.dados, R=confronto(d), sv=()=>salvar(p);
  botaoBar("Baixar Excel deste processo",async()=>{ await salvarTudo(); await excelMulti(`mapa_${d.codigo||"processo"}`,linhasExport([p])); },"",ICO.exportar);
  botaoBar("Imprimir ou salvar PDF",()=>imprimir(`${d.codigo} — ${d.nome}`,relatorioHTML(p)),"",ICO.imprimir);
  botaoBar("Excluir",async()=>{ if(!confirm(`Excluir o processo ${d.codigo} — ${d.nome}? (fica guardado no banco como excluído)`)) return;
    const {r,j}=await api(`${API}/${p.id}`,{method:"DELETE"}); if(!r.ok) throw new Error(j.detail||r.status); PROCS=PROCS.filter(x=>x!==p); ir("lista"); },"warn");
  const cont={real:d.passos_real.filter(x=>tx(x.descricao)).length, it:d.passos_it.filter(x=>tx(x.descricao)).length, confronto:R.gaps,
    oportunidades:d.oportunidades.length, anotacoes:d.anotacoes.length, historico:registrosDo(p).length};
  c.innerHTML=`<div class="shell-item">${menuVertical(SECOES_PROC,secProc,cont)}<div class="conteudo-item">
    ${p._conflito?`<div class="conflito"><b>⚠️ ${esc(p._conflito.atualizado_por||"Outra pessoa")} alterou este processo enquanto você editava</b> (${esc(dataBR(p._conflito.atualizado_em))}). Suas últimas alterações ainda não foram gravadas.
      <div class="acoes"><button type="button" id="cfDele">Ver a versão dele (descarta as minhas)</button><button type="button" class="warn" id="cfMinha">Manter a minha (grava por cima)</button></div></div>`:""}
    <div id="secCorpo"></div></div></div>`;
  c.querySelectorAll(".side-btn").forEach(b=>b.onclick=()=>{ secProc=b.dataset.sec; if(secProc!=="registrar") reg.editando=null; guardarNav(); render(); });
  if(p._conflito){
    $("#cfDele",c).onclick=()=>{ Object.assign(p,{dados:normalizar(p._conflito.dados),versao:p._conflito.versao,atualizado_por:p._conflito.atualizado_por,atualizado_em:p._conflito.atualizado_em,_conflito:null}); setStatus("ok"); render(); };
    $("#cfMinha",c).onclick=async()=>{ await enfileirar(p,true); render(); };
  }
  const corpo=$("#secCorpo",c);
  if(secProc==="linha") return renderLinha(corpo,p);
  const [tit,desc]=TITULOS_PROC[secProc]||["",""];
  corpo.innerHTML=`<section><header><h2>${esc(tit)}</h2>${desc?`<p>${esc(desc)}</p>`:""}</header><div id="secBody"></div></section>`;
  const body=$("#secBody",corpo);
  ({registrar:renderRegistrarProc,real:abaReal,it:abaIT,confronto:abaConfronto,oportunidades:abaOport,anotacoes:abaNotas,
    identificacao:abaIdent,validacao:abaValid,historico:(b,p)=>desenharHistorico(b,p,0)})[secProc](body,p,d,sv);
}

// ─── Linha de vida (página principal do processo, como no RG) ───
function renderLinha(c,p){
  const d=p.dados, R=confronto(d), cls=R.conforme.length+R.divergente.length+R.semIT.length+R.naoFeito.length;
  const passosIT=d.passos_it.map((x,i)=>({x,i})).filter(o=>tx(o.x.descricao));
  const corte=(s,n)=>{ s=tx(s); return s.length>n?s.slice(0,n-1)+"…":s; };
  const estilo={"Executado conforme":["st-ok","p-ok","Conforme"],"Executado com divergência":["st-warn","p-warn","Divergente"],
    "Não executado":["st-bad","p-bad","Não é feito"],"Pendente de classificação":["","p-cinza","Pendente"]};
  let h=`<header class="doc-head"><div><h1>${esc(d.nome||"(sem nome)")}</h1>
      <p class="obj">${esc(d.objetivo||"Processo em levantamento: registre como é feito hoje e confronte com a Instrução de Trabalho para encontrar os gaps.")}</p></div>
    <div class="stamp"><div class="code">${esc(d.codigo)}</div><dl>
      <dt>Versão</dt><dd>${p.versao}</dd><dt>Situação</dt><dd>${pillStatus(d.status)}</dd>
      <dt>IT</dt><dd>${esc(d.it.codigo||"—")}${d.it.versao?` · rev. ${esc(d.it.versao)}`:""}</dd>
      <dt>Área</dt><dd>${esc(d.area||"—")}</dd><dt>Responsável</dt><dd>${esc(d.dono||"—")}</dd><dt>Criticidade</dt><dd>${esc(d.criticidade||"—")}</dd>
      <dt>Atualizado</dt><dd>${esc(dataBR(p.atualizado_em))}<br><span class="muted">${esc(p.atualizado_por||"")}</span></dd></dl></div></header>
    ${blocoResumo(R.indice,R.conforme.length,cls,`Cobertura da IT: ${pct(R.cobertura)} · Aderência dos executados: ${pct(R.aderencia)}`,{...R,conforme:R.conforme.length,divergente:R.divergente.length,semIT:R.semIT.length,naoFeito:R.naoFeito.length,pendente:R.pendente.length,horas:R.horasMes})}
    <section><header><h2>Linha de vida da Instrução de Trabalho</h2><p>Cada passo da IT e o que acontece com ele na prática.</p><button type="button" class="add primary" id="lvReg">${ICO.registrar} Registrar</button></header>`;
  if(passosIT.length){
    h+=`<div class="legenda-chain"><span><span class="pill p-ok">Conforme</span> feito como a IT manda</span><span><span class="pill p-warn">Divergente</span> feito de outro jeito</span>
        <span><span class="pill p-bad">Não é feito</span> está na IT e ninguém faz</span><span><span class="pill p-cinza">Pendente</span> ligado, falta classificar</span></div>
      <div class="chain">${passosIT.map(({x,i})=>{ const s=situacaoPassoIT(d,x), e=estilo[s]||estilo["Pendente de classificação"];
        const lig=d.passos_real.map((r,j)=>r.it_ref===x.id&&tx(r.descricao)?j+1:null).filter(Boolean);
        return `<div class="link ${e[0]}"><div class="knot">${i+1}</div><div class="nm">${esc(corte(x.descricao,48))}</div><div class="st"><span class="pill ${e[1]}">${e[2]}</span></div><div class="doc">${lig.length?"real nº "+lig.join(", "):""}</div></div>`; }).join("")}</div>
      <div class="chain-detail scroll"><table><thead><tr><th>Passo da IT</th><th>Situação</th><th>Como é feito hoje</th><th>O que difere</th></tr></thead><tbody>${
        passosIT.map(({x,i})=>{ const s=situacaoPassoIT(d,x), e=estilo[s]||estilo["Pendente de classificação"];
          const lig=d.passos_real.map((r,j)=>({r,j})).filter(o=>o.r.it_ref===x.id&&tx(o.r.descricao));
          return `<tr><td><span class="muted" style="font-weight:600">${i+1}.</span> ${esc(x.descricao)}</td><td><span class="pill ${e[1]}">${e[2]}</span></td>
            <td>${lig.length?lig.map(({r,j})=>`<div><b>${j+1}.</b> ${esc(r.descricao)}</div>`).join(""):'<span class="muted">—</span>'}</td>
            <td>${lig.map(o=>o.r.diferenca).filter(Boolean).map(esc).join("<br>")||'<span class="muted">—</span>'}</td></tr>`; }).join("")}</tbody></table></div>`;
  } else h+='<p class="banner">Ainda não há passos da Instrução de Trabalho. Cadastre em <b>Instrução de Trabalho</b> (dá para colar os passos direto do documento) ou pelo <b>Registrar</b>.</p>';
  h+=`</section>`;
  if(R.semIT.length) h+=`<section><header><h2>Feito sem Instrução de Trabalho</h2><p>Passos que acontecem na prática e não estão na IT.</p></header>
      <div class="chain">${R.semIT.map(({real:r})=>`<div class="link st-prog"><div class="knot">${r._n}</div><div class="nm">${esc(corte(r.descricao,48))}</div><div class="st"><span class="pill p-azul">Sem IT</span></div><div class="doc">${esc([r.quem,r.sistema].filter(Boolean).join(" · "))}</div></div>`).join("")}</div></section>`;
  if(!passosIT.length && !d.passos_real.some(r=>tx(r.descricao))) h+=`<p class="aviso" style="margin-top:20px">Comece pelo <b>Registrar</b>: escreva o primeiro passo de como o processo é feito hoje.</p>`;
  c.innerHTML=h;
  $("#lvReg",c).onclick=()=>ir("processo",p.id,"registrar");
}

// ─── Registrar (dentro do processo) ───
function renderRegistrarProc(c,p){
  reg.proc=p.id;
  const d=p.dados, lista=d[LISTA_DO_TIPO[reg.tipo]];
  const emEdicao = reg.editando ? lista.find(x=>x.id===reg.editando) : null;
  if(reg.editando && !emEdicao) reg.editando=null;
  const rasc = emEdicao ? null : lerRasc();
  const valores = emEdicao ? {...emEdicao} : {...padraoDoTipo(reg.tipo), ...(rasc||{})};
  const campos=camposDoTipo(reg.tipo,p);
  c.innerHTML=`<p class="cap">Escreva o que você levantou e grave. Cada registro fica guardado com data e autor — o mapa vai sendo construído aos poucos, semana a semana.</p>
    <div class="reg-dupla"><div class="box" style="margin:0" id="rgCorpo"></div>
    <div><h3 style="margin-top:0">Últimos registros deste processo</h3><div id="rgHist"></div></div></div>`;
  const corpo=$("#rgCorpo",c);
  corpo.innerHTML=`<div class="tipos" role="radiogroup" aria-label="O que você vai registrar">${TIPOS_REG.map(([id,ico,rot,desc])=>
      `<button type="button" role="radio" aria-checked="${id===reg.tipo}" class="tipo${id===reg.tipo?" ativo":""}" data-t="${id}" ${emEdicao?"disabled":""}><span>${ico}</span><b>${esc(rot)}</b><small>${esc(desc)}</small></button>`).join("")}</div>
    ${emEdicao?`<div class="editando-faixa">✏️ Editando um registro de ${esc(emEdicao.autor||"—")}${emEdicao.criado_em?` (${esc(dataBR(emEdicao.criado_em))})`:""}. Grave para salvar a alteração.</div>`:""}
    <div class="campos">${campos.map(([k,rot,t,o])=>{ const v=valores[k]??"", cls=o.full?"f full":"f";
      if(t==="grande"||t==="textarea") return `<label class="${cls}">${esc(rot)}<textarea data-k="${k}" class="${t==="grande"?"grande":""}" rows="${t==="grande"?5:2}" placeholder="${esc(o.ph||"")}">${esc(v)}</textarea></label>`;
      if(t==="select"){ let ops=(o.opcoes||[]).map(x=>Array.isArray(x)?x:[x,x]); if(!o.semVazio) ops=[["",o.vazio||""],...ops]; if(v&&!ops.some(x=>x[0]===v)) ops.push([v,v]);
        return `<label class="${cls}">${esc(rot)}<select data-k="${k}">${ops.map(([a,b])=>`<option value="${esc(a)}"${a===v?" selected":""}>${esc(b)}</option>`).join("")}</select></label>`; }
      return `<label class="${cls}">${esc(rot)}<input data-k="${k}" type="${t}" value="${esc(v)}" ${o.lista?`list="${o.lista}"`:""} ${t==="number"?'min="0" step="any"':""}></label>`; }).join("")}</div>
    <p class="rascunho" id="rgRasc">${rasc?"📝 Rascunho recuperado — ainda não gravado.":""}</p>
    <div class="acoes"><button type="button" class="primary" id="rgGravar">${emEdicao?"Salvar alteração":"Gravar registro"}</button>
      ${emEdicao?'<button type="button" id="rgCancelar">Cancelar edição</button>':'<button type="button" id="rgLimpar">Limpar</button>'}
      <span class="msg" id="rgMsg" role="status"></span></div>
    <p class="cap" style="margin:0">Atalho: <code>Ctrl</code> + <code>Enter</code> grava.</p>`;
  corpo.querySelectorAll(".tipo").forEach(b=>b.onclick=()=>{ reg.tipo=b.dataset.t; guardarReg(); render(); });
  const ler=()=>{ const o={}; corpo.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value); return o; };
  const ajustar=()=>{ const it=corpo.querySelector('[data-k="it_ref"]'), ad=corpo.querySelector('[data-k="aderencia"]'), df=corpo.querySelector('[data-k="diferenca"]');
    if(!it||!ad) return; const lig=!!it.value; ad.disabled=!lig; if(!lig) ad.value=""; if(df) df.closest("label").style.display = ad.value==="Divergente"?"":"none"; };
  ajustar();
  corpo.querySelectorAll("[data-k]").forEach(i=>{
    const ev=i.tagName==="SELECT"||i.type==="date"?"change":"input";
    i.addEventListener(ev,()=>{ if(i.dataset.k==="it_ref"||i.dataset.k==="aderencia") ajustar();
      if(!emEdicao){ gravarRasc(ler()); $("#rgRasc").textContent="📝 Rascunho guardado neste navegador — ainda não gravado."; } });
  });
  const gravar=async()=>{
    const v=ler(), m=$("#rgMsg"), obrig=reg.tipo==="nota"?"texto":"descricao";
    if(!tx(v[obrig])){ m.className="msg erro"; m.textContent="Escreva a descrição antes de gravar."; corpo.querySelector(`[data-k="${obrig}"]`).focus(); return; }
    if(reg.tipo==="real" && !v.it_ref) v.aderencia="";
    if(reg.tipo==="real" && v.aderencia!=="Divergente") v.diferenca="";
    $("#rgGravar").disabled=true;
    let alvo;
    if(emEdicao) alvo=Object.assign(emEdicao,v,{alterado_por:USUARIO_NOME,alterado_em:new Date().toISOString()});
    else{ alvo={id:uid(),...v,autor:USUARIO_NOME,criado_em:new Date().toISOString()};
      if(reg.tipo==="op") Object.assign(alvo,{tipo:v.tipo||"Dor",status:v.status||"Identificada"});
      lista.push(alvo); }
    if(reg.tipo==="real" && !d.etapas.registrar.feito){ d.etapas.registrar.feito=true; d.etapas.registrar.data=hojeISO(); }
    clearTimeout(pend[p.id]); await enfileirar(p);
    if(p._conflito){ render(); return; }
    limparRasc(); reg.editando=null; reg.ultimo=alvo.id;
    const tot=registrosDo(p).length; render();
    const m2=$("#rgMsg"); if(m2){ m2.className="msg ok"; m2.textContent=`✓ Gravado às ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} — ${tot} registro(s) neste processo.`; }
    const f=document.querySelector("#rgCorpo textarea.grande"); f&&f.focus();
  };
  $("#rgGravar",c).onclick=gravar;
  corpo.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); gravar(); } });
  const lim=$("#rgLimpar",c); if(lim) lim.onclick=()=>{ limparRasc(); render(); };
  const can=$("#rgCancelar",c); if(can) can.onclick=()=>{ reg.editando=null; render(); };
  if(!emEdicao && !rasc) setTimeout(()=>{ const f=corpo.querySelector("textarea.grande"); f&&f.focus(); },30);
  desenharHistorico($("#rgHist",c),p,6);
}

// ─── histórico (cartões de registro) ───
function desenharHistorico(box, p, limite){
  const ROT=Object.fromEntries(TIPOS_REG.map(([id,ico,rot])=>[id,{ico,rot}]));
  const itens=registrosDo(p), cont={}; itens.forEach(r=>cont[r.tipo]=(cont[r.tipo]||0)+1);
  let lst = limite ? itens : (reg.filtro ? itens.filter(r=>r.tipo===reg.filtro) : itens);
  const total=lst.length; if(limite) lst=lst.slice(0,limite);
  box.innerHTML = (!limite?`<div class="hist-filtro">${[["","Todos",itens.length],...TIPOS_REG.map(([id,ico,rot])=>[id,`${ico} ${rot}`,cont[id]||0])].map(([id,rot,n])=>
      `<button type="button" data-f="${id}" class="${reg.filtro===id?"ativo":""}">${esc(rot)} · ${n}</button>`).join("")}</div>`:"")
    + (lst.length ? lst.map(r=>{
      const x=r.x, R=r.tipo==="real"?classePassoReal(p.dados,x):"";
      const det = r.tipo==="real" ? [x.quem,x.sistema,x.tempo_min&&`${x.tempo_min} min`,x.vezes_mes&&`${x.vezes_mes}×/mês`,x.fonte].filter(Boolean).join(" · ")
                : r.tipo==="nota" ? [x.com_quem,x.fonte].filter(Boolean).join(" · ")
                : r.tipo==="op" ? [x.tipo,score(x)?`prioridade ${score(x)}`:"",x.status].filter(Boolean).join(" · ")
                : [x.quem,x.sistema].filter(Boolean).join(" · ");
      const cat = R ? `<span class="pill ${R.startsWith("Feito conforme")?"p-ok":R.startsWith("Feito diferente")?"p-warn":R.startsWith("Feito sem")?"p-azul":"p-cinza"}">${esc(R)}</span>` : "";
      return `<div class="registro${x.id===reg.ultimo?" recente":""}"><div class="topo-r"><span class="pill p-cinza">${ROT[r.tipo].ico} ${esc(ROT[r.tipo].rot)}${r.n?` nº ${r.n}`:""}</span>${cat}
          <span>${esc(x.data_obs?dataBR(x.data_obs):dataBR(x.criado_em))} · ${esc(x.autor||"—")}</span>
          <span class="acs"><button class="ib" type="button" data-ed="${x.id}" data-tp="${r.tipo}" title="Editar">✏️</button><button class="ib del" type="button" data-dl="${x.id}" data-tp="${r.tipo}" title="Excluir">🗑</button></span></div>
        <p>${esc(r.texto)}</p>${det?`<div class="det">${esc(det)}</div>`:""}${x.diferenca?`<div class="det" style="color:var(--amber)">difere da IT: ${esc(x.diferenca)}</div>`:""}</div>`; }).join("")
      : `<div class="vazio-h">Nenhum registro ainda neste processo.${limite?" O primeiro começa no formulário ao lado.":""}</div>`)
    + (limite && total>limite ? `<button type="button" id="hsTudo">Ver histórico completo (${total})</button>` : "");
  box.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ reg.filtro=b.dataset.f; guardarReg(); desenharHistorico(box,p,limite); });
  const tudo=$("#hsTudo",box); if(tudo) tudo.onclick=()=>ir("processo",p.id,"historico");
  box.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ reg.tipo=b.dataset.tp; reg.editando=b.dataset.ed; ir("processo",p.id,"registrar"); });
  box.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{
    const l=p.dados[LISTA_DO_TIPO[b.dataset.tp]], i=l.findIndex(x=>x.id===b.dataset.dl); if(i<0) return;
    const aviso = b.dataset.tp==="it" && p.dados.passos_real.some(r=>r.it_ref===b.dataset.dl) ? "\n\nHá passos reais ligados a este passo da IT — eles passarão a contar como 'Feito sem IT'." : "";
    if(!confirm("Excluir este registro?"+aviso)) return;
    l.splice(i,1); if(reg.editando===b.dataset.dl) reg.editando=null; salvar(p); render(); });
}

$("#btnVoltar").onclick=()=>ir("lista");

// ═══════════════════════════════════════════════════════════════════
// Início
// ═══════════════════════════════════════════════════════════════════
async function iniciar(){
  try{ const r=await fetch("/api/auth/me",{cache:"no-store"}); if(r.ok){ const j=await r.json(); USUARIO_NOME=(j.usuario&&(j.usuario.nome||j.usuario.email))||""; } }catch(_){}
  try{
    const {r,j}=await api(API);
    if(!r.ok) throw new Error(j.detail||`HTTP ${r.status}`);
    PROCS=(j||[]).map(p=>({...p,dados:normalizar(p.dados)})); setStatus("ok"); render();
  }catch(e){
    if(e.message==="sessão expirada") return;
    setStatus("erro",e.message);
    $("#root").innerHTML=`<div class="conflito"><b>Não consegui carregar os processos.</b><br>${esc(e.message)}<div class="acoes"><button type="button" onclick="location.reload()">Tentar de novo</button></div></div>`;
  }
}
iniciar();
</script>
