<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxo interno — Organograma, Atividades, Áreas e Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/pqi-acesso.js" data-modulo="mapeamento"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   mapeamento.html — MAPEAMENTO (v6.4)
   A sequência do mapeamento num módulo só, em 4 passos:
     1 Organograma  →  2 Atividades  →  3 Áreas  →  4 Processos
   Cada passo é uma tela (organograma.html, diagnostico.html, mapa.html) — Organograma e Processos
   [v7.3] só existem aqui, como passos; o Diagnóstico ainda é sistema próprio até virar Melhoria Contínua —
   aberta em "modo Mapeamento" (?embed=mapeamento — ver pqi-acesso.js):
   um sistema nunca abre dentro do outro; quem leva de um passo a outro é esta tela.
   Mesmo padrão visual do Organograma e de Processos.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2436; --ink-2:#4A5568; --ink-3:#7A8599;
  --rule:#D9DEE7; --rule-2:#EBEEF3; --steel:#2E4A7A; --steel-soft:#E3EAF5;
  --amber:#C98A0B; --amber-soft:#FBF1D9; --ok:#2F7D4F; --ok-soft:#E1F2E7; --bad:#B83232; --bad-soft:#F9E2E2;
  --prog:#2B63B0; --prog-soft:#E1EBF8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
    --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
    --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
    --prog:#7FA9EA; --prog-soft:#1E2E48;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --sheet:#1A2130; --ink:#E6EAF2; --ink-2:#B4BCCB; --ink-3:#8791A3;
  --rule:#2F384A; --rule-2:#252D3D; --steel:#8FB0E6; --steel-soft:#22304A;
  --amber:#E8B04A; --amber-soft:#3A2F17; --ok:#6BC28E; --ok-soft:#1D3527; --bad:#EE8080; --bad-soft:#3E2020;
  --prog:#7FA9EA; --prog-soft:#1E2E48;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
h1,.cond{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif}
button{font:500 14px/1 "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ink-3)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.bar{flex:none;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
.tit{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.tit b{font:700 18px "IBM Plex Sans Condensed",system-ui,sans-serif}
.tit span{font-size:12px;color:var(--ink-3)}
.passos{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.passos::-webkit-scrollbar{display:none}
.passo{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);white-space:nowrap;color:var(--ink-2)}
.passo .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px "IBM Plex Sans Condensed",sans-serif;background:var(--rule-2);color:var(--ink-2)}
.passo b{font-weight:600;font-size:14px}
.passo small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.passo.ativo{border-color:var(--steel);background:var(--steel-soft);color:var(--ink)}
.passo.ativo .n{background:var(--steel);color:var(--sheet)}
.passo[disabled]{opacity:.45;cursor:not-allowed}
.seta{color:var(--ink-3);flex:none}
.tema{flex:none}

/* [v7.2] guia do passo: o que fazer, quando está pronto e qual o próximo */
.guia{flex:none;display:flex;gap:14px;align-items:flex-start;background:var(--prog-soft);border-bottom:1px solid var(--rule);padding:9px 20px;font-size:13.5px;color:var(--ink)}
.guia .ic{font-size:18px;line-height:1.2}
.guia .col{flex:1;min-width:0}
.guia b{color:var(--prog)}
.guia .linha{display:flex;gap:18px;flex-wrap:wrap;margin-top:2px;color:var(--ink-2)}
.guia button{padding:5px 10px;font-size:12.5px;align-self:center}
.guia .x{background:none;border:0;color:var(--ink-3);padding:2px 6px}
.guia-min{flex:none;padding:3px 20px;border-bottom:1px solid var(--rule);font-size:12.5px}
.guia-min button{padding:3px 9px;font-size:12px}
.palco{flex:1;position:relative;min-height:0}
.palco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);display:none}
.palco iframe.ativo{display:block}
.carregando{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s}
.carregando.on{opacity:1}
.sem-acesso{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.sem-acesso div{max-width:460px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px 22px}

@media (max-width:760px){
  .bar-in{padding:8px 12px;gap:8px}
  .tit span,.passo small{display:none}
  .passo{padding:6px 10px 6px 6px}
}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <div class="tit"><b>🧭 Fluxo interno</b><span>como a empresa funciona, passo a passo</span></div>
  <nav class="passos" id="passos" aria-label="Passos do mapeamento"></nav>
  <button type="button" class="tema" id="btnTema" title="Alternar tema claro/escuro (vale para todos os passos)">◐ Tema</button>
</div></div>
<div id="guia"></div>
<div class="palco" id="palco"><div class="carregando" id="carregando">Carregando…</div></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// passo: [id, nome, dica, endereço, sistema de origem (permissão)]
const PASSOS = [
  // [v7.3] o acesso de cada passo é a aba do Fluxo interno ("aba:…"); Atividades ainda usa o Diagnóstico
  ["organograma", "Organograma", "setores e pessoas", "/organograma", "aba:organograma"],
  ["atividades", "Atividades", "o que cada setor faz", "/diagnostico", "diagnostico"],
  ["areas", "Áreas", "atividade vira processo", "/mapa?modo=areas", "aba:areas"],
  ["processos", "Processos", "linha de vida, registrar…", "/mapa", "aba:processos"],
];
// [v7.2] o que fazer em cada passo (qualquer pessoa, lendo, consegue seguir)
const GUIA = {
  organograma: { faca: "Escolha o setor (ou crie em <b>＋ Novo setor</b>) e cadastre as pessoas: nome, cargo, nível, subsetor e a quem responde.",
    pronto: "todas as pessoas do setor estão no desenho, cada uma com o seu gestor.", prox: "atividades" },
  atividades: { faca: "Escolha o departamento e, na aba <b>Atividades</b>, liste tudo o que ele faz — uma linha por atividade, com subsetor e executores.",
    pronto: "a lista de atividades do departamento está completa.", prox: "areas" },
  areas: { faca: "Em cada área, cada atividade vira processo: clique em <b>Criar processo</b> (ou cadastre processos novos, escolhendo o subsetor). Quando todos estiverem cadastrados, marque <b>✓ 100% mapeado</b>.",
    pronto: "toda atividade da área virou processo.", prox: "processos" },
  processos: { faca: "Abra o processo e registre <b>Como é feito hoje</b>, passo a passo (o fluxograma é montado sozinho). Depois confira a <b>IT atual</b>.",
    pronto: "o passo a passo e o fluxograma de cada processo estão completos — a empresa está mapeada. Daqui em diante, melhorias vão para a <b>Melhoria Contínua</b>.", prox: "" },
};
function desenharGuia() {
  const g = GUIA[ativo], el = $("#guia"); if (!g) { el.innerHTML = ""; return; }
  let fechado = false; try { fechado = localStorage.getItem("pqi_fi_guia") === "0"; } catch (_) {}
  const i = PASSOS.findIndex((p) => p[0] === ativo), prox = PASSOS.find((p) => p[0] === g.prox);
  if (fechado) { el.innerHTML = `<div class="guia-min"><button type="button" id="gAbre">ⓘ O que fazer neste passo</button></div>`; $("#gAbre").onclick = () => { try { localStorage.removeItem("pqi_fi_guia"); } catch (_) {} desenharGuia(); }; return; }
  el.innerHTML = `<div class="guia"><span class="ic">ⓘ</span><div class="col"><div><b>Passo ${i + 1} · ${esc(PASSOS[i][1])}:</b> ${g.faca}</div>
    <div class="linha"><span>✓ <b>Pronto quando</b> ${g.pronto}</span>${prox ? `<span>➜ <b>Próximo:</b> ${PASSOS.indexOf(prox) + 1} · ${esc(prox[1])}</span>` : ""}</div>
    <div class="linha" style="font-size:12.5px"><span>Passe o mouse no <b>(i)</b> ao lado de cada campo para saber o que preencher.</span></div></div>
    ${prox ? `<button type="button" id="gProx">Ir para ${esc(prox[1])} ›</button>` : ""}<button type="button" class="x" id="gFecha" title="Esconder o guia">✕</button></div>`;
  const b = $("#gProx"); if (b) b.onclick = () => abrir(prox[0]);
  $("#gFecha").onclick = () => { try { localStorage.setItem("pqi_fi_guia", "0"); } catch (_) {} desenharGuia(); };
}
const QUADROS = {};   // passo → iframe (fica vivo ao trocar de passo)
let ativo = null, perm = {}, visitou4 = false;

const comEmbed = (url) => url + (url.includes("?") ? "&" : "?") + "embed=mapeamento";
let abasFluxo = null;
const pode = (p) => p[4].startsWith("aba:") ? (abasFluxo ? (Number(abasFluxo[p[4].slice(4)]) || 0) >= 1 : true) : (perm[p[4]] ?? 3) >= 1;

// ─── tema único para todos os passos ───
function temaAtual() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function aplicarTema(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("pqi_mapeamento_tema", t); } catch (_) {}
  Object.values(QUADROS).forEach((f) => { try { f.contentWindow.postMessage({ pqi: "tema", tema: t }, location.origin); } catch (_) {} });
}
try { const t = localStorage.getItem("pqi_mapeamento_tema"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
$("#btnTema").onclick = () => aplicarTema(temaAtual() === "dark" ? "light" : "dark");

function desenharPassos() {
  $("#passos").innerHTML = PASSOS.map((p, i) => `${i ? '<span class="seta">›</span>' : ""}<button type="button" class="passo${p[0] === ativo ? " ativo" : ""}" data-p="${p[0]}"
      ${pode(p) ? "" : `disabled title="Sem acesso a ${esc(p[1])} — peça liberação ao administrador"`} aria-current="${p[0] === ativo}">
      <span class="n">${i + 1}</span><span><b>${esc(p[1])}</b><small>${esc(p[2])}</small></span></button>`).join("");
  document.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => abrir(b.dataset.p)));
}

function quadro(id, url) {
  let f = QUADROS[id];
  if (!f) {
    f = document.createElement("iframe");
    f.title = PASSOS.find((p) => p[0] === id)[1];
    f.onload = () => {
      f.dataset.ok = "1";
      if (ativo === id) $("#carregando").classList.remove("on");
      try { f.contentWindow.postMessage({ pqi: "tema", tema: temaAtual() }, location.origin); } catch (_) {}
    };
    QUADROS[id] = f; $("#palco").appendChild(f);
  }
  if (url) { f.dataset.ok = ""; f.src = comEmbed(url); }
  return f;
}

// abre um passo; "url" (opcional) leva o passo a um lugar específico (ex.: a linha de vida de um processo)
function abrir(id, url) {
  const p = PASSOS.find((x) => x[0] === id); if (!p) return;
  document.querySelectorAll(".sem-acesso").forEach((x) => x.remove());
  Object.values(QUADROS).forEach((f) => f.classList.remove("ativo"));
  ativo = id; desenharPassos(); desenharGuia();
  try { sessionStorage.setItem("pqi_mapeamento_passo", id); } catch (_) {}
  if (!pode(p)) {
    const d = document.createElement("div"); d.className = "sem-acesso";
    d.innerHTML = `<div><b>Sem acesso a ${esc(p[1])}</b><p>Este passo usa o sistema ${esc(p[1] === "Atividades" ? "Diagnóstico" : p[1] === "Áreas" ? "Processos" : p[1])}. Peça liberação ao administrador em Segurança.</p></div>`;
    $("#palco").appendChild(d); return;
  }
  const novo = !QUADROS[id];
  // Áreas lê os processos: se você passou por Processos, recarrega para mostrar o que mudou
  const recarregar = id === "areas" && visitou4 && !url;
  if (id === "processos") visitou4 = true; else if (recarregar) visitou4 = false;
  const f = quadro(id, url || (novo || recarregar ? p[3] : ""));
  f.classList.add("ativo");
  $("#carregando").classList.toggle("on", f.dataset.ok !== "1");
}

// os passos pedem para ir a outro passo (link para outro sistema, criar/abrir processo nas Áreas…)
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.pqi !== "mapeamento-ir" || typeof e.data.url !== "string") return;
  const u = new URL(e.data.url, location.origin);
  const destino = u.pathname === "/organograma" ? "organograma" : u.pathname === "/diagnostico" ? "atividades" : u.pathname === "/mapa" ? "processos" : null;
  if (destino) abrir(destino, u.pathname + u.search);
});

async function iniciar() {
  try { const r = await fetch("/api/auth/me", { cache: "no-store" }); if (r.ok) { const j = await r.json(); perm = j.permissoes || {}; abasFluxo = (j.abas || {}).mapeamento || null; } } catch (_) {}
  const q = new URLSearchParams(location.search);
  // [v7.3] ?ir=/mapa?processo=… — vindo do Agente, de um link antigo ou da Segurança: abre direto no passo certo
  const ir = q.get("ir");
  if (ir) { try { history.replaceState(null, "", location.pathname); } catch (_) {}
    const u = new URL(ir, location.origin), d = u.pathname === "/organograma" ? "organograma" : u.pathname === "/diagnostico" ? "atividades" : u.pathname === "/mapa" ? (u.searchParams.get("modo") === "areas" ? "areas" : "processos") : null;
    if (d) { abrir(d, u.pathname + u.search); return; } }
  let inicio = q.get("passo");
  if (!PASSOS.some((p) => p[0] === inicio)) { try { inicio = sessionStorage.getItem("pqi_mapeamento_passo"); } catch (_) {} }
  if (!PASSOS.some((p) => p[0] === inicio)) inicio = (PASSOS.find(pode) || PASSOS[0])[0];
  abrir(inicio);
}
iniciar();
})();
</script>
</body>
</html>
